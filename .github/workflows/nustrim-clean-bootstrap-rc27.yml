name: Nustrim Clean Bootstrap RC27

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-clean-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Import, verify and commit clean RC27
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download known-good RC27 baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/nustrim-rc27.zip"
          DIR="$RUNNER_TEMP/nustrim-rc27"

          rm -rf "$DIR"
          mkdir -p "$DIR"

          curl --fail --location --retry 4 --retry-delay 2 \
            "https://codeload.github.com/kurato-svg/Nustrim/zip/refs/tags/v0.16.0-rc27" \
            -o "$SRC"

          unzip -q "$SRC" -d "$DIR"

          ROOT="$(find "$DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/gradle.properties"
          test -d "$ROOT/app/src"

          echo "RC27_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Replace repository content with clean source
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          for entry in "$RC27_ROOT"/* "$RC27_ROOT"/.[!.]* "$RC27_ROOT"/..?*; do
            [ -e "$entry" ] || continue
            name="$(basename "$entry")"
            case "$name" in
              .git|.github) continue ;;
            esac
            cp -a "$entry" .
          done

          rm -f d.kt

          cat > .nustrim-clean <<'EOF'
          generation=clean
          baseline=v0.16.0-rc27
          upstream=kurato-svg/Nustrim
          repository=nudroid12/Nustrim
          EOF

      - name: Move updater endpoint to new repository
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/app/nudroidlabs/nustrim/core/update/AppUpdater.kt"
          )
          text = path.read_text(encoding="utf-8")

          old = (
              "https://github.com/kurato-svg/Nustrim/"
              "releases/latest/download/update.json"
          )
          new = (
              "https://github.com/nudroid12/Nustrim/"
              "releases/latest/download/update.json"
          )

          if old not in text:
              raise SystemExit("Expected RC27 updater endpoint was not found")

          text = text.replace(old, new, 1)

          if old in text:
              raise SystemExit("Old updater endpoint still exists after replacement")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Audit clean baseline before build
        shell: bash
        run: |
          set -euo pipefail

          test -f .nustrim-clean
          grep -q '^baseline=v0.16.0-rc27$' .nustrim-clean
          grep -q '^repository=nudroid12/Nustrim$' .nustrim-clean

          grep -q 'applicationId = "app.nudroidlabs.nustrim"' app/build.gradle.kts
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "0.16.0-rc27"' app/build.gradle.kts

          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.builtInKotlin=true$' gradle.properties
          grep -q '^android.newDsl=true$' gradle.properties
          grep -q 'maven("https://jitpack.io")' settings.gradle.kts

          grep -q \
            'https://github.com/nudroid12/Nustrim/releases/latest/download/update.json' \
            app/src/main/java/app/nudroidlabs/nustrim/core/update/AppUpdater.kt

          # Scan only app/build configuration, never the workflow file itself.
          if grep -R -n \
            --exclude='*.md' \
            --exclude='*.txt' \
            -E 'NuBrowse|NuBrowseApp|app\.nubrowse' \
            app gradle.properties settings.gradle.kts build.gradle.kts 2>/dev/null; then
            echo "::error::NuBrowse contamination detected in Nustrim source/config."
            exit 20
          fi

          if find . -maxdepth 2 -type f \
            \( -name 'build.gradle' -o -name 'settings.gradle' \) \
            | grep -q .; then
            echo "::error::Unexpected Groovy Gradle files detected."
            find . -maxdepth 2 -type f \
              \( -name 'build.gradle' -o -name 'settings.gradle' \)
            exit 21
          fi

          count="$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = "1"

          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0 with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Build clean RC27 debug baseline
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --build-cache \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-clean-bootstrap-build.log"

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

      - name: Commit only after Android build passes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          git diff --cached --quiet -- .github/workflows

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m 'bootstrap: clean Nustrim RC27 baseline'
            git push origin HEAD:main
          fi

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-clean-rc27-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e

          D="$RUNNER_TEMP/nustrim-clean-bootstrap-diagnose"
          mkdir -p "$D"

          cp "$RUNNER_TEMP/nustrim-clean-bootstrap-build.log" "$D/" 2>/dev/null
          cp app/build.gradle.kts "$D/" 2>/dev/null
          cp gradle.properties "$D/" 2>/dev/null
          cp settings.gradle.kts "$D/" 2>/dev/null
          cp .nustrim-clean "$D/" 2>/dev/null

          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1
          find . -maxdepth 3 -type f | sort > "$D/file-tree.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-clean-bootstrap-rc27-diagnose
          path: ${{ runner.temp }}/nustrim-clean-bootstrap-diagnose
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Clean Nustrim RC27 bootstrap passed'
            echo ''
            echo '- Source baseline: v0.16.0-rc27'
            echo '- Android package: app.nudroidlabs.nustrim'
            echo '- versionCode: 44'
            echo '- Old workflows: not imported'
            echo '- Nustrim source/config contamination audit: passed'
            echo '- Android debug build: passed'
            echo '- Updater endpoint: nudroid12/Nustrim'
            echo ''
            echo 'Next: configure permanent signing and the new updater release pipeline.'
          } >> "$GITHUB_STEP_SUMMARY"
