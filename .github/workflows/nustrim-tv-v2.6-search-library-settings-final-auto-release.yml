name: Nustrim TV V2.6 Search Library Settings Final Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-6-search-library-settings-final
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.32.0-tv-v2.5-home-final"
  BASE_VERSION_CODE: "87"
  TARGET_VERSION_NAME: "0.33.0-tv-v2.6-search-library-settings-final"
  TARGET_VERSION_CODE: "88"

  BASE_SEARCH_SHA256: "c4906b9dd8e570a46439878d43effbad58253f7e517411457d17ecb8a0bc0dff"
  BASE_LIBRARY_SHA256: "2f99b64e03598694b7883f797e0a2f8cc42ec162693d5f78c5cd6d09c3f7f324"
  BASE_SETTINGS_SHA256: "41f07a9aa5316fec9c7b0326b893866e3b833872b5bc94aa48fec0a0f90f2238"
  BASE_CARD_SHA256: "622ce5ef77f1fe799c0ab0b0c2860592112629a8402e52877522729ebe9d5b75"
  BASE_STORE_SHA256: "2b3c005a8dbbd661114cc23f3473e3cd649b8113a29f09bddd64b2af9e232df4"

  TARGET_SEARCH_SHA256: "297046f7223dc1aebff722e5fff565b459baf88fb19c2c4a6bbe6a16beab25c7"
  TARGET_LIBRARY_SHA256: "49de4ec76013538f969502265ef4e33f1e83a90f38441d2c8b790f074c7cadec"
  TARGET_SETTINGS_SHA256: "99d7a2eedfe5676243a74f047505b23602daf99e680d13be28765fdd4ae6ef56"
  TARGET_CARD_SHA256: "dd284ba4ce0261ef72bcd2f97c28ff256723e6f68160f7fea29efd349dccd1c8"

jobs:
  v26_final:
    name: Build and publish V2.6 final surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.6 Search Library Settings Final"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v26-final/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.5 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          SEARCH="app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt"
          LIBRARY="app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt"
          SETTINGS="app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt"
          CARD="app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          for file in "$SEARCH" "$LIBRARY" "$SETTINGS" "$CARD" "$STORE" "$BUILD"; do
            test -f "$file"
          done

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"

          search_sha="$(sha256sum "$SEARCH" | awk '{print $1}')"
          library_sha="$(sha256sum "$LIBRARY" | awk '{print $1}')"
          settings_sha="$(sha256sum "$SETTINGS" | awk '{print $1}')"
          card_sha="$(sha256sum "$CARD" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Search SHA:   $search_sha"
          echo "Library SHA:  $library_sha"
          echo "Settings SHA: $settings_sha"
          echo "Card SHA:     $card_sha"
          echo "Store SHA:    $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$search_sha" = "$TARGET_SEARCH_SHA256" ] &&              [ "$library_sha" = "$TARGET_LIBRARY_SHA256" ] &&              [ "$settings_sha" = "$TARGET_SETTINGS_SHA256" ] &&              [ "$card_sha" = "$TARGET_CARD_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "V2.6 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          test "$search_sha" = "$BASE_SEARCH_SHA256" || { echo "::error::Search baseline mismatch."; exit 21; }
          test "$library_sha" = "$BASE_LIBRARY_SHA256" || { echo "::error::Library baseline mismatch."; exit 22; }
          test "$settings_sha" = "$BASE_SETTINGS_SHA256" || { echo "::error::Settings baseline mismatch."; exit 23; }
          test "$card_sha" = "$BASE_CARD_SHA256" || { echo "::error::Shared grid card baseline mismatch."; exit 24; }
          test "$store_sha" = "$BASE_STORE_SHA256" || { echo "::error::LocalMediaStore baseline mismatch."; exit 25; }

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$D/TvSearchScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$D/TvLibraryScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$D/TvSettingsScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt "$D/TvMediaGridCard.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"

      - name: Apply V2.6 Search source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
