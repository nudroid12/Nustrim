      - name: Bump V2.6 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "87" or name.group(1) != "0.32.0-tv-v2.5-home-final":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 88', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.33.0-tv-v2.6-search-library-settings-final"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify V2.6 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          SEARCH="app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt"
          LIBRARY="app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt"
          SETTINGS="app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt"
          CARD="app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt"

          grep -Fq 'versionCode = 88' app/build.gradle.kts
          grep -Fq 'versionName = "0.33.0-tv-v2.6-search-library-settings-final"' app/build.gradle.kts

          grep -Fq 'val resultGridState = rememberLazyGridState()' "$SEARCH"
          grep -Fq 'var lastFocusedResultKey by remember' "$SEARCH"
          grep -Fq 'private fun TvSearchOptionsOverlay(' "$SEARCH"
          grep -Fq 'label = if (saved) "Remove from Library" else "Add to Library"' "$SEARCH"
          grep -Fq 'label = if (watched) "Mark as unwatched" else "Mark as watched"' "$SEARCH"
          grep -Fq 'badgeText = when {' "$SEARCH"
          grep -Fq 'onLongPress = {' "$SEARCH"

          grep -Fq 'val gridState = rememberLazyGridState()' "$LIBRARY"
          grep -Fq 'private fun TvLibraryOptionsOverlay(' "$LIBRARY"
          grep -Fq 'label = "Remove from Continue Watching"' "$LIBRARY"
          grep -Fq 'label = "Remove from Library"' "$LIBRARY"
          grep -Fq 'progressFraction = continueEntry' "$LIBRARY"
          grep -Fq 'continueEntry?.nextUp == true -> "NEXT UP"' "$LIBRARY"
          grep -Fq 'restoreLibraryFocus(replacementKey)' "$LIBRARY"

          grep -Fq 'val listState = rememberLazyListState()' "$SETTINGS"
          grep -Fq 'var lastFocusedRequester by remember' "$SETTINGS"
          grep -Fq 'fun reportFocus(requester: FocusRequester)' "$SETTINGS"
          grep -Fq '(lastFocusedRequester ?: firstContentRequester).requestFocus()' "$SETTINGS"
          grep -Fq 'installedSources = latestSources' "$SETTINGS"
          grep -Fq 'sources enabled' "$SETTINGS"

          grep -Fq 'GRID_CARD_LONG_PRESS_MS = 650L' "$CARD"
          grep -Fq 'onLongPress: ((TvHomeEntry) -> Unit)? = null' "$CARD"
          grep -Fq 'badgeText: String? = null' "$CARD"
          grep -Fq 'progressFraction: Float? = null' "$CARD"
          grep -Fq 'heldMs >= GRID_CARD_LONG_PRESS_MS' "$CARD"

          changed="$(git diff --name-only | sort)"
          expected="$(
            printf '%s\n'               app/build.gradle.kts               app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt               app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt               app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt               app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt |
            sort
          )"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected changed-file set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile and release lint gates
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/verify.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$D/TvSearchScreen.after.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$D/TvLibraryScreen.after.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$D/TvSettingsScreen.after.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt "$D/TvMediaGridCard.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/v26-final.diff"

          cat > "$D/summary.txt" <<'EOF_SUMMARY'
          Nustrim TV V2.6 Search Library Settings Final
          =================================================
          Baseline: 0.32.0-tv-v2.5-home-final (87)
          Target:   0.33.0-tv-v2.6-search-library-settings-final (88)

          Search:
          - stable result-grid state and exact result focus restore
          - long press result actions
          - add/remove Library from Search
          - mark watched/unwatched from Search
          - Library and WATCHED badges

          Library:
          - stable grid and exact card focus restore
          - watched and NEXT UP badges
          - resumable progress indicator
          - long press watched, Continue Watching and Library actions
          - nearby focus recovery after item removal

          Settings:
          - stable LazyColumn state
          - last focused setting is restored
          - source state refreshes when revisited
          - header shows enabled source count

          Shared grid card:
          - optional long press
          - optional badge
          - optional progress indicator

          Frozen surfaces:
          - Player untouched
          - Details untouched
          - Home untouched
          - LocalMediaStore untouched
          EOF_SUMMARY

      - name: Commit only after compile and lint pass
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt

          git diff --cached --check
          git commit -m 'tv: complete v2.6 Search Library Settings milestone'
          git push origin HEAD:main

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 50
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          test "$CERT" = "$LOCKED_CERT"

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             :app:assembleRelease             --stacktrace             --console=plain             2>&1 | tee "$D/release-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v26-final"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$D/signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$D/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "88"
          test "$NAME" = "0.33.0-tv-v2.6-search-library-settings-final"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA

          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "V2.6 final surfaces: Search actions and focus restore, Library progress and watched actions, Settings focus and source refresh.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY_ASSETS

      - name: Publish Nustrim release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.6 final TV surfaces."               --latest
            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG"               "$APK" update.json               --target "$TARGET_SHA"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.6 final TV surfaces."               --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_CERT: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v26-final/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG"             --pattern update.json             --pattern "$APK"             --dir "$LIVE"             --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"

          export LIVE APK EXPECTED_SHA EXPECTED_CERT

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))

          assert int(manifest["versionCode"]) == 88
          assert manifest["versionName"] == "0.33.0-tv-v2.6-search-library-settings-final"
          assert manifest["signingMode"] == "permanent"
          assert manifest["signingCertSha256"].upper() == os.environ["EXPECTED_CERT"].upper()

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          assert manifest["sha256"] == sha

          print("Updater verified:", manifest["versionName"], manifest["versionCode"])
          PY_VERIFY

      - name: Collect failure context
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v26-final"
          mkdir -p "$D"

          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$D/TvSearchScreen.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$D/TvLibraryScreen.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$D/TvSettingsScreen.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt "$D/TvMediaGridCard.current.kt" 2>/dev/null || true
          cp update.json "$D/update.current.json" 2>/dev/null || true

          git status --short > "$D/git-status.txt" 2>&1 || true
          git diff > "$D/git-diff.txt" 2>&1 || true
          git log -8 --oneline > "$D/recent-commits.txt" 2>&1 || true

          {
            echo "Failure bundle collected."
            echo "Inspect verify.log for compile or lint failures."
            echo "Inspect release-build.log for signed build failures."
            echo "Inspect git-diff.txt for contract or preflight failures."
          } > "$D/README.txt"

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.6-search-library-settings-final-diagnose
          path: ${{ runner.temp }}/nustrim-v26-final
          if-no-files-found: error
          retention-days: 14
