name: Nustrim TV Stage 4 Sources

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-stage4-sources
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.22.0-tv-stage4"

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Stage 4 preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage4"
          mkdir -p "$DIR"

          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"
          SESSION="app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt"
          MODELS="app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt"

          test -f "$APP"
          test -f "$PREFS"
          test -f "$HOME"
          test -f "$DETAILS"
          test -f "$SHELL"
          test -f "$SESSION"
          test -f "$MODELS"
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'TvSourcesStage4Preview(' "$DETAILS"
          grep -q 'private fun TvSourcesStage4Preview(' "$DETAILS"
          grep -q 'fun loadStreams(' "$SESSION"
          grep -q 'data class StreamSource(' "$MODELS"
          grep -q 'val playable:' "$MODELS"
          grep -q 'val url:' "$MODELS"
          grep -q 'val name:' "$MODELS"

          grep -q 'var tvModeSessionActive by rememberSaveable' "$APP"
          grep -q 'if (tvModeSessionActive || interfaceMode == InterfaceMode.TV)' "$APP"

          cp "$APP" "$DIR/NustrimApp.before.kt"
          cp "$PREFS" "$DIR/UiPreferences.before.kt"
          cp "$HOME" "$DIR/TvHomeScreen.before.kt"
          cp "$SHELL" "$DIR/TvShell.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          {
            echo "TV STAGE 4 SOURCES"
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts || true
            grep -m1 'versionName' app/build.gradle.kts || true
            grep -n -A18 -B3 'fun loadStreams' "$SESSION" | head -n 50 || true
            grep -n -A22 -B3 'data class StreamSource' "$MODELS" | head -n 60 || true
          } | tee "$DIR/preflight.txt"

      - name: Install real Sources modal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          
          DETAILS = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          text = DETAILS.read_text(encoding="utf-8")
          
          required = [
              "fun TvDetailsScreen(",
              "TvSourcesStage4Preview(",
              "private fun TvSourcesStage4Preview(",
              "fun openSources(episode: MediaEpisode?)",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Stage 3 baseline missing: " + ", ".join(missing))
          
          if "import androidx.compose.foundation.lazy.LazyColumn\n" not in text:
              text = text.replace(
                  "import androidx.compose.foundation.lazy.LazyRow\n",
                  "import androidx.compose.foundation.lazy.LazyRow\n"
                  "import androidx.compose.foundation.lazy.LazyColumn\n",
                  1,
              )
          
          if "import app.nudroidlabs.nustrim.core.model.StreamSource\n" not in text:
              text = text.replace(
                  "import app.nudroidlabs.nustrim.core.model.MediaType\n",
                  "import app.nudroidlabs.nustrim.core.model.MediaType\n"
                  "import app.nudroidlabs.nustrim.core.model.StreamSource\n",
                  1,
              )
          
          old_state = '    var sourcePreview by remember(entry.stableKey) {\n        mutableStateOf<TvSourcePreviewRequest?>(null)\n    }\n'
          new_state = '    var sourcePreview by remember(entry.stableKey) {\n        mutableStateOf<TvSourcePreviewRequest?>(null)\n    }\n    var restoreSourceFocus by remember(entry.stableKey) {\n        mutableStateOf(false)\n    }\n'
          if "var restoreSourceFocus by remember" not in text:
              if old_state not in text:
                  raise SystemExit("sourcePreview state anchor missing")
              text = text.replace(old_state, new_state, 1)
          
          old_open = '    fun openSources(episode: MediaEpisode?) {\n        sourcePreview = TvSourcePreviewRequest(\n'
          new_open = '    fun openSources(episode: MediaEpisode?) {\n        restoreSourceFocus = false\n        sourcePreview = TvSourcePreviewRequest(\n'
          if "restoreSourceFocus = false" not in text:
              if old_open not in text:
                  raise SystemExit("openSources anchor missing")
              text = text.replace(old_open, new_open, 1)
          
          old_call = '        sourcePreview?.let { request ->\n            TvSourcesStage4Preview(\n                request = request,\n                onClose = {\n                    sourcePreview = null\n                },\n                onRestoreFocus = {\n                    lastDetailsRequester?.let { requester ->\n                        runCatching { requester.requestFocus() }\n                    }\n                },\n                modifier = Modifier\n                    .fillMaxSize()\n                    .zIndex(30f)\n            )\n        }\n'
          new_call = '        sourcePreview?.let { request ->\n            TvSourcesStage4Modal(\n                request = request,\n                onClose = {\n                    sourcePreview = null\n                    restoreSourceFocus = true\n                },\n                modifier = Modifier\n                    .fillMaxSize()\n                    .zIndex(30f)\n            )\n        }\n'
          if "TvSourcesStage4Modal(" not in text:
              if old_call not in text:
                  raise SystemExit("preview call block missing")
              text = text.replace(old_call, new_call, 1)
          
          focus_anchor = '    LaunchedEffect(entry.stableKey) {\n        delay(70)\n        runCatching { firstActionRequester.requestFocus() }\n    }\n'
          focus_insert = '    LaunchedEffect(sourcePreview, restoreSourceFocus) {\n        if (sourcePreview == null && restoreSourceFocus) {\n            delay(70)\n            val requester = lastDetailsRequester ?: firstActionRequester\n            runCatching { requester.requestFocus() }\n            restoreSourceFocus = false\n        }\n    }\n\n    LaunchedEffect(entry.stableKey) {\n        delay(70)\n        runCatching { firstActionRequester.requestFocus() }\n    }\n'
          if "LaunchedEffect(sourcePreview, restoreSourceFocus)" not in text:
              if focus_anchor not in text:
                  raise SystemExit("focus anchor missing")
              text = text.replace(focus_anchor, focus_insert, 1)
          
          start = text.find("@Composable\nprivate fun TvSourcesStage4Preview(")
          if start < 0:
              raise SystemExit("preview function marker missing")
          
          modal = base64.b64decode("").decode()
          text = text[:start] + modal.rstrip() + "\n"
          
          checks = [
              "import androidx.compose.foundation.lazy.LazyColumn",
              "import app.nudroidlabs.nustrim.core.model.StreamSource",
              "private fun TvSourcesStage4Modal(",
              "session.loadStreams(",
              "Finding playable streams...",
              "private fun rankTvStreams(",
              "stream.playable && stream.url.isNotBlank()",
              "reloadToken += 1",
              "LaunchedEffect(sourcePreview, restoreSourceFocus)",
          ]
          missing = [x for x in checks if x not in text]
          if missing:
              raise SystemExit("Stage 4 contract failed: " + ", ".join(missing))
          if "private fun TvSourcesStage4Preview(" in text:
              raise SystemExit("Stage 3 preview still present")
          
          DETAILS.write_text(re.sub(r'(?m)^[ \t]+$', '', text), encoding="utf-8")
          print("PASS: real Stage 4 Sources modal installed")
          PY

      - name: Set Stage 4 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          p.write_text(text, encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Stage 4 audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage4"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"

          echo "AUDIT VERSION: TV-STAGE4-SOURCES-R1"

          grep -q 'private fun TvSourcesStage4Modal(' "$DETAILS"
          grep -q 'session.loadStreams(' "$DETAILS"
          grep -q 'private fun rankTvStreams(' "$DETAILS"
          grep -q 'stream.playable && stream.url.isNotBlank()' "$DETAILS"
          grep -q 'Finding playable streams...' "$DETAILS"
          grep -q 'reloadToken += 1' "$DETAILS"
          grep -q 'LaunchedEffect(sourcePreview, restoreSourceFocus)' "$DETAILS"

          if grep -q 'private fun TvSourcesStage4Preview(' "$DETAILS"; then
            echo "::error::Stage 3 preview remains."
            exit 1
          fi

          cmp "$DIR/NustrimApp.before.kt" "$APP"
          cmp "$DIR/UiPreferences.before.kt" "$PREFS"
          cmp "$DIR/TvHomeScreen.before.kt" "$HOME"
          cmp "$DIR/TvShell.before.kt" "$SHELL"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.22.0-tv-stage4"' app/build.gradle.kts

          git diff --check
          git diff > "$DIR/stage4.patch"

          echo "PASS: R6 root runtime untouched"
          echo "PASS: Home/Shell/UiPreferences untouched"
          echo "PASS: loadStreams + loading/error/retry/ranking installed"
          echo "PASS: Details focus restore delayed after modal close"
          echo "PASS: updater/build untouched"

      - name: Compile Stage 4
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-stage4/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Assemble Stage 4
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-stage4/assemble.log"

      - name: Commit and push Stage 4
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-stage4/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt app/build.gradle.kts
          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): connect Stage 4 sources"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)" | tee "$RUNNER_TEMP/tv-stage4/remote-main.txt"
          python3 - <<'PY'
          import subprocess
          details = subprocess.check_output(
              ["git", "show", "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"],
              text=True,
          )
          gradle = subprocess.check_output(
              ["git", "show", "origin/main:app/build.gradle.kts"],
              text=True,
          )
          
          required = [
              "private fun TvSourcesStage4Modal(",
              "session.loadStreams(",
              "private fun rankTvStreams(",
          ]
          missing = [x for x in required if x not in details]
          if missing:
              raise SystemExit("remote Stage 4 missing: " + ", ".join(missing))
          if "private fun TvSourcesStage4Preview(" in details:
              raise SystemExit("remote preview still present")
          if 'versionName = "0.22.0-tv-stage4"' not in gradle:
              raise SystemExit("remote Stage 4 version missing")
          
          print("PASS: origin/main contains TV Stage 4 Sources")
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true
          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID" | tee "$RUNNER_TEMP/tv-stage4/dispatch.txt"

      - name: Wait signed build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status 2>&1 | tee "$RUNNER_TEMP/tv-stage4/signed-build-watch.log"

      - name: Verify published Stage 4
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/tv-stage4/update.json"

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true
            if grep -q '0.22.0-tv-stage4' "$MANIFEST" 2>/dev/null; then break; fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.22.0-tv-stage4' "$MANIFEST"
          cat "$MANIFEST" | tee "$RUNNER_TEMP/tv-stage4/published-update.json"

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-stage4"
          echo "========== TV Stage 4 Sources =========="
          for f in preflight.txt compile.log assemble.log push.log remote-main.txt dispatch.txt signed-build-watch.log published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo "===== $f ====="
              tail -n 200 "$DIR/$f"
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage4-sources-diagnose
          path: ${{ runner.temp }}/tv-stage4
          if-no-files-found: ignore
          retention-days: 7
