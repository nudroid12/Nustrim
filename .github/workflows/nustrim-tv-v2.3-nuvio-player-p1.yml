          actual="$(sha256sum "$PLAYER" | awk '{print $1}')"
          if [ "$actual" != "$TARGET_PLAYER_SHA256" ]; then
            echo "::error::Decoded player source SHA mismatch."
            echo "expected=$TARGET_PLAYER_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump V2.3 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")
          if code.group(1) != "74" or name.group(1) != "0.28.0-tv-v2.2-resume":
              raise SystemExit(
                  f"Unexpected version before bump: {name.group(1)} ({code.group(1)})"
              )

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 75',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.28.1-tv-v2.3-nuvio-player-p1"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify Player P1 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 75' app/build.gradle.kts
          grep -q 'versionName = "0.28.1-tv-v2.3-nuvio-player-p1"' app/build.gradle.kts

          # Preserve V2.2 resume and progress reporting.
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'fun reportProgress(' "$PLAYER"

          # Nuvio-style interaction and layout contract.
          grep -q 'val progressControlRequester' "$PLAYER"
          grep -q 'fun hideControlsFromRow()' "$PLAYER"
          grep -q 'Key.DirectionUp,' "$PLAYER"
          grep -q 'Icons.Default.PlayArrow' "$PLAYER"
          grep -q 'Icons.Default.SkipNext' "$PLAYER"
          grep -q 'Icons.Default.ClosedCaption' "$PLAYER"
          grep -q 'Icons.AutoMirrored.Filled.VolumeUp' "$PLAYER"
          grep -q 'Icons.Default.SwapHoriz' "$PLAYER"
          grep -q 'Icons.Default.Speed' "$PLAYER"
          grep -q 'Icons.Default.AspectRatio' "$PLAYER"
          grep -q 'private fun TvPlayerSpeedPicker(' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"
          grep -q 'focused -> Color.White' "$PLAYER"
          grep -q 'focused -> Color.Black' "$PLAYER"

          # Old utility-card row must be gone.
          if grep -q 'id = "rewind"' "$PLAYER"; then
            echo "::error::Old rewind card still exists in the primary control row."
            exit 40
          fi
          if grep -q 'id = "forward"' "$PLAYER"; then
            echo "::error::Old forward card still exists in the primary control row."
            exit 41
          fi
          if grep -q 'append("  •  ▲ Audio shortcut")' "$PLAYER"; then
            echo "::error::Old player shortcut legend survived the redesign."
            exit 42
          fi

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p1"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p1"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/player-p1.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P1
          =================================
          Baseline: 0.28.0-tv-v2.2-resume (74)
          Target:   0.28.1-tv-v2.3-nuvio-player-p1 (75)

          Player changes:
          - title and episode metadata moved into the bottom controls hierarchy
          - focusable progress bar with Left/Right seek
          - Up/Down from hidden player reveals controls instead of opening Audio
          - Play/Pause is the primary control focus
          - circular Nuvio-style white focus, black focused icon
          - primary row: Play, Next, Subtitles, Audio, Sources, More
          - More exposes real Playback Speed and Aspect Ratio actions
          - playback speed picker applies ExoPlayer playback speed
          - aspect cycles Fit -> Zoom -> Fill with on-screen indicator
          - Down/Back from controls hides controls before leaving player
          - V2.2 resume/progress hooks preserved
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.3 Nuvio player controls pass 1'
          git push origin HEAD:main

      - name: Write already-applied summary
        if: steps.preflight.outputs.already_applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p1"
          mkdir -p "$D"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P1 is already applied exactly.
          No source files were changed by this run.
          EOF

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v23-player-p1"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.3-nuvio-player-p1-diagnose
          path: ${{ runner.temp }}/nustrim-v23-player-p1
          if-no-files-found: warn
          retention-days: 14
