name: Nustrim TV Stage 6 Search Library Settings S1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-stage6-search-library-settings-s1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.25.0-tv-stage6"
  SHELL_BASE_HASH: "469d6a2b0db1207545408dc559e618051749d2cbfd0882243d1181432ec57bac"
  SHELL_TARGET_HASH: "4888bb9b8ec86b555e7e06050719549af073207ba3b0d9354ca35199688e69a4"
  DETAILS_BASE_HASH: "50a0910fa693e24f43a0afe98fdcfe423dca1e9d6731368713910067972edc4c"
  DETAILS_TARGET_HASH: "8be6801b4c8f49cb5885917ee2d4c2f9cbd6cb5d5827fc6365c6a9786212fe11"

jobs:
  stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Stage 6 live preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage6-s1"
          mkdir -p "$DIR"

          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          AGG="app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          test -f "$SHELL"
          test -f "$DETAILS"
          test -f "$AGG"
          test -f "$PLAYER"
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'TvDestination.HOME -> TvHomeScreen(' "$SHELL"
          grep -q 'StreamSourceAggregator' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          shell_hash="$(sha256sum "$SHELL" | awk '{print $1}')"
          details_hash="$(sha256sum "$DETAILS" | awk '{print $1}')"

          if [[ "$shell_hash" != "$SHELL_BASE_HASH" && "$shell_hash" != "$SHELL_TARGET_HASH" ]]; then
            echo "::error::TvShell.kt drifted from the reviewed Stage 5/6 baseline."
            echo "actual=$shell_hash"
            echo "expected_base=$SHELL_BASE_HASH"
            echo "expected_target=$SHELL_TARGET_HASH"
            exit 1
          fi

          if [[ "$details_hash" != "$DETAILS_BASE_HASH" && "$details_hash" != "$DETAILS_TARGET_HASH" ]]; then
            echo "::error::TvDetailsScreen.kt drifted from the reviewed Stage 5/6 baseline."
            echo "actual=$details_hash"
            echo "expected_base=$DETAILS_BASE_HASH"
            echo "expected_target=$DETAILS_TARGET_HASH"
            exit 1
          fi

          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt             "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt             "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt             "$DIR/TvHomeScreen.before.kt"
          cp "$PLAYER" "$DIR/TvPlayerScreen.before.kt"
          cp "$AGG" "$DIR/StreamSourceAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             "$DIR/LocalMediaStore.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt             "$DIR/InstalledSourceStore.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.before"

          {
            echo "NUSTRIM TV STAGE 6 S1"
            echo "====================="
            echo "sha=$(git rev-parse HEAD)"
            echo "shell_hash=$shell_hash"
            echo "details_hash=$details_hash"
            grep -m1 'minSdk' app/build.gradle.kts
            grep -m1 'versionCode' app/build.gradle.kts
            grep -m1 'versionName' app/build.gradle.kts
          } | tee "$DIR/preflight.txt"

      - name: Write Stage 6 TV workspaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt': '',
          }
          for raw_path, payload in files.items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print("WRITE:", path)
          PY

      - name: Set Stage 6 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          code_match = re.search(r'versionCode\s*=\s*(\d+)', text)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata.")
          
          old_code = int(code_match.group(1))
          old_name = name_match.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1,
          )
          
          path.write_text(text, encoding="utf-8")
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Stage 6 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage6-s1"
          ROOT="app/src/main/java/app/nudroidlabs/nustrim"
          SHELL="$ROOT/tv/shell/TvShell.kt"
          SEARCH="$ROOT/tv/search/TvSearchScreen.kt"
          LIBRARY="$ROOT/tv/library/TvLibraryScreen.kt"
          SETTINGS="$ROOT/tv/settings/TvSettingsScreen.kt"
          DETAILS="$ROOT/tv/details/TvDetailsScreen.kt"
          COMMON="$ROOT/tv/common/TvMediaGridCard.kt"

          echo "AUDIT VERSION: TV-STAGE6-SEARCH-LIBRARY-SETTINGS-S1"

          test -f "$COMMON"
          test -f "$SEARCH"
          test -f "$LIBRARY"
          test -f "$SETTINGS"

          grep -q 'TvDestination.SEARCH -> TvSearchScreen(' "$SHELL"
          grep -q 'TvDestination.LIBRARY -> TvLibraryScreen(' "$SHELL"
          grep -q 'TvDestination.SETTINGS -> TvSettingsScreen(' "$SHELL"

          if grep -q 'else -> TvStagePlaceholder(' "$SHELL"; then
            echo "::error::Stage placeholder is still routing a real TV destination."
            exit 1
          fi

          grep -q 'SearchableSourceSession' "$SEARCH"
          grep -q 'sourceStore.sources()' "$SEARCH"
          grep -q 'searchable.search(' "$SEARCH"
          grep -q 'TvMediaGridCard(' "$SEARCH"

          grep -q 'LocalMediaStore(context)' "$LIBRARY"
          grep -q 'mediaStore.saved()' "$LIBRARY"
          grep -q 'local.toMediaItem()' "$LIBRARY"
          grep -q 'TvMediaGridCard(' "$LIBRARY"

          grep -q 'UiPreferences(context)' "$SETTINGS"
          grep -q 'InstalledSourceStore(context)' "$SETTINGS"
          grep -q 'sourceStore.setEnabled(source.url, next)' "$SETTINGS"
          grep -q 'BuildConfig.VERSION_NAME' "$SETTINGS"

          grep -q 'LocalMediaStore(context)' "$DETAILS"
          grep -q 'Add to Library' "$DETAILS"
          grep -q 'Remove from Library' "$DETAILS"
          grep -q 'StreamSourceAggregator' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          if grep -R -n -E 'app\.nudroidlabs\.nustrim\.(tv2|tv3)'             "$COMMON" "$SEARCH" "$LIBRARY" "$SETTINGS" "$SHELL" "$DETAILS"; then
            echo "::error::Legacy tv2/tv3 reference detected."
            exit 1
          fi

          bad_mobile_imports="$(
            grep -R -n '^import app\.nudroidlabs\.nustrim\.ui\.'               "$COMMON" "$SEARCH" "$LIBRARY" "$SETTINGS" 2>/dev/null               | grep -v -E '(UiPreferences|SubtitleDisplayMode)$'               || true
          )"
          if [[ -n "$bad_mobile_imports" ]]; then
            echo "::error::TV workspace imported a Mobile presentation class."
            printf '%s\n' "$bad_mobile_imports"
            exit 1
          fi

          cmp "$DIR/NustrimApp.before.kt" "$ROOT/ui/NustrimApp.kt"
          cmp "$DIR/UiPreferences.before.kt" "$ROOT/ui/UiPreferences.kt"
          cmp "$DIR/TvHomeScreen.before.kt" "$ROOT/tv/home/TvHomeScreen.kt"
          cmp "$DIR/TvPlayerScreen.before.kt" "$ROOT/tv/player/TvPlayerScreen.kt"
          cmp "$DIR/StreamSourceAggregator.before.kt"             "$ROOT/core/source/StreamSourceAggregator.kt"
          cmp "$DIR/LocalMediaStore.before.kt"             "$ROOT/core/library/LocalMediaStore.kt"
          cmp "$DIR/InstalledSourceStore.before.kt"             "$ROOT/core/source/InstalledSourceStore.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find "$ROOT/core/update" -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'minSdk = 23' app/build.gradle.kts
          grep -q 'versionName = "0.25.0-tv-stage6"' app/build.gradle.kts

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed" | tee "$DIR/changed-files.txt"

          unexpected="$(
            printf '%s\n' "$changed" |
            grep -v -E               '^(app/build.gradle.kts|app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt)$'               || true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected Stage 6 file changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git diff --check
          git diff > "$DIR/stage6.patch"

          echo "PASS: Search workspace is TV-only and source-backed"
          echo "PASS: Library is backed by LocalMediaStore.saved()"
          echo "PASS: Details can Add/Remove Library"
          echo "PASS: Settings can enable/disable installed sources"
          echo "PASS: Sources aggregator and Stage 5 player preserved"
          echo "PASS: Mobile/R6/updater/build workflow protected"

      - name: Compile Stage 6
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage6-s1/compile.log"

      - name: Run release lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage6-s1/lint-release.log"

      - name: Assemble Stage 6
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage6-s1/assemble.log"

      - name: Commit and push Stage 6
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-stage6-s1/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvMediaGridCard.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): add Stage 6 search library settings"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-stage6-s1/remote-main.txt"
          python3 - <<'PY'
          import subprocess
          
          def show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"origin/main:{path}"],
                  text=True,
              )
          
          shell = show("app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt")
          search = show("app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt")
          library = show("app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt")
          settings = show("app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt")
          details = show("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          gradle = show("app/build.gradle.kts")
          
          checks = {
              "Search route": "TvDestination.SEARCH -> TvSearchScreen(" in shell,
              "Library route": "TvDestination.LIBRARY -> TvLibraryScreen(" in shell,
              "Settings route": "TvDestination.SETTINGS -> TvSettingsScreen(" in shell,
              "placeholder route removed": "else -> TvStagePlaceholder(" not in shell,
              "search core": "SearchableSourceSession" in search,
              "library core": "mediaStore.saved()" in library,
              "source toggles": "sourceStore.setEnabled(source.url, next)" in settings,
              "library action": "Add to Library" in details and "Remove from Library" in details,
              "aggregator retained": "StreamSourceAggregator" in details,
              "player retained": "TvPlayerScreen(" in details,
              "version": 'versionName = "0.25.0-tv-stage6"' in gradle,
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("REMOTE STAGE 6 VERIFY FAILED: " + ", ".join(failed))
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-stage6-s1/signed-run.txt"

      - name: Wait signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-stage6-s1/signed-build-watch.log"

      - name: Verify published Stage 6
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/tv-stage6-s1/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.25.0-tv-stage6' "$MANIFEST" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.25.0-tv-stage6' "$MANIFEST"
          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-stage6-s1/published-update.json"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-stage6-s1"
          echo "========== Nustrim TV Stage 6 S1 =========="
          echo "Result: FAILED"

          for f in preflight.txt changed-files.txt remote-main.txt signed-run.txt                    published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              cat "$DIR/$f" || true
            fi
          done

          for f in compile.log lint-release.log assemble.log push.log                    signed-build-watch.log; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              tail -n 280 "$DIR/$f" || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage6-s1-diagnose
          path: ${{ runner.temp }}/tv-stage6-s1
          if-no-files-found: ignore
          retention-days: 7
