name: Nustrim TV Cleanroom S11.1 Subtitle System Fixed Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s11-1-subtitle-system
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.56.1-tv-cleanroom-s11.1-subtitle-system"
  MIN_TARGET_VERSION_CODE: "122"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S11 baseline
        shell: bash
        run: |
          set -euo pipefail

          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.56.0-tv-cleanroom-s11-parity-qa"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          if [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          fi

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S11.1 subtitle source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          files = {
              ".nustrim-tv": "",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt": "",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt": "",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt": "",
          }
          for relative, payload in files.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))

          target_name = "0.56.1-tv-cleanroom-s11.1-subtitle-system"
          minimum_code = 122
          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          target_code = current_code if current_name == target_name else max(current_code + 1, minimum_code)
          build = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {target_code}", build, count=1)
          build = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', build, count=1)
          build_path.write_text(build, encoding="utf-8")
          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify subtitle boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S11.1 changed files outside subtitle boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "6be95fa75685fcf314a40c3b224c174065253f20bce725ea45fb344924d22851",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt": "17521da7dbeb87eaf2cbf204318836fa3422a6f8711bd1996af27d4aa0f00c09",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt": "b96927996ded46cb62dbcf3779f44ee83b69a9ddd759f962fb4c552df3e63901",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt": "833d18a134513e1dbac0eeb8947e2a8071574624b06b2d470f36bc8a00ee3457",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact subtitle payload mismatch: " + ", ".join(mismatch))

          entry = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt").read_text()
          runtime = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt").read_text()
          repository = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt").read_text()
          marker = Path(".nustrim-tv").read_text()
          build = Path("app/build.gradle.kts").read_text()

          required = {
              "entry enrichment": "subtitleRepository.enrich(activeRequest)" in entry,
              "request reaches player": "request = playbackRequest" in entry,
              "local loading surface": "private fun TvSubtitleLoading" in entry and "TvPlayerLoadingOverlay(" not in entry,
              "preferred language": "setPreferredTextLanguage(language)" in runtime,
              "text tracks enabled": "setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)" in runtime,
              "enabled visible addons": "visibleSources(preferences.developerMode)" in repository and ".filter { it.enabled }" in repository,
              "partial results": "synchronized(lock) { collected += loaded }" in repository,
              "bounded overall timeout": "const val OVERALL_TIMEOUT_MS = 3_500L" in repository,
              "bounded source timeout": "const val PER_SOURCE_TIMEOUT_MS = 3_000L" in repository,
              "Malay preference": '"ms" to listOf(' in repository,
              "issue marker": "subtitle-issue=s11-sub-01-resolved" in marker,
              "version name": 'versionName = "0.56.1-tv-cleanroom-s11.1-subtitle-system"' in build,
          }
          failed = [name for name, passed in required.items() if not passed]
          if failed:
              raise SystemExit("Subtitle invariant failed: " + ", ".join(failed))
          print(f"S11.1 subtitle invariants passed: {len(required)}/{len(required)}")
          PY

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s11-1-subtitle-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" |
            tee "$RUNNER_TEMP/nustrim-s11-1-subtitle-signature.txt"
          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s11-1-subtitle-signature.txt" |
            head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$CERT"
          test "$CERT" = "$LOCKED_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          test "$SRC_CODE" -ge "$MIN_TARGET_VERSION_CODE"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater and subtitle report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          dst = Path(f"Nustrim-{version_name}.apk")
          dst.write_bytes(src.read_bytes())
          sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          size = dst.stat().st_size
          tag = f"v{version_name}"

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{dst.name}",
              "sha256": sha,
              "changelog": "S11.1 restores TV subtitle discovery from embedded tracks and enabled addons, keeps partial results under a 3.5 second bound, and prefers Malay automatically when available.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S11.1 Subtitle System Only",
              "issue": "S11-SUB-01",
              "status": "build-verified",
              "scope": ["TV player subtitle discovery", "subtitle preference", "text track selection"],
              "preserved": ["Sources", "provider engine", "stream resolver", "player controls", "Mobile UI"],
              "timeoutsMs": {"overall": 3500, "perSource": 3000},
              "deviceAcceptance": "pending",
              "nextBacklog": "S11-SRC-01 progressive Sources loading",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-subtitle-system-s11-1-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={dst.name}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"size={size}\n")
          PY

      - name: Commit S11.1 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version \
            .nustrim-tv \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt

          if git diff --cached --quiet; then
            echo "S11.1 subtitle source is already committed."
          else
            git commit -m "Fix cleanroom TV subtitle system S11.1 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.cert_sha }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/s11-1-subtitle-release-payload.json"
          LOOKUP="$RUNNER_TEMP/s11-1-subtitle-release-existing.json"
          RESPONSE="$RUNNER_TEMP/s11-1-subtitle-release.json"
          export PAYLOAD TAG VERSION CERT TARGET_SHA
          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["TARGET_SHA"],
              "name": f"Nustrim {os.environ['VERSION']}",
              "body": (
                  f"Nustrim {os.environ['VERSION']}\n\n"
                  "S11.1 Subtitle System Only restores external TV subtitle discovery while preserving the accepted S11 baseline. "
                  "Embedded tracks and enabled subtitle addons are merged, partial fast results survive slow addons, and Malay is preferred automatically when available.\n\n"
                  "Sources progressive loading remains a separate backlog item.\n\n"
                  f"Permanent signing certificate SHA-256:\n{os.environ['CERT']}\n"
              ),
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          }
          Path(os.environ["PAYLOAD"]).write_text(json.dumps(payload))
          PY

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$LOOKUP" 2>/dev/null; then
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$LOOKUP")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input "$PAYLOAD" > "$RESPONSE"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$PAYLOAD" > "$RESPONSE"
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s update.json
          test -s tv-subtitle-system-s11-1-report.json
          gh release upload "$TAG" "$APK" update.json tv-subtitle-system-s11-1-report.json --clobber

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          EXPECTED_NAME: ${{ steps.verify.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.verify.outputs.version_code }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.assets.outputs.size }}
          EXPECTED_CERT: ${{ steps.verify.outputs.cert_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          LIVE="$RUNNER_TEMP/s11-1-subtitle-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK_NAME" --pattern update.json --pattern tv-subtitle-system-s11-1-report.json --dir "$LIVE" --clobber
          export LIVE APK_NAME EXPECTED_NAME EXPECTED_CODE EXPECTED_SHA EXPECTED_SIZE EXPECTED_CERT TAG
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK_NAME"]
          manifest = json.loads((root / "update.json").read_text())
          report = json.loads((root / "tv-subtitle-system-s11-1-report.json").read_text())
          actual_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{apk.name}"
          checks = {
              "versionName": manifest.get("versionName") == os.environ["EXPECTED_NAME"],
              "versionCode": int(manifest.get("versionCode", -1)) == int(os.environ["EXPECTED_CODE"]),
              "apkUrl": manifest.get("apkUrl") == expected_url,
              "sha256": actual_sha == os.environ["EXPECTED_SHA"] == manifest.get("sha256"),
              "size": apk.stat().st_size == int(os.environ["EXPECTED_SIZE"]),
              "certificate": manifest.get("signingCertSha256") == os.environ["EXPECTED_CERT"],
              "issue": report.get("issue") == "S11-SUB-01",
              "device claim": report.get("deviceAcceptance") == "pending",
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Published release verification failed: " + ", ".join(failed))
          print("Published subtitle release verified")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s11-1-subtitle-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-subtitle-system-s11-1-report.json
            ${{ runner.temp }}/nustrim-s11-1-subtitle-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s11-1-subtitle-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s11-1-subtitle-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s11-1-subtitle-signature.txt" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-1-subtitle-release.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-1-subtitle-release-existing.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-1-subtitle-release-payload.json" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-subtitle-system-s11-1-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s11-1-subtitle-diagnose
          path: ${{ runner.temp }}/nustrim-s11-1-subtitle-diagnose
          if-no-files-found: warn
          retention-days: 7
