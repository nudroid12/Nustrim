name: Nustrim TV Cleanroom S11 Parity QA Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s11-parity-qa
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.56.0-tv-cleanroom-s11-parity-qa"
  MIN_TARGET_VERSION_CODE: "121"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard known clean-room baseline
        shell: bash
        run: |
          set -euo pipefail

          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"

          echo "Build version: $current_build"
          echo "Marker version: $current_marker"

          allowed_versions=(
            "0.55.0-tv-cleanroom-s10-global-polish"
            "0.56.0-tv-cleanroom-s11-parity-qa"
          )

          allowed=false
          for version in "${allowed_versions[@]}"; do
            if [ "$current_build" = "$version" ]; then
              allowed=true
              break
            fi
          done

          if [ "$allowed" != "true" ]; then
            echo "::error::Unexpected app baseline. S11 Parity QA is allowed only from the accepted S10 release or an idempotent S11 rerun."
            exit 20
          fi

          if [ "$current_marker" != "$current_build" ]; then
            echo "::error::Build version and .nustrim-version marker do not match."
            exit 21
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare and validate permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate does not match Nustrim permanent certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : $CERT"
            exit 31
          fi

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact clean-room S11 Parity QA source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          files = {
              '.nustrim-tv': '',
              'docs/tv-cleanroom-s11-parity-audit.md': '',
              'scripts/verify_tv_parity_s11.py': '',
          }

          target_name = "0.56.0-tv-cleanroom-s11-parity-qa"
          min_code = 121

          for relative_path, encoded in files.items():
              destination = Path(relative_path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(encoded))

          obsolete = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt")
          if obsolete.exists():
              obsolete.unlink()

          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          target_code = current_code if current_name == target_name else max(current_code + 1, min_code)

          build = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {target_code}", build, count=1)
          build = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', build, count=1)
          build_path.write_text(build, encoding="utf-8")
          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify S11 Parity QA boundaries and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"

          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt",
              "docs/tv-cleanroom-s11-parity-audit.md",
              "scripts/verify_tv_parity_s11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S11 changed files outside the parity QA boundary: " + ", ".join(unexpected))

          expected_hashes = {
              '.nustrim-tv': '1f04c0805b3e1e38285214b9be03d222648cb7261e86d25d7ccfebbe9cce39ab',
              'docs/tv-cleanroom-s11-parity-audit.md': '518fce2c73f58a5d1335a4acc49df3843d5cd3ea9d2f0eb4d873314e24569d60',
              'scripts/verify_tv_parity_s11.py': 'fe7d78153b9460a9526dad697f76430bc723cdb237ccef24acd884b098949acf',
          }
          failed_hashes = []
          for relative, expected in expected_hashes.items():
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  failed_hashes.append(relative)
          if failed_hashes:
              raise SystemExit("S11 exact payload mismatch: " + ", ".join(failed_hashes))

          obsolete = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt")
          if obsolete.exists():
              raise SystemExit("Unused temporary TV foundation screen remains present")

          root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          all_tv = "\n".join(path.read_text(errors="ignore") for path in root.rglob("*.kt"))
          if "intentionally temporary until its subsystem rebuild begins" in all_tv:
              raise SystemExit("Temporary clean-room placeholder copy remains in a routed TV source")
          if "EpisodeEngine" in all_tv:
              raise SystemExit("Protected legacy EpisodeEngine entered the clean-room TV source")
          if "import androidx.compose.foundation.layout.weight" in all_tv:
              raise SystemExit("Invalid direct weight import returned")
          PY

          python3 scripts/verify_tv_parity_s11.py \
            --minimum-percent 95 \
            --json tv-parity-s11-report.json

          python3 <<'PY'
          from pathlib import Path
          import json

          report = json.loads(Path("tv-parity-s11-report.json").read_text(encoding="utf-8"))
          contract = report.get("staticContract", {})
          if contract.get("passed") != 40 or contract.get("total") != 40:
              raise SystemExit("S11 static contract is not exactly 40/40")
          if float(contract.get("percent", 0)) != 100.0:
              raise SystemExit("S11 static contract percentage is not 100.0")
          if report.get("deviceVisualParity") != "not-evaluated":
              raise SystemExit("S11 must not claim device visual parity without device evidence")
          print("S11 report verified: static 40/40; device visual parity not evaluated")
          PY

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s11-parity-qa-build.log"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity, version and permanent certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" |
            tee "$RUNNER_TEMP/nustrim-s11-parity-qa-signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' \
              "$RUNNER_TEMP/nustrim-s11-parity-qa-signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT" ] || [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Built APK certificate is not the locked Nustrim certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : ${CERT:-missing}"
            exit 50
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"

          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          test "$SRC_CODE" -ge "$MIN_TARGET_VERSION_CODE"

          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          dst = Path(f"Nustrim-{version_name}.apk")
          dst.write_bytes(src.read_bytes())

          sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          size = dst.stat().st_size
          tag = f"v{version_name}"

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{dst.name}",
              "sha256": sha,
              "changelog": (
                  "Clean-room S11 Parity QA with a 40-check static contract across eight TV surfaces, removal of the unused "
                  "temporary screen, and an explicit device acceptance checklist. Device visual parity remains pending."
              ),
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={dst.name}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"size={size}\n")
          PY

      - name: Commit S11 Parity QA only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --sparse \
            .nustrim-version \
            .nustrim-tv \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv \
            docs/tv-cleanroom-s11-parity-audit.md \
            scripts/verify_tv_parity_s11.py

          if git diff --cached --quiet; then
            echo "S11 Parity QA source is already committed."
          else
            git commit -m "Build cleanroom S11 Parity QA [skip ci]"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.cert_sha }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$RUNNER_TEMP/s11-parity-qa-release.json"
          LOOKUP_JSON="$RUNNER_TEMP/s11-parity-qa-release-existing.json"
          PAYLOAD="$RUNNER_TEMP/s11-parity-qa-release-payload.json"

          export TAG VERSION CERT TARGET_SHA PAYLOAD

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["TARGET_SHA"],
              "name": f"Nustrim {os.environ['VERSION']}",
              "body": (
                  f"Nustrim {os.environ['VERSION']}\n\n"
                  "Clean-room S11 Parity QA is now implemented on the accepted S10 baseline.\n\n"
                  "Includes a 40-check static contract across Shell, Home, Search, Library, Settings, Details, Sources and Player, plus a manual device acceptance checklist. Static parity is verified separately from device visual parity.\n\n"
                  "Nuvio TV 0.8.6-beta remains the locked behavioural reference.\n\n"
                  f"Permanent signing certificate SHA-256:\n{os.environ['CERT']}\n"
              ),
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          }
          Path(os.environ["PAYLOAD"]).write_text(json.dumps(payload), encoding="utf-8")
          PY

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$LOOKUP_JSON" 2>/dev/null; then
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$LOOKUP_JSON")"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          fi

          export RELEASE_JSON
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("Release API returned the wrong tag")
          if release.get("draft") is not False:
              raise SystemExit("Release remained a draft")

          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("Release API did not return a valid release id")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_id={release_id}\n")
          PY

      - name: Upload APK and updater manifest to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s update.json
          test -s tv-parity-s11-report.json
          test -s docs/tv-cleanroom-s11-parity-audit.md
          gh release upload "$TAG" "$APK" update.json tv-parity-s11-report.json docs/tv-cleanroom-s11-parity-audit.md --clobber

      - name: Verify published Release and live updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          EXPECTED_NAME: ${{ steps.verify.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.verify.outputs.version_code }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.assets.outputs.size }}
          EXPECTED_CERT: ${{ steps.verify.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          RELEASE_JSON="$RUNNER_TEMP/s11-parity-qa-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"

          export RELEASE_JSON APK_NAME
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          assets = {
              item.get("name"): int(item.get("size", 0))
              for item in release.get("assets", [])
          }
          for required in (os.environ["APK_NAME"], "update.json", "tv-parity-s11-report.json", "tv-cleanroom-s11-parity-audit.md"):
              if required not in assets or assets[required] <= 0:
                  raise SystemExit(f"Missing or empty release asset: {required}")
          PY

          LIVE="$RUNNER_TEMP/s11-parity-qa-live-updater"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG" \
            --pattern update.json \
            --pattern tv-parity-s11-report.json \
            --pattern tv-cleanroom-s11-parity-audit.md \
            --pattern "$APK_NAME" \
            --dir "$LIVE" \
            --clobber

          export LIVE TAG APK_NAME EXPECTED_NAME EXPECTED_CODE EXPECTED_SHA EXPECTED_SIZE EXPECTED_CERT
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK_NAME"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))
          parity = json.loads((root / "tv-parity-s11-report.json").read_text(encoding="utf-8"))

          expected_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/{apk.name}"
          )

          checks = {
              "versionName": manifest.get("versionName") == os.environ["EXPECTED_NAME"],
              "versionCode": int(manifest.get("versionCode", -1)) == int(os.environ["EXPECTED_CODE"]),
              "apkUrl": manifest.get("apkUrl") == expected_url,
              "sizeBytes": int(manifest.get("sizeBytes", -1)) == int(os.environ["EXPECTED_SIZE"]),
              "signingMode": manifest.get("signingMode") == "permanent",
              "signingCertSha256": (
                  str(manifest.get("signingCertSha256", "")).upper()
                  == os.environ["EXPECTED_CERT"].upper()
              ),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Live updater verification failed: " + ", ".join(failed))

          actual_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if actual_sha.lower() != os.environ["EXPECTED_SHA"].lower():
              raise SystemExit("Live APK SHA-256 differs from prepared asset")
          if str(manifest.get("sha256", "")).lower() != actual_sha.lower():
              raise SystemExit("update.json SHA-256 differs from live APK")

          contract = parity.get("staticContract", {})
          if contract.get("passed") != 40 or contract.get("total") != 40:
              raise SystemExit("Live parity report is not 40/40")
          if parity.get("deviceVisualParity") != "not-evaluated":
              raise SystemExit("Live parity report makes an unsupported device claim")

          print(f"Live updater and parity report verified: {manifest['versionName']} ({manifest['versionCode']})")
          PY

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s11-parity-qa-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-parity-s11-report.json
            docs/tv-cleanroom-s11-parity-audit.md
            ${{ runner.temp }}/nustrim-s11-parity-qa-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s11-parity-qa-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s11-parity-qa-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s11-parity-qa-signature.txt" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-parity-qa-release.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-parity-qa-release-existing.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-parity-qa-release-payload.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s11-parity-qa-release-assets.json" "$D/" 2>/dev/null
          cp app/build.gradle.kts "$D/" 2>/dev/null
          cp .nustrim-version "$D/" 2>/dev/null
          cp .nustrim-tv "$D/" 2>/dev/null
          cp update.json "$D/" 2>/dev/null
          cp tv-parity-s11-report.json "$D/" 2>/dev/null
          cp docs/tv-cleanroom-s11-parity-audit.md "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s11-parity-qa-diagnose
          path: ${{ runner.temp }}/nustrim-s11-parity-qa-diagnose
          if-no-files-found: warn
          retention-days: 7
