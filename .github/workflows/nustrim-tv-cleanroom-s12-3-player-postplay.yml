name: Nustrim TV Cleanroom S12.3 Player Post-play Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-3-player-postplay
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.2-tv-cleanroom-s12.3-player-postplay"
  MIN_TARGET_VERSION_CODE: "125"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.1-tv-cleanroom-s12.2-details-episode-focus"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.3 Player source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
          MARKER_B64: ""
          VERIFY_B64: ""
        run: |
          set -euo pipefail
          SCREEN="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          TARGET_SCREEN_SHA="c69dc1c8f74a4944f2c68c45760179d61e2ade0abdc3b499fd925260f011a452"
          if [ "$(sha256sum "$SCREEN" | cut -d' ' -f1)" != "$TARGET_SCREEN_SHA" ]; then
            PATCH_FILE="$RUNNER_TEMP/s12-3-player.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi
          printf '%s' "$MARKER_B64" | base64 --decode > .nustrim-tv
          mkdir -p scripts
          printf '%s' "$VERIFY_B64" | base64 --decode > scripts/verify_tv_player_postplay_s12_3.py

          python3 <<'PY'
          from pathlib import Path
          import re

          target_name = "0.57.2-tv-cleanroom-s12.3-player-postplay"
          minimum_code = 125
          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")
          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          target_code = current_code if current_name == target_name else max(current_code + 1, minimum_code)
          build = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {target_code}", build, count=1)
          build = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', build, count=1)
          build_path.write_text(build, encoding="utf-8")
          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify S12.3 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerControls.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesEntry.kt",
              "scripts/verify_tv_player_postplay_s12_3.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.3 changed files outside Player boundary: " + ", ".join(unexpected))
          expected_hashes = {
              ".nustrim-tv": "8fcd7f2b534259e11c4f34fe67dfc2717815dcf91085b00085e92ca6463fdd2b",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerControls.kt": "cca71d04b9d8fbba74a300627fcf87cb6054834cd0a554f5f62a1c18c4979d8a",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt": "36caca9e0374a0f4f29d5ee702bd827bf8704db51e6e75837c8250cce9bf4e83",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt": "c69dc1c8f74a4944f2c68c45760179d61e2ade0abdc3b499fd925260f011a452",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesEntry.kt": "042b27b07f3d6b5dddffac0b7ec852911ecbd42a33e1f0145bfce6e880fb3a3e",
              "scripts/verify_tv_player_postplay_s12_3.py": "142ebff66caca213b0d70f13828a4f87517a008c1ebb8aae3c17d5ddfc2aa015",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.3 payload mismatch: " + ", ".join(mismatch))
          version = Path(".nustrim-version").read_text().strip()
          build = Path("app/build.gradle.kts").read_text()
          if version != "0.57.2-tv-cleanroom-s12.3-player-postplay":
              raise SystemExit("Unexpected S12.3 version marker")
          if "versionCode = 125" not in build or f'versionName = "{version}"' not in build:
              raise SystemExit("Unexpected S12.3 build metadata")
          PY
          python3 scripts/verify_tv_player_postplay_s12_3.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-3-player-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-3-player-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-3-player-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          test "$SRC_CODE" -ge "$MIN_TARGET_VERSION_CODE"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater and S12.3 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.3 connects Player seek and control-hide settings, adds a cancellable next-episode countdown, keeps an explicit return-to-details action, and honours first-source autoplay when enabled.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.3 Player Overlay and Post-play",
              "issue": "S12-PLY-01",
              "status": "build-verified",
              "scope": ["TV Player overlay", "post-play", "preference wiring", "one-shot source autoplay"],
              "preserved": ["S12.2 Details", "provider scheduling", "subtitle discovery", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "verify seek intervals at 10, 15, and 30 seconds",
                  "verify controls hide at 3, 5, and 8 seconds",
                  "verify autoplay-next countdown and cancellation",
                  "verify Back to details from post-play",
                  "verify autoplay-first-source only when enabled",
              ],
              "nextBacklog": "S12.4 Subtitle Overlay and Updater closure",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-player-postplay-s12-3-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.3 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerControls.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesEntry.kt \
            scripts/verify_tv_player_postplay_s12_3.py
          if git diff --cached --quiet; then
            echo "S12.3 Player source is already committed."
          else
            git commit -m "Close TV Player overlay and post-play S12.3 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-3-player-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.3 connects Player seek and control-hide preferences, adds a cancellable next-episode countdown, keeps Back to details visible, and honours first-source autoplay only when enabled." "" \
            "S12.2 Details, progressive provider scheduling, subtitle discovery, and Mobile UI remain preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-player-postplay-s12-3-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-3-player-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-player-postplay-s12-3-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-player-postplay-s12-3-report.json").read_text())
          if report.get("issue") != "S12-PLY-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.3 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-3-player-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-player-postplay-s12-3-report.json
            ${{ runner.temp }}/nustrim-s12-3-player-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-3-player-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-3-player-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-3-player-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-player-postplay-s12-3-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-3-player-diagnose
          path: ${{ runner.temp }}/nustrim-s12-3-player-diagnose
          if-no-files-found: warn
          retention-days: 7
