name: Nustrim TV Cleanroom S10 Global Polish Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s10-global-polish
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.55.0-tv-cleanroom-s10-global-polish"
  MIN_TARGET_VERSION_CODE: "120"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard known clean-room baseline
        shell: bash
        run: |
          set -euo pipefail

          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"

          echo "Build version: $current_build"
          echo "Marker version: $current_marker"

          allowed_versions=(
            "0.54.0-tv-cleanroom-s9-settings"
            "0.55.0-tv-cleanroom-s10-global-polish"
          )

          allowed=false
          for version in "${allowed_versions[@]}"; do
            if [ "$current_build" = "$version" ]; then
              allowed=true
              break
            fi
          done

          if [ "$allowed" != "true" ]; then
            echo "::error::Unexpected app baseline. S10 Global Polish is allowed only from the accepted S9 release or an idempotent S10 rerun."
            exit 20
          fi

          if [ "$current_marker" != "$current_build" ]; then
            echo "::error::Build version and .nustrim-version marker do not match."
            exit 21
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare and validate permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate does not match Nustrim permanent certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : $CERT"
            exit 31
          fi

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact clean-room S10 Global Polish source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvFocusMotion.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '',
          }

          target_name = "0.55.0-tv-cleanroom-s10-global-polish"
          min_code = 120

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          target_code = current_code if current_name == target_name else max(current_code + 1, min_code)

          build = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {target_code}", build, count=1)
          build = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', build, count=1)
          build_path.write_text(build, encoding="utf-8")

          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          Path(".nustrim-tv").write_text(
              "generation=cleanroom-v1\n"
              "reference=nuvio-tv-0.8.6-beta\n"
              "subsystem=10-global-polish\n"
              "status=release-candidate\n"
              "baseline=0.51.4-tv-cleanroom-s6.2-rollback\n"
              "preserve=source-provider-engine,stream-resolver,playback-engine,mobile-ui\n"
              "home=cleanroom-s2-accepted\n"
              "episode-domain=cleanroom-s3-accepted\n"
              "details=cleanroom-s4-accepted\n"
              "sources=cleanroom-s5.1-accepted\n"
              "player=cleanroom-s6-functional\n"
              "player-parity=cleanroom-s6.2-restored\n"
              "search=cleanroom-s7\n"
              "search-min-query-length=2\n"
              "search-live-debounce-ms=350\n"
              "search-recent-limit=8\n"
              "search-discover=catalog-sections\n"
              "search-details-route=enabled\n"
              "search-focus=exact-card-restoration\n"
              "library=cleanroom-s8\n"
              "library-sections=saved,continue-watching\n"
              "library-filters=media-type,watched-status\n"
              "library-sort=recent,oldest,title-asc,title-desc\n"
              "library-details-route=enabled\n"
              "library-save-toggle=details-integrated\n"
              "library-focus=exact-card-restoration\n"
              "settings=cleanroom-s9\n"
              "settings-layout=category-rail,detail-pane\n"
              "settings-sections=playback,subtitles,content,integrations,advanced,about\n"
              "settings-content-sources=enable-disable\n"
              "settings-update-check=enabled\n"
              "settings-focus=category-and-detail-restoration\n"
              "global-polish=cleanroom-s10\n"
              "tv-theme=shared-colour,typography,spacing,motion\n"
              "focus-motion=shared-scale-and-duration\n"
              "focus-restore=bounded-six-frame-retry\n"
              "backlog=s6-player-final-polish,episode-focus,subtitle-overlay,player-overlay,postplay,updater\n"
              "auto-release=permanent-signed\n"
              "legacy-episode-engine=unused-by-cleanroom-tv\n",
              encoding="utf-8",
          )

          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify S10 Global Polish boundaries and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"

          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed_exact = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
          }
          allowed_prefixes = (
              "app/src/main/java/app/nudroidlabs/nustrim/tv/common/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/focus/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/search/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/theme/",
          )
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit("S10 changed files outside TV visual and focus boundary: " + ", ".join(unexpected))

          expected_hashes = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': 'c2b2239709f79807ef125a135581c5d2ae842e803da600ae0227387b52600422',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt': 'c93f9e91b6facab30b7340067efb3fcf773cb1d0b208af151f5c5b8a86c443ee',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '14a85d53d7a7f4fc7d3e909045963a9ea0c1bd2353b80f91ea0e512f6877e475',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': 'da0780acff08e9a2a96b7eb990acafb2bf831c7f6950300521720f42a8e4ae70',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': 'a73b3d493c47d47750c0ba6e5cf07b2486989dbc7ada44de0db14ead972782e6',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt': '487bbc2e646ea7ca6ec636a1b177343a7b43fa63692329b2a2e33ba1ea12306b',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchRows.kt': 'a3d7db293e0bcd1fe1bee4ae23faee78606d314cb2f97e72e8590e2cc61175dd',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt': '666338f52837395e5a67bfaa1ed359019588d8ad2fd8c0fc75460b10262aedc9',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '131c6377e400270f682d5e6f86430febedf9bf4fedde5cebd641bdc1d396b01f',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesScreen.kt': '2b83a1afc561390fda6ca375fc3a82914691d09f1e2a4daf575f90844450ee38',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '622f808283dacbaa228733c7bdcd8e2c7919a83c4ab778dac375dc5b249e16d4',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvFocusMotion.kt': '65e4d7233eb8e828fe07b65550f7da844181a3dc3c64c7018ebbdfcfcb765315',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '9cee42e83cccc026fab18e3a8eeb6d3eb167117a6fd154ff69ea60d73f7c0af9',
          }
          failed_hashes = []
          for relative, expected in expected_hashes.items():
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  failed_hashes.append(relative)
          if failed_hashes:
              raise SystemExit("S10 exact payload mismatch: " + ", ".join(failed_hashes))

          root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          tokens = (root / "theme/TvTokens.kt").read_text()
          motion = (root / "theme/TvFocusMotion.kt").read_text()
          theme = (root / "theme/NustrimTvTheme.kt").read_text()
          registry = (root / "focus/TvFocusRegistry.kt").read_text()
          restore = (root / "focus/TvFocusRestoreEffect.kt").read_text()
          sidebar = (root / "shell/TvSidebar.kt").read_text()
          home = (root / "home/TvHomeRows.kt").read_text()
          search = (root / "search/TvSearchRows.kt").read_text()
          library = (root / "library/TvLibraryScreen.kt").read_text()
          settings = (root / "settings/TvSettingsScreen.kt").read_text()
          details = (root / "details/TvDetailsScreen.kt").read_text()
          sources = (root / "sources/TvSourcesScreen.kt").read_text()
          player_runtime = (root / "player/TvPlayerRuntime.kt").read_text()
          player_screen = (root / "player/TvPlayerScreen.kt").read_text()
          all_tv = "\n".join(path.read_text(errors="ignore") for path in root.rglob("*.kt"))

          checks = {
              "shared visual palette installed": "object TvColors" in theme and "TvTypography" in theme,
              "shared focus motion installed": "fun animateTvFocusScale" in motion and "FastOutSlowInEasing" in motion,
              "focus scale normalized": "const val FocusScale = 1.02f" in tokens and "SubtleFocusScale = 1.01f" in tokens,
              "focus restore is bounded": "FocusRestoreAttempts = 6" in tokens and "repeat(TvTokens.FocusRestoreAttempts)" in restore,
              "failed remembered anchor falls back": "candidates.any" in registry and "requestAnchor(scopeKey, anchorKey)" in registry,
              "sidebar uses shared motion and colours": "animateTvFocusScale" in sidebar and "TvColors.SidebarExpanded" in sidebar,
              "root content focus motion normalized": all("animateTvFocusScale" in text for text in (home, search, library, settings)),
              "detail and source focus motion normalized": "animateTvFocusScale" in details and "animateTvFocusScale" in sources,
              "real Media3 playback preserved": "PlayerFactory.create(" in player_runtime and "PlayerView(context)" in player_screen,
              "protected legacy EpisodeEngine remains absent": "EpisodeEngine" not in all_tv,
              "invalid direct weight import absent": "import androidx.compose.foundation.layout.weight" not in all_tv,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit("S10 Global Polish invariant failure: " + ", ".join(failed))
          PY

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s10-global-polish-build.log"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity, version and permanent certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" |
            tee "$RUNNER_TEMP/nustrim-s10-global-polish-signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' \
              "$RUNNER_TEMP/nustrim-s10-global-polish-signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT" ] || [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Built APK certificate is not the locked Nustrim certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : ${CERT:-missing}"
            exit 50
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"

          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          test "$SRC_CODE" -ge "$MIN_TARGET_VERSION_CODE"

          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          dst = Path(f"Nustrim-{version_name}.apk")
          dst.write_bytes(src.read_bytes())

          sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          size = dst.stat().st_size
          tag = f"v{version_name}"

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{dst.name}",
              "sha256": sha,
              "changelog": (
                  "Clean-room S10 Global Polish with shared TV colour, typography, spacing and motion tokens, consistent "
                  "focus scaling, and bounded focus restoration retries. The accepted S6.2 Player baseline is preserved."
              ),
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={dst.name}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"size={size}\n")
          PY

      - name: Commit S10 Global Polish only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nustrim-version \
            .nustrim-tv \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv

          if git diff --cached --quiet; then
            echo "S10 Global Polish source is already committed."
          else
            git commit -m "Build cleanroom S10 Global Polish [skip ci]"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.cert_sha }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$RUNNER_TEMP/s10-global-polish-release.json"
          LOOKUP_JSON="$RUNNER_TEMP/s10-global-polish-release-existing.json"
          PAYLOAD="$RUNNER_TEMP/s10-global-polish-release-payload.json"

          export TAG VERSION CERT TARGET_SHA PAYLOAD

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["TARGET_SHA"],
              "name": f"Nustrim {os.environ['VERSION']}",
              "body": (
                  f"Nustrim {os.environ['VERSION']}\n\n"
                  "Clean-room S10 Global Polish is now implemented on the accepted S9 baseline.\n\n"
                  "Includes shared TV colour, typography, spacing and motion tokens, consistent focus scaling across rebuilt screens, and bounded focus restoration retries.\n\n"
                  "Nuvio TV 0.8.6-beta remains the locked behavioural reference.\n\n"
                  f"Permanent signing certificate SHA-256:\n{os.environ['CERT']}\n"
              ),
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          }
          Path(os.environ["PAYLOAD"]).write_text(json.dumps(payload), encoding="utf-8")
          PY

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$LOOKUP_JSON" 2>/dev/null; then
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$LOOKUP_JSON")"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          fi

          export RELEASE_JSON
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("Release API returned the wrong tag")
          if release.get("draft") is not False:
              raise SystemExit("Release remained a draft")

          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("Release API did not return a valid release id")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_id={release_id}\n")
          PY

      - name: Upload APK and updater manifest to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s update.json
          gh release upload "$TAG" "$APK" update.json --clobber

      - name: Verify published Release and live updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          EXPECTED_NAME: ${{ steps.verify.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.verify.outputs.version_code }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.assets.outputs.size }}
          EXPECTED_CERT: ${{ steps.verify.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          RELEASE_JSON="$RUNNER_TEMP/s10-global-polish-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"

          export RELEASE_JSON APK_NAME
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          assets = {
              item.get("name"): int(item.get("size", 0))
              for item in release.get("assets", [])
          }
          for required in (os.environ["APK_NAME"], "update.json"):
              if required not in assets or assets[required] <= 0:
                  raise SystemExit(f"Missing or empty release asset: {required}")
          PY

          LIVE="$RUNNER_TEMP/s10-global-polish-live-updater"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG" \
            --pattern update.json \
            --pattern "$APK_NAME" \
            --dir "$LIVE" \
            --clobber

          export LIVE TAG APK_NAME EXPECTED_NAME EXPECTED_CODE EXPECTED_SHA EXPECTED_SIZE EXPECTED_CERT
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK_NAME"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))

          expected_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/{apk.name}"
          )

          checks = {
              "versionName": manifest.get("versionName") == os.environ["EXPECTED_NAME"],
              "versionCode": int(manifest.get("versionCode", -1)) == int(os.environ["EXPECTED_CODE"]),
              "apkUrl": manifest.get("apkUrl") == expected_url,
              "sizeBytes": int(manifest.get("sizeBytes", -1)) == int(os.environ["EXPECTED_SIZE"]),
              "signingMode": manifest.get("signingMode") == "permanent",
              "signingCertSha256": (
                  str(manifest.get("signingCertSha256", "")).upper()
                  == os.environ["EXPECTED_CERT"].upper()
              ),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Live updater verification failed: " + ", ".join(failed))

          actual_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if actual_sha.lower() != os.environ["EXPECTED_SHA"].lower():
              raise SystemExit("Live APK SHA-256 differs from prepared asset")
          if str(manifest.get("sha256", "")).lower() != actual_sha.lower():
              raise SystemExit("update.json SHA-256 differs from live APK")

          print(f"Live updater verified: {manifest['versionName']} ({manifest['versionCode']})")
          PY

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s10-global-polish-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            ${{ runner.temp }}/nustrim-s10-global-polish-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s10-global-polish-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s10-global-polish-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s10-global-polish-signature.txt" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s10-global-polish-release.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s10-global-polish-release-existing.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s10-global-polish-release-payload.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s10-global-polish-release-assets.json" "$D/" 2>/dev/null
          cp app/build.gradle.kts "$D/" 2>/dev/null
          cp .nustrim-version "$D/" 2>/dev/null
          cp .nustrim-tv "$D/" 2>/dev/null
          cp update.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s10-global-polish-diagnose
          path: ${{ runner.temp }}/nustrim-s10-global-polish-diagnose
          if-no-files-found: warn
          retention-days: 7
