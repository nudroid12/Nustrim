name: Nustrim TV Cleanroom S5.1 Stream Resolution Auto Release V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s5-sources
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.50.1-tv-cleanroom-s5.1-stream-resolution"
  MIN_TARGET_VERSION_CODE: "108"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard known clean-room baseline
        shell: bash
        run: |
          set -euo pipefail

          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"

          echo "Build version: $current_build"
          echo "Marker version: $current_marker"

          allowed_versions=(
            "0.45.0-tv-v3.5-library-core"
            "0.46.0-tv-cleanroom-s1"
            "0.47.0-tv-cleanroom-s2-home"
            "0.48.0-tv-cleanroom-s3-episodes"
            "0.48.1-tv-cleanroom-s3.1-media-handoff"
            "0.49.0-tv-cleanroom-s4-details"
            "0.49.1-tv-cleanroom-s4.1-episode-title-fix"
            "0.49.2-tv-cleanroom-s4.2-season-focus"
            "0.49.3-tv-cleanroom-s4.3-exact-episode-return"
            "0.50.0-tv-cleanroom-s5-sources"
            "0.50.1-tv-cleanroom-s5.1-stream-resolution"
          )

          allowed=false
          for version in "${allowed_versions[@]}"; do
            if [ "$current_build" = "$version" ]; then
              allowed=true
              break
            fi
          done

          if [ "$allowed" != "true" ]; then
            echo "::error::Unexpected app baseline. Re-audit before applying S5.1."
            exit 20
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare and validate permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate does not match Nustrim permanent certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : $CERT"
            exit 31
          fi

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Replace TV tree with clean-room S1 through S5
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil

          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsSessionStore.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeCatalogueBuilder.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeHero.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvBackPolicy.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvNavigator.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvRoute.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlaybackRequest.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesSessionStore.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '',
          }

          target_name = "0.50.1-tv-cleanroom-s5.1-stream-resolution"
          min_code = 107

          tv_root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          if tv_root.exists():
              shutil.rmtree(tv_root)

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          if current_name == target_name:
              target_code = current_code
          else:
              target_code = max(current_code + 1, min_code)

          build = re.sub(
              r"versionCode\s*=\s*\d+",
              f"versionCode = {target_code}",
              build,
              count=1,
          )
          build = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target_name}"',
              build,
              count=1,
          )
          build_path.write_text(build, encoding="utf-8")

          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          Path(".nustrim-tv").write_text(
              "generation=cleanroom-v1\n"
              "reference=nuvio-tv-0.8.6-beta\n"
              "subsystem=5.1-stream-resolution\n"
              "status=release-candidate\n"
              "preserve=source-provider-engine,stream-resolver,playback-engine,mobile-ui\n"
              "home=cleanroom-s2-accepted\n"
              "episode-domain=cleanroom-s3-accepted\n"
              "details=cleanroom-s4-accepted\n"
              "sources=cleanroom-s5.1\n"
              "sources-layout=nuvio-40-60\n"
              "sources-aggregation=enabled-installed-sources\n"
              "sources-filter=all-plus-provider\n"
              "sources-filter-from-list=left-right\n"
              "sources-first-stream-up=active-filter-chip\n"
              "sources-filter-down=remembered-stream\n"
              "sources-player-return=exact-stream-focus\n"
              "player=foundation-next\n"
              "auto-release=permanent-signed\n"
              "legacy-episode-engine=unused-by-cleanroom-tv\n",
              encoding="utf-8",
          )

          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify S5 boundaries and clean-room invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          if grep -R -n -F 'import androidx.compose.foundation.layout.weight'             app/src/main/java/app/nudroidlabs/nustrim/tv; then
            echo "::error::Do not import foundation.layout.weight directly. RowScope supplies Modifier.weight."
            exit 39
          fi

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"

          forbidden="$(printf '%s\n' "$changed" | grep -E '^app/src/main/java/app/nudroidlabs/nustrim/(core|features|ui)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Protected source changed unexpectedly:"
            printf '%s\n' "$forbidden"
            exit 40
          fi

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          screen = (root / "sources/TvSourcesScreen.kt").read_text()
          repo = (root / "sources/TvSourcesRepository.kt").read_text()
          route = (root / "navigation/TvRoute.kt").read_text()
          shell = (root / "shell/TvShell.kt").read_text()
          all_tv = "\n".join(p.read_text(errors="ignore") for p in root.rglob("*.kt"))

          checks = {
              "real Sources entry installed": "TvSourcesEntry(" in shell,
              "Stremio stream addons are direct-first":
                  "session.kind == SourceKind.STREMIO" in repo
                  and "resolveStremioSource(" in repo,
              "non-stream Stremio addons are excluded":
                  'if ("stream" !in resources)' in repo,
              "Stremio direct ID fallback is diagnosable":
                  "Direct stream ID returned 0" in repo,
              "source provider engine consumed, not replaced": "SourceEngine" in repo,
              "installed source aggregation": "sourceStore.sources()" in repo,
              "CloudStream searchable provider path": "SearchableSourceSession" in repo,
              "CloudStream child provider path": "ChildSourceOpener" in repo,
              "stream Left cycles provider filter": "Key.DirectionLeft -> onCycleFilter(-1)" in screen,
              "stream Right cycles provider filter": "Key.DirectionRight -> onCycleFilter(1)" in screen,
              "first stream Up goes to active chip": "focusRegistry.requestAnchor(scopeKey, chipAnchor)" in screen,
              "chip Down returns to remembered stream": "focusRegistry.requestAnchor(scopeKey, streamAnchorKey(streamKey))" in screen,
              "player receives selected preserved stream": "val request: TvPlaybackRequest" in route,
              "old EpisodeEngine absent from clean-room TV": "EpisodeEngine" not in all_tv,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit("S5 invariant failure: " + ", ".join(failed))
          PY

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s5-build.log"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity, version and permanent certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" |
            tee "$RUNNER_TEMP/nustrim-s5-signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' \
              "$RUNNER_TEMP/nustrim-s5-signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT" ] || [ "$CERT" != "$LOCKED_CERT_SHA256" ]; then
            echo "::error::Built APK certificate is not the locked Nustrim certificate."
            echo "Expected: $LOCKED_CERT_SHA256"
            echo "Current : ${CERT:-missing}"
            exit 50
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"

          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"

          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          dst = Path(f"Nustrim-{version_name}.apk")
          dst.write_bytes(src.read_bytes())

          sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          size = dst.stat().st_size
          tag = f"v{version_name}"

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{dst.name}",
              "sha256": sha,
              "changelog": (
                  "TV clean-room S5.1 Stream Resolution: Nuvio-style source selection, "
                  "provider filters, D-pad focus restoration and Player handoff."
              ),
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={dst.name}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"size={size}\n")
          PY

      - name: Commit S5 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nustrim-version \
            .nustrim-tv \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv

          if git diff --cached --quiet; then
            echo "S5 source is already committed."
          else
            git commit -m "TV cleanroom S5.1 stream resolution [skip ci]"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.cert_sha }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$RUNNER_TEMP/s5-release.json"
          LOOKUP_JSON="$RUNNER_TEMP/s5-release-existing.json"
          PAYLOAD="$RUNNER_TEMP/s5-release-payload.json"

          export TAG VERSION CERT TARGET_SHA PAYLOAD

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["TARGET_SHA"],
              "name": f"Nustrim {os.environ['VERSION']}",
              "body": (
                  f"Nustrim {os.environ['VERSION']}\n\n"
                  "TV clean-room S5.1 Stream Resolution.\n\n"
                  "Nuvio TV 0.8.6-beta remains the locked behavioural reference.\n\n"
                  f"Permanent signing certificate SHA-256:\n{os.environ['CERT']}\n"
              ),
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          }
          Path(os.environ["PAYLOAD"]).write_text(json.dumps(payload), encoding="utf-8")
          PY

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$LOOKUP_JSON" 2>/dev/null; then
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$LOOKUP_JSON")"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input "$PAYLOAD" \
              > "$RELEASE_JSON"
          fi

          export RELEASE_JSON
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("Release API returned the wrong tag")
          if release.get("draft") is not False:
              raise SystemExit("Release remained a draft")

          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("Release API did not return a valid release id")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_id={release_id}\n")
          PY

      - name: Upload APK and updater manifest to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s update.json
          gh release upload "$TAG" "$APK" update.json --clobber

      - name: Verify published Release and live updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          EXPECTED_NAME: ${{ steps.verify.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.verify.outputs.version_code }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.assets.outputs.size }}
          EXPECTED_CERT: ${{ steps.verify.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          RELEASE_JSON="$RUNNER_TEMP/s5-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"

          export RELEASE_JSON APK_NAME
          python3 <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as fh:
              release = json.load(fh)

          assets = {
              item.get("name"): int(item.get("size", 0))
              for item in release.get("assets", [])
          }
          for required in (os.environ["APK_NAME"], "update.json"):
              if required not in assets or assets[required] <= 0:
                  raise SystemExit(f"Missing or empty release asset: {required}")
          PY

          LIVE="$RUNNER_TEMP/s5-live-updater"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG" \
            --pattern update.json \
            --pattern "$APK_NAME" \
            --dir "$LIVE" \
            --clobber

          export LIVE TAG APK_NAME EXPECTED_NAME EXPECTED_CODE EXPECTED_SHA EXPECTED_SIZE EXPECTED_CERT
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK_NAME"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))

          expected_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/{apk.name}"
          )

          checks = {
              "versionName": manifest.get("versionName") == os.environ["EXPECTED_NAME"],
              "versionCode": int(manifest.get("versionCode", -1)) == int(os.environ["EXPECTED_CODE"]),
              "apkUrl": manifest.get("apkUrl") == expected_url,
              "sizeBytes": int(manifest.get("sizeBytes", -1)) == int(os.environ["EXPECTED_SIZE"]),
              "signingMode": manifest.get("signingMode") == "permanent",
              "signingCertSha256": (
                  str(manifest.get("signingCertSha256", "")).upper()
                  == os.environ["EXPECTED_CERT"].upper()
              ),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Live updater verification failed: " + ", ".join(failed))

          actual_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if actual_sha.lower() != os.environ["EXPECTED_SHA"].lower():
              raise SystemExit("Live APK SHA-256 differs from prepared asset")
          if str(manifest.get("sha256", "")).lower() != actual_sha.lower():
              raise SystemExit("update.json SHA-256 differs from live APK")

          print(f"Live updater verified: {manifest['versionName']} ({manifest['versionCode']})")
          PY

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s5.1-stream-resolution-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            ${{ runner.temp }}/nustrim-s5-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s5-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s5-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s5-signature.txt" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s5-release.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s5-release-existing.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s5-release-payload.json" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/s5-release-assets.json" "$D/" 2>/dev/null
          cp app/build.gradle.kts "$D/" 2>/dev/null
          cp .nustrim-version "$D/" 2>/dev/null
          cp .nustrim-tv "$D/" 2>/dev/null
          cp update.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s5.1-stream-resolution-diagnose
          path: ${{ runner.temp }}/nustrim-s5-diagnose
          if-no-files-found: warn
          retention-days: 7
