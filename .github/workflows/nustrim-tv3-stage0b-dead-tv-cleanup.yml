name: Nustrim TV3 Stage 0B Dead TV Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv3-stage0b-dead-tv-cleanup
  cancel-in-progress: false

env:
  RESET_VERSION: "0.18.0-tv3-reset0b"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Stage 0A green baseline and protect updater
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"
          mkdir -p "$DIR"

          test -f .nustrim-tv-reset
          grep -q '^generation=3$' .nustrim-tv-reset
          grep -q '^stage=0A$' .nustrim-tv-reset
          grep -q '^runtime=mobile-only$' .nustrim-tv-reset

          test -d app/src/main/java/app/nudroidlabs/nustrim/tv2
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 \
            | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          python3 - <<'PY' > "$DIR/build-gradle.normalized.before"
          from pathlib import Path
          import re
          text = Path("app/build.gradle.kts").read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = <VERSION_CODE>', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "<VERSION_NAME>"', text, count=1)
          print(text, end="")
          PY

          {
            echo "NUSTRIM TV3 STAGE 0B"
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionName' app/build.gradle.kts || true
            echo
            echo "[external Tv2 symbols before cleanup]"
            grep -o -E '\bTv2[A-Za-z0-9_]*\b' app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt \
              | sort | uniq -c | sort -nr || true
            echo
            echo "[legacy TV inventory before cleanup]"
            grep -o -E '\b(Tv[A-Za-z0-9_]+|isTv|rememberIsTv)\b' app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt \
              | sort | uniq -c | sort -nr | head -n 160 || true
          } > "$DIR/preflight.txt"

      - name: Remove dead TV call sites and helper cluster
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0b/cleanup.log"
          from pathlib import Path
          import re
          
          APP = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          text = APP.read_text(encoding="utf-8")
          
          def match_block(source: str, start: int, opener="{", closer="}") -> int:
              depth = 0
              in_string = False
              triple = False
              escape = False
              i = start
              while i < len(source):
                  if source.startswith('"""', i):
                      triple = not triple
                      i += 3
                      continue
                  ch = source[i]
                  if triple:
                      i += 1
                      continue
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if ch == '"':
                      in_string = True
                      i += 1
                      continue
                  if ch == opener:
                      depth += 1
                  elif ch == closer:
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise SystemExit(f"Unbalanced {opener}{closer} block")
          
          def function_bounds_at(source: str, position: int):
              matches = list(re.finditer(
                  r'(?m)^(?:@[^\n]+\n)*\s*(?:private\s+)?fun\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',
                  source[:position + 1]
              ))
              for match in reversed(matches):
                  brace = source.find("{", match.end())
                  if brace < 0 or brace > position:
                      continue
                  try:
                      end = match_block(source, brace)
                  except SystemExit:
                      continue
                  if position < end:
                      return match.group(1), match.start(), end
              return None
          
          def top_level_named_span(source: str, name: str):
              patterns = [
                  rf'(?m)^(?:@[^\n]+\n)*\s*(?:private\s+)?fun\s+{re.escape(name)}\s*\(',
                  rf'(?m)^\s*private\s+object\s+{re.escape(name)}\b',
                  rf'(?m)^\s*private\s+(?:data\s+)?class\s+{re.escape(name)}\b',
                  rf'(?m)^\s*private\s+enum\s+class\s+{re.escape(name)}\b',
                  rf'(?m)^\s*private\s+sealed\s+(?:class|interface)\s+{re.escape(name)}\b',
              ]
              for pattern in patterns:
                  m = re.search(pattern, source)
                  if not m:
                      continue
                  # Function/class/object body.
                  brace = source.find("{", m.end())
                  paren = source.find("(", m.end())
                  if brace >= 0 and (paren < 0 or brace < paren or "fun " in m.group(0)):
                      # For functions the body brace comes after the parameter list,
                      # so use the first brace after the declaration match.
                      brace = source.find("{", m.end())
                      if brace >= 0:
                          return m.start(), match_block(source, brace)
                  if paren >= 0:
                      end = match_block(source, paren, "(", ")")
                      # Data class may have a body after the constructor.
                      cursor = end
                      while cursor < len(source) and source[cursor].isspace():
                          cursor += 1
                      if cursor < len(source) and source[cursor] == "{":
                          end = match_block(source, cursor)
                      return m.start(), end
              return None
          
          def remove_span(source: str, start: int, end: int):
              while end < len(source) and source[end] == "\n":
                  end += 1
              return source[:start] + source[end:]
          
          def strip_is_tv_block_once(source: str, negated: bool):
              pattern = re.compile(
                  r'if\s*\(\s*' + (r'!\s*isTv' if negated else r'isTv') + r'\s*\)\s*\{'
              )
              m = pattern.search(source)
              if not m:
                  return source, False
              open_brace = source.find("{", m.start())
              then_end = match_block(source, open_brace)
              then_body = source[open_brace + 1:then_end - 1]
          
              cursor = then_end
              while cursor < len(source) and source[cursor].isspace():
                  cursor += 1
          
              has_else = source.startswith("else", cursor)
              replacement = ""
              total_end = then_end
          
              if has_else:
                  cursor += 4
                  while cursor < len(source) and source[cursor].isspace():
                      cursor += 1
                  if cursor < len(source) and source[cursor] == "{":
                      else_end = match_block(source, cursor)
                      else_body = source[cursor + 1:else_end - 1]
                      total_end = else_end
                      replacement = then_body if negated else else_body
                  else:
                      # else-if or expression form: don't guess.
                      return source[:m.end()] + "__TVBLOCK_SKIP__" + source[m.end():], True
              else:
                  replacement = then_body if negated else ""
          
              return source[:m.start()] + replacement + source[total_end:], True
          
          # Stage 0A guarantees all runtime calls are Mobile. Therefore exact block
          # branches `if (isTv) {}` are dead and `if (!isTv) {}` are always active.
          # Fold only brace-delimited forms. Expression/else-if forms are left for 0C.
          for negated in (False, True):
              safety = 0
              while True:
                  updated, changed = strip_is_tv_block_once(text, negated)
                  if not changed:
                      break
                  if "__TVBLOCK_SKIP__" in updated:
                      updated = updated.replace("__TVBLOCK_SKIP__", "", 1)
                      # Move past this unsupported branch by rewriting only this occurrence
                      # to a harmless syntactic variant that this pass won't match.
                      # 0C will handle remaining expression/else-if semantics.
                      if negated:
                          updated = updated.replace("if (!isTv)", "if (isTv == false)", 1)
                      else:
                          updated = updated.replace("if (isTv)", "if (isTv == true)", 1)
                  text = updated
                  safety += 1
                  if safety > 1000:
                      raise SystemExit("Too many isTv block-fold passes")
          
          # Hard-mobile composable lookup. This removes the old automatic TV detector
          # as an active route while preserving function signatures until 0C.
          text = text.replace("rememberIsTv()", "false")
          
          # Remove entire TV-only functions that still contain external Tv2 calls.
          # Shared functions are NOT auto-deleted; seeing a Tv2 call there is a hard fail.
          for _ in range(100):
              tv2 = re.search(r'\bTv2[A-Za-z0-9_]*\b', text)
              if not tv2:
                  break
              symbol = tv2.group(0)
          
              # Ignore import lines for now.
              line_start = text.rfind("\n", 0, tv2.start()) + 1
              line_end = text.find("\n", tv2.end())
              if line_end < 0:
                  line_end = len(text)
              line = text[line_start:line_end]
              if line.lstrip().startswith("import app.nudroidlabs.nustrim.tv2."):
                  text = text[:line_start] + text[line_end + (1 if line_end < len(text) else 0):]
                  continue
          
              owner = function_bounds_at(text, tv2.start())
              if owner and owner[0].startswith("Tv"):
                  print(f"REMOVE TV-only owner {owner[0]} because it references {symbol}")
                  text = remove_span(text, owner[1], owner[2])
                  continue
          
              raise SystemExit(
                  f"External {symbol} remains in non-TV owner after mobile branch folding: "
                  f"{owner[0] if owner else 'top-level'}"
              )
          else:
              raise SystemExit("Too many Tv2 cleanup passes")
          
          # Remove every remaining direct TV2 import.
          text = re.sub(
              r'(?m)^import\s+app\.nudroidlabs\.nustrim\.tv2\.[^\n]+\n',
              '',
              text,
          )
          
          # Sweep known legacy top-level TV helper cluster from the R1 inventory.
          # A helper is removed only when it has no reference from code outside the
          # candidate TV-helper cluster. This safely handles mutually-referencing helpers.
          candidate_names = [
              "TvNavigationMemory",
              "TvSettingsRootItem",
              "TvDialogAction",
              "TvTestRemoteKey",
              "TvSearchState",
              "TvLibraryControl",
              "TvSearchFilterPill",
              "TvActionDialog",
              "TvSourcePickerState",
              "TvSourcePickerControl",
              "TvSearchMediaGrid",
              "TvDialogConfirmButton",
              "TvDetailIconAction",
              "TvStreamSourcePickerRow",
              "TvSourceFilterChip",
              "TvSettingsWorkspace",
              "TvSettingsOpenButton",
              "TvSeasonPill",
              "TvSearchScreenContent",
              "TvPauseInfoOverlay",
              "TvLibraryScreenContent",
              "TvEpisodesSection",
              "TvEpisodeCard",
              "TvDiscoverChoiceDialog",
              "TvDetailPrimaryAction",
              "TvTestRemote",
              "TvStreamSourcePickerDialog",
              "TvReferenceCanvas",
              "TvNavItem",
              "TvFocusDetailsHeader",
              "rememberIsTv",
              "rememberIsPhysicalTv",
              "isTvActivateKey",
              "consumeTvActivateKey",
              "requestTvFocus",
          ]
          
          # TvLayoutPrefsName is intentionally NOT a candidate: mobile subtitle
          # preferences still use that storage key and it is not presentation logic.
          
          spans = {}
          for name in candidate_names:
              span = top_level_named_span(text, name)
              if span:
                  spans[name] = span
          
          def mask_spans(source: str, spans_list):
              chars = list(source)
              for start, end in spans_list:
                  for i in range(start, end):
                      chars[i] = " "
              return "".join(chars)
          
          outside = mask_spans(text, list(spans.values()))
          remove_names = []
          retain_names = []
          for name, span in spans.items():
              if re.search(rf'\b{re.escape(name)}\b', outside):
                  retain_names.append(name)
              else:
                  remove_names.append(name)
          
          for name in sorted(remove_names, key=lambda n: spans[n][0], reverse=True):
              start, end = spans[name]
              text = remove_span(text, start, end)
          
          print("Dead TV helpers removed:", ", ".join(sorted(remove_names)) or "none")
          print("Still referenced legacy helpers:", ", ".join(sorted(retain_names)) or "none")
          
          # Final hard requirement for 0B: nothing may depend on external TV2 source.
          if re.search(r'\bTv2[A-Za-z0-9_]*\b', text):
              leftovers = sorted(set(re.findall(r'\bTv2[A-Za-z0-9_]*\b', text)))
              raise SystemExit("Tv2 symbols still remain: " + ", ".join(leftovers))
          if "app.nudroidlabs.nustrim.tv2." in text:
              raise SystemExit("TV2 import remains")
          
          APP.write_text(text, encoding="utf-8")
          
          print("PASS: all external Tv2 references removed before folder deletion")
          PY
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Prove TV2 has no references then delete package
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          if grep -R -n -E '\bTv2[A-Za-z0-9_]*\b|app\.nudroidlabs\.nustrim\.tv2\.' \
            app/src/main/java/app/nudroidlabs/nustrim \
            --exclude-dir=tv2 2>/dev/null | tee "$DIR/tv2-reference-blockers.txt"; then
            echo "::error::TV2 references remain outside tv2 package. Refusing deletion."
            exit 1
          fi

          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv2
          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv
          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv3

          echo "PASS: tv2 package deleted only after zero-reference proof" \
            | tee "$DIR/tv2-delete.txt"

      - name: Safe repo cleanup
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"
          echo "SAFE REPO CLEANUP" > "$DIR/repo-cleanup.log"

          while IFS= read -r file; do
            case "$file" in
              app/src/*|.github/workflows/*)
                ;;
              *.tmp|*.bak|*.orig|*.rej|*.patch|*.log|*-diagnose.zip)
                rm -f -- "$file"
                echo "REMOVED: $file" >> "$DIR/repo-cleanup.log"
                ;;
            esac
          done < <(git ls-files)

          echo "PRESERVED: updater/build workflow" >> "$DIR/repo-cleanup.log"
          cat "$DIR/repo-cleanup.log"

      - name: Advance Stage 0B metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0b/metadata.log"
          from pathlib import Path
          import os
          import re
          
          target = os.environ["RESET_VERSION"]
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          path.write_text(text, encoding="utf-8")
          Path(".nustrim-version").write_text(target + "\n", encoding="utf-8")
          
          Path(".nustrim-tv-reset").write_text(
              "generation=3\n"
              "stage=0B\n"
              "runtime=mobile-only\n"
              "tv2-package=removed\n"
              "external-tv2-references=removed\n"
              "dead-tv-helper-sweep=completed\n"
              "inline-isTv-cleanup=pending-0C\n"
              "mobile=protected\n"
              "updater=protected\n",
              encoding="utf-8",
          )
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          print("TV reset stage=0B")
          PY

      - name: Verify updater and build configuration protection
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 \
            | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          python3 - <<'PY' > "$DIR/build-gradle.normalized.after"
          from pathlib import Path
          import re
          text = Path("app/build.gradle.kts").read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = <VERSION_CODE>', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "<VERSION_NAME>"', text, count=1)
          print(text, end="")
          PY

          cmp "$DIR/build-gradle.normalized.before" "$DIR/build-gradle.normalized.after"
          echo "PASS: updater/signing/build configuration protected" \
            | tee "$DIR/updater-protection.txt"

      - name: Stage 0B architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          test ! -d app/src/main/java/app/nudroidlabs/nustrim/tv2
          test ! -d app/src/main/java/app/nudroidlabs/nustrim/tv3

          if grep -R -n -E '\bTv2[A-Za-z0-9_]*\b|app\.nudroidlabs\.nustrim\.tv2\.' \
            app/src/main/java/app/nudroidlabs/nustrim 2>/dev/null; then
            echo "::error::Tv2 symbol/import remains after Stage 0B."
            exit 1
          fi

          grep -q 'MobileNavItem(' "$APP"
          grep -q 'content(false, 0)' "$APP"
          grep -q 'AppUpdater(context)' "$APP"
          grep -q 'UpdateSettingsScreen' "$APP"

          grep -q '^stage=0B$' .nustrim-tv-reset
          grep -q '^tv2-package=removed$' .nustrim-tv-reset
          grep -q '^external-tv2-references=removed$' .nustrim-tv-reset

          if grep -R -n -E 'NuBrowse|NuBrowseApp|app\.nubrowse' app/src/main app/build.gradle.kts 2>/dev/null; then
            echo "::error::NuBrowse contamination detected."
            exit 1
          fi

          git diff --check

          {
            echo "PASS: entire tv2 package removed"
            echo "PASS: zero external Tv2 references"
            echo "PASS: dead TV helper sweep completed"
            echo "PASS: Mobile runtime retained"
            echo "PASS: updater retained and protected"
            echo
            echo "[remaining inline legacy TV semantics for Stage 0C]"
            grep -o -E '\b(Tv[A-Za-z0-9_]+|isTv|rememberIsTv)\b' "$APP" \
              | sort | uniq -c | sort -nr | head -n 160 || true
            echo
            git status --short
            git diff --stat
          } > "$DIR/audit.txt"

          cat "$DIR/audit.txt"
          git diff > "$DIR/stage0b.patch"

      - name: Compile after TV2 deletion
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0b/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Assemble mobile debug APK
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0b/assemble.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Commit and push Stage 0B
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-tv3-reset0b/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Stage 0B already applied."
          else
            git commit -m "refactor(tv): remove dead TV2 source and helper cluster"

            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi

            git push origin HEAD:main
          fi

      - name: Dispatch protected signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0b/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0b"

          echo "========== Nustrim TV3 Stage 0B Summary =========="
          echo "Result: FAILED"
          echo "SHA: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in \
            preflight.txt cleanup.log tv2-reference-blockers.txt tv2-delete.txt \
            repo-cleanup.log metadata.log updater-protection.txt audit.txt \
            push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 110 "$DIR/$file" || true
            fi
          done

          for file in compile.log assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file result]"
              grep -E 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)' \
                "$DIR/$file" | tail -n 130 || true
            fi
          done

          echo "==================================================="

      - name: Upload Stage 0B diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv3-stage0b-diagnose
          path: ${{ runner.temp }}/nustrim-tv3-reset0b
          if-no-files-found: ignore
          retention-days: 7
