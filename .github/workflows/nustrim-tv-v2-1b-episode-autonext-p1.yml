name: Nustrim TV V2.1B Episode AutoNext P1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-1b-episode-autonext-p1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.27.1-tv-v2.1b-autonext"
  LIVE_DETAILS_SHA: "9c59001e1cdc4bd105216d6d76099331dbe6fa48aaa3f6c6c46f79f14655057d"
  LIVE_PLAYER_SHA: "00e7d8286a83172e3e5f2d46e675b8004d7d7aa66e72ddec75d0bff29d6de00e"

jobs:
  v21b:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.1-A live preflight
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v21b"
          mkdir -p "$DIR"

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          test -f "$DETAILS"
          test -f "$PLAYER"
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          actual_details="$(sha256sum "$DETAILS" | awk '{print $1}')"
          actual_player="$(sha256sum "$PLAYER" | awk '{print $1}')"

          if [[ "$actual_details" != "$LIVE_DETAILS_SHA" ]]; then
            echo "::error::TvDetailsScreen drifted after V2.1-A."
            echo "expected=$LIVE_DETAILS_SHA"
            echo "actual=$actual_details"
            exit 1
          fi

          if [[ "$actual_player" != "$LIVE_PLAYER_SHA" ]]; then
            echo "::error::TvPlayerScreen drifted after V2.1-A."
            echo "expected=$LIVE_PLAYER_SHA"
            echo "actual=$actual_player"
            exit 1
          fi

          grep -q 'versionName = "0.27.0-tv-v2.1a-tracks"' app/build.gradle.kts
          grep -q 'val resolvedEpisodes = if (detailsResolved)' "$DETAILS"
          grep -q 'SubtitleSourceAggregator(context)' "$DETAILS"
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'TvPlayerTrackPanel.AUDIO' "$PLAYER"
          grep -q 'TvPlayerTrackPanel.SUBTITLES' "$PLAYER"
          grep -q 'setSubtitleConfigurations(subtitleConfigurations)' "$PLAYER"

          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$DIR/Home.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$DIR/Search.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$DIR/Library.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$DIR/Settings.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt "$DIR/StreamAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt "$DIR/SubtitleAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt "$DIR/InstalledSourceStore.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$DIR/NustrimApp.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.before"

          {
            echo "NUSTRIM TV V2.1-B EPISODE AUTONEXT P1"
            echo "====================================="
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts
            grep -m1 'versionName' app/build.gradle.kts
            echo "details_sha=$actual_details"
            echo "player_sha=$actual_player"
          } | tee "$DIR/preflight.txt"

      - name: Write V2.1-B Details and Player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          files = {
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"):
                  "",
          }
          
          for path, payload in files.items():
              path.write_bytes(base64.b64decode(payload))
              print("WRITE:", path)
          PY

      - name: Set V2.1-B version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Could not parse app version.")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: V2.1-B architecture audit
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v21b"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          echo "AUDIT VERSION: TV-V2.1B-EPISODE-AUTONEXT-P1"

          grep -q 'val activeEpisodeIndex = activeEpisode?.let' "$DETAILS"
          grep -q 'val previousEpisode = activeEpisodeIndex' "$DETAILS"
          grep -q 'val nextEpisode = activeEpisodeIndex' "$DETAILS"
          grep -q 'fun switchPlayerEpisode(episode: MediaEpisode)' "$DETAILS"
          grep -q 'autoPlay = true' "$DETAILS"
          grep -q 'preferredProviderId = currentStream?.providerId.orEmpty()' "$DETAILS"
          grep -q 'preferredProviderName = currentStream?.providerName.orEmpty()' "$DETAILS"

          grep -q 'var autoPlayConsumed' "$DETAILS"
          grep -q 'var subtitleScanComplete' "$DETAILS"
          grep -q 'request.autoPlay' "$DETAILS"
          grep -q 'preferred.subtitles + aggregatedSubtitles' "$DETAILS"

          grep -q 'previousEpisodeTitle = previousEpisode?.displayTitle' "$DETAILS"
          grep -q 'nextEpisodeTitle = nextEpisode?.displayTitle' "$DETAILS"
          grep -q 'onPreviousEpisode = previousEpisode?.let' "$DETAILS"
          grep -q 'onNextEpisode = nextEpisode?.let' "$DETAILS"

          grep -q 'var autoNextCountdown' "$PLAYER"
          grep -q 'fun triggerPreviousEpisode()' "$PLAYER"
          grep -q 'fun triggerNextEpisode()' "$PLAYER"
          grep -q 'state == Player.STATE_ENDED' "$PLAYER"
          grep -q 'autoNextCountdown = if (onNextEpisode != null)' "$PLAYER"
          grep -q 'Key.MediaPrevious' "$PLAYER"
          grep -q 'Key.MediaNext' "$PLAYER"
          grep -q 'positionMs <= 1_500L' "$PLAYER"
          grep -q 'durationMs - positionMs <= 12_000L' "$PLAYER"
          grep -q 'Next episode in ${autoNextCountdown}s' "$PLAYER"
          grep -q 'OK Play now  •  Back Cancel' "$PLAYER"

          # V2.1-A tracks must remain.
          grep -q 'TvPlayerTrackPanel.AUDIO' "$PLAYER"
          grep -q 'TvPlayerTrackPanel.SUBTITLES' "$PLAYER"
          grep -q 'setPreferredTextLanguages' "$PLAYER"
          grep -q 'setSubtitleConfigurations(subtitleConfigurations)' "$PLAYER"
          grep -q 'setDefaultRequestProperties(stream.headers)' "$PLAYER"

          # Stage 4 source/subtitle aggregation must remain.
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'SubtitleSourceAggregator(context)' "$DETAILS"
          grep -q 'aggregator.load(' "$DETAILS"

          # Protect unrelated stable code.
          cmp "$DIR/Home.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          cmp "$DIR/Search.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt
          cmp "$DIR/Library.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt
          cmp "$DIR/Settings.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          cmp "$DIR/StreamAggregator.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          cmp "$DIR/SubtitleAggregator.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt
          cmp "$DIR/InstalledSourceStore.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          cmp "$DIR/UiPreferences.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          cmp "$DIR/NustrimApp.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.27.1-tv-v2.1b-autonext"' app/build.gradle.kts
          grep -q 'minSdk = 23' app/build.gradle.kts

          git diff --check
          git diff --name-status | tee "$DIR/changed-files.txt"

          unexpected="$(
            git diff --name-only |
            grep -v -E               '^(app/build.gradle.kts|app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt)$'               || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git diff > "$DIR/v21b.patch"

          echo "PASS: previous/next calculated across complete episode order"
          echo "PASS: manual next/previous callbacks wired"
          echo "PASS: end-of-episode 5 second auto-next wired"
          echo "PASS: Back cancels countdown before leaving player"
          echo "PASS: same provider preferred for adjacent episode"
          echo "PASS: fallback to best ranked source if provider unavailable"
          echo "PASS: subtitle aggregation completes before auto-play"
          echo "PASS: last episode has no auto-next callback"
          echo "PASS: V2.1-A Audio/Subtitles retained"
          echo "PASS: Sources/Mobile/updater/signing protected"

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21b/compile.log"

      - name: Unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21b/tests.log"

      - name: Release lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21b/lint-release.log"

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21b/assemble.log"

      - name: Commit and push V2.1-B
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-v21b/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt             app/build.gradle.kts

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): add episode navigation and auto next"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-v21b/remote-main.txt"

          python3 - <<'PY'
          import subprocess
          
          target = "0.27.1-tv-v2.1b-autonext"
          
          details = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt",
              ],
              text=True,
          )
          player = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              ],
              text=True,
          )
          gradle = subprocess.check_output(
              ["git", "show", "origin/main:app/build.gradle.kts"],
              text=True,
          )
          
          checks = {
              "adjacent episode model":
                  "val previousEpisode = activeEpisodeIndex" in details and
                  "val nextEpisode = activeEpisodeIndex" in details,
              "provider-preserving autoplay request":
                  "preferredProviderId = currentStream?.providerId.orEmpty()" in details,
              "auto source selection":
                  "request.autoPlay" in details and
                  "autoPlayConsumed" in details,
              "subtitle completion gate":
                  "subtitleScanComplete" in details and
                  "preferred.subtitles + aggregatedSubtitles" in details,
              "stream aggregator retained":
                  "StreamSourceAggregator(context)" in details,
              "subtitle aggregator retained":
                  "SubtitleSourceAggregator(context)" in details,
              "player adjacent callbacks":
                  "onPreviousEpisode" in player and "onNextEpisode" in player,
              "auto-next countdown":
                  "autoNextCountdown" in player and
                  "Next episode in ${autoNextCountdown}s" in player,
              "ended trigger":
                  "state == Player.STATE_ENDED" in player and
                  "autoNextCountdown = if (onNextEpisode != null)" in player,
              "media next previous":
                  "Key.MediaPrevious" in player and "Key.MediaNext" in player,
              "dpad boundary navigation":
                  "positionMs <= 1_500L" in player and
                  "durationMs - positionMs <= 12_000L" in player,
              "back cancels countdown":
                  "autoNextCountdown >= 0" in player and
                  "cancelAutoNext()" in player,
              "audio subtitle foundation retained":
                  "TvPlayerTrackPanel.AUDIO" in player and
                  "TvPlayerTrackPanel.SUBTITLES" in player and
                  "setSubtitleConfigurations(subtitleConfigurations)" in player,
              "version":
                  f'versionName = "{target}"' in gradle,
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(
                  "REMOTE V2.1-B VERIFY FAILED: " + ", ".join(failed)
              )
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-v21b/signed-run.txt"

      - name: Wait signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-v21b/signed-build-watch.log"

      - name: Verify published V2.1-B
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/tv-v21b/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.27.1-tv-v2.1b-autonext' "$MANIFEST" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.27.1-tv-v2.1b-autonext' "$MANIFEST"
          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-v21b/published-update.json"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-v21b"

          echo "========== Nustrim TV V2.1-B P1 =========="
          echo "RESULT: FAILED"

          for f in             preflight.txt             changed-files.txt             remote-main.txt             signed-run.txt             published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              cat "$DIR/$f" || true
            fi
          done

          for f in             compile.log             tests.log             lint-release.log             assemble.log             push.log             signed-build-watch.log; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              tail -n 340 "$DIR/$f" || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2-1b-episode-autonext-p1-diagnose
          path: ${{ runner.temp }}/tv-v21b
          if-no-files-found: ignore
          retention-days: 7
