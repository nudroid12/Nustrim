name: Nustrim TV Cleanroom S12.16 Subtitle Panel Polish Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-16-subtitle-panel-polish
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.15-tv-cleanroom-s12.16-subtitle-panel-polish"
  TARGET_VERSION_CODE: "138"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.15 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.14-tv-cleanroom-s12.15-content-manager-nesting"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.16 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.16-subtitle-panel-polish' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-16-subtitle-panel.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              "scripts/verify_tv_settings_parity_s12_11.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.16 changed files outside subtitle panel boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "63d346391b12202d592bd712e866524cff07cea02808f1894690e9a2637664bd",
              ".nustrim-version": "7497d6db95aa4a43238a7e06b07ada8f58fb1aca36159fbe69af6d8cd44afb19",
              "app/build.gradle.kts": "cf22dd3064cf3b895030ce4a75e43629c6a0c78a602e4ef4b774d3bd7f18c571",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt": "432fb2d40a839106e98f1b627aa9cdb67befc912e0a5ecd4da2c6b5da9be217a",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt": "180fb6d447fa5d77dab61fce0323670062c34edfff2fed121740d3861f0c96ca",
              "scripts/verify_tv_settings_parity_s12_11.py": "4d3a655344f42553b6e613039c67e677aa735892d199df122b817752f370b820",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "fcfa857f5451ecb8302206f17b2123365628340e029454eb3e12fe0843188f54",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.16 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-16-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-16-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-16-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.16 improves TV subtitle panel readability, safe-area sizing, language labels, scrolling and style controls.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.16 Subtitle Panel Polish",
              "issue": "S12-PLAYER-SUBTITLE-02",
              "status": "build-verified",
              "changes": [
                  "reduce panel width to the TV safe area",
                  "show every language in a scrollable compact list",
                  "replace duplicated text-size rows with one minus and plus control",
                  "hide rendered subtitles while the subtitle panel is open"
              ],
              "preserved": ["S12.15 Content Manager", "S12.14 sidebar fix", "subtitle selection engine", "SmartSubs", "provider engine", "Mobile UI", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-subtitle-panel-s12-16-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.16 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt \
            scripts/verify_tv_settings_parity_s12_11.py \
            scripts/verify_tv_subtitle_panel_s12_16.py
          if git diff --cached --quiet; then
            echo "S12.16 source is already committed."
          else
            git commit -m "Polish TV subtitle panel S12.16 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-16-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.16 makes the TV subtitle panel smaller, darker and easier to scan." "" \
            "All languages can scroll, ISO labels are normalised, text size uses one minus and plus control, and rendered subtitles are hidden while the panel is open." "" \
            "S12.15 Content Manager, S12.14 sidebar animation, subtitle selection and all backend systems are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-subtitle-panel-s12-16-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-16-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-subtitle-panel-s12-16-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-16-subtitle-panel-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-subtitle-panel-s12-16-report.json
            ${{ runner.temp }}/nustrim-s12-16-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-16-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-16-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-16-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-subtitle-panel-s12-16-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-16-subtitle-panel-diagnose
          path: ${{ runner.temp }}/nustrim-s12-16-diagnose
          if-no-files-found: warn
          retention-days: 7
