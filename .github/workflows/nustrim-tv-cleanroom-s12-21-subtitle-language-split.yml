name: Nustrim TV Cleanroom S12.21 Subtitle Language Split Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-21-subtitle-language-split
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.20-tv-cleanroom-s12.21-subtitle-language-split"
  TARGET_VERSION_CODE: "143"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.20 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.19-tv-cleanroom-s12.20-cloudstream-tv"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.21 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.21-subtitle-language-split' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-21-subtitle-language-split.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleLanguage.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt",
              "scripts/verify_tv_subtitle_language_split_s12_21.py",
              "scripts/verify_tv_cloudstream_tv_s12_20.py",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.21 changed files outside subtitle language boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "d06e347a794f2359d306e8430148cefb5a3a40d1dc1216cf0f0767ae29d5b810",
              ".nustrim-version": "a626fc6af79630a6f44f3b9b1067f4c8defbdf2d21387d4ff4550798fb0234ac",
              "app/build.gradle.kts": "4290cbd72c1b40d41f758f609c9de16327eeb63fc5d64088ba995b45dc70af04",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleLanguage.kt": "5d7a9e50dcf7ff31fd67b9d11a432a6f41aec370bf7766eecab2e124f7127b07",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt": "8b2c7d8aa797d8656960b9fdcbfac6a8df4ce7f8d25de7fdc75e48c90ae18483",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt": "1dae1a02cf38d94be45966dc50a0989950512462b44a5d1ce43472511339bb2f",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt": "a8ce834ec2df0dac7ba24c2d0b5b17315b858da28fe67ecdbb30fdf1d0f8653c",
              "scripts/verify_tv_subtitle_language_split_s12_21.py": "3b240ff3b2b1cc40353933e41a0f631d106890f5a85a242a9abb01c6807c003c",
              "scripts/verify_tv_cloudstream_tv_s12_20.py": "b05d000c5ce321164b68640ee69a3aaf884726f118b6bbafa1b64085e6045198",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "b1a2d397b83a0064432c4b537629359ab59cac10e4e0dfce210f3ced9bca5b15",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "e7ff420772ff3107f25c005357f08be3a825dbdaf0e61caed4dac62da1ede44b",
              "scripts/verify_tv_episode_titles_s12_17.py": "40239a40f40e24d287edc46bd415e717355ef3ffad788b478177f9212e2327f6",
              "scripts/verify_tv_settings_parity_s12_11.py": "b5a6fb6b4266d4f69907fbbac89b57f2ecf354008967bd1c806a79b8c6a78bfc",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "0175b3d32458851367853b3851b5196ae07bc06530154792f0efcc34bd7f95c0",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.21 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_subtitle_language_split_s12_21.py
          python3 scripts/verify_tv_cloudstream_tv_s12_20.py
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-21-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-21-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-21-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.21 separates Malay and Indonesian subtitle classification throughout TV discovery, Media3 and the subtitle panel.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.21 Subtitle Language Split",
              "issue": "S12-SUBTITLE-LANGUAGE-01",
              "status": "build-verified",
              "changes": [
                  "keep Malay ms and Indonesian id as separate TV subtitle languages",
                  "correct a wrong provider language code when the track label is explicit",
                  "recognise ISO aliases, BCP 47 tags and Bahasa Melayu or Bahasa Indonesia labels",
                  "leave the ambiguous label Bahasa unclassified without an explicit code",
                  "apply one classifier across discovery, Media3 and the subtitle panel"
              ],
              "preserved": ["S12.20 full CloudStream TV flow", "S12.19 CloudStream caches", "S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "SmartSubs", "Mobile UI", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-subtitle-language-s12-21-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.21 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-tv \
            .nustrim-version \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleLanguage.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt \
            scripts/verify_tv_subtitle_language_split_s12_21.py \
            scripts/verify_tv_cloudstream_tv_s12_20.py \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_settings_parity_s12_11.py \
            scripts/verify_tv_subtitle_panel_s12_16.py
          if git diff --cached --quiet; then
            echo "S12.21 source is already committed."
          else
            git commit -m "Separate Malay and Indonesian subtitles S12.21 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-21-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.21 separates Malay and Indonesian subtitle tracks throughout TV discovery, Media3 and the player panel." "" \
            "Explicit labels such as Bahasa Indonesia correct a wrong provider code, while the ambiguous label Bahasa is not guessed." "" \
            "S12.20 CloudStream TV, subtitle panel polish, SmartSubs, source resolution and Mobile UI are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-subtitle-language-s12-21-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-21-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-subtitle-language-s12-21-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-21-subtitle-language-split-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-subtitle-language-s12-21-report.json
            ${{ runner.temp }}/nustrim-s12-21-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-21-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-21-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-21-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-subtitle-language-s12-21-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-21-subtitle-language-split-diagnose
          path: ${{ runner.temp }}/nustrim-s12-21-diagnose
          if-no-files-found: warn
          retention-days: 7
