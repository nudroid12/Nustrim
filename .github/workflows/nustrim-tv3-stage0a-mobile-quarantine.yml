name: Nustrim TV3 Stage 0A Mobile Quarantine

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv3-stage0a-mobile-quarantine
  cancel-in-progress: false

env:
  RESET_VERSION: "0.18.0-tv3-reset0a"

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Protect updater baseline
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0a"
          mkdir -p "$DIR"

          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 \
            | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          {
            echo "NUSTRIM TV3 STAGE 0A"
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionName' app/build.gradle.kts || true
            echo
            grep -n -E 'NustrimTv2Shell|InterfaceMode\.TV|TvReferenceCanvas|InterfaceModePicker|Tv2FocusedBackdrop' \
              app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt | head -n 100 || true
          } > "$DIR/preflight.txt"

      - name: Make runtime mobile only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0a/patch.log"
          from pathlib import Path
          import re
          
          app_path = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          text = app_path.read_text(encoding="utf-8")
          
          def match_pair(source: str, start: int, opener="{", closer="}"):
              depth = 0
              in_string = False
              triple = False
              escape = False
              i = start
              while i < len(source):
                  if source.startswith('"""', i):
                      triple = not triple
                      i += 3
                      continue
                  ch = source[i]
                  if triple:
                      i += 1
                      continue
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if ch == '"':
                      in_string = True
                      i += 1
                      continue
                  if ch == opener:
                      depth += 1
                  elif ch == closer:
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise SystemExit("Unbalanced block")
          
          def function_bounds(source: str, name: str):
              m = re.search(rf'(?m)^\s*(?:private\s+)?fun\s+{re.escape(name)}\s*\(', source)
              if not m:
                  raise SystemExit(f"Function {name} not found")
              brace = source.find("{", m.end())
              if brace < 0:
                  raise SystemExit(f"Function {name} body missing")
              return m.start(), match_pair(source, brace)
          
          # Remove direct TV2 imports. Folder is removed later by shell step.
          text = re.sub(
              r'(?m)^import\s+app\.nudroidlabs\.nustrim\.tv2\.[^\n]+\n',
              '',
              text,
          )
          
          # Replace MainShell with its existing MOBILE branch only.
          start, end = function_bounds(text, "MainShell")
          main = text[start:end]
          
          scaffold_pos = main.find("Scaffold(")
          if scaffold_pos < 0:
              raise SystemExit("Mobile Scaffold not found in MainShell")
          paren = main.find("(", scaffold_pos)
          scaffold_end = match_pair(main, paren, "(", ")")
          i = scaffold_end
          while i < len(main) and main[i].isspace():
              i += 1
          if i < len(main) and main[i] == "{":
              scaffold_end = match_pair(main, i)
          
          scaffold = main[scaffold_pos:scaffold_end]
          replacement = (
              "@Composable\n"
              "private fun MainShell(\n"
              "    selected: MainSection,\n"
              "    remoteTestActive: Boolean,\n"
              "    onRemoteTestClose: () -> Unit,\n"
              "    onSection: (MainSection) -> Unit,\n"
              "    content: @Composable (Boolean, Int) -> Unit\n"
              ") {\n"
              + "\n".join("    " + line if line else line for line in scaffold.splitlines())
              + "\n}\n"
          )
          text = text[:start] + replacement + text[end:]
          
          # Force every runtime screen onto the existing mobile branch.
          text = text.replace("isTv = rememberIsTv()", "isTv = false")
          text = text.replace("isTv = isTv,", "isTv = false,")
          text = text.replace(
              "interfaceMode = interfaceMode ?: if (isTv) InterfaceMode.TV else InterfaceMode.MOBILE,",
              "interfaceMode = InterfaceMode.MOBILE,",
          )
          
          # Main shell lambda must no longer expose a TV=true state.
          text = text.replace(
              ") { isTv, contentFocusRequestToken ->",
              ") { _, _ ->",
              1,
          )
          # Calls inside Main section are now hard-mobile with no focus token.
          text = text.replace("focusRequestToken = contentFocusRequestToken,", "focusRequestToken = 0,")
          
          # Force stored interface mode to MOBILE while TV3 is absent.
          text = re.sub(
              r'var\s+interfaceMode\s+by\s+remember\s*\{\s*mutableStateOf\(preferences\.interfaceMode\)\s*\}',
              'val interfaceMode = InterfaceMode.MOBILE',
              text,
              count=1,
          )
          
          # switchInterfaceMode becomes a no-op-to-mobile compatibility function.
          switch = re.search(
              r'fun\s+switchInterfaceMode\s*\(\s*selected:\s*InterfaceMode\s*\)\s*\{',
              text
          )
          if switch:
              brace = text.find("{", switch.start())
              switch_end = match_pair(text, brace)
              new_switch = (
                  "fun switchInterfaceMode(selected: InterfaceMode) {\n"
                  "        preferences.interfaceMode = InterfaceMode.MOBILE\n"
                  "        screen = Screen.Main(MainSection.HOME)\n"
                  "    }"
              )
              text = text[:switch.start()] + new_switch + text[switch_end:]
          
          # Orientation must no longer depend on TV mode. Player landscape remains.
          text = text.replace(
              "interfaceMode == InterfaceMode.TV || screen is Screen.Player ->",
              "screen is Screen.Player ->",
          )
          
          # Remove TV reference canvas and first-run interface picker from runtime wrapper.
          text = re.sub(
              r'(?ms)\s*val\s+physicalTvDevice\s*=\s*rememberIsPhysicalTv\(\)\s*'
              r'Surface\(modifier\s*=\s*Modifier\.fillMaxSize\(\),\s*color\s*=\s*AppBackground\)\s*\{\s*'
              r'if\s*\(\s*interfaceMode\s*==\s*InterfaceMode\.TV\s*&&\s*!physicalTvDevice\s*\)\s*\{\s*'
              r'TvReferenceCanvas\s*\{\s*screenContent\(\)\s*\}\s*'
              r'\}\s*else\s*\{\s*screenContent\(\)\s*\}\s*'
              r'\}\s*'
              r'if\s*\(\s*interfaceMode\s*==\s*null\s*\)\s*\{\s*'
              r'InterfaceModePicker\(onSelect\s*=\s*\{\s*switchInterfaceMode\(it\)\s*\}\)\s*'
              r'\}',
              '\n            Surface(modifier = Modifier.fillMaxSize(), color = AppBackground) {\n'
              '                screenContent()\n'
              '            }',
              text,
              count=1,
          )
          
          # Prevent any remaining old runtime route from selecting TV.
          text = text.replace("InterfaceMode.TV", "InterfaceMode.MOBILE")
          
          checks = {
              "no tv2 imports": "app.nudroidlabs.nustrim.tv2." not in text,
              "no old tv2 shell runtime": "NustrimTv2Shell(" not in text,
              "mobile scaffold runtime": "MobileNavItem(" in text and "content(false, 0)" in text,
              "runtime screens hard mobile": "isTv = rememberIsTv()" not in text,
              "no TV enum runtime route": "InterfaceMode.TV" not in text,
              "no TV canvas runtime call": "TvReferenceCanvas { screenContent()" not in text,
              "no picker runtime call": "InterfaceModePicker(onSelect" not in text,
              "updater retained": "AppUpdater(context)" in text and "UpdateSettingsScreen" in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Stage 0A contract failed: " + ", ".join(failed))
          
          app_path.write_text(text, encoding="utf-8")
          for name in checks:
              print("PASS:", name)
          PY
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv
          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv2
          rm -rf app/src/main/java/app/nudroidlabs/nustrim/tv3

      - name: Advance reset metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0a/metadata.log"
          from pathlib import Path
          import re, os
          
          target = os.environ["RESET_VERSION"]
          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          p.write_text(text, encoding="utf-8")
          Path(".nustrim-version").write_text(target + "\n", encoding="utf-8")
          
          Path(".nustrim-tv-reset").write_text(
              "generation=3\n"
              "stage=0A\n"
              "runtime=mobile-only\n"
              "tv2-package=removed\n"
              "legacy-inline-tv=quarantined-dead\n"
              "mobile=protected\n"
              "updater=protected\n",
              encoding="utf-8",
          )
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          print("TV reset stage=0A")
          PY

      - name: Verify protected updater unchanged
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0a"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 \
            | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"
          echo "PASS: updater protected" | tee "$DIR/updater-protection.txt"

      - name: Mobile-only runtime audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0a"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          test ! -d app/src/main/java/app/nudroidlabs/nustrim/tv2
          test ! -d app/src/main/java/app/nudroidlabs/nustrim/tv3
          ! grep -q 'app\.nudroidlabs\.nustrim\.tv2\.' "$APP"
          ! grep -q 'NustrimTv2Shell(' "$APP"
          ! grep -q 'InterfaceMode\.TV' "$APP"
          ! grep -q 'TvReferenceCanvas { screenContent()' "$APP"
          ! grep -q 'InterfaceModePicker(onSelect' "$APP"

          grep -q 'MobileNavItem(' "$APP"
          grep -q 'content(false, 0)' "$APP"
          grep -q 'AppUpdater(context)' "$APP"
          grep -q 'UpdateSettingsScreen' "$APP"
          grep -q '^runtime=mobile-only$' .nustrim-tv-reset

          # Inline legacy TV helpers may still exist after 0A, but they must be
          # unreachable. Stage 0B will remove them after a successful compile.
          {
            echo "PASS: runtime is mobile-only"
            echo "PASS: external tv2 package removed"
            echo "PASS: mobile shell retained"
            echo "PASS: updater retained"
            echo
            echo "[remaining legacy TV symbols for Stage 0B]"
            grep -o -E '\b(Tv2[A-Za-z0-9_]*|Tv[A-Za-z0-9_]+|isTv|rememberIsTv)\b' "$APP" \
              | sort | uniq -c | sort -nr | head -n 120 || true
            echo
            git status --short
            git diff --stat
          } > "$DIR/audit.txt"

          cat "$DIR/audit.txt"
          git diff --check
          git diff > "$DIR/stage0a.patch"

      - name: Compile mobile-only runtime
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0a/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Assemble mobile-only debug APK
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:assembleDebug --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0a/assemble.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-tv3-reset0a/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Stage 0A already applied."
          else
            git commit -m "refactor(tv): quarantine legacy TV and keep mobile runtime only"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: Dispatch protected updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true \
            2>&1 | tee "$RUNNER_TEMP/nustrim-tv3-reset0a/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-tv3-reset0a"
          echo "========== Nustrim TV3 Stage 0A Summary =========="
          echo "Result: FAILED"
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in preflight.txt patch.log metadata.log updater-protection.txt audit.txt push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 90 "$DIR/$file" || true
            fi
          done

          for file in compile.log assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file result]"
              grep -E 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)' \
                "$DIR/$file" | tail -n 100 || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv3-stage0a-diagnose
          path: ${{ runner.temp }}/nustrim-tv3-reset0a
          if-no-files-found: ignore
          retention-days: 7
