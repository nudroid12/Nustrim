name: Nustrim TV2 Sidebar Fix 1 R3

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv2-sidebar-fix-1-r3
  cancel-in-progress: false

env:
  TV2_VERSION: "0.17.0-tv2-rc8"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare diagnose and structural baseline
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-sidebar-r3"
          mkdir -p "$DIR"

          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          {
            echo "NUSTRIM TV2 SIDEBAR FIX 1 R3"
            echo "sha=$(git rev-parse HEAD)"
            cat .nustrim-tv2 2>/dev/null || true
            grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true
            echo
            echo "[shell symbols]"
            grep -n -E 'fun NustrimTv2Shell|fun .*RailItem|text *= *"N"|Nustrim|val fill|onPreviewKeyEvent' "$SHELL" | head -n 80 || true
          } > "$DIR/preflight.txt"

          test -f "$SHELL"
          test -f "$APP"
          grep -q 'fun NustrimTv2Shell(' "$SHELL"
          grep -q 'fun Tv2RailItem(' "$SHELL"
          grep -q 'fun MainShell(' "$APP"

      - name: Patch sidebar by function structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r3/patch.log"
          from pathlib import Path
          import re
          
          shell_path = Path("app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt")
          app_path = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          shell = shell_path.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")
          
          def find_function_bounds(text: str, name: str):
              match = re.search(rf'\bfun\s+{re.escape(name)}\s*\(', text)
              if not match:
                  return None
              brace = text.find("{", match.end())
              if brace < 0:
                  return None
              depth = 0
              in_string = False
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return match.start(), i + 1
              return None
          
          def replace_function(text: str, name: str, transform):
              bounds = find_function_bounds(text, name)
              if not bounds:
                  raise SystemExit(f"Function {name} not found")
              start, end = bounds
              segment = text[start:end]
              updated = transform(segment)
              if updated == segment:
                  print(f"INFO: {name} required no textual change or already patched")
              return text[:start] + updated + text[end:]
          
          # 1. Hide brand/logo N when collapsed.
          # Prefer a named brand function if available. Otherwise find the composable
          # function containing text = "N" and an expanded Boolean parameter.
          brand_name = None
          for candidate in ("Tv2BrandMark", "TvBrandMark", "SidebarBrand", "Tv2SidebarBrand"):
              if find_function_bounds(shell, candidate):
                  brand_name = candidate
                  break
          
          if brand_name:
              def patch_brand(segment: str):
                  if "if (!expanded) return" in segment:
                      return segment
                  if "expanded: Boolean" not in segment:
                      return segment
                  body = segment.find("{")
                  return segment[:body+1] + "\n    if (!expanded) return\n" + segment[body+1:]
              shell = replace_function(shell, brand_name, patch_brand)
          else:
              # Generic fallback: locate function that owns the "N" brand text.
              function_matches = list(re.finditer(r'\bfun\s+([A-Za-z0-9_]+)\s*\(', shell))
              patched = False
              for match in function_matches:
                  name = match.group(1)
                  bounds = find_function_bounds(shell, name)
                  if not bounds:
                      continue
                  start, end = bounds
                  segment = shell[start:end]
                  if ('text = "N"' in segment or 'text="N"' in segment) and "expanded: Boolean" in segment:
                      body = segment.find("{")
                      if "if (!expanded) return" not in segment:
                          segment = segment[:body+1] + "\n    if (!expanded) return\n" + segment[body+1:]
                          shell = shell[:start] + segment + shell[end:]
                      brand_name = name
                      patched = True
                      break
              if not patched and brand_name is None:
                  # If brand is inline inside shell, wrap the nearest Surface/Row block
                  # is too risky. Fail with context instead of guessing.
                  lines = [ln for ln in shell.splitlines() if '"N"' in ln or "Nustrim" in ln][:20]
                  raise SystemExit("Brand component could not be identified. Context: " + " | ".join(lines))
          
          # 2. Patch rail item by function boundary, independent of formatting.
          def patch_rail(segment: str):
              # Add onMoveRight parameter if absent.
              if "onMoveRight:" not in segment:
                  segment, count = re.subn(
                      r'(expanded\s*:\s*Boolean\s*,)',
                      r'\1\n    onMoveRight: () -> Unit,',
                      segment,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit("Unable to add onMoveRight to Tv2RailItem")
          
              # Remove scale animation declaration and scale modifier.
              segment = re.sub(
                  r'(?ms)^\s*val\s+scale\s+by\s+animateFloatAsState\(.*?\)\s*\n',
                  '',
                  segment,
                  count=1
              )
              segment = re.sub(r'(?m)^\s*\.scale\(scale\)\s*\n', '', segment, count=1)
          
              # Remove focused border wrapper regardless of whitespace.
              segment = re.sub(
                  r'(?ms)\s*\.then\(\s*if\s*\(focused\)\s*Modifier\.border\(.*?\)\s*else\s*Modifier\s*\)',
                  '',
                  segment,
                  count=1
              )
          
              # Replace fill semantics by locating val fill = when {...}.
              fill_match = re.search(r'(?ms)val\s+fill\s*=\s*when\s*\{.*?\n\s*\}', segment)
              if fill_match:
                  replacement = (
                      "val fill = when {\n"
                      "        selected -> Color.White\n"
                      "        focused -> Color.White.copy(alpha = 0.10f)\n"
                      "        else -> Color.Transparent\n"
                      "    }"
                  )
                  segment = segment[:fill_match.start()] + replacement + segment[fill_match.end():]
              elif "selected -> Color.White" not in segment:
                  raise SystemExit("Tv2RailItem fill block not found")
          
              # Icon/text colors: selected current item has white marker with dark content.
              segment = re.sub(
                  r'tint\s*=\s*if\s*\(selected\s*\|\|\s*focused\)\s*Tv2Colors\.ContentPrimary\s*else\s*Tv2Colors\.ContentSecondary\s*,',
                  'tint = when {\n'
                  '                selected -> Tv2Colors.Background\n'
                  '                focused -> Tv2Colors.ContentPrimary\n'
                  '                else -> Tv2Colors.ContentSecondary\n'
                  '            },',
                  segment,
                  count=1
              )
              segment = re.sub(
                  r'color\s*=\s*if\s*\(selected\s*\|\|\s*focused\)\s*Tv2Colors\.ContentPrimary\s*else\s*Tv2Colors\.ContentSecondary\s*,',
                  'color = when {\n'
                  '                    selected -> Tv2Colors.Background\n'
                  '                    focused -> Tv2Colors.ContentPrimary\n'
                  '                    else -> Tv2Colors.ContentSecondary\n'
                  '                },',
                  segment,
                  count=1
              )
              segment = re.sub(
                  r'fontWeight\s*=\s*if\s*\(selected\)\s*FontWeight\.SemiBold\s*else\s*FontWeight\.Medium\s*,',
                  'fontWeight = if (selected || focused) FontWeight.SemiBold else FontWeight.Medium,',
                  segment,
                  count=1
              )
          
              # D-pad Right returns to content.
              key_block = re.search(r'(?ms)\.onPreviewKeyEvent\s*\{\s*event\s*->.*?\n\s*\}', segment)
              if key_block and "Key.DirectionRight" not in key_block.group(0):
                  old = key_block.group(0)
                  replacement = (
                      ".onPreviewKeyEvent { event ->\n"
                      "                when {\n"
                      "                    event.type == KeyEventType.KeyDown && event.key == Key.DirectionRight -> {\n"
                      "                        onMoveRight()\n"
                      "                        true\n"
                      "                    }\n"
                      "                    (event.key == Key.DirectionCenter || event.key == Key.Enter) &&\n"
                      "                        event.type == KeyEventType.KeyDown -> {\n"
                      "                        onClick()\n"
                      "                        true\n"
                      "                    }\n"
                      "                    else -> false\n"
                      "                }\n"
                      "            }"
                  )
                  segment = segment.replace(old, replacement, 1)
              elif "Key.DirectionRight" not in segment:
                  raise SystemExit("Tv2RailItem key handler not found")
          
              return segment
          
          shell = replace_function(shell, "Tv2RailItem", patch_rail)
          
          # 3. Patch shell function signature and rail item call.
          def patch_shell(segment: str):
              if "onMoveRight:" not in segment.split("{", 1)[0]:
                  segment, count = re.subn(
                      r'(onDestinationSelected\s*:\s*\(String\)\s*->\s*Unit\s*,)',
                      r'\1\n    onMoveRight: () -> Unit,',
                      segment,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit("Unable to add onMoveRight to NustrimTv2Shell")
          
              # Add callback to every Tv2RailItem call lacking it.
              if "onMoveRight = onMoveRight" not in segment:
                  segment, count = re.subn(
                      r'(Tv2RailItem\(\s*.*?expanded\s*=\s*railExpanded\s*,)',
                      r'\1\n                            onMoveRight = onMoveRight,',
                      segment,
                      count=1,
                      flags=re.S
                  )
                  if count != 1:
                      raise SystemExit("Unable to wire onMoveRight into Tv2RailItem")
          
              # Use a stable solid rail surface/body. Remove the transparent gradient if present.
              segment = re.sub(
                  r'(?ms)\.background\(\s*Brush\.horizontalGradient\(.*?Color\.Transparent.*?\)\s*\)',
                  '.background(Tv2Colors.Rail)',
                  segment,
                  count=1
              )
              return segment
          
          shell = replace_function(shell, "NustrimTv2Shell", patch_shell)
          
          # 4. MainShell handoff. It already uses a (Boolean, Int) content contract in
          # current TV2 architecture. Create/reuse a focus token.
          def patch_main(segment: str):
              if "tvContentFocusToken" not in segment:
                  # Add state near existing tv2RailExpanded state.
                  state_match = re.search(r'(?m)^(\s*var\s+tv2RailExpanded\s+by\s+remember.*)$', segment)
                  if state_match:
                      insert = state_match.group(1) + "\n    var tvContentFocusToken by remember { mutableIntStateOf(0) }"
                      segment = segment[:state_match.start()] + insert + segment[state_match.end():]
                  else:
                      # Fallback after isTv state.
                      body = segment.find("{")
                      segment = segment[:body+1] + "\n    var tvContentFocusToken by remember { mutableIntStateOf(0) }\n" + segment[body+1:]
          
              # Add shell callback in NustrimTv2Shell call.
              call = re.search(r'(?ms)NustrimTv2Shell\(.*?\)\s*\{', segment)
              if not call:
                  raise SystemExit("NustrimTv2Shell call not found inside MainShell")
              call_text = call.group(0)
              if "onMoveRight =" not in call_text:
                  destination = re.search(
                      r'(?ms)onDestinationSelected\s*=\s*\{\s*key\s*->.*?\n\s*\}',
                      call_text
                  )
                  if not destination:
                      raise SystemExit("onDestinationSelected callback not found")
                  replacement = destination.group(0) + (
                      ",\n        onMoveRight = {\n"
                      "            tv2RailExpanded = false\n"
                      "            tvContentFocusToken += 1\n"
                      "        }"
                  )
                  call_text = call_text[:destination.start()] + replacement + call_text[destination.end():]
                  segment = segment[:call.start()] + call_text + segment[call.end():]
          
              # Pass content focus token. Handle one-arg or any prior token name.
              segment = re.sub(
                  r'content\(\s*true\s*(?:,\s*[A-Za-z0-9_]+)?\s*\)',
                  'content(true, tvContentFocusToken)',
                  segment,
                  count=1
              )
              if "content(true, tvContentFocusToken)" not in segment:
                  raise SystemExit("MainShell content focus token not wired")
              return segment
          
          app = replace_function(app, "MainShell", patch_main)
          
          # Cleanup imports only when symbols no longer exist in shell.
          for symbol, import_line in (
              ("animateFloatAsState", "import androidx.compose.animation.core.animateFloatAsState\n"),
              (".border(", "import androidx.compose.foundation.border\n"),
              (".scale(", "import androidx.compose.ui.draw.scale\n"),
              ("Brush.", "import androidx.compose.ui.graphics.Brush\n"),
          ):
              if symbol not in shell.replace(import_line, ""):
                  shell = shell.replace(import_line, "")
          
          # Validate.
          checks = {
              "brand hidden": "if (!expanded) return" in shell,
              "selected white marker": "selected -> Color.White" in shell,
              "soft focus": "focused -> Color.White.copy(alpha = 0.10f)" in shell,
              "right key": "Key.DirectionRight" in shell,
              "shell handoff": "onMoveRight = onMoveRight" in shell,
              "main focus token": "tvContentFocusToken += 1" in app,
              "content token": "content(true, tvContentFocusToken)" in app,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Patch contract failed: " + ", ".join(failed))
          
          if ".scale(scale)" in shell:
              raise SystemExit("Rail scale effect remains")
          if "FocusStroke" in find_function_bounds(shell, "Tv2RailItem") and False:
              pass
          
          shell_path.write_text(shell, encoding="utf-8")
          app_path.write_text(app, encoding="utf-8")
          
          for name in checks:
              print("PASS:", name)
          print("Brand function:", brand_name)
          PY
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Safe repo cleanup
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-sidebar-r3"
          {
            echo "SAFE REPO CLEANUP"
            echo "================="
          } > "$DIR/cleanup.log"

          # Only generated/temporary artifacts. Never delete app/src or workflow YAML.
          find . -maxdepth 2 -type f \
            \( -name '*.tmp' -o -name '*.bak' -o -name '*.orig' -o -name '*.rej' -o -name '*.patch' \) \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file; do
              if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                rm -f "$file"
                echo "REMOVED tracked temp: $file" >> "$DIR/cleanup.log"
              fi
            done

          # Remove empty generated directories outside runtime source.
          find . -maxdepth 2 -type d -empty \
            -not -path './.git*' \
            -not -path './app*' \
            -print >> "$DIR/cleanup.log" || true

          echo "GUARD: app/src untouched by cleanup step" >> "$DIR/cleanup.log"
          echo "GUARD: .github/workflows untouched by cleanup step" >> "$DIR/cleanup.log"
          cat "$DIR/cleanup.log"

      - name: Advance RC8 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r3/metadata.log"
          from pathlib import Path
          import os, re
          
          target = os.environ["TV2_VERSION"]
          gradle_path = Path("app/build.gradle.kts")
          gradle = gradle_path.read_text(encoding="utf-8")
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          if not cm or not nm:
              raise SystemExit("Version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          gradle = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', gradle, count=1)
          gradle = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', gradle, count=1)
          gradle_path.write_text(gradle, encoding="utf-8")
          Path(".nustrim-version").write_text(target + "\n", encoding="utf-8")
          
          marker = Path(".nustrim-tv2")
          lines = marker.read_text(encoding="utf-8").splitlines()
          out = []
          seen = False
          for line in lines:
              if line.startswith("stage="):
                  out.append("stage=8")
                  seen = True
              else:
                  out.append(line)
          if not seen:
              out.append("stage=8")
          marker.write_text("\n".join(out) + "\n", encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          print("stage=8")
          PY

      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-sidebar-r3"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          grep -q 'selected -> Color.White' "$SHELL"
          grep -q 'focused -> Color.White.copy(alpha = 0.10f)' "$SHELL"
          grep -q 'Key.DirectionRight' "$SHELL"
          grep -q 'onMoveRight = onMoveRight' "$SHELL"
          grep -q 'tvContentFocusToken += 1' "$APP"
          grep -q 'content(true, tvContentFocusToken)' "$APP"
          grep -q 'if (!expanded) return' "$SHELL"
          ! grep -q '\.scale(scale)' "$SHELL"

          if grep -R -n -E 'NuBrowse|NuBrowseApp|app\.nubrowse' app/src/main app/build.gradle.kts 2>/dev/null; then
            echo "::error::NuBrowse runtime contamination detected."
            exit 1
          fi

          git diff --check

          {
            echo "PASS: sidebar R3 audit"
            git status --short
            git diff --stat
          } > "$DIR/audit.txt"
          cat "$DIR/audit.txt"
          git diff > "$DIR/sidebar-r3.patch"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r3/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-sidebar-r3/push.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix(tv2): correct sidebar behavior and clean temp artifacts"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true \
            2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r3/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-sidebar-r3"
          echo "========== Nustrim TV2 Sidebar Fix 1 R3 Summary =========="
          echo "Result: FAILED"
          cat .nustrim-tv2 2>/dev/null || true
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in preflight.txt patch.log cleanup.log metadata.log audit.txt push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 55 "$DIR/$file"
            fi
          done

          if [[ -f "$DIR/compile.log" ]]; then
            echo
            echo "[compile result]"
            grep -E 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)' \
              "$DIR/compile.log" | tail -n 70 || true
          fi

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv2-sidebar-fix-1-r3-diagnose
          path: ${{ runner.temp }}/nustrim-sidebar-r3
          if-no-files-found: ignore
          retention-days: 7
