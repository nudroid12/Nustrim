name: Nustrim TV Sources Aggregator A1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-sources-aggregator-a1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.24.0-tv-sources-aggregator"

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Live contract preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-source-agg"
          mkdir -p "$DIR"

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt"
          SESSION="app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt"
          CLOUD="app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositorySession.kt"

          test -f "$DETAILS"
          test -f "$STORE"
          test -f "$SESSION"
          test -f "$CLOUD"
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'fun sources(): List<InstalledSource>' "$STORE"
          grep -q 'val capabilities: SourceCapabilities' "$SESSION"
          grep -q 'resources = setOf("providers")' "$CLOUD"
          grep -q 'private fun TvSourcesStage4Modal(' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          cp "$STORE" "$DIR/InstalledSourceStore.before.kt"
          cp "$SESSION" "$DIR/SourceSession.before.kt"
          cp "$CLOUD" "$DIR/CloudStreamRepositorySession.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$DIR/TvHomeScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt "$DIR/TvShell.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$DIR/TvPlayerScreen.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          echo "TV SOURCES AGGREGATOR A1 | sha=$(git rev-parse HEAD)" | tee "$DIR/preflight.txt"
          grep -m1 'versionName' app/build.gradle.kts | tee -a "$DIR/preflight.txt"

      - name: Write aggregator and TV wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          agg = Path("app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt")
          details = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          
          agg.parent.mkdir(parents=True, exist_ok=True)
          details.parent.mkdir(parents=True, exist_ok=True)
          
          agg.write_bytes(base64.b64decode(""))
          details.write_bytes(base64.b64decode(""))
          
          print("WRITE:", agg)
          print("WRITE:", details)
          PY

      - name: Set aggregator version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          path.write_text(text, encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-source-agg"
          AGG="app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          echo "AUDIT VERSION: TV-SOURCES-AGGREGATOR-A1"

          grep -q 'class StreamSourceAggregator(' "$AGG"
          grep -q 'store.sources()' "$AGG"
          grep -q 'filter { it.enabled }' "$AGG"
          grep -q 'resource.equals("stream", ignoreCase = true)' "$AGG"
          grep -q 'session.kind == SourceKind.NUSTRIM_JSON' "$AGG"

          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'aggregator.load(' "$DETAILS"
          grep -q 'preferredSession = request.session' "$DETAILS"
          grep -q 'No stream addons are installed or enabled.' "$DETAILS"
          grep -q 'Scanning installed stream addons...' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          if grep -q 'text = "DIAG • $sourceDiag"' "$DETAILS"; then
            echo "::error::Temporary source diagnose UI remains."
            exit 1
          fi

          cmp "$DIR/InstalledSourceStore.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          cmp "$DIR/SourceSession.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt
          cmp "$DIR/CloudStreamRepositorySession.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositorySession.kt
          cmp "$DIR/NustrimApp.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          cmp "$DIR/UiPreferences.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          cmp "$DIR/TvHomeScreen.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          cmp "$DIR/TvShell.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt
          cmp "$DIR/TvPlayerScreen.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.24.0-tv-sources-aggregator"' app/build.gradle.kts
          git diff --check
          git diff > "$DIR/aggregator.patch"

      - name: Compile aggregator
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-source-agg/compile.log"

      - name: Assemble aggregator
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-source-agg/assemble.log"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-source-agg/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt                   app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt                   app/build.gradle.kts

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): aggregate installed stream addons"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess
          
          agg = subprocess.check_output(
              ["git", "show", "origin/main:app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt"],
              text=True,
          )
          details = subprocess.check_output(
              ["git", "show", "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"],
              text=True,
          )
          gradle = subprocess.check_output(
              ["git", "show", "origin/main:app/build.gradle.kts"],
              text=True,
          )
          
          checks = {
              "aggregator": "class StreamSourceAggregator(" in agg,
              "installed scan": "store.sources()" in agg,
              "stream capability": 'resource.equals("stream", ignoreCase = true)' in agg,
              "TV wiring": "aggregator.load(" in details,
              "zero addon state": "No stream addons are installed or enabled." in details,
              "player retained": "TvPlayerScreen(" in details,
              "version": 'versionName = "0.24.0-tv-sources-aggregator"' in gradle,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("REMOTE VERIFY FAILED: " + ", ".join(failed))
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true
          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Wait signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status 2>&1 | tee "$RUNNER_TEMP/tv-source-agg/signed-build-watch.log"

      - name: Verify published aggregator
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/tv-source-agg/update.json"

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true
            if grep -q '0.24.0-tv-sources-aggregator' "$MANIFEST" 2>/dev/null; then break; fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.24.0-tv-sources-aggregator' "$MANIFEST"
          cat "$MANIFEST" | tee "$RUNNER_TEMP/tv-source-agg/published-update.json"

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-source-agg"
          echo "========== TV Sources Aggregator A1 =========="
          for f in preflight.txt compile.log assemble.log push.log signed-build-watch.log published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo "===== $f ====="
              tail -n 220 "$DIR/$f"
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-sources-aggregator-a1-diagnose
          path: ${{ runner.temp }}/tv-source-agg
          if-no-files-found: ignore
          retention-days: 7
