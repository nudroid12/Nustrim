name: Nustrim TV Sources Runtime Diagnose D2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-sources-runtime-diagnose-d2
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-source-diag"
          mkdir -p "$DIR"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          test -f "$DETAILS"
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'private fun TvSourcesStage4Modal(' "$DETAILS"
          grep -q 'session.loadStreams(' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$DIR/TvHomeScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt "$DIR/TvShell.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$DIR/TvPlayerScreen.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          echo "SOURCE DIAG D1 | sha=$(git rev-parse HEAD)" | tee "$DIR/preflight.txt"
          grep -m1 'versionName' app/build.gradle.kts | tee -a "$DIR/preflight.txt"

      - name: Patch visible runtime diagnose
        shell: bash
        run: |
          set -euo pipefail
          {
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          text = p.read_text(encoding="utf-8")
          
          pairs = [
              ('    var selectedStreamUrl by remember(requestKey) { mutableStateOf<String?>(null) }\n', '    var selectedStreamUrl by remember(requestKey) { mutableStateOf<String?>(null) }\n    var sourceDiag by remember(requestKey) { mutableStateOf("WAITING") }\n', "diag state"),
              ('    fun acceptStreams(loaded: List<StreamSource>) {\n        val ranked = rankTvStreams(loaded)\n        streams = ranked\n        loading = false\n        errorMessage = if (ranked.isEmpty()) {\n            "No playable streams were returned by this source."\n        } else {\n            null\n        }\n', '    fun acceptStreams(loaded: List<StreamSource>) {\n        val ranked = rankTvStreams(loaded)\n        val playableCount = loaded.count { stream ->\n            stream.playable && stream.url.isNotBlank()\n        }\n        val sample = loaded\n            .take(3)\n            .joinToString(" | ") { stream ->\n                "${stream.name.take(18)}:${stream.type}:play=${stream.playable}:url=${stream.url.isNotBlank()}"\n            }\n        sourceDiag = "SUCCESS raw=${loaded.size} playable=$playableCount ranked=${ranked.size}" +\n            if (sample.isBlank()) "" else " • $sample"\n        streams = ranked\n        loading = false\n        errorMessage = if (ranked.isEmpty()) {\n            "No playable streams were returned by this source."\n        } else {\n            null\n        }\n', "success counts"),
              ('    LaunchedEffect(requestKey, reloadToken) {\n        loading = true\n        errorMessage = null\n        streams = emptyList()\n        selectedStreamUrl = null\n', '    LaunchedEffect(requestKey, reloadToken) {\n        loading = true\n        errorMessage = null\n        streams = emptyList()\n        selectedStreamUrl = null\n        sourceDiag = "START session=${request.session?.id ?: "none"} source=${request.sourceUrl.take(48)} item=${request.item.id.take(40)} ep=${request.episode?.id?.take(30) ?: "none"}"\n', "start trace"),
              ('        fun loadFrom(session: SourceSession) {\n            session.loadStreams(\n', '        fun loadFrom(session: SourceSession) {\n            sourceDiag = "LOAD session=${session.id} name=${session.displayName.take(28)} kind=${session.kind} item=${request.item.id.take(32)} ep=${request.episode?.id?.take(24) ?: "none"}"\n            session.loadStreams(\n', "session trace"),
              ('                onError = { error ->\n                    loading = false\n                    streams = emptyList()\n                    errorMessage = error.message\n                        ?.takeIf { it.isNotBlank() }\n                        ?: "Could not load streams."\n                }\n', '                onError = { error ->\n                    loading = false\n                    streams = emptyList()\n                    val message = error.message\n                        ?.takeIf { it.isNotBlank() }\n                        ?: "Could not load streams."\n                    errorMessage = message\n                    sourceDiag = "LOAD_ERROR ${error::class.java.simpleName}: ${message.take(120)}"\n                }\n', "load error"),
              ('                onSuccess = { session ->\n                    loadFrom(session)\n                },\n', '                onSuccess = { session ->\n                    sourceDiag = "OPEN_OK session=${session.id} name=${session.displayName.take(28)} kind=${session.kind}"\n                    loadFrom(session)\n                },\n', "open success"),
              ('                onError = { error ->\n                    loading = false\n                    streams = emptyList()\n                    errorMessage = error.message\n                        ?.takeIf { it.isNotBlank() }\n                        ?: "Could not open source."\n                }\n', '                onError = { error ->\n                    loading = false\n                    streams = emptyList()\n                    val message = error.message\n                        ?.takeIf { it.isNotBlank() }\n                        ?: "Could not open source."\n                    errorMessage = message\n                    sourceDiag = "OPEN_ERROR ${error::class.java.simpleName}: ${message.take(120)}"\n                }\n', "open error"),
              ('        } else {\n            loading = false\n            streams = emptyList()\n            errorMessage = "Source information is unavailable."\n        }\n', '        } else {\n            loading = false\n            streams = emptyList()\n            errorMessage = "Source information is unavailable."\n            sourceDiag = "NO_SOURCE session=null sourceUrl=blank"\n        }\n', "no source"),
              ('                when {\n                    loading -> {\n', '                Text(\n                    text = "DIAG • $sourceDiag",\n                    modifier = Modifier.fillMaxWidth(),\n                    color = TvColors.TextSecondary,\n                    fontSize = 10.sp,\n                    lineHeight = 13.sp,\n                    maxLines = 3,\n                    overflow = TextOverflow.Ellipsis\n                )\n\n                when {\n                    loading -> {\n', "visible diag"),
          ]
          
          for old, new, label in pairs:
              if new in text:
                  print("PRESERVE:", label)
                  continue
              if old not in text:
                  raise SystemExit("Missing anchor: " + label)
              text = text.replace(old, new, 1)
              print("PATCH:", label)
          
          checks = [
              'var sourceDiag by remember',
              'SUCCESS raw=${loaded.size} playable=$playableCount ranked=${ranked.size}',
              'LOAD_ERROR ${error::class.java.simpleName}',
              'OPEN_ERROR ${error::class.java.simpleName}',
              'NO_SOURCE session=null sourceUrl=blank',
              'text = "DIAG • $sourceDiag"',
          ]
          missing = [x for x in checks if x not in text]
          if missing:
              raise SystemExit("Diagnose post-check missing: " + ", ".join(missing))
          
          p.write_text(text, encoding="utf-8")
          print("PASS: visible Sources runtime diagnose installed")
          PY
          } 2>&1 | tee "$RUNNER_TEMP/tv-source-diag/patch.log"

      - name: Bump diagnose version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")
          target = "0.23.2-tv-sources-diag-d2"
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          p.write_text(text, encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-source-diag"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          grep -q 'var sourceDiag by remember' "$DETAILS"
          grep -q 'SUCCESS raw=' "$DETAILS"
          grep -q 'LOAD_ERROR' "$DETAILS"
          grep -q 'OPEN_ERROR' "$DETAILS"
          grep -q 'DIAG •' "$DETAILS"

          cmp "$DIR/NustrimApp.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          cmp "$DIR/UiPreferences.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          cmp "$DIR/TvHomeScreen.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          cmp "$DIR/TvShell.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt
          cmp "$DIR/TvPlayerScreen.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0 | sort -z | xargs -0 sha256sum > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.23.2-tv-sources-diag-d2"' app/build.gradle.kts
          git diff --check
          git diff > "$DIR/diag.patch"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-source-diag/compile.log"

      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/tv-source-diag/assemble.log"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-source-diag/push.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt app/build.gradle.kts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "debug(tv): expose source runtime state"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-sources-runtime-diagnose-d2
          path: ${{ runner.temp }}/tv-source-diag
          if-no-files-found: ignore
          retention-days: 7
