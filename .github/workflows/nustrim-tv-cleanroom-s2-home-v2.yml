name: Nustrim TV Cleanroom S2 Home

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanroom-s2-home:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Guard known baseline
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          echo "Current version: $current"
          case "$current" in
            0.45.0-tv-v3.5-library-core|0.46.0-tv-cleanroom-s1)
              ;;
            *)
              echo "Unexpected baseline. Re-audit before applying S2."
              exit 20
              ;;
          esac

      - name: Replace TV tree with clean-room S1 plus S2 Home
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil

          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeHero.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvBackPolicy.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvNavigator.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvRoute.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '',
          }

          tv_root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          if tv_root.exists():
              shutil.rmtree(tv_root)

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          build_file = Path("app/build.gradle.kts")
          build = build_file.read_text()
          build = re.sub(
              r"versionCode = (\d+)",
              lambda m: f"versionCode = {int(m.group(1)) + 1}",
              build,
              count=1,
          )
          build = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "0.47.0-tv-cleanroom-s2-home"',
              build,
              count=1,
          )
          build_file.write_text(build)

          Path(".nustrim-tv").write_text(
              "generation=cleanroom-v1\n"
              "reference=nuvio-tv-0.8.6-beta\n"
              "subsystem=2-home-modern\n"
              "status=build-candidate\n"
              "preserve=source-provider-engine,stream-resolver,playback-engine,mobile-ui\n"
              "home=cleanroom-modern-catalogues\n"
              "continue-watching=deferred-untrusted-progress-rebuild\n"
              "legacy-tv-source=replaced\n"
          )
          PY

      - name: Verify patch boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf "%s\n" "$changed"
          forbidden="$(printf "%s\n" "$changed" | grep -E '^app/src/main/java/app/nudroidlabs/nustrim/(core|features|ui)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Protected source changed unexpectedly:"
            printf "%s\n" "$forbidden"
            exit 21
          fi
          if grep -R -n "detailsStack" app/src/main/java/app/nudroidlabs/nustrim/tv; then
            echo "Legacy TV implementation leaked into clean-room tree."
            exit 22
          fi

      - name: Compile and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee tv-s2-home-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s2-home-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s2-home-build-log
          path: tv-s2-home-build.log
          if-no-files-found: ignore

      - name: Commit only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nustrim-tv app/build.gradle.kts app/src/main/java/app/nudroidlabs/nustrim/tv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "TV cleanroom S2 modern home [skip ci]"
          git push origin HEAD:main
