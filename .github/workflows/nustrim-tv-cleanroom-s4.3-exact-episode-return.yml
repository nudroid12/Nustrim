name: Nustrim TV Cleanroom S4.3 Exact Episode Return

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanroom-s4-3-exact-episode-return:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Guard known clean-room baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          echo "Build version: $current_build"
          echo "Marker version: $current_marker"

          case "$current_build" in
            0.45.0-tv-v3.5-library-core|0.46.0-tv-cleanroom-s1|0.47.0-tv-cleanroom-s2-home|0.48.0-tv-cleanroom-s3-episodes|0.48.1-tv-cleanroom-s3.1-media-handoff|0.49.0-tv-cleanroom-s4-details|0.49.1-tv-cleanroom-s4.1-episode-title-fix|0.49.2-tv-cleanroom-s4.2-season-focus|0.49.3-tv-cleanroom-s4.3-exact-episode-return)
              ;;
            *)
              echo "Unexpected app baseline. Re-audit before applying S4.3."
              exit 20
              ;;
          esac

      - name: Replace TV tree with accepted clean-room S1 through S4.3
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil

          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsSessionStore.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeCatalogueBuilder.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeHero.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvBackPolicy.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvNavigator.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvRoute.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '',
          }

          tv_root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          if tv_root.exists():
              shutil.rmtree(tv_root)

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          build_file = Path("app/build.gradle.kts")
          build = build_file.read_text()
          build = re.sub(
              r"versionCode = (\d+)",
              lambda m: f"versionCode = {max(int(m.group(1)) + 1, 106)}",
              build,
              count=1,
          )
          build = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "0.49.3-tv-cleanroom-s4.3-exact-episode-return"',
              build,
              count=1,
          )
          build_file.write_text(build)

          Path(".nustrim-version").write_text(
              "0.49.3-tv-cleanroom-s4.3-exact-episode-return\n"
          )
          Path(".nustrim-tv").write_text(
              "generation=cleanroom-v1\n"
              "reference=nuvio-tv-0.8.6-beta\n"
              "subsystem=4.3-details-exact-episode-return\n"
              "status=build-candidate\n"
              "preserve=source-provider-engine,stream-resolver,playback-engine,mobile-ui\n"
              "home=cleanroom-s2-accepted\n"
              "episode-domain=cleanroom-s3-accepted\n"
              "details=cleanroom-s4\n"
              "episode-title-normalization=coordinate-safe\n"
              "details-episode-up-target=active-season-tab\n"
              "details-season-down-target=live-last-focused-episode\n"
              "details-up-commits-current-episode=true\n"
              "details-episode-identity=provider-id-primary\n"
              "sources=foundation-next\n"
              "legacy-details=removed\n"
              "legacy-episode-engine=unused-by-cleanroom-tv\n"
          )
          PY

      - name: Verify S4.3 boundaries and exact return invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          changed="$(git diff --name-only)"
          printf "%s\n" "$changed"

          forbidden="$(printf "%s\n" "$changed" | grep -E '^app/src/main/java/app/nudroidlabs/nustrim/(core|features|ui)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Protected source changed unexpectedly:"
            printf "%s\n" "$forbidden"
            exit 21
          fi

          python3 <<'PY'
          from pathlib import Path

          details = Path(
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          ).read_text()

          tv_text = "\n".join(
              p.read_text(errors="ignore")
              for p in Path(
                  "app/src/main/java/app/nudroidlabs/nustrim/tv"
              ).rglob("*.kt")
          )

          checks = {
              "Up explicitly targets active season":
                  "Key.DirectionUp -> {" in details
                  and "focusRegistry.requestAnchor(scopeKey, upAnchorKey)" in details,
              "Up commits exact episode before leaving row":
                  "onFocused()\n                        focusRegistry.requestAnchor(scopeKey, upAnchorKey)" in details,
              "season Down target is resolved live":
                  "downAnchorResolver?.invoke()" in details,
              "season resolver reads latest per-season memory":
                  "rememberedEpisodeKeyForSeason(season.stableKey)" in details,
              "provider ID remains episode identity":
                  "episode.identity.stableKey" in details,
              "legacy EpisodeEngine absent":
                  "EpisodeEngine" not in tv_text,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit(
                  "S4.3 invariant failure: " + ", ".join(failed)
              )
          PY

      - name: Compile and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee tv-s4.3-exact-episode-return-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s4.3-exact-episode-return-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s4.3-exact-episode-return-build-log
          path: tv-s4.3-exact-episode-return-build.log
          if-no-files-found: ignore

      - name: Commit only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nustrim-version .nustrim-tv app/build.gradle.kts app/src/main/java/app/nudroidlabs/nustrim/tv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "TV cleanroom S4.3 exact episode return [skip ci]"
          git push origin HEAD:main
