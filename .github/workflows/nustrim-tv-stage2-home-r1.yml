      - name: Stage 2 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv-stage2"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"

          echo "AUDIT VERSION: TV-STAGE2-HOME-R1"
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt

          grep -q 'fun TvHomeScreen(' app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          grep -q 'LocalMediaStore' app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          grep -q 'CatalogSectionSourceSession' app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          grep -q 'delay(2400)' app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          grep -q 'if (loading)' app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          grep -q 'TvDestination.HOME -> TvHomeScreen' app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt

          if grep -R -n -E 'import[[:space:]]+app\.nudroidlabs\.nustrim\.ui\.|NustrimApp|MobileNavItem' app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::TV presentation imported or reused Mobile UI."
            exit 1
          fi

          if grep -R -n -E             'tv2|tv3|NustrimTv2|NustrimTv3|Tv2[A-Za-z0-9_]*|Tv3[A-Za-z0-9_]*'             app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::Old TV generation naming detected."
            exit 1
          fi

          cmp "$DIR/NustrimApp.before.kt" "$APP"
          cmp "$DIR/UiPreferences.before.kt" "$PREFS"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          git diff --check

          {
            echo "PASS: TV Home uses core data only"
            echo "PASS: Mobile NustrimApp byte-identical"
            echo "PASS: UiPreferences byte-identical"
            echo "PASS: updater/build workflow byte-identical"
            echo "PASS: Continue Watching hidden during initial catalog loading"
            echo "PASS: focused poster delayed landscape expansion present"
            echo
            git status --short
            git diff --stat
          } > "$DIR/audit.txt"

          cat "$DIR/audit.txt"
          git diff > "$DIR/stage2.patch"

