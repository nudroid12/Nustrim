      - name: Advance Stage 2 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          target = os.environ["STAGE_VERSION"]
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1
          )
          path.write_text(text, encoding="utf-8")
          
          Path(".nustrim-tv").write_text(
              "generation=fresh\n"
              "stage=2\n"
              "namespace=tv\n"
              "reference=NuvioTV\n"
              "home=modern-hero-catalogs-continue-watching\n"
              "focused-poster=delayed-landscape-expansion\n"
              "mobile=protected\n"
              "updater=protected\n",
              encoding="utf-8"
          )
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Final assemble after version update
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage2/final-assemble.log"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-tv-stage2/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "TV Stage 2 already applied."
          else
            git commit -m "feat(tv): build modern TV Home experience"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage2/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-tv-stage2"

          echo "========== Nustrim TV Stage 2 Home =========="
          echo "Result: FAILED"
          echo "SHA: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in preflight.txt audit.txt push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 140 "$DIR/$file" || true
            fi
          done

          for file in compile.log assemble.log final-assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file result]"
              grep -E                 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)'                 "$DIR/$file" | tail -n 170 || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage2-home-diagnose
          path: ${{ runner.temp }}/nustrim-tv-stage2
          if-no-files-found: ignore
          retention-days: 7
