          actual="$(sha256sum "$DETAILS" | awk '{print $1}')"
          if [ "$actual" != "$TARGET_DETAILS_SHA256" ]; then
            echo "::error::Decoded Details Final source SHA mismatch."
            echo "expected=$TARGET_DETAILS_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump final Details version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "85" or name.group(1) != "0.30.2-tv-v2.4-details-episodes-p2":
              raise SystemExit(
                  f"Unexpected baseline: {name.group(1)} ({code.group(1)})"
              )

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 86',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.31.0-tv-v2.4-details-final"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify final Details contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          grep -Fq 'versionCode = 86' app/build.gradle.kts
          grep -Fq 'versionName = "0.31.0-tv-v2.4-details-final"' app/build.gradle.kts

          # Season and episode navigation.
          grep -Fq 'private const val EPISODE_SCROLL_REPEAT_THROTTLE_MS = 80L' "$DETAILS"
          grep -Fq 'val seasonListState = rememberLazyListState()' "$DETAILS"
          grep -Fq 'state = seasonListState' "$DETAILS"
          grep -Fq '.distinctBy(::episodeFocusKey)' "$DETAILS"
          grep -Fq 'now - lastEpisodeRepeatAt <' "$DETAILS"
          grep -Fq 'EPISODE_SCROLL_REPEAT_THROTTLE_MS' "$DETAILS"
          grep -Fq 'delay(150)' "$DETAILS"

          # Specials and watched summaries.
          grep -Fq 'val specialSeasons = rawSeasons.filter { it == 0 }' "$DETAILS"
          grep -Fq 'text = if (season == 0) "Specials" else "Season $season"' "$DETAILS"
          grep -Fq '"$selectedSeasonWatchedCount/${selectedSeasonEpisodes.size} watched"' "$DETAILS"
          grep -Fq 'fullyWatched = seasonFullyWatched' "$DETAILS"

          # Episode and season options.
          grep -Fq 'var seasonOptions by remember(entry.stableKey)' "$DETAILS"
          grep -Fq 'private fun TvSeasonOptionsOverlay(' "$DETAILS"
          grep -Fq 'label = "Mark previous episodes watched"' "$DETAILS"
          grep -Fq 'label = "Mark previous seasons watched"' "$DETAILS"
          grep -Fq '"Mark season as unwatched"' "$DETAILS"
          grep -Fq '"Mark season as watched"' "$DETAILS"

          # Watched-state consistency.
          grep -Fq 'fun markEpisodeWatched(' "$DETAILS"
          grep -Fq 'fun markSeasonWatched(' "$DETAILS"
          grep -Fq 'fun markPreviousEpisodesWatched(' "$DETAILS"
          grep -Fq 'fun markPreviousSeasonsWatched(' "$DETAILS"
          grep -Fq 'episodeWatchedRevision' "$DETAILS"
          grep -Fq 'completed = true' "$DETAILS"

          # P1/P2 player-return behaviour remains.
          grep -Fq 'pendingEpisodeFocusRestoreKey' "$DETAILS"
          grep -Fq 'episodeListState.scrollToItem(restoreIndex)' "$DETAILS"
          grep -Fq 'TvPlayerScreen(' "$DETAILS"
          grep -Fq 'startPositionMs = if (sourcePreview?.startFromBeginning == true)' "$DETAILS"
          grep -Fq 'mediaStore.resumePosition(' "$DETAILS"
          grep -Fq 'mediaStore.recordProgress(' "$DETAILS"
          grep -Fq 'switchPlayerEpisode(episode)' "$DETAILS"

          changed="$(git diff --name-only | sort)"
          expected="$(
            printf '%s\n'               app/build.gradle.kts               app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt |
            sort
          )"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected changed-file set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile and release lint gates
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail

          D="$RUNNER_TEMP/nustrim-v24-details-final"

          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/verify.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/nustrim-v24-details-final"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/details-final.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt > "$D/details-sha256.txt"

          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.4 Details Final
          ==============================
          Baseline: 0.30.2-tv-v2.4-details-episodes-p2 (85)
          Target:   0.31.0-tv-v2.4-details-final (86)

          Final Details milestone:
          - season 0 is retained as Specials at the end of the season row
          - duplicate episode identities are removed before rendering
          - repeated Left/Right input on long episode rows is throttled
          - selected season is kept scrolled into view
          - season chips show watched completion
          - episode header shows watched count for the selected season
          - long press on a season opens season actions
          - season actions can mark the season watched/unwatched
          - season actions can mark previous regular seasons watched
          - episode options can mark the current season watched/unwatched
          - episode options can mark previous episodes watched
          - manual watched actions refresh Continue Watching immediately
          - marking the active Continue Watching episode watched advances Next Up
          - marking the active Continue Watching season watched advances beyond that season
          - P1/P2 focus restoration, resume, Sources and player wiring are preserved

          Scope:
          - player source is untouched
          - LocalMediaStore implementation is untouched
          - no second workflow is dispatched
          - release is published directly by this workflow
          EOF

      - name: Commit only after compile and lint pass
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt

          git diff --cached --check
          git commit -m 'tv: complete v2.4 Details and Episodes milestone'
          git push origin HEAD:main

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 50
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          if [ "$CERT" != "$LOCKED_CERT" ]; then
            echo "::error::Permanent signing certificate mismatch."
            echo "Expected: $LOCKED_CERT"
            echo "Current : $CERT"
            exit 51
          fi

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail

          D="$RUNNER_TEMP/nustrim-v24-details-final"

          gradle --no-daemon --build-cache             :app:testDebugUnitTest             :app:assembleRelease             --stacktrace             --console=plain             2>&1 | tee "$D/release-build.log"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/nustrim-v24-details-final"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" |
            tee "$D/signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$D/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "86"
          test "$NAME" = "0.31.0-tv-v2.4-details-final"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA

          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "Details Final: season and episode watched actions, focus polish, Specials handling, stable episode rows, and Continue Watching consistency.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY_ASSETS

      - name: Publish Nustrim release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail

          test -s "$APK"
          test -s update.json

          TARGET_SHA="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.4 Details and Episodes final milestone."               --latest

            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG"               "$APK"               update.json               --target "$TARGET_SHA"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.4 Details and Episodes final milestone."               --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_CERT: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v24-details-final/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG"             --pattern update.json             --pattern "$APK"             --dir "$LIVE"             --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"

          export LIVE APK EXPECTED_SHA EXPECTED_CERT

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))

          assert int(manifest["versionCode"]) == 86
          assert manifest["versionName"] == "0.31.0-tv-v2.4-details-final"
          assert manifest["signingMode"] == "permanent"
          assert manifest["signingCertSha256"].upper() == os.environ["EXPECTED_CERT"].upper()

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          assert manifest["sha256"] == sha

          print(
              "Updater verified:",
              manifest["versionName"],
              manifest["versionCode"],
          )
          PY_VERIFY

      - name: Collect failure context
        if: failure()
        shell: bash
        run: |
          set +e

          D="$RUNNER_TEMP/nustrim-v24-details-final"
          mkdir -p "$D"

          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt "$D/LocalMediaStore.current.kt" 2>/dev/null || true
          cp update.json "$D/update.current.json" 2>/dev/null || true

          git status --short > "$D/git-status.txt" 2>&1 || true
          git diff > "$D/git-diff.txt" 2>&1 || true
          git log -8 --oneline > "$D/recent-commits.txt" 2>&1 || true

          {
            echo "Failure bundle collected."
            echo "Inspect verify.log first if compile/lint failed."
            echo "Inspect release-build.log if signing/build failed."
            echo "Inspect git-diff.txt if a contract or baseline check failed."
          } > "$D/README.txt"

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.4-details-final-diagnose
          path: ${{ runner.temp }}/nustrim-v24-details-final
          if-no-files-found: error
          retention-days: 14
