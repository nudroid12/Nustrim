name: Nustrim TV V2.4 Details Final Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-4-details-final
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.30.2-tv-v2.4-details-episodes-p2"
  BASE_VERSION_CODE: "85"
  TARGET_VERSION_NAME: "0.31.0-tv-v2.4-details-final"
  TARGET_VERSION_CODE: "86"
  BASE_DETAILS_SHA256: "3a6fc28dd00bf63d7ae7a5d58e09cc3d4cf967c34304b72d4a92fa8fd4d3da20"
  TARGET_DETAILS_SHA256: "4e34f71afd8cd07d937e4137d803cfa786632e3662021f4be5054d854f2488e2"
  BASE_STORE_SHA256: "24f0a09d70fdba00d7738e32aea279e33a36a9cdc22bfa2c1bc2b093c39f84a3"

jobs:
  details_final:
    name: Build and publish Details Final
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-final"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.4 Details Final"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v24-details-final/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact P2 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          test -f "$DETAILS"
          test -f "$STORE"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          details_sha="$(sha256sum "$DETAILS" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Details SHA: $details_sha"
          echo "Store SHA:   $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$details_sha" = "$TARGET_DETAILS_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Details Final is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$details_sha" != "$BASE_DETAILS_SHA256" ]; then
            echo "::error::TvDetailsScreen.kt baseline mismatch."
            echo "expected=$BASE_DETAILS_SHA256"
            echo "actual=$details_sha"
            exit 21
          fi

          if [ "$store_sha" != "$BASE_STORE_SHA256" ]; then
            echo "::error::LocalMediaStore.kt changed unexpectedly."
            echo "expected=$BASE_STORE_SHA256"
            echo "actual=$store_sha"
            exit 22
          fi

          grep -Fq 'fun setSeasonWatched(' "$STORE"
          grep -Fq 'fun watchedEpisodeKeys(' "$STORE"
          grep -Fq 'fun recordProgress(' "$STORE"

      - name: Save before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-final"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"

      - name: Apply Details Final source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

