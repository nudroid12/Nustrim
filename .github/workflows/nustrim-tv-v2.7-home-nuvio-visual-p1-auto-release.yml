          if [ "$actual" != "$TARGET_HOME_SHA256" ]; then
            echo "::error::Decoded Home visual source SHA mismatch."
            echo "expected=$TARGET_HOME_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump V2.7 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "88" or name.group(1) != "0.33.0-tv-v2.6-search-library-settings-final":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 89', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.34.0-tv-v2.7-home-nuvio-visual-p1"',
              text,
              count=1,
          )
          p.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify visual parity contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"

          grep -Fq 'versionCode = 89' app/build.gradle.kts
          grep -Fq 'versionName = "0.34.0-tv-v2.7-home-nuvio-visual-p1"' app/build.gradle.kts

          # Nuvio-style screen geometry.
          grep -Fq 'HOME_ROWS_VIEWPORT_FRACTION = 0.52f' "$HOME"
          grep -Fq 'HOME_HERO_MEDIA_WIDTH_FRACTION = 0.74f' "$HOME"
          grep -Fq 'val rowsViewportHeight = screenHeight * HOME_ROWS_VIEWPORT_FRACTION' "$HOME"
          grep -Fq 'val heroBackdropHeight = (' "$HOME"
          grep -Fq 'top = rowsTopPadding' "$HOME"
          grep -Fq 'verticalArrangement = Arrangement.spacedBy(28.dp)' "$HOME"

          # Hero treatment.
          grep -Fq 'Crossfade(' "$HOME"
          grep -Fq 'durationMillis = 320' "$HOME"
          grep -Fq '.align(Alignment.BottomStart)' "$HOME"
          grep -Fq '.fillMaxWidth(0.48f)' "$HOME"
          grep -Fq '0.22f to TvColors.Background.copy(alpha = 0.86f)' "$HOME"
          grep -Fq '0.75f to TvColors.Background.copy(alpha = 0.65f)' "$HOME"

          # Nuvio row geometry.
          grep -Fq 'modifier = Modifier.padding(horizontal = 52.dp)' "$HOME"
          grep -Fq 'contentPadding = PaddingValues(horizontal = 52.dp)' "$HOME"
          grep -Fq 'horizontalArrangement = Arrangement.spacedBy(16.dp)' "$HOME"

          # Focused poster behaviour.
          grep -Fq 'HOME_POSTER_EXPAND_DELAY_MS = 3000L' "$HOME"
          grep -Fq 'delay(HOME_POSTER_EXPAND_DELAY_MS)' "$HOME"
          grep -Fq 'targetValue = if (expanded) 352.dp else 132.dp' "$HOME"
          grep -Fq 'val height = 198.dp' "$HOME"
          grep -Fq 'targetValue = if (focused) 1.03f else 1f' "$HOME"

          # Wide Continue Watching shape, close to 2.5:1.
          grep -Fq '.width(286.dp)' "$HOME"
          grep -Fq '.height(114.dp)' "$HOME"
          grep -Fq '.height(3.dp)' "$HOME"

          # Existing functional behaviour stays present.
          grep -Fq 'BackHandler(enabled = optionsEntry != null)' "$HOME"
          grep -Fq 'mediaStore.clearContinueWatching(' "$HOME"
          grep -Fq 'HOME_LONG_PRESS_MS = 650L' "$HOME"
          grep -Fq 'pendingRestoreKey' "$HOME"
          grep -Fq 'rememberLazyListState(' "$HOME"

          changed="$(git diff --name-only | sort)"
          expected="$(
            printf '%s\n'               app/build.gradle.kts               app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt |
            sort
          )"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected changed-file set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile and release lint gates
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v27-home-visual"

          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/verify.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-home-visual"

          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$D/TvHomeScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/home-visual-p1.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt > "$D/home-sha256.txt"

          cat > "$D/summary.txt" <<'EOF_SUMMARY'
          Nustrim TV V2.7 Home Nuvio Visual P1
          ======================================
          Baseline: 0.33.0-tv-v2.6-search-library-settings-final (88)
          Target:   0.34.0-tv-v2.7-home-nuvio-visual-p1 (89)

          Visual changes:
          - Nuvio-style 52% row viewport geometry
          - partial-width hero media aligned to the right
          - Nuvio-like horizontal and bottom hero gradients
          - hero metadata moved low-left above the rows
          - 52dp row gutters and wider 16dp card spacing
          - quieter 18sp row titles
          - hero backdrop 320ms crossfade
          - focused poster waits 3 seconds before expanding
          - expanded poster keeps 198dp height and becomes true 16:9 landscape
          - subtler 1.03 focus scale
          - Continue Watching becomes a wide ~2.5:1 card
          - thinner 3dp Continue Watching progress track

          Preserved:
          - Home focus restoration
          - row position memory
          - long press actions
          - Continue Watching removal
          - Library toggle
          - watched / Next Up state
          - Player, Details, Search, Library and Settings untouched
          EOF_SUMMARY

      - name: Commit only after compile and lint pass
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt

          git diff --cached --check
          git commit -m 'tv: v2.7 Home Nuvio visual parity pass 1'
          git push origin HEAD:main

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 50
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list             -keystore "$KS"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          test "$CERT" = "$LOCKED_CERT"

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v27-home-visual"

          gradle --no-daemon --build-cache             :app:testDebugUnitTest             :app:assembleRelease             --stacktrace             --console=plain             2>&1 | tee "$D/release-build.log"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/nustrim-v27-home-visual"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$D/signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$D/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "89"
          test "$NAME" = "0.34.0-tv-v2.7-home-nuvio-visual-p1"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA

          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "V2.7 Home Nuvio visual parity P1: dynamic hero/row geometry, 52dp gutters, wide Continue Watching cards, true landscape poster expansion and hero crossfade.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }

          Path("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY_ASSETS

      - name: Publish Nustrim release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.7 Home Nuvio visual parity P1."               --latest
            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG"               "$APK" update.json               --target "$TARGET_SHA"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. V2.7 Home Nuvio visual parity P1."               --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_CERT: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v27-home-visual/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG"             --pattern update.json             --pattern "$APK"             --dir "$LIVE"             --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"

          export LIVE APK EXPECTED_SHA EXPECTED_CERT

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))

          assert int(manifest["versionCode"]) == 89
          assert manifest["versionName"] == "0.34.0-tv-v2.7-home-nuvio-visual-p1"
          assert manifest["signingMode"] == "permanent"
          assert manifest["signingCertSha256"].upper() == os.environ["EXPECTED_CERT"].upper()

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          assert manifest["sha256"] == sha

          print("Updater verified:", manifest["versionName"], manifest["versionCode"])
          PY_VERIFY

      - name: Collect failure context
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v27-home-visual"
          mkdir -p "$D"

          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$D/TvHomeScreen.current.kt" 2>/dev/null || true
          cp update.json "$D/update.current.json" 2>/dev/null || true

          git status --short > "$D/git-status.txt" 2>&1 || true
          git diff > "$D/git-diff.txt" 2>&1 || true
          git log -8 --oneline > "$D/recent-commits.txt" 2>&1 || true

          {
            echo "Failure bundle collected."
            echo "Inspect verify.log for compile or lint failures."
            echo "Inspect release-build.log for signed build failures."
            echo "Inspect git-diff.txt for preflight or contract failures."
          } > "$D/README.txt"

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.7-home-nuvio-visual-p1-diagnose
          path: ${{ runner.temp }}/nustrim-v27-home-visual
          if-no-files-found: error
          retention-days: 14
