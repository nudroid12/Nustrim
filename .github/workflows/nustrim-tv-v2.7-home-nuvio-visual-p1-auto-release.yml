name: Nustrim TV V2.7 Home Nuvio Visual P1 Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-7-home-nuvio-visual-p1
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.33.0-tv-v2.6-search-library-settings-final"
  BASE_VERSION_CODE: "88"
  TARGET_VERSION_NAME: "0.34.0-tv-v2.7-home-nuvio-visual-p1"
  TARGET_VERSION_CODE: "89"
  BASE_HOME_SHA256: "f41c3009d7f0b3e7a718e3f62a90fe056e940abe92e8a74c83e93274f9eeebaf"
  TARGET_HOME_SHA256: "98bf971d3ab9847b133dee7dfc4e6e15dca1a3bf2be901ec894a72a16324eb29"
  BASE_STORE_SHA256: "2b3c005a8dbbd661114cc23f3473e3cd649b8113a29f09bddd64b2af9e232df4"

jobs:
  home_visual:
    name: Build and publish Home Nuvio Visual P1
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-home-visual"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.7 Home Nuvio Visual P1"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v27-home-visual/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.6 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          test -f "$HOME"
          test -f "$STORE"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          home_sha="$(sha256sum "$HOME" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Home SHA:  $home_sha"
          echo "Store SHA: $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$home_sha" = "$TARGET_HOME_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Home Visual P1 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$home_sha" != "$BASE_HOME_SHA256" ]; then
            echo "::error::TvHomeScreen.kt baseline mismatch."
            echo "expected=$BASE_HOME_SHA256"
            echo "actual=$home_sha"
            exit 21
          fi

          if [ "$store_sha" != "$BASE_STORE_SHA256" ]; then
            echo "::error::LocalMediaStore.kt changed unexpectedly."
            echo "expected=$BASE_STORE_SHA256"
            echo "actual=$store_sha"
            exit 22
          fi

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-home-visual"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$D/TvHomeScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"

      - name: Apply Home visual parity source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
