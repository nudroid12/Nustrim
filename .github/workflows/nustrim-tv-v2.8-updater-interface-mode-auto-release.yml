name: Nustrim TV V2.8 Updater and Mode Selector Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-8-updater-mode-selector
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.34.1-tv-v2.7-episode-engine-polish"
  BASE_VERSION_CODE: "90"
  TARGET_VERSION_NAME: "0.35.0-tv-v2.8-updater-interface-mode"
  TARGET_VERSION_CODE: "91"
  BASE_BUILD_SHA256: "5ad15a3e1f52f965a3881ed74a60c9966f1fb2bc347a98e7dd01baaaeb54e220"
  BASE_NUSTRIM_APP_SHA256: "55c9624164ae8dad443c94a4fe27e01f093f0c5a72f5cc925985b0b46628833c"
  BASE_UI_PREFS_SHA256: "68d587223c61085222b069d55396211007111b13317b1ca6a55d2c33ea5ee37c"
  BASE_TV_SETTINGS_SHA256: "99d7a2eedfe5676243a74f047505b23602daf99e680d13be28765fdd4ae6ef56"
  TARGET_BUILD_SHA256: "347118f4cad5c34e3e6aac2e21e1943bd85432169ad877a802712beddaadc6e4"
  TARGET_NUSTRIM_APP_SHA256: "c78e75260632c37c76e793c53bf446da3aada2572612b70a3180afc73d062eab"
  TARGET_UI_PREFS_SHA256: "05bbf79ed13c73cf25876ba512e1c653e59200e86bb11558e5ba2728d7a39116"
  TARGET_TV_SETTINGS_SHA256: "298d0ddd1d75da2ba11a41c2778152c915ef06fee960c7ca26569d7b6b8cb505"

jobs:
  v28:
    name: Build and publish V2.8
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.8 Updater and Mode Selector"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v28-updater-mode/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.7 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          BUILD="app/build.gradle.kts"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          TVSET="app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt"

          for file in "$BUILD" "$APP" "$PREFS" "$TVSET"; do
            test -f "$file"
          done

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          build_sha="$(sha256sum "$BUILD" | awk '{print $1}')"
          app_sha="$(sha256sum "$APP" | awk '{print $1}')"
          prefs_sha="$(sha256sum "$PREFS" | awk '{print $1}')"
          tvset_sha="$(sha256sum "$TVSET" | awk '{print $1}')"

          {
            echo "version=$name ($code)"
            echo "build=$build_sha"
            echo "NustrimApp=$app_sha"
            echo "UiPreferences=$prefs_sha"
            echo "TvSettingsScreen=$tvset_sha"
          } | tee "$RUNNER_TEMP/nustrim-v28-updater-mode/preflight.txt"

          if [ "$name" = "$TARGET_VERSION_NAME" ] && \
             [ "$code" = "$TARGET_VERSION_CODE" ] && \
             [ "$build_sha" = "$TARGET_BUILD_SHA256" ] && \
             [ "$app_sha" = "$TARGET_NUSTRIM_APP_SHA256" ] && \
             [ "$prefs_sha" = "$TARGET_UI_PREFS_SHA256" ] && \
             [ "$tvset_sha" = "$TARGET_TV_SETTINGS_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          test "$name" = "$BASE_VERSION_NAME" || {
            echo "::error::Expected baseline $BASE_VERSION_NAME, got $name"
            exit 20
          }
          test "$code" = "$BASE_VERSION_CODE" || {
            echo "::error::Expected versionCode $BASE_VERSION_CODE, got $code"
            exit 21
          }
          test "$build_sha" = "$BASE_BUILD_SHA256" || {
            echo "::error::build.gradle.kts baseline mismatch"
            exit 22
          }
          test "$app_sha" = "$BASE_NUSTRIM_APP_SHA256" || {
            echo "::error::NustrimApp.kt baseline mismatch"
            exit 23
          }
          test "$prefs_sha" = "$BASE_UI_PREFS_SHA256" || {
            echo "::error::UiPreferences.kt baseline mismatch"
            exit 24
          }
          test "$tvset_sha" = "$BASE_TV_SETTINGS_SHA256" || {
            echo "::error::TvSettingsScreen.kt baseline mismatch"
            exit 25
          }

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$D/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$D/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$D/TvSettingsScreen.before.kt"

      - name: Apply interface mode persistence fix
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          text = path.read_text(encoding="utf-8")

          old = """    var interfaceMode by remember { mutableStateOf<InterfaceMode?>(InterfaceMode.MOBILE) }
          """
          new = """    var interfaceMode by remember {
              mutableStateOf<InterfaceMode?>(
                  preferences.interfaceMode.takeIf { preferences.interfaceModeConfirmed }
              )
          }
          """
          if old not in text:
              raise SystemExit("interfaceMode startup anchor missing")
          text = text.replace(old, new, 1)

          old = """    var tvModeSessionActive by rememberSaveable {
              mutableStateOf(preferences.interfaceMode == InterfaceMode.TV)
          }

          fun switchInterfaceMode(selected: InterfaceMode) {
              tvModeSessionActive = selected == InterfaceMode.TV
              preferences.interfaceMode = InterfaceMode.MOBILE
              interfaceMode = InterfaceMode.MOBILE
              screen = Screen.Main(MainSection.HOME)
          }
          """
          new = """    var tvModeSessionActive by rememberSaveable {
              mutableStateOf(
                  preferences.interfaceModeConfirmed &&
                      preferences.interfaceMode == InterfaceMode.TV
              )
          }

          fun switchInterfaceMode(selected: InterfaceMode) {
              tvModeSessionActive = selected == InterfaceMode.TV
              preferences.interfaceMode = selected
              preferences.interfaceModeConfirmed = true
              interfaceMode = selected
              screen = Screen.Main(MainSection.HOME)
          }
          """
          if old not in text:
              raise SystemExit("switchInterfaceMode anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          test "$(sha256sum app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt | awk '{print $1}')" = "$TARGET_NUSTRIM_APP_SHA256"

