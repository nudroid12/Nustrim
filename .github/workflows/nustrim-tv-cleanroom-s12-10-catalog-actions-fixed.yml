name: Nustrim TV Cleanroom S12.10 Catalog Actions Auto Release

# FIXED: apply is skipped only after the S12.10 target marker already exists.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-10-catalog-actions
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.9-tv-cleanroom-s12.10-catalog-actions"
  TARGET_VERSION_CODE: "132"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.8-tv-cleanroom-s12.9-continue-watching-home"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.10 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.10-catalog-actions' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-10-catalog-actions.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify S12.10 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeLongPress.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomePosterActions.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt",
              "scripts/verify_tv_catalog_actions_s12_10.py",
              "scripts/verify_tv_parity_s11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.10 changed files outside catalogue action boundary: " + ", ".join(unexpected))
          expected_hashes = {
              ".nustrim-tv": "d70d783c6004be5f97575cff2d304cdc3a70df38e36ca9875372f4f1e962673a",
              ".nustrim-version": "17d45efd5d3cd736d6fafb37790c50c9549d3d0bbc705d46425e7e675cd49002",
              "app/build.gradle.kts": "a3a322021b6021dd67e102b14ba0a771472ec12c0a468ca5d2f8e543f74ecf7d",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt": "44821f45779d4363b3833dc9724e229f64c1400642d0f952e7c5f8bf9b64bcf7",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeLongPress.kt": "61a864aa7c5ac93d50e3957b555dac72759a0cf461eeea57470839aa01466b56",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomePosterActions.kt": "5f90744309c7d8cbdeb33f7a1cf659a86c8eed82f4f2e2a40776f8f316cf0c95",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt": "d09e317a235e5012114a0f09a60098eb0f6309c1dda7791bafa0ffd9d55f8ef3",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt": "330f27dc2d2423c84452aefeb67a49b5d03a072d497454054369a0b643571fa7",
              "scripts/verify_tv_catalog_actions_s12_10.py": "d357c637c5212d3a18f69e70f081a0ed59500b0fdcb2798d54a556c1e97faefd",
              "scripts/verify_tv_parity_s11.py": "c8aa66aca341f93330bc2bc891f191c4ed9721986c314be1fea4c35ae40995bf",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.10 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_catalog_actions_s12_10.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-10-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-10-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-10-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and S12.10 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.10 makes Home catalogue posters more compact and adds functional hold actions for Details, Library and watched state.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.10 Catalog Actions",
              "issue": "S12-HOME-ACTIONS-01",
              "status": "build-verified",
              "staticContracts": "34/34",
              "parityContracts": "40/40",
              "scope": [
                  "compact 116 x 174 dp catalogue posters",
                  "select-key and remote Menu hold detection",
                  "Details, Library and watched title actions",
                  "exact origin-card focus restoration"
              ],
              "preserved": ["Continue Watching landscape cards", "normal card activation", "Home catalogues", "Search", "Library", "Details", "Player", "provider engine", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "keep version code 131 installed and use the TV updater to install version code 132",
                  "confirm catalogue posters are smaller while Continue Watching cards remain landscape",
                  "tap OK briefly and confirm the existing open behaviour still works",
                  "hold OK on a poster and confirm Title actions opens once with Go to details focused",
                  "test Add to library and Remove from library, then verify the Saved Library result",
                  "test Mark as watched and Mark as unwatched, including removal from Continue Watching when marked watched",
                  "dismiss the dialog with Back and confirm focus returns to the exact origin poster",
                  "open Go to details from a Continue Watching card and confirm it opens Details rather than Sources",
              ],
              "nextBacklog": "Device acceptance followed by final measured parity audit",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-catalog-actions-s12-10-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.10 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeLongPress.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomePosterActions.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt \
            scripts/verify_tv_catalog_actions_s12_10.py \
            scripts/verify_tv_parity_s11.py
          if git diff --cached --quiet; then
            echo "S12.10 source is already committed."
          else
            git commit -m "Add compact Home catalogue actions S12.10 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-10-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.10 reduces Home catalogue posters from 126 x 189 dp to the user-accepted compact size of 116 x 174 dp." "" \
            "Holding OK or pressing the remote Menu key opens Title actions with Go to details, Add or Remove from library, and Mark as watched or unwatched." "" \
            "Short OK, Continue Watching landscape cards, provider, resolver, playback and Mobile UI engines are preserved." "" \
            "Device acceptance remains required before the final parity score can be claimed." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-catalog-actions-s12-10-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-10-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-catalog-actions-s12-10-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-catalog-actions-s12-10-report.json").read_text())
          if report.get("issue") != "S12-HOME-ACTIONS-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.10 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-10-catalog-actions-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-catalog-actions-s12-10-report.json
            ${{ runner.temp }}/nustrim-s12-10-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-10-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-10-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-10-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-catalog-actions-s12-10-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-10-catalog-actions-diagnose
          path: ${{ runner.temp }}/nustrim-s12-10-diagnose
          if-no-files-found: warn
          retention-days: 7
