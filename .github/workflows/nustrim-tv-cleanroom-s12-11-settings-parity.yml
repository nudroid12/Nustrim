name: Nustrim TV Cleanroom S12.11 Settings Parity Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-11-settings-parity
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.10-tv-cleanroom-s12.11-settings-parity"
  TARGET_VERSION_CODE: "133"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.10 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.9-tv-cleanroom-s12.10-catalog-actions"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.11 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.11-settings-parity' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-11-settings-parity.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify S12.11 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsCredentialDialog.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt",
              "scripts/verify_tv_settings_parity_s12_11.py",
              "scripts/verify_tv_parity_s11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.11 changed files outside Settings boundary: " + ", ".join(unexpected))
          expected_hashes = {
              ".nustrim-tv": "d8fa55bc4df740028db8d56963c326cc79bb77363c191ecf61775fec20c27ae8",
              ".nustrim-version": "6f0c8ed572a5b3274963bb14bc1467573593023f618614e329448a90baaa52b3",
              "app/build.gradle.kts": "3967a07c0c8843a22f9ba14d7208cc3b0b200b632c5120651ac840814934c21f",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt": "b6c5a7f7df0c3e38640c2b5b2a53314c5f2716ddfba0043ad1348d4886c6d9e1",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsCredentialDialog.kt": "b1ff688cfad2633ebeb82560478cb3141623f80efd2b5cb1686a348b64076e7f",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt": "345924a9ffa2802f66cc5d1c1f43267c7daac84661deafa66ccb527035a40eaa",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt": "90fa56adaaa96cbb29d3187f4eb849c7f9ecc86f3626ebb0ec6c61825ff43cfa",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt": "824cb6f7c934bb0943428da7179514b22ee7e9767564f6110bf2e05e086d189c",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt": "992cbb7715042a6b8a2ff93b7e8a2664493e1f08f3dd044e07ec8cccfdbe6346",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt": "d76a90bbdfbe199b2d34fcf496752b46c56bd43e78112d1f0c98c23609a380dd",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt": "8d95e366c5332d4c97b6518d4db1934860071ec91da69d3e6261a3de6d0a9f43",
              "scripts/verify_tv_settings_parity_s12_11.py": "966cb9caa64ddec9ffb00662f4bb0c381a758496d8abf62f7fb6c71a1fa10fec",
              "scripts/verify_tv_parity_s11.py": "04e3c54d64944f92bac2b9c88e01d97d3a03890590ac41e10f44c167d02cc489",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.11 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-11-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-11-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-11-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and S12.11 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.11 brings functional Mobile settings to TV with D-pad controls for subtitles, catalogues, integrations, local backup and diagnostics.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.11 Settings Parity",
              "issue": "S12-SETTINGS-PARITY-01",
              "status": "build-verified",
              "staticContracts": "31/31",
              "parityContracts": "40/40",
              "scope": [
                  "complete subtitle language, font size and bold preferences",
                  "parallel catalogue discovery with order, visibility and reset controls",
                  "TV credential editors and validation for TMDB and MDBList",
                  "Trakt device-code connection and disconnect",
                  "MDBList rating-provider controls",
                  "clipboard backup, restore and diagnostics actions",
                  "explicit switch from TV to Mobile interface"
              ],
              "preserved": ["Home S12.10", "Search", "Library", "Details", "Sources", "Player", "provider engine", "Mobile settings", "signed updater"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "install version code 133 over the accepted version code 132 build",
                  "confirm every Settings category and row is reachable with D-pad only",
                  "change subtitle language, font size and bold then confirm the player uses the values",
                  "hide and move a Home catalogue, reopen Home and confirm the new layout",
                  "enter and test TMDB and MDBList credentials using the Android TV keyboard",
                  "start Trakt device authentication, approve the copied code and confirm Connected status",
                  "copy a backup, change a local setting, restore it and verify the original value returns",
                  "copy and clear diagnostics, then verify line count and focus remain stable",
                  "switch to Mobile interface and confirm the touch-first shell opens",
              ],
              "nextBacklog": "Device acceptance followed by final measured parity audit",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-settings-parity-s12-11-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.11 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsCredentialDialog.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt \
            app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt \
            app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt \
            scripts/verify_tv_settings_parity_s12_11.py \
            scripts/verify_tv_parity_s11.py
          if git diff --cached --quiet; then
            echo "S12.11 source is already committed."
          else
            git commit -m "Bring Mobile settings to TV S12.11 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-11-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.11 brings the functional Mobile settings set into the clean-room TV interface with D-pad navigation." "" \
            "It adds full subtitle defaults, catalogue layout controls, TMDB, MDBList and Trakt setup, local backup and diagnostics actions." "" \
            "Downloads remains marked as planned and the touch-only Remote Test utility is intentionally not exposed as a TV product setting." "" \
            "Home S12.10, Search, Library, Details, Sources, Player, provider, resolver, updater and Mobile settings are preserved." "" \
            "Device acceptance remains required before the final parity score can be claimed." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-settings-parity-s12-11-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-11-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-settings-parity-s12-11-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-settings-parity-s12-11-report.json").read_text())
          if report.get("issue") != "S12-SETTINGS-PARITY-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.11 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-11-settings-parity-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-settings-parity-s12-11-report.json
            ${{ runner.temp }}/nustrim-s12-11-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-11-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-11-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-11-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-settings-parity-s12-11-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-11-settings-parity-diagnose
          path: ${{ runner.temp }}/nustrim-s12-11-diagnose
          if-no-files-found: warn
          retention-days: 7
