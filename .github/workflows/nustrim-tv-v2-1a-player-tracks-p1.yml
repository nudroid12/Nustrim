name: Nustrim TV V2.1A Player Tracks Foundation P1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-1a-player-tracks-p1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.27.0-tv-v2.1a-tracks"
  LIVE_DETAILS_SHA: "1a03f345cdd411547e4b56bcb9c4f3cea432be2d2eeb871fa78d52843fd8ff74"
  LIVE_PLAYER_SHA: "74f024079316fbec8d601c40b74dc304a92e5d673f8a06b8c319d861268dcd5d"

jobs:
  v21a:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact live baseline preflight
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v21a"
          mkdir -p "$DIR"

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt"

          test -f "$DETAILS"
          test -f "$PLAYER"
          test -f "$STORE"
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/stremio/StremioSession.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          actual_details="$(sha256sum "$DETAILS" | awk '{print $1}')"
          actual_player="$(sha256sum "$PLAYER" | awk '{print $1}')"

          if [[ "$actual_details" != "$LIVE_DETAILS_SHA" ]]; then
            echo "::error::TvDetailsScreen live baseline drifted."
            echo "expected=$LIVE_DETAILS_SHA"
            echo "actual=$actual_details"
            exit 1
          fi

          if [[ "$actual_player" != "$LIVE_PLAYER_SHA" ]]; then
            echo "::error::TvPlayerScreen live baseline drifted."
            echo "expected=$LIVE_PLAYER_SHA"
            echo "actual=$actual_player"
            exit 1
          fi

          grep -q 'versionName = "0.26.1-tv-season-default-fix"' app/build.gradle.kts
          grep -q 'selectedSeason = seasons.firstOrNull()' "$DETAILS"
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"
          grep -q 'ExoPlayer.Builder(context)' "$PLAYER"
          grep -q 'setDefaultRequestProperties(stream.headers)' "$PLAYER"
          grep -q 'subtitlePreferredLanguage' app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          grep -q 'override fun loadSubtitles(' app/src/main/java/app/nudroidlabs/nustrim/core/source/stremio/StremioSession.kt
          grep -q 'https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/refs/heads/main/repo.json' "$STORE"

          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$DIR/Home.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$DIR/Search.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$DIR/Library.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$DIR/Settings.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt "$DIR/StreamAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt "$DIR/SourceSession.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/stremio/StremioSession.kt "$DIR/StremioSession.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt "$DIR/InstalledSourceStore.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt "$DIR/MediaModels.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$DIR/UiPreferences.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.before"

          {
            echo "NUSTRIM TV V2.1-A PLAYER TRACKS P1"
            echo "==================================="
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts
            grep -m1 'versionName' app/build.gradle.kts
            echo "details_sha=$actual_details"
            echo "player_sha=$actual_player"
            echo
            echo "[Kurato repo]"
            grep 'DEV_CLOUDSTREAM_URL' "$STORE"
          } | tee "$DIR/preflight.txt"

      - name: Write V2.1-A sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          files = {
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt"):
                  "",
          }
          
          for path, payload in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print("WRITE:", path)
          PY

      - name: Set V2.1-A version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          code_match = re.search(r'versionCode\s*=\s*(\d+)', text)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata.")
          
          old_code = int(code_match.group(1))
          old_name = name_match.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1,
          )
          
          path.write_text(text, encoding="utf-8")
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: V2.1-A architecture audit
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v21a"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          SUBAGG="app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt"

          echo "AUDIT VERSION: TV-V2.1A-PLAYER-TRACKS-P1"

          # Season flash bug: catalog episodes must not render before detail resolution.
          grep -q 'var detailsResolved' "$DETAILS"
          grep -q 'val resolvedEpisodes = if (detailsResolved)' "$DETAILS"
          grep -q 'detailsResolved = false' "$DETAILS"
          grep -q 'detailsResolved = true' "$DETAILS"

          # Existing Stage 4/5 path stays connected.
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'aggregator.load(' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"

          # Subtitle addon aggregation.
          grep -q 'SubtitleSourceAggregator(context)' "$DETAILS"
          grep -q 'stream.subtitles + aggregatedSubtitles' "$DETAILS"
          grep -q 'class SubtitleSourceAggregator(' "$SUBAGG"
          grep -q 'store.sources()' "$SUBAGG"
          grep -q 'filter { it.enabled }' "$SUBAGG"
          grep -q 'resource.equals("subtitles", ignoreCase = true)' "$SUBAGG"
          grep -q 'session.loadSubtitles(' "$SUBAGG"

          if grep -q 'putIfAbsent(' "$SUBAGG"; then
            echo "::error::Subtitle aggregator contains API 24 putIfAbsent."
            exit 1
          fi

          # Player track foundation.
          grep -q 'TrackSelectionOverride(' "$PLAYER"
          grep -q 'setOverrideForType' "$PLAYER"
          grep -q 'setPreferredTextLanguages' "$PLAYER"
          grep -q 'setSubtitleConfigurations(subtitleConfigurations)' "$PLAYER"
          grep -q 'TvPlayerTrackPanel.AUDIO' "$PLAYER"
          grep -q 'TvPlayerTrackPanel.SUBTITLES' "$PLAYER"
          grep -q 'Key.DirectionUp' "$PLAYER"
          grep -q 'Key.DirectionDown' "$PLAYER"
          grep -q 'setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)' "$PLAYER"
          grep -q 'preferences.subtitlePreferredLanguage = language' "$PLAYER"
          grep -q 'setDefaultRequestProperties(stream.headers)' "$PLAYER"

          # Protect all already-stable areas.
          cmp "$DIR/Home.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt
          cmp "$DIR/Search.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt
          cmp "$DIR/Library.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt
          cmp "$DIR/Settings.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          cmp "$DIR/StreamAggregator.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          cmp "$DIR/SourceSession.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceSession.kt
          cmp "$DIR/StremioSession.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/stremio/StremioSession.kt
          cmp "$DIR/InstalledSourceStore.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          cmp "$DIR/MediaModels.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt
          cmp "$DIR/NustrimApp.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          cmp "$DIR/UiPreferences.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.27.0-tv-v2.1a-tracks"' app/build.gradle.kts
          grep -q 'minSdk = 23' app/build.gradle.kts

          git diff --check
          git diff --name-status | tee "$DIR/changed-files.txt"

          unexpected="$(
            git diff --name-only |
            grep -v -E               '^(app/build.gradle.kts|app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt)$'               || true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git diff > "$DIR/v21a.patch"

          echo "PASS: catalog season flash eliminated"
          echo "PASS: first real season remains default after details resolve"
          echo "PASS: installed subtitle addons aggregate in parallel"
          echo "PASS: stream-provided + addon subtitles merge"
          echo "PASS: Media3 external subtitle configurations included"
          echo "PASS: Up opens Audio picker"
          echo "PASS: Down opens Subtitle picker"
          echo "PASS: subtitle Off supported"
          echo "PASS: subtitle language preference remembered"
          echo "PASS: existing Sources/Player path retained"
          echo "PASS: Mobile/updater/signing/source store protected"

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21a/compile.log"

      - name: Unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21a/tests.log"

      - name: Release lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21a/lint-release.log"

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v21a/assemble.log"

      - name: Commit and push V2.1-A
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-v21a/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt             app/build.gradle.kts

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): add player subtitle and audio track foundation"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-v21a/remote-main.txt"

          python3 - <<'PY'
          import subprocess
          
          target = "0.27.0-tv-v2.1a-tracks"
          
          details = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt",
              ],
              text=True,
          )
          player = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              ],
              text=True,
          )
          subtitle_agg = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt",
              ],
              text=True,
          )
          gradle = subprocess.check_output(
              ["git", "show", "origin/main:app/build.gradle.kts"],
              text=True,
          )
          store = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt",
              ],
              text=True,
          )
          
          checks = {
              "season flash fix":
                  "val resolvedEpisodes = if (detailsResolved)" in details,
              "details resolved state":
                  "var detailsResolved" in details,
              "subtitle aggregator wired":
                  "SubtitleSourceAggregator(context)" in details,
              "stream subtitles merged":
                  "stream.subtitles + aggregatedSubtitles" in details,
              "stream aggregator retained":
                  "StreamSourceAggregator(context)" in details,
              "player retained":
                  "TvPlayerScreen(" in details,
              "audio picker":
                  "TvPlayerTrackPanel.AUDIO" in player and
                  "C.TRACK_TYPE_AUDIO" in player,
              "subtitle picker":
                  "TvPlayerTrackPanel.SUBTITLES" in player and
                  "C.TRACK_TYPE_TEXT" in player,
              "external subtitle configs":
                  "setSubtitleConfigurations(subtitleConfigurations)" in player,
              "preferred subtitle languages":
                  "setPreferredTextLanguages" in player,
              "specific track override":
                  "TrackSelectionOverride(" in player and
                  "setOverrideForType" in player,
              "subtitle off":
                  "setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)" in player,
              "neutral subtitle aggregator":
                  "class SubtitleSourceAggregator(" in subtitle_agg and
                  'resource.equals("subtitles", ignoreCase = true)' in subtitle_agg,
              "API23 safe subtitle aggregator":
                  "putIfAbsent(" not in subtitle_agg,
              "Kurato repo URL preserved":
                  "https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/refs/heads/main/repo.json" in store,
              "version":
                  f'versionName = "{target}"' in gradle,
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(
                  "REMOTE V2.1-A VERIFICATION FAILED: " + ", ".join(failed)
              )
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-v21a/signed-run.txt"

      - name: Wait signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-v21a/signed-build-watch.log"

      - name: Verify published V2.1-A
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/tv-v21a/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.27.0-tv-v2.1a-tracks' "$MANIFEST" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.27.0-tv-v2.1a-tracks' "$MANIFEST"
          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-v21a/published-update.json"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e

          DIR="$RUNNER_TEMP/tv-v21a"
          echo "========== Nustrim TV V2.1-A P1 =========="
          echo "RESULT: FAILED"

          for f in             preflight.txt             changed-files.txt             remote-main.txt             signed-run.txt             published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              cat "$DIR/$f" || true
            fi
          done

          for f in             compile.log             tests.log             lint-release.log             assemble.log             push.log             signed-build-watch.log; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              tail -n 320 "$DIR/$f" || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2-1a-player-tracks-p1-diagnose
          path: ${{ runner.temp }}/tv-v21a
          if-no-files-found: ignore
          retention-days: 7
