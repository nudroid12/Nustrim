      - name: Bump V2.8 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          old_code = 'versionCode = 90'
          old_name = 'versionName = "0.34.1-tv-v2.7-episode-engine-polish"'
          if old_code not in text or old_name not in text:
              raise SystemExit("V2.7 version anchors missing")
          text = text.replace(old_code, 'versionCode = 91', 1)
          text = text.replace(
              old_name,
              'versionName = "0.35.0-tv-v2.8-updater-interface-mode"',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          test "$(sha256sum app/build.gradle.kts | awk '{print $1}')" = "$TARGET_BUILD_SHA256"
          echo "Version bump OK" >> "$RUNNER_TEMP/nustrim-v28-updater-mode/patch-stage.log"

      - name: Verify V2.8 source contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u | tee "$D/contract.log"

          cat > "$D/expected-files.txt" <<'EOF'
          app/build.gradle.kts
          app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          EOF
          sed -i 's/^          //' "$D/expected-files.txt"
          sort -u "$D/expected-files.txt" -o "$D/expected-files.txt"

          diff -u "$D/expected-files.txt" "$D/contract.log"

          grep -F 'interfaceModeConfirmed' app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          grep -F 'preferences.interfaceMode = selected' app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          grep -F 'TvSettingsSectionTitle("Updates")' app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          grep -F 'AppUpdater(context)' app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          grep -F 'updater.download(info)' app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt

      - name: Compile and lint before commit
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :app:testDebugUnitTest \
            :app:lintRelease \
            --stacktrace \
            --console=plain 2>&1 | tee "$D/verify.log"

      - name: Commit V2.8 only after verification
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt \
            app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt
          git commit -m "Nustrim TV V2.8 updater and interface mode selector"
          git push origin HEAD:main

      - name: Refresh to committed V2.8
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          test "$(sha256sum app/build.gradle.kts | awk '{print $1}')" = "$TARGET_BUILD_SHA256"
          test "$(sha256sum app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt | awk '{print $1}')" = "$TARGET_NUSTRIM_APP_SHA256"
          test "$(sha256sum app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt | awk '{print $1}')" = "$TARGET_UI_PREFS_SHA256"
          test "$(sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt | awk '{print $1}')" = "$TARGET_TV_SETTINGS_SHA256"

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 50
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          test "$CERT" = "$LOCKED_CERT"

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          gradle --no-daemon --build-cache \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain 2>&1 | tee "$D/release-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$D/signature.txt"
          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$D/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "91"
          test "$NAME" = "0.35.0-tv-v2.8-updater-interface-mode"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "V2.8 adds the TV Settings updater and fixes first-run Mobile or TV interface selection with persistent mode choice.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY

      - name: Publish Nustrim V2.8 release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          NOTES="Nustrim $VERSION. TV Settings updater plus persistent Mobile or TV startup selection."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes "$NOTES" --latest
            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG" "$APK" update.json \
              --target "$TARGET_SHA" \
              --title "Nustrim $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_CERT: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v28-updater-mode/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"
          gh release download "$TAG" \
            --pattern update.json \
            --pattern "$APK" \
            --dir "$LIVE" \
            --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          export LIVE APK EXPECTED_SHA EXPECTED_CERT

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))
          assert int(manifest["versionCode"]) == 91
          assert manifest["versionName"] == "0.35.0-tv-v2.8-updater-interface-mode"
          assert manifest["signingMode"] == "permanent"
          assert manifest["signingCertSha256"].upper() == os.environ["EXPECTED_CERT"].upper()
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          assert manifest["sha256"] == sha
          print("Updater verified:", manifest["versionName"], manifest["versionCode"])
          PY

      - name: Collect failure context
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v28-updater-mode"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$D/NustrimApp.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$D/UiPreferences.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$D/TvSettingsScreen.current.kt" 2>/dev/null || true
          cp update.json "$D/update.current.json" 2>/dev/null || true
          git status --short > "$D/git-status.txt" 2>&1 || true
          git diff > "$D/git-diff.txt" 2>&1 || true
          git log -8 --oneline > "$D/recent-commits.txt" 2>&1 || true
          {
            echo "V2.8 failure bundle."
            echo "verify.log contains compile, test and lint output."
            echo "release-build.log contains signed APK build output."
            echo "contract.log contains the exact changed-file contract."
            echo "preflight.txt contains baseline hashes."
          } > "$D/README.txt"

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.8-updater-interface-mode-diagnose
          path: ${{ runner.temp }}/nustrim-v28-updater-mode
          if-no-files-found: error
          retention-days: 14
