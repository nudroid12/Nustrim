name: Nustrim TV Cleanroom S12.19 CloudStream Speed Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-19-cloudstream-speed
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.18-tv-cleanroom-s12.19-cloudstream-speed"
  TARGET_VERSION_CODE: "141"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.18 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.17-tv-cleanroom-s12.18-sources-live-tabs"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.19 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.19-cloudstream-speed' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-19-cloudstream-speed.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceEngine.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositoryCache.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositorySession.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvCloudStreamPerformanceStore.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.19 changed files outside CloudStream speed boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "0a534223abf98ab72334d6344161edaf3be5fe67db3b909ad7dc40fdd904159a",
              ".nustrim-version": "8788fe2e845584f29f796120a0168d1f8f9119d9724de53acfa28d42d14299e4",
              "app/build.gradle.kts": "9d3fcf16141125af815d5d334d9ca322c5b03eea6b7fccb1723aab6fdb196486",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceEngine.kt": "8dea5cdebc619e2ca5321fd4e3f838121259840efdf71fca345e16df193d8e0f",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositoryCache.kt": "8bd9b1cf89f47ada9266fd6d1afac20de412afaea4cf53f756e7d5cfd6b022bd",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositorySession.kt": "a703c6c8411204e3d2af4b09bbfef19f234ea45341c3ae61acb6d317c9bbe946",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvCloudStreamPerformanceStore.kt": "ada4372f7ddf62b8bc100cc4f976d3f13b4b2b510c260672557436a7799d9032",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt": "e83bbcc100e5bbddc285e5c0e5bca39b2a4cf41cefb2561d807e7cd6a31af876",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "4ca757c9f3c64ee4235191f97103afcccb7cf814197a4a3f713839497995fdbb",
              "scripts/verify_tv_episode_titles_s12_17.py": "7c342b09445f20bf0546805b1c19836e371a5afcf7610fa4745a0d045d41c472",
              "scripts/verify_tv_settings_parity_s12_11.py": "2d897a08ea61dcc1a3f5537dc465914353c1ad21ac7f56ff8206b3379097313d",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "5788201e4b86d6cf5db136ca7c22961664af2852c04092ceab7288eefb9bf11a",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "c0dd8c7363b35b13c7e530b212b07446e23f7b84d63b89b9a9f0fd651821c128",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.19 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-19-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-19-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-19-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.19 accelerates CloudStream repository and provider resolution with bounded caches, success priority and controlled concurrency.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.19 CloudStream Speed",
              "issue": "S12-CLOUDSTREAM-SPEED-01",
              "status": "build-verified",
              "changes": [
                  "cache CloudStream repository metadata for 24 hours",
                  "cache successful Sources results for 30 minutes and no-match results for 10 minutes",
                  "prioritise providers that previously returned playable links",
                  "limit top-level CloudStream provider work to four concurrent jobs",
                  "preserve progressive results and manual Refresh cache bypass"
              ],
              "preserved": ["S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "S12.15 Content Manager", "SmartSubs", "Mobile UI", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-cloudstream-speed-s12-19-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.19 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/core/source/SourceEngine.kt \
            app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositoryCache.kt \
            app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamRepositorySession.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvCloudStreamPerformanceStore.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_settings_parity_s12_11.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_subtitle_panel_s12_16.py
          if git diff --cached --quiet; then
            echo "S12.19 source is already committed."
          else
            git commit -m "Accelerate CloudStream Sources S12.19 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-19-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.19 opens cached CloudStream repository metadata immediately and refreshes it in the background." "" \
            "Provider work is limited to four concurrent jobs, successful providers run first, and repeat Sources requests use bounded result caches." "" \
            "S12.18 playable-only tabs, S12.17 catalog episode titles, S12.16 subtitle panel, SmartSubs and Mobile UI are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-cloudstream-speed-s12-19-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-19-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-cloudstream-speed-s12-19-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-19-cloudstream-speed-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-cloudstream-speed-s12-19-report.json
            ${{ runner.temp }}/nustrim-s12-19-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-19-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-19-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-19-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-cloudstream-speed-s12-19-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-19-cloudstream-speed-diagnose
          path: ${{ runner.temp }}/nustrim-s12-19-diagnose
          if-no-files-found: warn
          retention-days: 7
