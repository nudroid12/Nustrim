name: Nustrim TV V2.4 Details Episodes P2 Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-4-details-episodes-p2
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.30.1-tv-v2.4-details-episodes-p1-lintfix"
  BASE_VERSION_CODE: "84"
  TARGET_VERSION_NAME: "0.30.2-tv-v2.4-details-episodes-p2"
  TARGET_VERSION_CODE: "85"
  BASE_DETAILS_SHA256: "1221e028ed34e9674c57a844861b4d660d55b1354992ecb063bcf472e547d0f9"
  BASE_STORE_SHA256: "ca32e6c8e8df9d6b760cd54ea1499f52e564ea1f8149a8e3474232c3ca6af8af"
  TARGET_DETAILS_SHA256: "3a6fc28dd00bf63d7ae7a5d58e09cc3d4cf967c34304b72d4a92fa8fd4d3da20"
  TARGET_STORE_SHA256: "24f0a09d70fdba00d7738e32aea279e33a36a9cdc22bfa2c1bc2b093c39f84a3"

jobs:
  details_p2:
    name: Build and publish Details Episodes P2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact P1 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          details_sha="$(sha256sum "$DETAILS" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Details SHA: $details_sha"
          echo "Store SHA:   $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$details_sha" = "$TARGET_DETAILS_SHA256" ] &&              [ "$store_sha" = "$TARGET_STORE_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          test "$name" = "$BASE_VERSION_NAME" || {
            echo "::error::Expected $BASE_VERSION_NAME, got $name"
            exit 20
          }
          test "$code" = "$BASE_VERSION_CODE" || {
            echo "::error::Expected versionCode $BASE_VERSION_CODE, got $code"
            exit 21
          }
          test "$details_sha" = "$BASE_DETAILS_SHA256" || {
            echo "::error::TvDetailsScreen.kt baseline mismatch"
            exit 22
          }
          test "$store_sha" = "$BASE_STORE_SHA256" || {
            echo "::error::LocalMediaStore.kt baseline mismatch"
            exit 23
          }

      - name: Apply Details P2 sources
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
