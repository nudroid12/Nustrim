          aGVkRW50cmllczogTGlzdDxMb2NhbE1lZGlhRW50cnk+ID0gZW1wdHlMaXN0KCkKICAgIH0KfQo=
          STORE_EOF

          test "$(sha256sum "$DETAILS" | awk '{print $1}')" = "$TARGET_DETAILS_SHA256"
          test "$(sha256sum "$STORE" | awk '{print $1}')" = "$TARGET_STORE_SHA256"

      - name: Bump P2 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "84" or name.group(1) != "0.30.1-tv-v2.4-details-episodes-p1-lintfix":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 85', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.30.2-tv-v2.4-details-episodes-p2"',
              text,
              count=1,
          )
          p.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify P2 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"

          grep -Fq 'var episodeOptions by remember(entry.stableKey)' "$DETAILS"
          grep -Fq 'onLongPress = {' "$DETAILS"
          grep -Fq 'private fun TvEpisodeOptionsOverlay(' "$DETAILS"
          grep -Fq 'text = "Start from beginning"' "$DETAILS"
          grep -Fq 'text = if (watched) "Mark as unwatched" else "Mark as watched"' "$DETAILS"
          grep -Fq 'sourcePreview?.startFromBeginning == true' "$DETAILS"
          grep -Fq 'native.repeatCount >= 2' "$DETAILS"
          grep -Fq 'episodeWatched -> "Watched"' "$DETAILS"

          grep -Fq 'fun watchedEpisodeKeys(' "$STORE"
          grep -Fq 'fun isEpisodeWatched(' "$STORE"
          grep -Fq 'fun setEpisodeWatched(' "$STORE"
          grep -Fq 'fun setSeasonWatched(' "$STORE"
          grep -Fq 'KEY_EPISODE_WATCHED = "episode_watched_v1"' "$STORE"
          grep -Fq 'if (reachedEnd && episode != null)' "$STORE"

          grep -Fq 'versionCode = 85' app/build.gradle.kts
          grep -Fq 'versionName = "0.30.2-tv-v2.4-details-episodes-p2"' app/build.gradle.kts

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt | sort)"
          test "$changed" = "$expected"

          git diff --check

      - name: Compile and release lint gates
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-p2"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/verify.log"

      - name: Commit only after verification
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.4 details episode options and watched state pass 2'
          git push origin HEAD:main

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "::error::Signing secret $name is missing."
              exit 50
            }
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc               -keystore "$KS"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          test "$CERT" = "$LOCKED_CERT" || {
            echo "::error::Permanent signing certificate mismatch."
            exit 51
          }

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-p2"
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             :app:assembleRelease             --stacktrace             --console=plain             2>&1 | tee "$D/release-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/nustrim-v24-details-p2/signature.txt"

          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p'               "$RUNNER_TEMP/nustrim-v24-details-p2/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "85"
          test "$NAME" = "0.30.2-tv-v2.4-details-episodes-p2"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA

          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import hashlib, json, os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "Details + Episodes P2: episode options, start from beginning, and per-episode watched state.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY_ASSETS

      - name: Publish Nustrim release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. Details + Episodes P2."               --latest
            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG"               "$APK" update.json               --target "$TARGET_SHA"               --title "Nustrim $VERSION"               --notes "Nustrim $VERSION. Details + Episodes P2."               --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v24-details-p2/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"

          gh release download "$TAG"             --pattern update.json             --pattern "$APK"             --dir "$LIVE"             --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"

          python3 - "$LIVE/update.json" <<'PY_VERIFY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["versionCode"] == 85
          assert data["versionName"] == "0.30.2-tv-v2.4-details-episodes-p2"
          assert data["signingMode"] == "permanent"
          print("Updater verified:", data["versionName"], data["versionCode"])
          PY_VERIFY

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.4-details-episodes-p2-diagnose
          path: ${{ runner.temp }}/nustrim-v24-details-p2
          if-no-files-found: warn
          retention-days: 14
