          actual="$(sha256sum "$PLAYER" | awk '{print $1}')"
          if [ "$actual" != "$TARGET_PLAYER_SHA256" ]; then
            echo "::error::Decoded P5 player source SHA mismatch."
            echo "expected=$TARGET_PLAYER_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump P5 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "78" or name.group(1) != "0.28.4-tv-v2.3-nuvio-player-p4":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 79', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.28.5-tv-v2.3-nuvio-player-p5"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify P5 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 79' app/build.gradle.kts
          grep -q 'versionName = "0.28.5-tv-v2.3-nuvio-player-p5"' app/build.gradle.kts

          # Preserve P1 to P4 contracts.
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"
          grep -q 'fun previewSeekBy(direction: Int)' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"
          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'delay(5000)' "$PLAYER"

          # P5 final parity contract.
          grep -q 'private fun TvPlayerClockOverlay(' "$PLAYER"
          grep -q 'text = "Ends at \$endsAt"' "$PLAYER"
          grep -q 'private fun TvPlayerPostPlayOverlay(' "$PLAYER"
          grep -q 'text = "Play now"' "$PLAYER"
          grep -q 'text = "OK Play now  •  Back Cancel"' "$PLAYER"
          grep -q 'val hasNextEpisode = onNextEpisode != null' "$PLAYER"
          grep -q 'controlsVisible = !hasNextEpisode' "$PLAYER"
          grep -q 'autoNextCountdown >= 0 && event.type == KeyEventType.KeyDown' "$PLAYER"
          grep -q 'triggerNextEpisode()' "$PLAYER"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p5"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p5"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/player-p5.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P5
          =================================
          Baseline: 0.28.4-tv-v2.3-nuvio-player-p4 (78)
          Target:   0.28.5-tv-v2.3-nuvio-player-p5 (79)

          Final player parity changes:
          - controls show current TV clock and estimated playback end time
          - end time respects playback speed
          - episode end hides normal controls when a next episode exists
          - a dedicated Nuvio-style post-play card takes over
          - OK now really plays the next episode immediately
          - directional input cancels post-play and restores controls
          - Back cancels post-play before leaving player
          - post-play countdown has a visible progress track
          - P1 to P4 playback, focus, seek, pause OSD, tracks, speed, aspect and resume are preserved
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.3 Nuvio player final parity pass 5'
          git push origin HEAD:main

      - name: Dispatch signed updater release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml             --ref main             -f publish_release=true             -f prepare_clean_bridge=false
          echo "Build Nustrim Clean dispatched with publish_release=true."

      - name: Write already-applied summary
        if: steps.preflight.outputs.already_applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p5"
          mkdir -p "$D"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P5 is already applied exactly.
          No source files were changed by this run.
          The signed updater release workflow was dispatched again.
          EOF

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v23-player-p5"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.3-nuvio-player-p5-diagnose
          path: ${{ runner.temp }}/nustrim-v23-player-p5
          if-no-files-found: warn
          retention-days: 14
