name: Nustrim TV V2.3 Nuvio Player P5 Final Parity

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-3-nuvio-player-p5
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.28.4-tv-v2.3-nuvio-player-p4"
  BASE_VERSION_CODE: "78"
  TARGET_VERSION_NAME: "0.28.5-tv-v2.3-nuvio-player-p5"
  TARGET_VERSION_CODE: "79"
  BASE_PLAYER_SHA256: "668b84b8d6fe48d566504cd5cd1dfe9eb07da69e3155141eb5a26a8d551a8e2e"
  TARGET_PLAYER_SHA256: "3f555410010198bc5b67b0d696ee88d9aee544776a029f8e9320f7006f76f142"

jobs:
  player_p5:
    name: Patch, compile, commit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact P4 preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          BUILD="app/build.gradle.kts"

          test -f "$PLAYER"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          player_sha="$(sha256sum "$PLAYER" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Live player SHA-256: $player_sha"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$player_sha" = "$TARGET_PLAYER_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "P5 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$player_sha" != "$BASE_PLAYER_SHA256" ]; then
            echo "::error::TvPlayerScreen.kt does not match exact P4 baseline."
            echo "expected=$BASE_PLAYER_SHA256"
            echo "actual=$player_sha"
            exit 21
          fi

          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'delay(5000)' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p5"
          mkdir -p "$D"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          git rev-parse HEAD > "$D/base-commit.txt"

      - name: Write final player parity source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
