          if [ "$actual" != "$TARGET_DETAILS_SHA256" ]; then
            echo "::error::Decoded Details P1 source SHA mismatch."
            echo "expected=$TARGET_DETAILS_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump Details P1 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "82" or name.group(1) != "0.29.1-tv-v2.3-p5.1-restored":
              raise SystemExit(
                  f"Unexpected baseline: {name.group(1)} ({code.group(1)})"
              )

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 83',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.30.0-tv-v2.4-details-episodes-p1"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify Details P1 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "0.30.0-tv-v2.4-details-episodes-p1"' app/build.gradle.kts

          # Nuvio-like season and episode navigation.
          grep -q 'rememberLazyListState()' "$DETAILS"
          grep -q 'pendingSeasonSelection' "$DETAILS"
          grep -q 'delay(150)' "$DETAILS"
          grep -q 'episodeFocusRequesters' "$DETAILS"
          grep -q 'pendingEpisodeFocusRestoreKey' "$DETAILS"
          grep -q 'episodeListState.scrollToItem(restoreIndex)' "$DETAILS"
          grep -q 'state = episodeListState' "$DETAILS"

          # Continue Watching state must refresh from the real local store.
          grep -q 'val localContinueEntry = remember(' "$DETAILS"
          grep -q 'val effectiveContinueEntry = if (sourcePlayerReturnToken > 0)' "$DETAILS"
          grep -q 'stored.hasContinueState' "$DETAILS"
          grep -q 'val localPlaybackEntry = effectiveContinueEntry' "$DETAILS"

          # Episode card state and hierarchy.
          grep -q 'statusLabel = statusLabel' "$DETAILS"
          grep -q '"Next up"' "$DETAILS"
          grep -q '"Resume · ${(progressFraction * 100f).toInt()}%"' "$DETAILS"
          grep -q 'fillMaxWidth(progressFraction.coerceIn(0f, 1f))' "$DETAILS"
          grep -q 'private fun episodeFocusKey' "$DETAILS"
          grep -q '"S${episode.season} · E${episode.episode}"' "$DETAILS"

          # Player wiring and resume logic must remain present.
          grep -q 'TvPlayerScreen(' "$DETAILS"
          grep -q 'startPositionMs = mediaStore.resumePosition(' "$DETAILS"
          grep -q 'mediaStore.recordProgress(' "$DETAILS"
          grep -q 'switchPlayerEpisode(episode)' "$DETAILS"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-p1"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-p1"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/details-p1.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt > "$D/details-sha256.txt"

          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.4 Details + Episodes P1
          ======================================
          Baseline: 0.29.1-tv-v2.3-p5.1-restored (82)
          Target:   0.30.0-tv-v2.4-details-episodes-p1 (83)

          Changes:
          - season tabs switch after a short 150ms focus settle
          - episode row keeps explicit focus requesters
          - returning from Sources / Player restores the exact episode focus when possible
          - episode row scrolls to the restored episode before requesting focus
          - auto-next updates the selected season before returning to Details
          - Continue Watching state is refreshed from LocalMediaStore after player return
          - stale entry data is not reused after a completed playback return
          - current resume episode shows a progress bar and Resume percentage
          - queued next episode shows a Next up badge
          - episode number and episode title have separate hierarchy

          Scope:
          - no player source changes
          - no LocalMediaStore changes
          - no cross-workflow dispatch
          - no unrelated third-party automation
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.4 details and episode UX pass 1'
          git push origin HEAD:main

      - name: Safe CI completion summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Nustrim Details + Episodes P1 complete"
            echo
            echo "- Only Nustrim source in this repository was patched and compiled."
            echo "- No workflow-dispatch API call was made."
            echo "- No unrelated third-party service automation was performed."
            echo
            echo "For an installable signed updater build, manually run **Build Nustrim Clean**"
            echo "with **publish_release = true**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v24-details-p1"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.4-details-episodes-p1-diagnose
          path: ${{ runner.temp }}/nustrim-v24-details-p1
          if-no-files-found: warn
          retention-days: 14
