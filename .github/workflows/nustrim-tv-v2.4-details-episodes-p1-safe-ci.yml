name: Nustrim TV V2.4 Details Episodes P1 Safe CI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-4-details-episodes-p1
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.29.1-tv-v2.3-p5.1-restored"
  BASE_VERSION_CODE: "82"
  TARGET_VERSION_NAME: "0.30.0-tv-v2.4-details-episodes-p1"
  TARGET_VERSION_CODE: "83"
  BASE_DETAILS_SHA256: "6f85b30dfd59880aa1352a0c5b543edcf6029652472cecdcb409be7e90106cb1"
  TARGET_DETAILS_SHA256: "1a09d83e21632c14c60e31d3da92c1ca6a84779da0c419f160602b94af821343"
  LOCAL_MEDIA_STORE_SHA256: "ca32e6c8e8df9d6b760cd54ea1499f52e564ea1f8149a8e3474232c3ca6af8af"

jobs:
  details_p1:
    name: Patch, compile and commit Details P1
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact restored baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          test -f "$DETAILS"
          test -f "$STORE"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          details_sha="$(sha256sum "$DETAILS" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Details SHA-256: $details_sha"
          echo "LocalMediaStore SHA-256: $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$details_sha" = "$TARGET_DETAILS_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Details P1 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$details_sha" != "$BASE_DETAILS_SHA256" ]; then
            echo "::error::TvDetailsScreen.kt does not match the exact restored baseline."
            echo "expected=$BASE_DETAILS_SHA256"
            echo "actual=$details_sha"
            exit 21
          fi

          if [ "$store_sha" != "$LOCAL_MEDIA_STORE_SHA256" ]; then
            echo "::error::LocalMediaStore.kt changed. P1 depends on its current Continue Watching contract."
            echo "expected=$LOCAL_MEDIA_STORE_SHA256"
            echo "actual=$store_sha"
            exit 22
          fi

          grep -q 'val nextUp: Boolean = false' "$STORE"
          grep -q 'val hasContinueState: Boolean' "$STORE"
          grep -q 'fun resumePosition(' "$STORE"
          grep -q 'fun recordProgress(' "$STORE"

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-details-p1"
          mkdir -p "$D"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          git rev-parse HEAD > "$D/base-commit.txt"

      - name: Write Details and Episodes P1 source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
