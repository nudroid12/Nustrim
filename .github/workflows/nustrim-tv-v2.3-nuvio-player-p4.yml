          if [ "$actual" != "$TARGET_PLAYER_SHA256" ]; then
            echo "::error::Decoded P4 player source SHA mismatch."
            echo "expected=$TARGET_PLAYER_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump P4 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "77" or name.group(1) != "0.28.3-tv-v2.3-nuvio-player-p3":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 78', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.28.4-tv-v2.3-nuvio-player-p4"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify P4 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "0.28.4-tv-v2.3-nuvio-player-p4"' app/build.gradle.kts

          # Preserve P1 to P3 contracts.
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"
          grep -q 'fun previewSeekBy(direction: Int)' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"
          grep -q 'seekRepeatCount >= 9 -> 30_000L' "$PLAYER"

          # P4 pause OSD contract.
          grep -q 'var pauseOverlayVisible by remember' "$PLAYER"
          grep -q 'fun resumeFromPauseOverlay()' "$PLAYER"
          grep -q 'delay(5000)' "$PLAYER"
          grep -q 'player.playbackState == Player.STATE_READY' "$PLAYER"
          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'text = "You are watching"' "$PLAYER"
          grep -q 'DateFormat.getTimeFormat(context)' "$PLAYER"
          grep -q 'visible = pauseOverlayVisible && playbackError == null && !buffering' "$PLAYER"
          grep -q 'visible = controlsVisible && playbackError == null && !pauseOverlayVisible' "$PLAYER"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p4"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p4"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/player-p4.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P4
          =================================
          Baseline: 0.28.3-tv-v2.3-nuvio-player-p3 (77)
          Target:   0.28.4-tv-v2.3-nuvio-player-p4 (78)

          Player changes:
          - after 5 seconds paused, full controls transition to a Nuvio-style pause OSD
          - pause OSD has clock at top-right and watching metadata at bottom-left
          - OK resumes playback directly from the pause OSD
          - directional input dismisses the pause OSD and restores player controls
          - Back dismisses pause OSD before leaving player
          - loading, playback errors and episode-end state cannot trigger pause OSD
          - P1/P2/P3 controls, resume, seek preview, sources, tracks, speed and aspect are preserved
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.3 Nuvio player pause OSD pass 4'
          git push origin HEAD:main

      - name: Dispatch signed updater release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml             --ref main             -f publish_release=true             -f prepare_clean_bridge=false
          echo "Build Nustrim Clean dispatched with publish_release=true."

      - name: Write already-applied summary
        if: steps.preflight.outputs.already_applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p4"
          mkdir -p "$D"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P4 is already applied exactly.
          No source files were changed by this run.
          The signed updater release workflow was dispatched again.
          EOF

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v23-player-p4"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.3-nuvio-player-p4-diagnose
          path: ${{ runner.temp }}/nustrim-v23-player-p4
          if-no-files-found: warn
          retention-days: 14
