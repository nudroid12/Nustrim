name: Nustrim TV V2.5 Home Final Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-5-home-final
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.31.0-tv-v2.4-details-final"
  BASE_VERSION_CODE: "86"
  TARGET_VERSION_NAME: "0.32.0-tv-v2.5-home-final"
  TARGET_VERSION_CODE: "87"
  BASE_HOME_SHA256: "d61c35a31beab44e41a36ddb37a132b8d50e9e7c7e95911813732d9ac7397ea2"
  BASE_STORE_SHA256: "24f0a09d70fdba00d7738e32aea279e33a36a9cdc22bfa2c1bc2b093c39f84a3"
  TARGET_HOME_SHA256: "f41c3009d7f0b3e7a718e3f62a90fe056e940abe92e8a74c83e93274f9eeebaf"
  TARGET_STORE_SHA256: "2b3c005a8dbbd661114cc23f3473e3cd649b8113a29f09bddd64b2af9e232df4"

jobs:
  home_final:
    name: Build and publish Home Final
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v25-home-final"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.5 Home Final"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v25-home-final/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.4 baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          BUILD="app/build.gradle.kts"

          test -f "$HOME"
          test -f "$STORE"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          home_sha="$(sha256sum "$HOME" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Home SHA:  $home_sha"
          echo "Store SHA: $store_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$home_sha" = "$TARGET_HOME_SHA256" ] &&              [ "$store_sha" = "$TARGET_STORE_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Home Final is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$home_sha" != "$BASE_HOME_SHA256" ]; then
            echo "::error::TvHomeScreen.kt baseline mismatch."
            echo "expected=$BASE_HOME_SHA256"
            echo "actual=$home_sha"
            exit 21
          fi

          if [ "$store_sha" != "$BASE_STORE_SHA256" ]; then
            echo "::error::LocalMediaStore.kt baseline mismatch."
            echo "expected=$BASE_STORE_SHA256"
            echo "actual=$store_sha"
            exit 22
          fi

          grep -Fq 'refreshToken: Int = 0' "$HOME"
          grep -Fq 'fun continueWatching()' "$STORE"
          grep -Fq 'fun setSaved(' "$STORE"
          grep -Fq 'fun setWatched(' "$STORE"

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v25-home-final"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt "$D/TvHomeScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt "$D/LocalMediaStore.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"

      - name: Apply Home Final sources
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"

