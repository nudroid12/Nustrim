name: Nustrim TV Cleanroom S12.23 Player Episodes Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-23-player-episodes
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.22-tv-cleanroom-s12.23-player-episodes"
  TARGET_VERSION_CODE: "145"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.22 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.21-tv-cleanroom-s12.22-branding"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.23 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.23-player-episodes' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-23-player-episodes.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt",
              "scripts/verify_tv_player_episodes_s12_23.py",
              "scripts/verify_tv_branding_s12_22.py",
              "scripts/verify_tv_subtitle_language_split_s12_21.py",
              "scripts/verify_tv_cloudstream_tv_s12_20.py",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.23 changed files outside player episodes boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "8dc0dc9c5ce8717a41bc7b96338ded6d973ebb00286e2e4a21d33ce68ca58b8a",
              ".nustrim-version": "56f36782025fa76f59530a5b03aef7a56d2171f639a2d05f0dfacdbdeac4d520",
              "app/build.gradle.kts": "518e7623f632afda8c09282c42fe7cd58f3d481d8b849c4c3cc277e1a1f598aa",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt": "311666713f70b437dcf09620171102d14684fcda448408b21e567f1c963063f8",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt": "4a4a5481a91c51f8b4f84f277091599578e57f44b16eca88cb9934ad751c38b4",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt": "2b7617f3a10f32885aaf74d8603d05fda219aaa1393d72d649025749f84be91d",
              "scripts/verify_tv_player_episodes_s12_23.py": "e8b052d9c729e5818f720e2d420731918476ae2c2c6d8026423b6340000d8c2b",
              "scripts/verify_tv_branding_s12_22.py": "58719c71e61990bbef1f486fe1100d75e638bfc4c20ae7f42bf406afa7d1259f",
              "scripts/verify_tv_subtitle_language_split_s12_21.py": "0d51f07e403382294738205293860fa94505ebecbab2df017059fae83da4b21a",
              "scripts/verify_tv_cloudstream_tv_s12_20.py": "b8a2df02f8e53c9ae238b4327ea25774bee98d1e7f13f9ea91eb574982ac1d83",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "9fcf2a651839ca9d498ea1f6c422b9f935a18d0f98870c48c7693cba15ffe3b8",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "31d643696e9f4939318b9339ac0472ddcf0046f6d31d8250298925dbe8386c13",
              "scripts/verify_tv_episode_titles_s12_17.py": "c1225d732d2d1783c67257c56da44e6b4f2983b0d4c784ee27352f0ecd036ae7",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "2587726c4598a71a5facfe185155db5704d525d03dbd5c8a10d772c156908d2d",
              "scripts/verify_tv_settings_parity_s12_11.py": "1fc47d528ca5fa64f682fd4f42bfb65920eafa45ed7b09623355138f7a133427",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.23 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_player_episodes_s12_23.py
          python3 scripts/verify_tv_branding_s12_22.py
          python3 scripts/verify_tv_subtitle_language_split_s12_21.py
          python3 scripts/verify_tv_cloudstream_tv_s12_20.py
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-23-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-23-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-23-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.23 restores the Episodes tab for TV series playback, including Continue Watching, and hydrates the full episode catalogue in the background.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.23 Player Episodes",
              "issue": "S12-PLAYER-EPISODES-01",
              "status": "build-verified",
              "changes": [
                  "show Episodes immediately for TV episode playback",
                  "restore the full episode catalogue for Continue Watching",
                  "hydrate missing series metadata in the background",
                  "show loading state while the full list is restored",
                  "keep the Episodes control hidden for movies"
              ],
              "preserved": ["S12.22 approved branding", "S12.21 Malay and Indonesian subtitle split", "S12.20 full CloudStream TV flow", "S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "SmartSubs", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-player-episodes-s12-23-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.23 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-tv \
            .nustrim-version \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt \
            scripts/verify_tv_player_episodes_s12_23.py \
            scripts/verify_tv_branding_s12_22.py \
            scripts/verify_tv_subtitle_language_split_s12_21.py \
            scripts/verify_tv_cloudstream_tv_s12_20.py \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_subtitle_panel_s12_16.py \
            scripts/verify_tv_settings_parity_s12_11.py
          if git diff --cached --quiet; then
            echo "S12.23 source is already committed."
          else
            git commit -m "Restore TV player Episodes tab S12.23 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-23-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.23 restores the Episodes tab whenever a TV episode is playing, including playback opened from Continue Watching." "" \
            "A current-episode fallback makes the tab available immediately while the complete series catalogue loads in the background." "" \
            "S12.22 branding, subtitle separation, CloudStream TV, SmartSubs and source resolution are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-player-episodes-s12-23-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-23-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-player-episodes-s12-23-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-23-player-episodes-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-player-episodes-s12-23-report.json
            ${{ runner.temp }}/nustrim-s12-23-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-23-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-23-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-23-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-player-episodes-s12-23-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-23-player-episodes-diagnose
          path: ${{ runner.temp }}/nustrim-s12-23-diagnose
          if-no-files-found: warn
          retention-days: 7
