name: Nustrim TV Cleanroom S12.8 Repository Cleanup Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-8-repo-cleanup
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.7-tv-cleanroom-s12.8-repo-cleanup"
  TARGET_VERSION_CODE: "130"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.6-tv-cleanroom-s12.7-home-poster-scale"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.8 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
          OBSOLETE_PATHS_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.8-repo-cleanup' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-8-repo-cleanup.patch"
            OBSOLETE_FILE="$RUNNER_TEMP/s12-8-obsolete-paths.txt"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            printf '%s' "$OBSOLETE_PATHS_B64" | base64 --decode > "$OBSOLETE_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
            test "$(wc -l < "$OBSOLETE_FILE")" -eq 49
            while IFS= read -r path; do
              test -n "$path"
              test -f "$path"
              git rm -- "$path"
            done < "$OBSOLETE_FILE"
          fi

      - name: Verify S12.8 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff HEAD --check
          changed="$({ git diff HEAD --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          obsolete="$(git diff HEAD --diff-filter=D --name-only | sort)"
          rerun=false
          if [ -z "$changed" ]; then
            rerun=true
          else
            test "$(printf '%s\n' "$obsolete" | sed '/^$/d' | wc -l)" -eq 49
            test "$(printf '%s\n' "$obsolete" | sha256sum | cut -d' ' -f1)" = \
              "b9df72c0c912a1fd129d413d77ad8a5cfcc870be37fff76e3861392ab540fce8"
          fi
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          export OBSOLETE_PATHS="$obsolete"
          export RERUN="$rerun"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          rerun = os.environ.get("RERUN") == "true"
          obsolete = set(os.environ["OBSOLETE_PATHS"].splitlines())
          allowed = obsolete | {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "scripts/verify_repo_cleanup_s12_8.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.8 changed files outside locked cleanup boundary: " + ", ".join(unexpected))
          if rerun:
              if changed:
                  raise SystemExit("S12.8 rerun unexpectedly changed files")
          else:
              missing = sorted(allowed - set(changed))
              if missing:
                  raise SystemExit("S12.8 expected changes are missing: " + ", ".join(missing))
          expected_hashes = {
              ".nustrim-tv": "333510d25b7e18a49b8d0b23dbac5e186944683c6f366e37562240e0c7179996",
              ".nustrim-version": "3a1c79cc25932d7028b629d328c9644d768970b13dc7d32f7b5607e96f5d500f",
              "app/build.gradle.kts": "8ab6db96d1fa08324a0a16308f94187aefad5c9ed13263c3f7822f1668a45324",
              "scripts/verify_repo_cleanup_s12_8.py": "21b0a6e282c7ca22e7fff570773c3e1dca5e2cb03d529a8f9cdf16352808f630",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.8 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_repo_cleanup_s12_8.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-8-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-8-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-8-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and S12.8 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.8 removes 49 obsolete stage files and 17,394 lines while retaining the primary build, current provider engines and all TV parity contracts.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.8 Repository Cleanup",
              "issue": "S12-REPO-CLEANUP-01",
              "status": "build-verified",
              "staticContracts": "16/16",
              "parityContracts": "40/40",
              "removedFiles": 49,
              "removedLines": 17394,
              "removedGroups": {"obsoleteWorkflows": 36, "stageVerifiers": 7, "unreferencedKotlin": 6},
              "preserved": ["build.yml", "parity verifier", "SourceEngine", "active provider sessions", "TV Sources", "TV subtitles", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "keep version code 129 installed",
                  "use the TV updater to download and install version code 130",
                  "open Home, Search, Library, Settings and Details",
                  "resolve Sources and start playback",
                  "open the subtitle panel and confirm active subtitle discovery still works",
              ],
              "nextBacklog": "Final device parity acceptance and measured visual audit",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-repo-cleanup-s12-8-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.8 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "S12.8 source is already committed."
          else
            git commit -m "Clean obsolete repository files S12.8 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-8-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.8 removes 49 obsolete workflow, verifier, and unreferenced Kotlin files." "" \
            "The primary build, parity verifier, current provider engines, TV Sources, subtitles, and Mobile UI are preserved." "" \
            "Device acceptance remains required before the final parity score can be claimed." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-repo-cleanup-s12-8-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-8-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-repo-cleanup-s12-8-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-repo-cleanup-s12-8-report.json").read_text())
          if report.get("issue") != "S12-REPO-CLEANUP-01" or report.get("removedFiles") != 49:
              raise SystemExit("Published S12.8 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-8-repo-cleanup-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-repo-cleanup-s12-8-report.json
            ${{ runner.temp }}/nustrim-s12-8-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-8-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-8-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-8-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-repo-cleanup-s12-8-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-8-repo-cleanup-diagnose
          path: ${{ runner.temp }}/nustrim-s12-8-diagnose
          if-no-files-found: warn
          retention-days: 7
