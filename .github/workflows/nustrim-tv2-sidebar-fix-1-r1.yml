name: Nustrim TV2 Sidebar Fix 1 R1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv2-sidebar-fix-1-r1
  cancel-in-progress: false

env:
  TV2_VERSION: "0.17.0-tv2-rc8"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare diagnose
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-sidebar-r1"
          mkdir -p "$DIR"
          {
            echo "NUSTRIM TV2 SIDEBAR FIX 1 R1"
            echo "sha=$(git rev-parse HEAD)"
            cat .nustrim-tv2 2>/dev/null || true
            grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true
          } > "$DIR/preflight.txt"

      - name: Verify live sidebar baseline
        shell: bash
        run: |
          set -euo pipefail
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          test -f "$SHELL"
          test -f "$APP"
          grep -q 'private fun Tv2RailItem(' "$SHELL"
          grep -q 'focused -> Tv2Colors.Focus' "$SHELL"
          grep -q 'selected -> Tv2Colors.Selection' "$SHELL"
          grep -q 'content(true)' "$APP"
          echo "PASS: live sidebar baseline" >> "$RUNNER_TEMP/nustrim-sidebar-r1/preflight.txt"

      - name: Patch sidebar semantically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r1/patch.log"
          from pathlib import Path
          import re
          
          shell_path = Path("app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt")
          app_path = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          
          shell = shell_path.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")
          
          # Hide the whole brand when collapsed.
          brand_pattern = re.compile(
              r'(?ms)^\\s*Tv2BrandMark\\(\\s*expanded\\s*=\\s*railExpanded,\\s*modifier\\s*=\\s*Modifier\\.align\\(Alignment\\.TopStart\\)\\s*\\)'
          )
          brand_replacement = (
              "                if (railExpanded) {\\n"
              "                    Tv2BrandMark(\\n"
              "                        expanded = true,\\n"
              "                        modifier = Modifier.align(Alignment.TopStart)\\n"
              "                    )\\n"
              "                }"
          )
          shell, brand_count = brand_pattern.subn(brand_replacement, shell, count=1)
          if brand_count != 1 and "if (railExpanded)" not in shell:
              raise SystemExit("Brand patch failed")
          
          # Remove rail scale effect and thin white focus border.
          shell = re.sub(
              r'(?ms)^\\s*val scale by animateFloatAsState\\(.*?label\\s*=\\s*"tv2-rail-item-scale"\\s*\\)\\s*',
              '',
              shell,
              count=1
          )
          shell = shell.replace("            .scale(scale)\\n", "", 1)
          shell = re.sub(
              r'(?ms)\\s*\\.then\\(\\s*if \\(focused\\) Modifier\\.border\\(1\\.dp, Tv2Colors\\.FocusStroke, shape\\)\\s*else Modifier\\s*\\)',
              '',
              shell,
              count=1
          )
          
          # Selected/current section owns the white marker.
          fill_pattern = re.compile(
              r'val fill = when \\{\\s*focused -> Tv2Colors\\.Focus\\s*selected -> Tv2Colors\\.Selection\\s*else -> Color\\.Transparent\\s*\\}'
          )
          fill_replacement = (
              "val fill = when {\\n"
              "        selected -> Color.White\\n"
              "        focused -> Color.White.copy(alpha = 0.10f)\\n"
              "        else -> Color.Transparent\\n"
              "    }"
          )
          shell, fill_count = fill_pattern.subn(fill_replacement, shell, count=1)
          if fill_count != 1 and "selected -> Color.White" not in shell:
              raise SystemExit("Fill semantics patch failed")
          
          shell = shell.replace(
              "tint = if (selected || focused) Tv2Colors.ContentPrimary else Tv2Colors.ContentSecondary,",
              "tint = when {\\n"
              "                selected -> Tv2Colors.Background\\n"
              "                focused -> Tv2Colors.ContentPrimary\\n"
              "                else -> Tv2Colors.ContentSecondary\\n"
              "            },",
              1
          )
          
          shell = shell.replace(
              "color = if (selected || focused) Tv2Colors.ContentPrimary else Tv2Colors.ContentSecondary,",
              "color = when {\\n"
              "                    selected -> Tv2Colors.Background\\n"
              "                    focused -> Tv2Colors.ContentPrimary\\n"
              "                    else -> Tv2Colors.ContentSecondary\\n"
              "                },",
              1
          )
          
          shell = shell.replace(
              "fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,",
              "fontWeight = if (selected || focused) FontWeight.SemiBold else FontWeight.Medium,",
              1
          )
          
          # Solid rail body while expanding to avoid transparent edge shimmer.
          shell = re.sub(
              r'(?ms)\\.background\\(\\s*Brush\\.horizontalGradient\\(\\s*listOf\\(\\s*Tv2Colors\\.Rail,\\s*Tv2Colors\\.Rail\\.copy\\(alpha = 0\\.96f\\),\\s*Color\\.Transparent\\s*\\)\\s*\\)\\s*\\)',
              '.background(Tv2Colors.Rail)',
              shell,
              count=1
          )
          
          # Add D-pad Right handoff.
          sig_old = "    onDestinationSelected: (String) -> Unit,\\n    content: @Composable () -> Unit"
          sig_new = "    onDestinationSelected: (String) -> Unit,\\n    onMoveRight: () -> Unit,\\n    content: @Composable () -> Unit"
          if sig_old in shell:
              shell = shell.replace(sig_old, sig_new, 1)
          
          call_old = (
              "                            expanded = railExpanded,\\n"
              "                            onFocus = { focused ->"
          )
          call_new = (
              "                            expanded = railExpanded,\\n"
              "                            onMoveRight = onMoveRight,\\n"
              "                            onFocus = { focused ->"
          )
          if call_old in shell:
              shell = shell.replace(call_old, call_new, 1)
          
          rail_sig_old = "    expanded: Boolean,\\n    onFocus: (Boolean) -> Unit,"
          rail_sig_new = "    expanded: Boolean,\\n    onMoveRight: () -> Unit,\\n    onFocus: (Boolean) -> Unit,"
          if rail_sig_old in shell:
              shell = shell.replace(rail_sig_old, rail_sig_new, 1)
          
          key_pattern = re.compile(
              r'(?ms)\\.onPreviewKeyEvent \\{ event ->\\s*'
              r'if \\(\\(event\\.key == Key\\.DirectionCenter \\|\\| event\\.key == Key\\.Enter\\) &&\\s*'
              r'event\\.type == KeyEventType\\.KeyDown\\s*\\) \\{\\s*'
              r'onClick\\(\\)\\s*true\\s*\\} else false\\s*\\}'
          )
          key_replacement = (
              ".onPreviewKeyEvent { event ->\\n"
              "                when {\\n"
              "                    event.type == KeyEventType.KeyDown && event.key == Key.DirectionRight -> {\\n"
              "                        onMoveRight()\\n"
              "                        true\\n"
              "                    }\\n"
              "                    (event.key == Key.DirectionCenter || event.key == Key.Enter) &&\\n"
              "                        event.type == KeyEventType.KeyDown -> {\\n"
              "                        onClick()\\n"
              "                        true\\n"
              "                    }\\n"
              "                    else -> false\\n"
              "                }\\n"
              "            }"
          )
          shell, key_count = key_pattern.subn(key_replacement, shell, count=1)
          if key_count != 1 and "Key.DirectionRight" not in shell:
              raise SystemExit("Right-navigation patch failed")
          
          for unused in (
              "import androidx.compose.animation.core.animateFloatAsState\\n",
              "import androidx.compose.foundation.border\\n",
              "import androidx.compose.ui.draw.scale\\n",
              "import androidx.compose.ui.graphics.Brush\\n",
          ):
              shell = shell.replace(unused, "")
          
          # MainShell content-focus token.
          state_anchor = "    var tv2RailExpanded by remember { mutableStateOf(false) }\\n"
          if "var tvContentFocusToken" not in app:
              if state_anchor not in app:
                  raise SystemExit("MainShell rail state anchor not found")
              app = app.replace(
                  state_anchor,
                  state_anchor + "    var tvContentFocusToken by remember { mutableIntStateOf(0) }\\n",
                  1
              )
          
          callback_old = (
              "        onDestinationSelected = { key ->\\n"
              "            MainSection.entries.firstOrNull { it.name == key }?.let(onSection)\\n"
              "        }\\n"
              "    ) {"
          )
          callback_new = (
              "        onDestinationSelected = { key ->\\n"
              "            MainSection.entries.firstOrNull { it.name == key }?.let(onSection)\\n"
              "        },\\n"
              "        onMoveRight = {\\n"
              "            tv2RailExpanded = false\\n"
              "            tvContentFocusToken += 1\\n"
              "        }\\n"
              "    ) {"
          )
          if callback_old in app:
              app = app.replace(callback_old, callback_new, 1)
          elif "onMoveRight = {" not in app:
              raise SystemExit("MainShell callback anchor not found")
          
          app = app.replace("        content(true)\\n", "        content(true, tvContentFocusToken)\\n", 1)
          
          required_shell = (
              "selected -> Color.White",
              "focused -> Color.White.copy(alpha = 0.10f)",
              "Key.DirectionRight",
              "onMoveRight = onMoveRight",
              "if (railExpanded)",
          )
          for token in required_shell:
              if token not in shell:
                  raise SystemExit(f"Missing patched shell token: {token}")
          
          if "content(true, tvContentFocusToken)" not in app:
              raise SystemExit("Content focus handoff not wired")
          
          if "Modifier.border(1.dp, Tv2Colors.FocusStroke" in shell:
              raise SystemExit("Thin white border still present")
          
          if ".scale(scale)" in shell:
              raise SystemExit("Scale glitch source still present")
          
          shell_path.write_text(shell, encoding="utf-8")
          app_path.write_text(app, encoding="utf-8")
          
          print("PASS: hide N logo when sidebar collapsed")
          print("PASS: remove thin white focus line")
          print("PASS: selected section owns white marker")
          print("PASS: reduce expansion glitch")
          print("PASS: D-pad Right hands focus to page/catalog")
          PY
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Safe repo cleanup
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-sidebar-r1"
          echo "SAFE REPO CLEANUP" > "$DIR/cleanup.log"

          candidates=(
            ".github/workflows/NuBrowse-M6-R2-workflow.yml"
            ".github/workflows/nustrim-m10-stage6-final-tv-polish-performance-qa-r1.yml"
            ".github/workflows/nustrim-m11-tv2-stage1-foundation.yml"
            ".github/workflows/nustrim-m11-tv2-updater-pipeline-repair.yml"
            ".github/workflows/nustrim-m11-tv2-updater-pipeline-repair-r1.yml"
            ".github/workflows/nustrim-m11-tv2-updater-pipeline-repair-r2.yml"
          )

          for file in "${candidates[@]}"; do
            if [[ -f "$file" ]]; then
              rm -f "$file"
              echo "REMOVED: $file" >> "$DIR/cleanup.log"
            fi
          done

          test -f .github/workflows/build.yml
          echo "PRESERVED: .github/workflows/build.yml" >> "$DIR/cleanup.log"
          echo "GUARD: no app/src file deleted by cleanup" >> "$DIR/cleanup.log"
          cat "$DIR/cleanup.log"

      - name: Advance RC8 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r1/metadata.log"
          from pathlib import Path
          import os
          import re
          
          target = os.environ["TV2_VERSION"]
          gradle_path = Path("app/build.gradle.kts")
          gradle = gradle_path.read_text(encoding="utf-8")
          
          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          if not code_match or not name_match:
              raise SystemExit("Version metadata not found")
          
          old_code = int(code_match.group(1))
          old_name = name_match.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          gradle = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', gradle, count=1)
          gradle = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', gradle, count=1)
          gradle_path.write_text(gradle, encoding="utf-8")
          Path(".nustrim-version").write_text(target + "\n", encoding="utf-8")
          
          marker = Path(".nustrim-tv2")
          lines = marker.read_text(encoding="utf-8").splitlines()
          updated = []
          seen = False
          for line in lines:
              if line.startswith("stage="):
                  updated.append("stage=8")
                  seen = True
              else:
                  updated.append(line)
          if not seen:
              updated.append("stage=8")
          marker.write_text("\n".join(updated) + "\n", encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          print("TV2 marker advanced to stage=8")
          PY

      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv2/shell/NustrimTv2Shell.kt"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          LOG="$RUNNER_TEMP/nustrim-sidebar-r1/audit.txt"

          grep -q 'selected -> Color.White' "$SHELL"
          grep -q 'focused -> Color.White.copy(alpha = 0.10f)' "$SHELL"
          grep -q 'Key.DirectionRight' "$SHELL"
          grep -q 'content(true, tvContentFocusToken)' "$APP"
          ! grep -q 'Modifier.border(1.dp, Tv2Colors.FocusStroke' "$SHELL"
          ! grep -q '\.scale(scale)' "$SHELL"
          test -f .github/workflows/build.yml

          if grep -R -n -E 'NuBrowse|NuBrowseApp|app\.nubrowse' app/src/main app/build.gradle.kts 2>/dev/null; then
            echo "::error::NuBrowse runtime contamination detected."
            exit 1
          fi

          git diff --check
          {
            echo "PASS: sidebar audit"
            git status --short
            git diff --stat
          } > "$LOG"
          cat "$LOG"
          git diff > "$RUNNER_TEMP/nustrim-sidebar-r1/sidebar-fix.patch"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r1/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-sidebar-r1/push.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix(tv2): correct sidebar behavior and clean obsolete workflows"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true \
            2>&1 | tee "$RUNNER_TEMP/nustrim-sidebar-r1/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-sidebar-r1"
          echo "========== Nustrim TV2 Sidebar Fix 1 R1 Summary =========="
          echo "Result: FAILED"
          cat .nustrim-tv2 2>/dev/null || true
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in preflight.txt patch.log cleanup.log metadata.log audit.txt push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 45 "$DIR/$file"
            fi
          done

          if [[ -f "$DIR/compile.log" ]]; then
            echo
            echo "[compile result]"
            grep -E 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)' \
              "$DIR/compile.log" | tail -n 60 || true
          fi

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv2-sidebar-fix-1-r1-diagnose
          path: ${{ runner.temp }}/nustrim-sidebar-r1
          if-no-files-found: ignore
          retention-days: 7
