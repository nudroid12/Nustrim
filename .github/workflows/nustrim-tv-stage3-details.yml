      - name: Stage 3 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/nustrim-tv-stage3"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"

          echo "AUDIT VERSION: TV-STAGE3-DETAILS-R1"

          test -f "$DETAILS"
          grep -q 'fun TvDetailsScreen(' "$DETAILS"
          grep -q 'session.loadDetails(' "$DETAILS"
          grep -q 'selectedSeason' "$DETAILS"
          grep -q 'TvEpisodeCard(' "$DETAILS"
          grep -q 'TvSourcesStage4Preview(' "$DETAILS"
          grep -q 'Loading details...' "$DETAILS"
          grep -q 'Loading and ranking will be connected' "$DETAILS" ||             grep -q 'Stream loading and ranking will be connected' "$DETAILS"

          grep -q 'onContentFocused: (TvHomeEntry, FocusRequester) -> Unit' "$HOME"
          grep -q 'lastHomeFocusRequester' "$SHELL"
          grep -q 'closeDetailsAndRestoreHome' "$SHELL"
          grep -q 'openedDetailsEntry' "$SHELL"
          grep -q 'TvDetailsScreen(' "$SHELL"

          if grep -R -n -E             'import[[:space:]]+app\.nudroidlabs\.nustrim\.ui\.|NustrimApp|MobileNavItem'             app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::TV presentation imported or reused Mobile UI."
            exit 1
          fi

          if grep -R -n -E             'tv2|tv3|NustrimTv2|NustrimTv3|Tv2[A-Za-z0-9_]*|Tv3[A-Za-z0-9_]*'             app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::Old TV generation naming detected."
            exit 1
          fi

          cmp "$DIR/NustrimApp.before.kt" "$APP"
          cmp "$DIR/UiPreferences.before.kt" "$PREFS"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          git diff --check

          {
            echo "PASS: Details uses SourceSession.loadDetails core contract"
            echo "PASS: season-aware episode UI present"
            echo "PASS: source modal appears immediately before Stage 4 implementation"
            echo "PASS: Home remains composed behind Details"
            echo "PASS: origin Home FocusRequester restoration wired"
            echo "PASS: Mobile NustrimApp byte-identical"
            echo "PASS: UiPreferences byte-identical"
            echo "PASS: updater/build workflow byte-identical"
            echo
            git status --short
            git diff --stat
          } > "$DIR/audit.txt"

          cat "$DIR/audit.txt"
          git diff > "$DIR/stage3.patch"

      - name: Compile Stage 3
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage3/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Assemble Stage 3
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage3/assemble.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Advance Stage 3 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          target = os.environ["STAGE_VERSION"]
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Version metadata missing")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1
          )
          path.write_text(text, encoding="utf-8")
          
          Path(".nustrim-tv").write_text(
              "generation=fresh\n"
              "stage=3\n"
              "namespace=tv\n"
              "reference=NuvioTV\n"
              "details=full-screen-overlay\n"
              "episodes=season-aware\n"
              "sources=stage4-preview-modal\n"
              "home-focus=restore-origin-card\n"
              "mobile=protected\n"
              "updater=protected\n",
              encoding="utf-8"
          )
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Final assemble after version update
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage3/final-assemble.log"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nustrim-tv-stage3/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "TV Stage 3 already applied."
          else
            git commit -m "feat(tv): build TV details and episode experience"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true             2>&1 | tee "$RUNNER_TEMP/nustrim-tv-stage3/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/nustrim-tv-stage3"

          echo "========== Nustrim TV Stage 3 Details =========="
          echo "Result: FAILED"
          echo "SHA: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
          grep -m1 'versionName' app/build.gradle.kts 2>/dev/null || true

          for file in preflight.txt audit.txt push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 160 "$DIR/$file" || true
            fi
          done

          for file in compile.log assemble.log final-assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file result]"
              grep -E                 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)'                 "$DIR/$file" | tail -n 190 || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage3-details-diagnose
          path: ${{ runner.temp }}/nustrim-tv-stage3
          if-no-files-found: ignore
          retention-days: 7
