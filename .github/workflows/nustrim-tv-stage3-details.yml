ier = Modifier.padding(\n                horizontal = 9.dp,\n                vertical = 5.dp\n            )\n        )\n    }\n}\n\n@Composable\nprivate fun TvDetailsActionButton(\n    label: String,\n    focusRequester: FocusRequester,\n    onFocused: (FocusRequester) -> Unit,\n    onClick: () -> Unit\n) {\n    var focused by remember { mutableStateOf(false) }\n\n    Surface(\n        modifier = Modifier\n            .height(46.dp)\n            .focusRequester(focusRequester)\n            .onFocusChanged {\n                focused = it.hasFocus\n                if (it.hasFocus) onFocused(focusRequester)\n            }\n            .onPreviewKeyEvent { event ->\n                if (\n                    event.type == KeyEventType.KeyDown &&\n                    (\n                        event.key == Key.DirectionCenter ||\n                            event.key == Key.Enter\n                        )\n                ) {\n                    onClick()\n                    true\n                } else {\n                    false\n                }\n            }\n            .focusable(),\n        color = if (focused) {\n            TvColors.FocusRing\n        } else {\n            TvColors.SurfaceVariant\n        },\n        shape = RoundedCornerShape(10.dp),\n        border = BorderStroke(\n            1.dp,\n            if (focused) {\n                TvColors.FocusRing\n            } else {\n                Color.White.copy(alpha = 0.10f)\n            }\n        )\n    ) {\n        Row(\n            modifier = Modifier.padding(horizontal = 17.dp),\n            horizontalArrangement = Arrangement.spacedBy(8.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(\n                imageVector = Icons.Outlined.PlayArrow,\n                contentDescription = null,\n                tint = if (focused) TvColors.Background else TvColors.TextPrimary,\n                modifier = Modifier.size(19.dp)\n            )\n            Text(\n                text = label,\n                color = if (focused) TvColors.Background else TvColors.TextPrimary,\n                fontWeight = FontWeight.SemiBold,\n                fontSize = 14.sp\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun TvSeasonChip(\n    season: Int,\n    selected: Boolean,\n    onFocused: (FocusRequester) -> Unit,\n    onClick: () -> Unit\n) {\n    var focused by remember { mutableStateOf(false) }\n    val requester = remember(season) { FocusRequester() }\n\n    Surface(\n        modifier = Modifier\n            .height(38.dp)\n            .focusRequester(requester)\n            .onFocusChanged {\n                focused = it.hasFocus\n                if (it.hasFocus) onFocused(requester)\n            }\n            .onPreviewKeyEvent { event ->\n                if (\n                    event.type == KeyEventType.KeyDown &&\n                    (\n                        event.key == Key.DirectionCenter ||\n                            event.key == Key.Enter\n                        )\n                ) {\n                    onClick()\n                    true\n                } else {\n                    false\n                }\n            }\n            .focusable(),\n        color = when {\n            focused -> TvColors.FocusRing\n            selected -> TvColors.Accent.copy(alpha = 0.82f)\n            else -> TvColors.SurfaceVariant\n        },\n        shape = RoundedCornerShape(9.dp),\n        border = BorderStroke(\n            1.dp,\n            if (focused || selected) {\n                Color.White.copy(alpha = 0.52f)\n            } else {\n                Color.White.copy(alpha = 0.08f)\n            }\n        )\n    ) {\n        Box(\n            modifier = Modifier.padding(horizontal = 14.dp),\n            contentAlignment = Alignment.Center\n        ) {\n            Text(\n                text = "Season $season",\n                color = if (focused) TvColors.Background else TvColors.TextPrimary,\n                fontSize = 13.sp,\n                fontWeight = if (focused || selected) {\n                    FontWeight.SemiBold\n                } else {\n                    FontWeight.Normal\n                }\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun TvEpisodeCard(\n    episode: MediaEpisode,\n    onFocused: (FocusRequester) -> Unit,\n    onClick: () -> Unit\n) {\n    var focused by remember { mutableStateOf(false) }\n    val requester = remember(\n        episode.id,\n        episode.season,\n        episode.episode\n    ) { FocusRequester() }\n    val scale by animateFloatAsState(\n        targetValue = if (focused) 1.035f else 1f,\n        label = "episodeScale"\n    )\n\n    Surface(\n        modifier = Modifier\n            .width(278.dp)\n            .height(154.dp)\n            .graphicsLayer {\n                scaleX = scale\n                scaleY = scale\n            }\n            .focusRequester(requester)\n            .onFocusChanged {\n                focused = it.hasFocus\n                if (it.hasFocus) onFocused(requester)\n            }\n            .onPreviewKeyEvent { event ->\n                if (\n                    event.type == KeyEventType.KeyDown &&\n                    (\n                        event.key == Key.DirectionCenter ||\n                            event.key == Key.Enter\n                        )\n                ) {\n                    onClick()\n                    true\n                } else {\n                    false\n                }\n            }\n            .focusable(),\n        color = TvColors.Surface,\n        shape = RoundedCornerShape(11.dp),\n        border = BorderStroke(\n            if (focused) 2.dp else 1.dp,\n            if (focused) {\n                TvColors.FocusRing\n            } else {\n                Color.White.copy(alpha = 0.08f)\n            }\n        )\n    ) {\n        Box(modifier = Modifier.fillMaxSize()) {\n            if (episode.thumbnailUrl.isNotBlank()) {\n                AsyncImage(\n                    model = episode.thumbnailUrl,\n                    contentDescription = episode.displayTitle,\n                    modifier = Modifier.fillMaxSize(),\n                    contentScale = ContentScale.Crop\n                )\n            }\n\n            Box(\n                modifier = Modifier\n                    .fillMaxSize()\n                    .background(\n                        Brush.verticalGradient(\n                            listOf(\n                                Color.Transparent,\n                                Color.Transparent,\n                                TvColors.Background.copy(alpha = 0.96f)\n                            )\n                        )\n                    )\n            )\n\n            Column(\n                modifier = Modifier\n                    .align(Alignment.BottomStart)\n                    .padding(11.dp),\n                verticalArrangement = Arrangement.spacedBy(3.dp)\n            ) {\n                Text(\n                    text = episode.displayTitle,\n                    color = TvColors.TextPrimary,\n                    fontWeight = FontWeight.SemiBold,\n                    fontSize = 13.sp,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis\n                )\n\n                episode.overview\n                    .takeIf { it.isNotBlank() }\n                    ?.let {\n                        Text(\n                            text = it,\n                            color = TvColors.TextSecondary,\n                            fontSize = 11.sp,\n                            maxLines = 1,\n                            overflow = TextOverflow.Ellipsis\n                        )\n                    }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun TvSourcesStage4Preview(\n    request: TvSourcePreviewRequest,\n    onClose: () -> Unit,\n    onRestoreFocus: () -> Unit,\n    modifier: Modifier = M