r = TvColors.TextPrimary.copy(alpha = 0.76f),\n                            fontSize = 14.sp,\n                            lineHeight = 19.sp,\n                            maxLines = 4,\n                            overflow = TextOverflow.Ellipsis\n                        )\n                    }\n\n                if (errorMessage != null) {\n                    Surface(\n                        color = TvColors.BackgroundElevated.copy(alpha = 0.92f),\n                        shape = RoundedCornerShape(10.dp),\n                        border = BorderStroke(\n                            1.dp,\n                            Color.White.copy(alpha = 0.10f)\n                        )\n                    ) {\n                        Row(\n                            modifier = Modifier.padding(\n                                horizontal = 12.dp,\n                                vertical = 8.dp\n                            ),\n                            horizontalArrangement = Arrangement.spacedBy(8.dp),\n                            verticalAlignment = Alignment.CenterVertically\n                        ) {\n                            Icon(\n                                imageVector = Icons.Outlined.Info,\n                                contentDescription = null,\n                                tint = TvColors.TextSecondary,\n                                modifier = Modifier.size(17.dp)\n                            )\n                            Text(\n                                text = errorMessage.orEmpty(),\n                                color = TvColors.TextSecondary,\n                                fontSize = 12.sp,\n                                maxLines = 2,\n                                overflow = TextOverflow.Ellipsis\n                            )\n                        }\n                    }\n                }\n\n                Row(\n                    horizontalArrangement = Arrangement.spacedBy(10.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    TvDetailsActionButton(\n                        label = if (entry.continueEntry != null) "Resume" else "Play",\n                        focusRequester = firstActionRequester,\n                        onFocused = { lastDetailsRequester = it },\n                        onClick = {\n                            openSources(\n                                if (isSeries) primaryEpisode else null\n                            )\n                        }\n                    )\n                }\n\n                if (seasons.isNotEmpty()) {\n                    Spacer(Modifier.height(2.dp))\n                    Text(\n                        text = "Seasons",\n                        color = TvColors.TextPrimary,\n                        fontWeight = FontWeight.SemiBold,\n                        fontSize = 18.sp\n                    )\n\n                    LazyRow(\n                        horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        contentPadding = PaddingValues(end = 18.dp)\n                    ) {\n                        itemsIndexed(\n                            items = seasons,\n                            key = { _, season -> season }\n                        ) { _, season ->\n                            TvSeasonChip(\n                                season = season,\n                                selected = season == selectedSeason,\n                                onFocused = { lastDetailsRequester = it },\n                                onClick = {\n                                    selectedSeason = season\n                                }\n                            )\n                        }\n                    }\n                }\n\n                if (sortedEpisodes.isNotEmpty()) {\n                    Text(\n                        text = if (selectedSeason != null) {\n                            "Episodes · Season $selectedSeason"\n                        } else {\n                            "Episodes"\n                        },\n                        color = TvColors.TextPrimary,\n                        fontWeight = FontWeight.SemiBold,\n                        fontSize = 18.sp\n                    )\n\n                    LazyRow(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(12.dp),\n                        contentPadding = PaddingValues(\n                            end = 32.dp,\n                            bottom = 10.dp\n                        )\n                    ) {\n                        itemsIndexed(\n                            items = visibleEpisodes,\n                            key = { index, episode ->\n                                "${episode.id}|${episode.season}|${episode.episode}|$index"\n                            }\n                        ) { _, episode ->\n                            TvEpisodeCard(\n                                episode = episode,\n                                onFocused = { lastDetailsRequester = it },\n                                onClick = {\n                                    openSources(episode)\n                                }\n                            )\n                        }\n                    }\n                }\n            }\n        }\n\n        if (loading) {\n            Surface(\n                modifier = Modifier.align(Alignment.Center),\n                color = TvColors.BackgroundElevated.copy(alpha = 0.96f),\n                shape = RoundedCornerShape(16.dp),\n                border = BorderStroke(\n                    1.dp,\n                    Color.White.copy(alpha = 0.10f)\n                )\n            ) {\n                Row(\n                    modifier = Modifier.padding(\n                        horizontal = 20.dp,\n                        vertical = 14.dp\n                    ),\n                    horizontalArrangement = Arrangement.spacedBy(11.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    CircularProgressIndicator(\n                        modifier = Modifier.size(21.dp),\n                        strokeWidth = 2.dp\n                    )\n                    Text(\n                        text = "Loading details...",\n                        color = TvColors.TextSecondary,\n                        fontSize = 14.sp\n                    )\n                }\n            }\n        }\n\n        sourcePreview?.let { request ->\n            TvSourcesStage4Preview(\n                request = request,\n                onClose = {\n                    sourcePreview = null\n                },\n                onRestoreFocus = {\n                    lastDetailsRequester?.let { requester ->\n                        runCatching { requester.requestFocus() }\n                    }\n                },\n                modifier = Modifier\n                    .fillMaxSize()\n                    .zIndex(30f)\n            )\n        }\n    }\n\n    LaunchedEffect(entry.stableKey) {\n        delay(70)\n        runCatching { firstActionRequester.requestFocus() }\n    }\n}\n\n@Composable\nprivate fun TvDetailsBackdrop(\n    item: MediaItem,\n    modifier: Modifier = Modifier\n) {\n    val image = item.backgroundUrl\n        .takeIf { it.isNotBlank() }\n        ?: item.posterUrl\n\n    Box(modifier = modifier) {\n        if (image.isNotBlank()) {\n            AsyncImage(\n                model = image,\n                contentDescription = item.title,\n                modifier = Modifier.fillMaxSize(),\n                contentScale = ContentScale.Crop\n            )\n        }\n\n        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .background(\n                    Brush.horizontalGradient(\n                        colorStops = arrayOf(\n                            0.00f to TvCol