name: Nustrim TV Cleanroom S3 Episodes V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanroom-s3-episodes-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Guard known baseline
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/.*versionName = "\([^" ]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          echo "Current version: $current"
          case "$current" in
            0.45.0-tv-v3.5-library-core|0.46.0-tv-cleanroom-s1|0.47.0-tv-cleanroom-s2-home|0.48.0-tv-cleanroom-s3-episodes|0.48.1-tv-cleanroom-s3.1-media-handoff)
              ;;
            *)
              echo "Unexpected baseline. Re-audit before applying S3 V2."
              exit 20
              ;;
          esac

      - name: Replace TV tree with clean-room S1 plus S2 plus corrected S3
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil

          files = {
              'app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/common/TvFoundationScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeAuditEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeAuditScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeCatalogueBuilder.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRegistry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/focus/TvFocusRestoreEffect.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeHero.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvBackPolicy.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvNavigator.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvRoute.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/NustrimTvTheme.kt': '',
              'app/src/main/java/app/nudroidlabs/nustrim/tv/theme/TvTokens.kt': '',
          }

          tv_root = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          if tv_root.exists():
              shutil.rmtree(tv_root)

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          build_file = Path("app/build.gradle.kts")
          build = build_file.read_text()
          build = re.sub(
              r"versionCode = (\d+)",
              lambda m: f"versionCode = {max(int(m.group(1)) + 1, 103)}",
              build,
              count=1,
          )
          build = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "0.48.1-tv-cleanroom-s3.1-media-handoff"',
              build,
              count=1,
          )
          build_file.write_text(build)

          Path(".nustrim-version").write_text("0.48.1-tv-cleanroom-s3.1-media-handoff\n")
          Path(".nustrim-tv").write_text(
              "generation=cleanroom-v1\n"
              "reference=nuvio-tv-0.8.6-beta\n"
              "subsystem=3.1-episode-media-handoff\n"
              "status=build-candidate\n"
              "preserve=source-provider-engine,stream-resolver,playback-engine,mobile-ui\n"
              "episode-identity=provider-id-primary\n"
              "episode-coordinate-inference=disabled\n"
              "episode-slot-collisions=retained\n"
              "provider-media-ref=preserved-end-to-end\n"
              "legacy-episode-engine=unused-by-cleanroom-tv\n"
              "details=temporary-episode-domain-qa\n"
          )
          PY

      - name: Verify patch boundaries and S3 V2 invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf "%s\n" "$changed"
          forbidden="$(printf "%s\n" "$changed" | grep -E '^app/src/main/java/app/nudroidlabs/nustrim/(core|features|ui)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Protected source changed unexpectedly:"
            printf "%s\n" "$forbidden"
            exit 21
          fi
          if grep -R -n "EpisodeEngine" app/src/main/java/app/nudroidlabs/nustrim/tv; then
            echo "Legacy EpisodeEngine leaked into clean-room TV."
            exit 22
          fi
          if grep -R -n "Regex(" app/src/main/java/app/nudroidlabs/nustrim/tv/episode; then
            echo "Episode coordinate regex inference is forbidden in S3."
            exit 23
          fi
          grep -R -n "val media: MediaItem" app/src/main/java/app/nudroidlabs/nustrim/tv/navigation/TvRoute.kt >/dev/null
          grep -R -n "loadDetails(session, route.media)" app/src/main/java/app/nudroidlabs/nustrim/tv/episode/TvEpisodeRepository.kt >/dev/null
          if grep -R -n "mediaId = media.item.id" app/src/main/java/app/nudroidlabs/nustrim/tv; then
            echo "Stripped Home to Details media handoff returned."
            exit 24
          fi

      - name: Compile and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee tv-s3-episodes-v2-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s3-episodes-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s3-episodes-v2-build-log
          path: tv-s3-episodes-v2-build.log
          if-no-files-found: ignore

      - name: Commit only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nustrim-version .nustrim-tv app/build.gradle.kts app/src/main/java/app/nudroidlabs/nustrim/tv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "TV cleanroom S3.1 preserve provider media handoff [skip ci]"
          git push origin HEAD:main
