      - name: Bump V2.3 P2 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")
          if code.group(1) != "75" or name.group(1) != "0.28.1-tv-v2.3-nuvio-player-p1":
              raise SystemExit(
                  f"Unexpected version before bump: {name.group(1)} ({code.group(1)})"
              )

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 76',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.28.2-tv-v2.3-nuvio-player-p2"',
              text,
              count=1,
          )
          animation_dependency = '    implementation("androidx.compose.animation:animation")\n'
          if 'implementation("androidx.compose.animation:animation")' not in text:
              anchor = '    implementation("androidx.compose.foundation:foundation")\n'
              if anchor not in text:
                  raise SystemExit("Cannot locate Compose foundation dependency anchor")
              text = text.replace(anchor, anchor + animation_dependency, 1)
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify Player P2 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 76' app/build.gradle.kts
          grep -q 'versionName = "0.28.2-tv-v2.3-nuvio-player-p2"' app/build.gradle.kts
          grep -q 'implementation("androidx.compose.animation:animation")' app/build.gradle.kts

          # Preserve resume, progress, speed and aspect features from earlier stages.
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'fun reportProgress(' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"

          # P2 visual motion and seek-only overlay contract.
          grep -q 'import androidx.compose.animation.AnimatedVisibility' "$PLAYER"
          grep -q 'enter = fadeIn(animationSpec = tween(200))' "$PLAYER"
          grep -q 'height(150.dp)' "$PLAYER"
          grep -q 'height(200.dp)' "$PLAYER"
          grep -q 'slideInHorizontally(' "$PLAYER"
          grep -q 'animateFloatAsState(' "$PLAYER"
          grep -q 'animateDpAsState(' "$PLAYER"
          grep -q 'fun previewSeekBy(deltaMs: Long)' "$PLAYER"
          grep -q 'private fun TvPlayerSeekOverlay(' "$PLAYER"
          grep -q 'visible = seekOverlayVisible && !controlsVisible' "$PLAYER"
          grep -q 'delay(240)' "$PLAYER"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p2"
          mkdir -p "$D"
          gradle --no-daemon --build-cache \
            :app:compileDebugKotlin \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$D/compile.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p2"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/player-p2.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P2
          =================================
          Baseline: 0.28.1-tv-v2.3-nuvio-player-p1 (75)
          Target:   0.28.2-tv-v2.3-nuvio-player-p2 (76)

          Player changes:
          - 200 ms fade in/out for the full controls overlay
          - separate 150 dp top and 200 dp bottom gradients like Nuvio's hierarchy
          - focus request waits until the controls transition has settled
          - played and buffered progress animate smoothly
          - progress height animates on TV focus
          - hidden Left/Right seek keeps the full controls hidden
          - hidden seek shows a compact bottom progress + time overlay
          - More actions slide and fade horizontally
          - V2.2 resume/progress hooks preserved
          - P1 speed, aspect, audio, subtitles, sources and next episode preserved
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.3 Nuvio player polish pass 2'
          git push origin HEAD:main

      - name: Dispatch signed updater release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --ref main \
            -f publish_release=true \
            -f prepare_clean_bridge=false
          echo "Build Nustrim Clean dispatched with publish_release=true."

      - name: Write already-applied summary
        if: steps.preflight.outputs.already_applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p2"
          mkdir -p "$D"
          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.3 Nuvio Player P2 is already applied exactly.
          No source files were changed by this run.
          The signed updater release workflow was dispatched again.
          EOF

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v23-player-p2"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.3-nuvio-player-p2-diagnose
          path: ${{ runner.temp }}/nustrim-v23-player-p2
          if-no-files-found: warn
          retention-days: 14
