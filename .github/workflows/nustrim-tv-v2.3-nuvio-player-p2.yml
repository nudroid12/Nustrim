name: Nustrim TV V2.3 Nuvio Player P2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-3-nuvio-player-p2
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.28.1-tv-v2.3-nuvio-player-p1"
  BASE_VERSION_CODE: "75"
  TARGET_VERSION_NAME: "0.28.2-tv-v2.3-nuvio-player-p2"
  TARGET_VERSION_CODE: "76"
  BASE_PLAYER_SHA256: "e1bd6649b52fcf3800c1d66a85d2423937262ee349c13fe9eae1cb295f36f4ec"
  TARGET_PLAYER_SHA256: "b364a4a078dcef2d0b0440ca835442a37191978ed37fb228e33c6e60e6daf5e7"

jobs:
  player_p2:
    name: Patch, compile, commit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact live preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          BUILD="app/build.gradle.kts"
          test -f "$PLAYER"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          player_sha="$(sha256sum "$PLAYER" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Live player SHA-256: $player_sha"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$name" = "$TARGET_VERSION_NAME" ] && \
             [ "$code" = "$TARGET_VERSION_CODE" ] && \
             [ "$player_sha" = "$TARGET_PLAYER_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "V2.3 Player P2 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$player_sha" != "$BASE_PLAYER_SHA256" ]; then
            echo "::error::TvPlayerScreen.kt drifted from the checked live P1 baseline."
            echo "expected=$BASE_PLAYER_SHA256"
            echo "actual=$player_sha"
            exit 21
          fi

          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v23-player-p2"
          mkdir -p "$D"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          git rev-parse HEAD > "$D/base-commit.txt"

      - name: Write Nuvio Player P2 source
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
