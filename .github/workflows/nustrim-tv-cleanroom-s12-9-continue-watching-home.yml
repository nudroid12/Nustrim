name: Nustrim TV Cleanroom S12.9 Continue Watching Home Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-9-continue-watching-home
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.8-tv-cleanroom-s12.9-continue-watching-home"
  TARGET_VERSION_CODE: "131"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.8 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.7-tv-cleanroom-s12.8-repo-cleanup"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.9 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.9-continue-watching-home' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-9-continue-watching-home.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify S12.9 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt",
              "scripts/verify_tv_continue_watching_home_s12_9.py",
              "scripts/verify_tv_parity_s11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.9 changed files outside Continue Watching boundary: " + ", ".join(unexpected))
          expected_hashes = {
              ".nustrim-tv": "7a224746c94cbec5570943ecf6e54b1f0ae0bc781b5dc64fa40e536e6ba456c4",
              ".nustrim-version": "b0497bfc447f036abf24e18cb2ecb5b00b77c7f2150d812eebb26d2e8c3c1582",
              "app/build.gradle.kts": "0715199bfbe5bfb7fbe623c766dad796676b53b91d0608b008fff4aa78af53d5",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt": "a51f19661fcc463bdd5e970700863921f7376fe7df7386ec6d5bb3650993498b",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt": "3a83e3f0d04391d3ee944f8ef2fa361343ed6b9b55ec2f50cbe2887c51e47fc6",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt": "563e4e66dfcb24d7b75fcb1da3cbe636e1095ea6c8f1cfadd33ba544ff5072ca",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt": "b62dd40901704b5fee42e5ecd868ffccf87f0b6c33a6a45f20b5e0af0afc4ad6",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryModels.kt": "f6c18903987ef8cd815ef751306d147108b48c10c2b77a9d4ec1d063ef30e5d4",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt": "8a9341c08deed3fa52fe1bfd519752fd46cf34ecad8e490a2f703f5b04b02548",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt": "1f8726053dd890ebc3719b290313fc7fbfda4498a669eed025adfb47c8424715",
              "scripts/verify_tv_continue_watching_home_s12_9.py": "be17e77e3f917c051df75e69b1ba709785e48c4b8a4a9573040eceaeb1efe4c3",
              "scripts/verify_tv_parity_s11.py": "cb9c50f606aafae4daf3b0dac35bf67ed9e17d69de1df544bffa6c58aaeea671",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.9 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_continue_watching_home_s12_9.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-9-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-9-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-9-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and S12.9 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.9 moves Continue Watching to the first Home row with landscape progress cards and keeps Library focused on Saved titles.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.9 Continue Watching Home",
              "issue": "S12-CW-HOME-01",
              "status": "build-verified",
              "staticContracts": "23/23",
              "parityContracts": "40/40",
              "scope": [
                  "Continue Watching first Home row",
                  "landscape progress cards",
                  "Details-backed Sources and resume route",
                  "Saved-only Library"
              ],
              "preserved": ["Home catalogues", "Home focus restoration", "Search", "Details", "Player", "provider engine", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "keep version code 130 installed and use the TV updater to install version code 131",
                  "play a movie or episode for more than 15 seconds and return Home",
                  "confirm Continue Watching is the first row with progress or episode information",
                  "press OK on its card and confirm Sources opens, then playback resumes from stored progress",
                  "return from playback and confirm the Details and Home back stack remains usable",
                  "confirm the exact Continue Watching card regains focus after returning Home",
                  "open Library and confirm it contains Saved only",
              ],
              "nextBacklog": "Device acceptance followed by final measured parity audit",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-continue-watching-home-s12-9-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.9 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRows.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt \
            scripts/verify_tv_continue_watching_home_s12_9.py \
            scripts/verify_tv_parity_s11.py
          if git diff --cached --quiet; then
            echo "S12.9 source is already committed."
          else
            git commit -m "Move Continue Watching to Home S12.9 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-9-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.9 moves Continue Watching from Library to the first Home row, aligned with the locked Nuvio reference." "" \
            "Cards use a landscape layout with progress and episode information. Selecting a card opens the existing Sources flow and retains the Details-backed return stack." "" \
            "Library now contains Saved titles only. Provider, resolver, playback and Mobile UI engines are preserved." "" \
            "Device acceptance remains required before the final parity score can be claimed." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-continue-watching-home-s12-9-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-9-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-continue-watching-home-s12-9-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-continue-watching-home-s12-9-report.json").read_text())
          if report.get("issue") != "S12-CW-HOME-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.9 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-9-continue-watching-home-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-continue-watching-home-s12-9-report.json
            ${{ runner.temp }}/nustrim-s12-9-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-9-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-9-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-9-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-continue-watching-home-s12-9-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-9-continue-watching-home-diagnose
          path: ${{ runner.temp }}/nustrim-s12-9-diagnose
          if-no-files-found: warn
          retention-days: 7
