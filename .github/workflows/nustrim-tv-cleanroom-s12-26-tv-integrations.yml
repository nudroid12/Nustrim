name: Nustrim TV Cleanroom S12.26 TV Integrations Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-26-tv-integrations
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.25-tv-cleanroom-s12.26-tv-integrations"
  TARGET_VERSION_CODE: "148"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.25 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.24-tv-cleanroom-s12.25-cloudstream-links-fix"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.26 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.26-tv-integrations' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-26-tv-integrations.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt",
              "scripts/verify_tv_integrations_s12_26.py",
              "scripts/verify_tv_cloudstream_links_s12_25.py",
              "scripts/verify_tv_sidebar_clean_s12_24.py",
              "scripts/verify_tv_player_episodes_s12_23.py",
              "scripts/verify_tv_branding_s12_22.py",
              "scripts/verify_tv_subtitle_language_split_s12_21.py",
              "scripts/verify_tv_cloudstream_tv_s12_20.py",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.26 changed files outside TV integrations boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "8b4e9029d937327527370eeec38be285189410996d0a0229888f84c7b2b8f4bd",
              ".nustrim-version": "1f7662a372734e66b76d900b07a129d8dd395c46fb4a0590544225cc896e285a",
              "app/build.gradle.kts": "a038a52a52ca7f7f08b0e1d28f11cbc086df415d3476888cf7b33c17b8df7337",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsEntry.kt": "d6a52292dd814c7f33a4ed934e696e7b5807122e626097a3b314f9f6d7beb22c",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsModels.kt": "7f97df534b008074a97861db4750636d8cef4cbfe3843e32018e98f007fdc09d",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt": "ba281e65d044db4b8d51914e5393a8ccb0a502f39ace640542302a3d57cebdfd",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt": "0535daffa9fd0c45fdcb11d85d5eb84c0b88b2390d2a677c55b60a1d3c626edb",
              "scripts/verify_tv_integrations_s12_26.py": "c4404c3625b26902d49c5c4e0f6652389bdec07cb56729c6c899dc0021eaa199",
              "scripts/verify_tv_cloudstream_links_s12_25.py": "ffa7b915f244cee123e84ca8c3c702984c87d7e72314dbf293a3e317ebcd6925",
              "scripts/verify_tv_sidebar_clean_s12_24.py": "fc02703d2f2cb6aea288fb72ac26ecd64514193b376667b981dadbdbb6b4641c",
              "scripts/verify_tv_player_episodes_s12_23.py": "8498419946ee79ecc1b9c78e830fb6f129fb08ce654f0fdbfd76c644b3822dff",
              "scripts/verify_tv_branding_s12_22.py": "bba52cc8e4ba91b44ed1659d26887b7bbd5e07238e68430fffafbe921155f693",
              "scripts/verify_tv_subtitle_language_split_s12_21.py": "8cf7fa390f3790fa408d22c3429f9e543a54016f3652f3235bb3fdff66ab393b",
              "scripts/verify_tv_cloudstream_tv_s12_20.py": "00e2a32d34c39887784a57f86fe055d8e5dce97166a34d029fffca45eac6e07d",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "9534aa80574d14315c28e6f66645e44c181ae762ef562abc5af4755622d303e7",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "f2fd5b5d169706ab338be3595e5fe973da577ff50cf78fbe66b4ef0eef7709e3",
              "scripts/verify_tv_episode_titles_s12_17.py": "074ff4280b8e5354e3a503fe7e523cb4e88f8506580e8f04e332eef49e494f8e",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "5c10917bbde7bfbbda47ebd1c382f848781b5eeb2dfe8286761679795f353de6",
              "scripts/verify_tv_settings_parity_s12_11.py": "49b2504af85bc0035305e18891d8eed2f510265e62536664a72aab0b3e7bc938",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.26 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_integrations_s12_26.py
          python3 scripts/verify_tv_cloudstream_links_s12_25.py
          python3 scripts/verify_tv_sidebar_clean_s12_24.py
          python3 scripts/verify_tv_player_episodes_s12_23.py
          python3 scripts/verify_tv_branding_s12_22.py
          python3 scripts/verify_tv_subtitle_language_split_s12_21.py
          python3 scripts/verify_tv_cloudstream_tv_s12_20.py
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-26-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-26-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-26-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.26 connects configured TMDB metadata and selected MDBList ratings to TV Details without changing source playback identity.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.26 TV Integrations",
              "issue": "S12-TV-INTEGRATIONS-01",
              "status": "build-verified",
              "changes": [
                  "load source Details before external metadata enrichment",
                  "apply configured TMDB artwork overview genres runtime cast and logo",
                  "render selected MDBList ratings as readable TV chips",
                  "preserve source IDs episodes streams and playback routing",
                  "use credential-aware and provider-aware caching with bounded timeouts"
              ],
              "preserved": ["S12.25 CloudStream links fix", "S12.24 clean sidebar", "S12.23 Player Episodes", "S12.22 branding outside the sidebar", "S12.21 Malay and Indonesian subtitle split", "S12.20 CloudStream TV routing", "S12.19 CloudStream cache and concurrency", "S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "SmartSubs", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-integrations-s12-26-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.26 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-tv \
            .nustrim-version \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt \
            scripts/verify_tv_integrations_s12_26.py \
            scripts/verify_tv_cloudstream_links_s12_25.py \
            scripts/verify_tv_sidebar_clean_s12_24.py \
            scripts/verify_tv_player_episodes_s12_23.py \
            scripts/verify_tv_branding_s12_22.py \
            scripts/verify_tv_subtitle_language_split_s12_21.py \
            scripts/verify_tv_cloudstream_tv_s12_20.py \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_subtitle_panel_s12_16.py \
            scripts/verify_tv_settings_parity_s12_11.py
          if git diff --cached --quiet; then
            echo "S12.26 source is already committed."
          else
            git commit -m "Connect TMDB and MDBList to TV Details S12.26 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-26-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.26 connects configured TMDB metadata and MDBList ratings to TV Details." "" \
            "The base source Details screen opens first while external enrichment runs with bounded timeouts and caching." "" \
            "Source IDs, catalog episode titles, Sources routing, playback and all S12.25 fixes remain unchanged." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-integrations-s12-26-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-26-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-integrations-s12-26-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-26-tv-integrations-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-integrations-s12-26-report.json
            ${{ runner.temp }}/nustrim-s12-26-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-26-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-26-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-26-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-integrations-s12-26-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-26-tv-integrations-diagnose
          path: ${{ runner.temp }}/nustrim-s12-26-diagnose
          if-no-files-found: warn
          retention-days: 7
