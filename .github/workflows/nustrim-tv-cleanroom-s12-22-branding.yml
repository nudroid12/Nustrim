name: Nustrim TV Cleanroom S12.22 Branding Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-22-branding
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.21-tv-cleanroom-s12.22-branding"
  TARGET_VERSION_CODE: "144"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.21 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.20-tv-cleanroom-s12.21-subtitle-language-split"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.22 branding source
        shell: bash
        env:
          SOURCE_TAR_GZ_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.22-branding' .nustrim-tv; then
            printf '%s' "$SOURCE_TAR_GZ_B64" | base64 --decode | tar -xz -C .
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/values/styles.xml",
              "app/src/main/res/drawable/nustrim_launch_background.xml",
              "app/src/main/res/drawable-nodpi/nustrim_brand_mark.webp",
              "app/src/main/res/drawable-nodpi/nustrim_app_icon.webp",
              "app/src/main/res/drawable-xhdpi/nustrim_tv_banner.png",
              "app/src/main/res/drawable-xhdpi/nustrim_splash_brand.webp",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt",
              "scripts/verify_tv_branding_s12_22.py",
              "scripts/verify_tv_subtitle_language_split_s12_21.py",
              "scripts/verify_tv_cloudstream_tv_s12_20.py",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.22 changed files outside branding boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "1a4ca85dfbe0113f0d5dd09354be48ded101c9474ba41af6816025eb29946438",
              ".nustrim-version": "9614359d6ab762a1fda55b7968a4dec18507e7daa4fe3abb423a422e65fed9ba",
              "app/build.gradle.kts": "600e497f9b7adc4088edeab11c2c95920904b968144afd4dd6de472f48901939",
              "app/src/main/AndroidManifest.xml": "f453b13e619630b112a421d57c38e11e75b751eff70f7b3eba3ad94fe8aa09a8",
              "app/src/main/res/values/styles.xml": "8319999562f4b77626de737b0e4bce1d07de6fca03a1c232db69ee8e150aee7d",
              "app/src/main/res/drawable/nustrim_launch_background.xml": "e6460794da1b551da9670bdf3bc344b551f3ba1f2f92be572a357a8bc633e00c",
              "app/src/main/res/drawable-nodpi/nustrim_brand_mark.webp": "b886da07ef030dd09dcee05e2b47d1f04bd6d0940dfb4a23137c8008e822ef93",
              "app/src/main/res/drawable-nodpi/nustrim_app_icon.webp": "06cfe8425d07ae0b4adc722616612217b27615a235abbcc903fa208093d2731d",
              "app/src/main/res/drawable-xhdpi/nustrim_tv_banner.png": "56f34f828672ad6f0cad529c74e6f5dabc504175a3d1d7b03cbbcc6ca4725a1e",
              "app/src/main/res/drawable-xhdpi/nustrim_splash_brand.webp": "25e0b9d96561895731edf350ebe0b15117ce8aec6688ac6c534f9b20e5c93fdd",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt": "4943f61cd98f4fd50b86f1e5cb2c931ad949e4fb79a4ec8fab2a8c0853556ec9",
              "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt": "604f2fcf902c879eb62b24b2d1aa523b7aaf0638ff2b59e7d5d819f8f9eb201e",
              "scripts/verify_tv_branding_s12_22.py": "a1b8a6d3e44ff9dd29b6c43f360f13f2e16278e45635fe40696b323812aa02b3",
              "scripts/verify_tv_subtitle_language_split_s12_21.py": "d9c6446e65458e7ab865d5fbeec3263e377ec14df94bd68bd73023e1368042bc",
              "scripts/verify_tv_cloudstream_tv_s12_20.py": "81e0f8188dfd21ad377206f61ffc12ee603403caea9c1f00c7922bda054fd6f5",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "7bac225ae8453b8da2bf5347e5d86f6336e8880b014eb6657544db79a54a0d63",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "fde36496242b2b033a16e9e8f76fc697229733be705739995467835af20ee1bd",
              "scripts/verify_tv_episode_titles_s12_17.py": "4bf3713b3b7b9fa0ead12343c5db3ef43a84447052e7f28a7a9dfd47dbed96cd",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "da23181663c00b300c46f01ce8e0b2445d336ddb903a4bb3de247383769c78e7",
              "scripts/verify_tv_settings_parity_s12_11.py": "13f9058966fe5384a583dbb989950e7c705405513af37fe72cdf0489f7065875",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.22 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_branding_s12_22.py
          python3 scripts/verify_tv_subtitle_language_split_s12_21.py
          python3 scripts/verify_tv_cloudstream_tv_s12_20.py
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-22-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-22-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-22-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.22 applies the user-approved Nustrim blue-cyan identity to the launcher, Android TV banner, launch screen, sidebar and Mobile header.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.22 Branding",
              "issue": "S12-BRANDING-01",
              "status": "build-verified",
              "changes": [
                  "use the approved blue-cyan Nustrim logo as the canonical app identity",
                  "replace the launcher artwork with the icon-only N mark",
                  "replace the Android TV banner with the approved full lockup",
                  "show the approved lockup while the Android launch window is visible",
                  "use the transparent N mark in TV sidebar and Mobile header"
              ],
              "preserved": ["S12.21 Malay and Indonesian subtitle split", "S12.20 full CloudStream TV flow", "S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "SmartSubs", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-branding-s12-22-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.22 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-tv \
            .nustrim-version \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/values/styles.xml \
            app/src/main/res/drawable/nustrim_launch_background.xml \
            app/src/main/res/drawable-nodpi/nustrim_brand_mark.webp \
            app/src/main/res/drawable-nodpi/nustrim_app_icon.webp \
            app/src/main/res/drawable-xhdpi/nustrim_tv_banner.png \
            app/src/main/res/drawable-xhdpi/nustrim_splash_brand.webp \
            app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvSidebar.kt \
            app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt \
            scripts/verify_tv_branding_s12_22.py \
            scripts/verify_tv_subtitle_language_split_s12_21.py \
            scripts/verify_tv_cloudstream_tv_s12_20.py \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_subtitle_panel_s12_16.py \
            scripts/verify_tv_settings_parity_s12_11.py
          if git diff --cached --quiet; then
            echo "S12.22 source is already committed."
          else
            git commit -m "Apply approved Nustrim branding S12.22 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-22-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.22 applies the user-approved blue-cyan Nustrim logo across launcher, Android TV banner and launch screen." "" \
            "The icon-only mark is used in the TV sidebar and Mobile header so it remains readable at small sizes." "" \
            "S12.21 subtitle separation, CloudStream TV, playable-only source tabs, SmartSubs and playback are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-branding-s12-22-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-22-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-branding-s12-22-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-22-branding-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-branding-s12-22-report.json
            ${{ runner.temp }}/nustrim-s12-22-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-22-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-22-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-22-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-branding-s12-22-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-22-branding-diagnose
          path: ${{ runner.temp }}/nustrim-s12-22-diagnose
          if-no-files-found: warn
          retention-days: 7
