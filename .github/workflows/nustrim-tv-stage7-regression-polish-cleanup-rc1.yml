name: Nustrim TV Stage 7 Regression Polish Cleanup RC1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-stage7-regression-polish-cleanup-rc1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.26.0-tv-stage7-rc1"

jobs:
  stage7:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Stage 6 live baseline preflight
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-stage7"
          mkdir -p "$DIR"

          TV="app/src/main/java/app/nudroidlabs/nustrim/tv"
          SHELL="$TV/shell/TvShell.kt"
          DETAILS="$TV/details/TvDetailsScreen.kt"
          PLAYER="$TV/player/TvPlayerScreen.kt"
          SEARCH="$TV/search/TvSearchScreen.kt"
          LIBRARY="$TV/library/TvLibraryScreen.kt"
          SETTINGS="$TV/settings/TvSettingsScreen.kt"
          AGG="app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt"

          for file in             "$TV/TvApp.kt"             "$SHELL"             "$TV/home/TvHomeScreen.kt"             "$DETAILS"             "$PLAYER"             "$SEARCH"             "$LIBRARY"             "$SETTINGS"             "$AGG"             app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt             app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt             app/src/main/java/app/nudroidlabs/nustrim/MainActivity.kt             app/build.gradle.kts             README.md             .nustrim-tv             .nustrim-version             .github/workflows/build.yml; do
              test -f "$file"
          done

          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'TvDestination.HOME -> TvHomeScreen(' "$SHELL"
          grep -q 'TvDestination.SEARCH -> TvSearchScreen(' "$SHELL"
          grep -q 'TvDestination.LIBRARY -> TvLibraryScreen(' "$SHELL"
          grep -q 'TvDestination.SETTINGS -> TvSettingsScreen(' "$SHELL"

          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"
          grep -q 'Add to Library' "$DETAILS"
          grep -q 'SearchableSourceSession' "$SEARCH"
          grep -q 'LocalMediaStore' "$LIBRARY"
          grep -q 'InstalledSourceStore' "$SETTINGS"
          grep -q '!streamSessions.containsKey(session.id)' "$AGG"
          grep -q 'tvModeSessionActive'             app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt

          grep -q 'versionName = "0.25.0-tv-stage6"' app/build.gradle.kts

          cp "$TV/home/TvHomeScreen.kt" "$DIR/TvHomeScreen.before.kt"
          cp "$DETAILS" "$DIR/TvDetailsScreen.before.kt"
          cp "$PLAYER" "$DIR/TvPlayerScreen.before.kt"
          cp "$SEARCH" "$DIR/TvSearchScreen.before.kt"
          cp "$LIBRARY" "$DIR/TvLibraryScreen.before.kt"
          cp "$SETTINGS" "$DIR/TvSettingsScreen.before.kt"
          cp "$AGG" "$DIR/StreamSourceAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt             "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt             "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/MainActivity.kt             "$DIR/MainActivity.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.before"

          {
            echo "NUSTRIM TV STAGE 7 RC1 PREFLIGHT"
            echo "================================"
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts
            grep -m1 'versionName' app/build.gradle.kts
            echo "tv_files=$(find "$TV" -type f -name '*.kt' | wc -l)"
            echo
            echo "[current .nustrim-tv]"
            cat .nustrim-tv
            echo
            echo "[current .nustrim-version]"
            cat .nustrim-version
            echo
            echo "[stale workflow .kt files]"
            find .github/workflows -maxdepth 1 -type f               -name 'nustrim-tv-*.kt' -print | sort || true
          } | tee "$DIR/preflight.txt"

      - name: Cleanup dead TV residue and stale metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          
          target = "0.26.0-tv-stage7-rc1"
          
          shell = Path(
              "app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"
          )
          text = shell.read_text(encoding="utf-8")
          
          required_shell = [
              "TvDestination.HOME -> TvHomeScreen(",
              "TvDestination.SEARCH -> TvSearchScreen(",
              "TvDestination.LIBRARY -> TvLibraryScreen(",
              "TvDestination.SETTINGS -> TvSettingsScreen(",
          ]
          missing = [token for token in required_shell if token not in text]
          if missing:
              raise SystemExit(
                  "Stage 6 shell baseline missing: " + ", ".join(missing)
              )
          
          placeholder_name = "private fun TvStagePlaceholder("
          if placeholder_name in text:
              if text.count(placeholder_name) != 1:
                  raise SystemExit("Unexpected duplicate TvStagePlaceholder definitions.")
          
              pattern = re.compile(
                  r"\n@Composable\s*\nprivate fun TvStagePlaceholder\([\s\S]*\Z"
              )
              updated, count = pattern.subn("\n", text, count=1)
              if count != 1:
                  raise SystemExit(
                      "TvStagePlaceholder exists but safe trailing-function cleanup did not match."
                  )
              text = updated
              shell.write_text(text.rstrip() + "\n", encoding="utf-8")
              print("Removed dead TvStagePlaceholder.")
          else:
              print("TvStagePlaceholder already absent.")
          
          # Remove old production namespace directories only if they still exist.
          base = Path("app/src/main/java/app/nudroidlabs/nustrim")
          for legacy_name in ("tv2", "tv3"):
              legacy = base / legacy_name
              if legacy.exists():
                  shutil.rmtree(legacy)
                  print("Removed legacy namespace:", legacy)
          
          # .kt files inside .github/workflows are not executable workflows and are
          # leftover phone-upload artifacts. Remove only Nustrim TV patch copies.
          workflow_dir = Path(".github/workflows")
          removed_workflows = []
          for path in sorted(workflow_dir.glob("nustrim-tv-*.kt")):
              path.unlink()
              removed_workflows.append(str(path))
              print("Removed stale workflow artifact:", path)
          
          marker = Path(".nustrim-tv")
          marker.write_text(
              "\n".join(
                  [
                      "generation=fresh",
                      "stage=7",
                      "status=rc1-candidate",
                      "namespace=tv",
                      "reference=independent",
                      "home=complete",
                      "details=complete",
                      "sources=installed-stream-aggregation",
                      "player=media3-tv",
                      "search=complete",
                      "library=complete",
                      "settings=complete",
                      "focus=regression-audited",
                      "mobile=protected",
                      "updater=protected",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          
          Path(".nustrim-version").write_text(target + "\n", encoding="utf-8")
          
          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          baseline_line = f"Current development baseline: `{target}`"
          
          if re.search(r"(?m)^Current development baseline:.*$", readme_text):
              readme_text = re.sub(
                  r"(?m)^Current development baseline:.*$",
                  baseline_line,
                  readme_text,
                  count=1,
              )
          else:
              readme_text = readme_text.rstrip() + "\n\n" + baseline_line + "\n"
          
          tv_status = (
              "TV mode baseline: fresh `app.nudroidlabs.nustrim.tv` namespace with "
              "Home, Details, Sources, Player, Search, Library and Settings implemented."
          )
          if re.search(r"(?m)^TV mode baseline:.*$", readme_text):
              readme_text = re.sub(
                  r"(?m)^TV mode baseline:.*$",
                  tv_status,
                  readme_text,
                  count=1,
              )
          else:
              readme_text = readme_text.rstrip() + "\n\n" + tv_status + "\n"
          
          readme.write_text(readme_text, encoding="utf-8")
          
          final_shell = shell.read_text(encoding="utf-8")
          checks = {
              "placeholder removed":
                  "TvStagePlaceholder" not in final_shell,
              "later-stage copy removed":
                  "This workspace lands in a later TV stage." not in final_shell,
              "home retained":
                  "TvDestination.HOME -> TvHomeScreen(" in final_shell,
              "search retained":
                  "TvDestination.SEARCH -> TvSearchScreen(" in final_shell,
              "library retained":
                  "TvDestination.LIBRARY -> TvLibraryScreen(" in final_shell,
              "settings retained":
                  "TvDestination.SETTINGS -> TvSettingsScreen(" in final_shell,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Stage 7 cleanup failed: " + ", ".join(failed))
          
          for name in checks:
              print("PASS:", name)
          
          print("Removed stale .kt workflows:", len(removed_workflows))
          PY

      - name: Set Stage 7 RC1 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Could not parse app version.")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1,
          )
          
          path.write_text(text, encoding="utf-8")
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Protect stable Stage 1 through 6 code
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-stage7"
          TV="app/src/main/java/app/nudroidlabs/nustrim/tv"

          cmp "$DIR/TvHomeScreen.before.kt" "$TV/home/TvHomeScreen.kt"
          cmp "$DIR/TvDetailsScreen.before.kt" "$TV/details/TvDetailsScreen.kt"
          cmp "$DIR/TvPlayerScreen.before.kt" "$TV/player/TvPlayerScreen.kt"
          cmp "$DIR/TvSearchScreen.before.kt" "$TV/search/TvSearchScreen.kt"
          cmp "$DIR/TvLibraryScreen.before.kt" "$TV/library/TvLibraryScreen.kt"
          cmp "$DIR/TvSettingsScreen.before.kt" "$TV/settings/TvSettingsScreen.kt"
          cmp "$DIR/StreamSourceAggregator.before.kt"             app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt

          cmp "$DIR/NustrimApp.before.kt"             app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          cmp "$DIR/UiPreferences.before.kt"             app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          cmp "$DIR/MainActivity.before.kt"             app/src/main/java/app/nudroidlabs/nustrim/MainActivity.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          echo "PASS: Home untouched"
          echo "PASS: Details/Sources untouched"
          echo "PASS: Player untouched"
          echo "PASS: Search/Library/Settings untouched"
          echo "PASS: R6 route/preferences untouched"
          echo "PASS: updater/build workflow untouched"

      - name: Full TV Stage 7 readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          import subprocess
          
          root = Path(".")
          tv = Path("app/src/main/java/app/nudroidlabs/nustrim/tv")
          target = os.environ["TARGET_VERSION"]
          
          files = {
              "TvApp": tv / "TvApp.kt",
              "TvShell": tv / "shell/TvShell.kt",
              "TvHome": tv / "home/TvHomeScreen.kt",
              "TvDetails": tv / "details/TvDetailsScreen.kt",
              "TvPlayer": tv / "player/TvPlayerScreen.kt",
              "TvSearch": tv / "search/TvSearchScreen.kt",
              "TvLibrary": tv / "library/TvLibraryScreen.kt",
              "TvSettings": tv / "settings/TvSettingsScreen.kt",
              "Aggregator": Path(
                  "app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt"
              ),
              "NustrimApp": Path(
                  "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
              ),
          }
          
          missing = [name for name, path in files.items() if not path.exists()]
          if missing:
              raise SystemExit("Missing Stage 7 files: " + ", ".join(missing))
          
          content = {
              name: path.read_text(encoding="utf-8")
              for name, path in files.items()
          }
          
          checks = {
              "fresh TvApp route":
                  "TvShell(onExit = onExit)" in content["TvApp"],
              "R6 TV session latch":
                  "tvModeSessionActive" in content["NustrimApp"] and
                  "TvApp(" in content["NustrimApp"],
              "Home wired":
                  "TvDestination.HOME -> TvHomeScreen(" in content["TvShell"],
              "Search wired":
                  "TvDestination.SEARCH -> TvSearchScreen(" in content["TvShell"],
              "Library wired":
                  "TvDestination.LIBRARY -> TvLibraryScreen(" in content["TvShell"],
              "Settings wired":
                  "TvDestination.SETTINGS -> TvSettingsScreen(" in content["TvShell"],
              "dead placeholder gone":
                  "TvStagePlaceholder" not in content["TvShell"],
              "Details library action":
                  "LocalMediaStore" in content["TvDetails"] and
                  "Add to Library" in content["TvDetails"] and
                  "Remove from Library" in content["TvDetails"],
              "Sources aggregator wired":
                  "StreamSourceAggregator(context)" in content["TvDetails"] and
                  "aggregator.load(" in content["TvDetails"],
              "Player wired":
                  "TvPlayerScreen(" in content["TvDetails"],
              "Media3 player":
                  "ExoPlayer.Builder(context)" in content["TvPlayer"] and
                  "DefaultHttpDataSource.Factory()" in content["TvPlayer"],
              "stream headers preserved":
                  "setDefaultRequestProperties(stream.headers)" in content["TvPlayer"],
              "Search neutral source contract":
                  "SearchableSourceSession" in content["TvSearch"] and
                  "InstalledSourceStore" in content["TvSearch"],
              "Library neutral store":
                  "LocalMediaStore" in content["TvLibrary"],
              "Settings source store":
                  "InstalledSourceStore" in content["TvSettings"],
              "API23 aggregator fix retained":
                  "putIfAbsent(" not in content["Aggregator"] and
                  "!streamSessions.containsKey(session.id)" in content["Aggregator"],
              "marker stage7":
                  "stage=7" in Path(".nustrim-tv").read_text(encoding="utf-8"),
              "marker fresh namespace":
                  "namespace=tv" in Path(".nustrim-tv").read_text(encoding="utf-8"),
              "version marker":
                  Path(".nustrim-version").read_text(encoding="utf-8").strip() == target,
              "README baseline":
                  target in Path("README.md").read_text(encoding="utf-8"),
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(
                  "TV Stage 7 readiness failed: " + ", ".join(failed)
              )
          
          # Production namespace / residue audit.
          legacy_dirs = [
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv2"),
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv3"),
          ]
          if any(path.exists() for path in legacy_dirs):
              raise SystemExit("Legacy tv2/tv3 production directory remains.")
          
          scan_paths = [
              tv,
              Path(".nustrim-tv"),
              Path(".nustrim-version"),
              Path("README.md"),
              Path(
                  "app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
              ),
          ]
          
          bad_patterns = {
              "tv2/tv3 residue": re.compile(r"(?i)\btv[23]\b"),
              "diagnostic UI residue": re.compile(r"DIAG\s*[•:]"),
              "temporary TODO/FIXME": re.compile(r"\b(?:TODO|FIXME)\b"),
              "later-stage placeholder": re.compile(
                  r"This workspace lands in a later TV stage\.",
                  re.I,
              ),
          }
          
          residue = []
          for path in scan_paths:
              candidates = [path] if path.is_file() else list(path.rglob("*"))
              for candidate in candidates:
                  if not candidate.is_file():
                      continue
                  if candidate.suffix not in {".kt", ".md", ""}:
                      continue
                  text = candidate.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
                  for label, pattern in bad_patterns.items():
                      if pattern.search(text):
                          residue.append(f"{label}: {candidate}")
          
          if residue:
              raise SystemExit(
                  "Production residue detected:\n" + "\n".join(residue)
              )
          
          # TV may use neutral UiPreferences data, but must not import Mobile screens.
          mobile_screen_import = re.compile(
              r"(?m)^import app\.nudroidlabs\.nustrim\.ui\..*(?:Screen|Page|Route)\b"
          )
          mobile_import_hits = []
          for candidate in tv.rglob("*.kt"):
              text = candidate.read_text(encoding="utf-8")
              if mobile_screen_import.search(text):
                  mobile_import_hits.append(str(candidate))
          if mobile_import_hits:
              raise SystemExit(
                  "TV imports Mobile presentation screens:\n" +
                  "\n".join(mobile_import_hits)
              )
          
          report = []
          report.append("NUSTRIM TV STAGE 7 READINESS")
          report.append("============================")
          report.append(f"version={target}")
          report.append(
              "sha=" + subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True,
              ).strip()
          )
          report.append("")
          for name in checks:
              report.append(f"PASS | {name}")
          report.append("PASS | no tv2/tv3 production namespace")
          report.append("PASS | no DIAG/TODO/FIXME/later-stage TV residue")
          report.append("PASS | no Mobile presentation screen imports")
          report.append("")
          report.append("PROTECTED FILE HASHES")
          for name, path in files.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              report.append(f"{digest}  {path}")
          
          out = Path(os.environ["RUNNER_TEMP"]) / "tv-stage7" / "tv-v1-readiness.txt"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(report) + "\n", encoding="utf-8")
          
          print("\n".join(report))
          PY

      - name: Allowed change audit
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-stage7"

          git diff --check
          git diff > "$DIR/stage7.patch"

          git diff --name-status | tee "$DIR/changed-files.txt"

          bad="$(
            git diff --name-only |
            grep -v -E               '^(app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt|app/build.gradle.kts|README.md|\.nustrim-tv|\.nustrim-version|\.github/workflows/nustrim-tv-.*\.kt)$'               || true
          )"

          if [[ -n "$bad" ]]; then
            echo "::error::Unexpected Stage 7 file changes:"
            printf '%s\n' "$bad"
            exit 1
          fi

          grep -q 'versionName = "0.26.0-tv-stage7-rc1"' app/build.gradle.kts
          grep -q '^stage=7$' .nustrim-tv
          grep -q '^status=rc1-candidate$' .nustrim-tv
          grep -q '^namespace=tv$' .nustrim-tv
          grep -q '^0.26.0-tv-stage7-rc1$' .nustrim-version

          if grep -q 'TvStagePlaceholder'             app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt; then
            echo "::error::Dead TvStagePlaceholder remains."
            exit 1
          fi

          if find app/src/main/java/app/nudroidlabs/nustrim             -maxdepth 1 -type d \( -name tv2 -o -name tv3 \)             | grep -q .; then
            echo "::error::Legacy production tv2/tv3 directory remains."
            exit 1
          fi

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage7/compile.log"

      - name: Run unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage7/tests.log"

      - name: Run release lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage7/lint-release.log"

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage7/assemble.log"

      - name: Commit and push Stage 7 RC1
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-stage7/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt             app/build.gradle.kts             README.md             .nustrim-tv             .nustrim-version             .github/workflows

          git diff --cached --check

          bad="$(
            git diff --cached --name-only |
            grep -v -E               '^(app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt|app/build.gradle.kts|README.md|\.nustrim-tv|\.nustrim-version|\.github/workflows/nustrim-tv-.*\.kt)$'               || true
          )"

          if [[ -n "$bad" ]]; then
            echo "::error::Unexpected staged files:"
            printf '%s\n' "$bad"
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore(tv): stage 7 regression cleanup rc1"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-stage7/remote-main.txt"

          python3 - <<'PY'
          import subprocess
          
          target = "0.26.0-tv-stage7-rc1"
          
          shell = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt",
              ],
              text=True,
          )
          details = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt",
              ],
              text=True,
          )
          agg = subprocess.check_output(
              [
                  "git", "show",
                  "origin/main:app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt",
              ],
              text=True,
          )
          gradle = subprocess.check_output(
              ["git", "show", "origin/main:app/build.gradle.kts"],
              text=True,
          )
          marker = subprocess.check_output(
              ["git", "show", "origin/main:.nustrim-tv"],
              text=True,
          )
          version_marker = subprocess.check_output(
              ["git", "show", "origin/main:.nustrim-version"],
              text=True,
          ).strip()
          readme = subprocess.check_output(
              ["git", "show", "origin/main:README.md"],
              text=True,
          )
          
          checks = {
              "remote placeholder removed":
                  "TvStagePlaceholder" not in shell,
              "remote Search wired":
                  "TvDestination.SEARCH -> TvSearchScreen(" in shell,
              "remote Library wired":
                  "TvDestination.LIBRARY -> TvLibraryScreen(" in shell,
              "remote Settings wired":
                  "TvDestination.SETTINGS -> TvSettingsScreen(" in shell,
              "remote Sources retained":
                  "StreamSourceAggregator(context)" in details,
              "remote Player retained":
                  "TvPlayerScreen(" in details,
              "remote API23 aggregator retained":
                  "putIfAbsent(" not in agg and
                  "!streamSessions.containsKey(session.id)" in agg,
              "remote stage7 marker":
                  "stage=7" in marker and
                  "status=rc1-candidate" in marker,
              "remote version marker":
                  version_marker == target,
              "remote gradle version":
                  f'versionName = "{target}"' in gradle,
              "remote README":
                  target in readme and
                  "0.17.0-tv2-rc2" not in readme,
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(
                  "REMOTE STAGE 7 VERIFICATION FAILED: " + ", ".join(failed)
              )
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-stage7/signed-run.txt"

      - name: Wait signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-stage7/signed-build-watch.log"

      - name: Verify published Stage 7 RC1
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/tv-stage7/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.26.0-tv-stage7-rc1' "$MANIFEST"               2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.26.0-tv-stage7-rc1' "$MANIFEST"

          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-stage7/published-update.json"

          {
            echo
            echo "SIGNED RELEASE VERIFIED"
            echo "version=0.26.0-tv-stage7-rc1"
            echo "signed_run_id=$SIGNED_RUN_ID"
          } >> "$RUNNER_TEMP/tv-stage7/tv-v1-readiness.txt"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e

          DIR="$RUNNER_TEMP/tv-stage7"
          echo "========== Nustrim TV Stage 7 RC1 =========="
          echo "RESULT: FAILED"

          for f in             preflight.txt             changed-files.txt             tv-v1-readiness.txt             remote-main.txt             signed-run.txt             published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              cat "$DIR/$f" || true
            fi
          done

          for f in             compile.log             tests.log             lint-release.log             assemble.log             push.log             signed-build-watch.log; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              grep -E                 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)|FAILED|AssertionError'                 "$DIR/$f" | tail -n 320 || true
            fi
          done

      - name: Upload Stage 7 diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage7-rc1-diagnose
          path: ${{ runner.temp }}/tv-stage7
          if-no-files-found: ignore
          retention-days: 7
