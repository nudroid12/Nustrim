          if [ "$actual" != "$TARGET_PLAYER_SHA256" ]; then
            echo "::error::Decoded modern player SHA mismatch."
            echo "expected=$TARGET_PLAYER_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump V2.4 version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          accepted = {
              ("79", "0.28.5-tv-v2.3-nuvio-player-p5"),
              ("80", "0.28.6-tv-v2.3-nuvio-player-p5.1-backfix"),
          }
          current = (code.group(1), name.group(1))
          if current not in accepted:
              raise SystemExit(f"Unexpected baseline: {current[1]} ({current[0]})")

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 81',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.29.0-tv-v2.4-modern-player-p1"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify modern visual contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 81' app/build.gradle.kts
          grep -q 'versionName = "0.29.0-tv-v2.4-modern-player-p1"' app/build.gradle.kts

          # Modern minimalist visual language.
          grep -q 'graphicsLayer' "$PLAYER"
          grep -q 'targetValue = if (focused) 1.08f else 1f' "$PLAYER"
          grep -q '.size(44.dp)' "$PLAYER"
          grep -q 'focused -> Color.White.copy(alpha = 0.14f)' "$PLAYER"
          grep -q 'shape = RoundedCornerShape(12.dp)' "$PLAYER"
          grep -q 'targetValue = if (focused) 5.dp else 3.dp' "$PLAYER"
          grep -q 'Color.White.copy(alpha = 0.96f)' "$PLAYER"
          grep -q '.width(316.dp)' "$PLAYER"
          grep -q '.width(360.dp)' "$PLAYER"
          grep -q 'color = Color.Black.copy(alpha = 0.82f)' "$PLAYER"
          grep -q 'fontSize = 22.sp' "$PLAYER"
          grep -q 'horizontal = 48.dp' "$PLAYER"

          # Functional parity must remain intact.
          grep -q 'if (event.key == Key.Back)' "$PLAYER"
          grep -q 'onBack()' "$PLAYER"
          grep -q 'fun previewSeekBy(direction: Int)' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"
          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerPostPlayOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerClockOverlay(' "$PLAYER"
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v24-modern-player-p1"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save redesign evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-modern-player-p1"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/modern-player-p1.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"

          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.4 Modern Minimalist Player P1
          =================================================
          Target: 0.29.0-tv-v2.4-modern-player-p1 (81)

          Visual redesign:
          - replaces large classic 52dp circular controls with 44dp minimal soft-square controls
          - focus uses subtle 1.08 scale and translucent white highlight instead of solid inverted buttons
          - reduces icon size and visual chrome
          - makes playback progress 3dp idle / 5dp focused and switches it to a neutral white cinematic line
          - reduces top and bottom gradient weight
          - adds more horizontal breathing room and smaller title / episode hierarchy
          - makes clock and end-time quieter
          - makes speed and track pickers smaller, darker and translucent
          - removes heavy accent fills from picker rows
          - makes post-play card lighter and less dialog-like
          - softens pause OSD and seek overlay

          Functional preservation:
          - Back hierarchy retained
          - seek preview retained
          - resume and progress reporting retained
          - subtitles / audio / sources retained
          - playback speed and aspect ratio retained
          - pause OSD and post-play retained
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: v2.4 modern minimalist player visual pass 1'
          git push origin HEAD:main

      - name: Dispatch signed updater release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${ github.token }
        run: |
          set -euo pipefail
          gh workflow run build.yml             --ref main             -f publish_release=true             -f prepare_clean_bridge=false
          echo "Build Nustrim Clean dispatched with publish_release=true."

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v24-modern-player-p1"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.4-modern-player-p1-diagnose
          path: ${ runner.temp }/nustrim-v24-modern-player-p1
          if-no-files-found: warn
          retention-days: 14
