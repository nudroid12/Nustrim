name: Nustrim TV V2.4 Modern Minimalist Player P1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-4-modern-player-p1
  cancel-in-progress: false

env:
  TARGET_VERSION_NAME: "0.29.0-tv-v2.4-modern-player-p1"
  TARGET_VERSION_CODE: "81"
  BASE_PLAYER_SHA256: "30dea3f8dd041aacacb13dfb55a2288c4b413833abee8caff42d0363f2dded53"
  TARGET_PLAYER_SHA256: "337007b293536fa14b3c2e5545fa49e51b190c806186490df3493d25a802df05"

jobs:
  modern_player_p1:
    name: Redesign, compile, commit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact player preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          BUILD="app/build.gradle.kts"

          test -f "$PLAYER"
          test -f "$BUILD"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          player_sha="$(sha256sum "$PLAYER" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Live player SHA-256: $player_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$player_sha" = "$TARGET_PLAYER_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Modern Player P1 is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          case "$code|$name" in
            "79|0.28.5-tv-v2.3-nuvio-player-p5"|"80|0.28.6-tv-v2.3-nuvio-player-p5.1-backfix")
              ;;
            *)
              echo "::error::Unexpected version baseline: $name ($code)."
              echo "Accepted baselines are P5 (79) or P5.1 Backfix (80)."
              exit 20
              ;;
          esac

          if [ "$player_sha" != "$BASE_PLAYER_SHA256" ]; then
            echo "::error::Player source is not the exact accepted baseline."
            echo "expected=$BASE_PLAYER_SHA256"
            echo "actual=$player_sha"
            exit 21
          fi

          # Preserve the repaired Back path and P5 feature set.
          grep -q 'if (event.key == Key.Back)' "$PLAYER"
          grep -q 'Back belongs to BackHandler' "$PLAYER"
          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerPostPlayOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerClockOverlay(' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"

      - name: Save before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v24-modern-player-p1"
          mkdir -p "$D"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.before.kt"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          git rev-parse HEAD > "$D/base-commit.txt"

