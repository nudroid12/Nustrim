name: Nustrim TV Cleanroom S12.2 Details Episode Focus Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-2-details-episode-focus
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.1-tv-cleanroom-s12.2-details-episode-focus"
  MIN_TARGET_VERSION_CODE: "124"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.0-tv-cleanroom-s12.1-sources-progressive"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.2 Details source
        shell: bash
        env:
          DETAILS_PATCH_B64: ""
          MARKER_B64: ""
          VERIFY_B64: ""
        run: |
          set -euo pipefail
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          TARGET_DETAILS_SHA="8c186d2fcbc8100d652943b0e56bf24a8406978d8bee2a2144c260bff93fe6b6"
          if [ "$(sha256sum "$DETAILS" | cut -d' ' -f1)" != "$TARGET_DETAILS_SHA" ]; then
            PATCH_FILE="$RUNNER_TEMP/s12-2-details.patch"
            printf '%s' "$DETAILS_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

          printf '%s' "$MARKER_B64" | base64 --decode > .nustrim-tv
          mkdir -p scripts
          printf '%s' "$VERIFY_B64" | base64 --decode > scripts/verify_tv_details_episode_focus_s12_2.py

          python3 <<'PY'
          from pathlib import Path
          import re

          target_name = "0.57.1-tv-cleanroom-s12.2-details-episode-focus"
          minimum_code = 124
          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", build)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not code_match or not name_match:
              raise SystemExit("Could not parse app version metadata")
          current_code = int(code_match.group(1))
          current_name = name_match.group(1)
          target_code = current_code if current_name == target_name else max(current_code + 1, minimum_code)
          build = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {target_code}", build, count=1)
          build = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', build, count=1)
          build_path.write_text(build, encoding="utf-8")
          Path(".nustrim-version").write_text(target_name + "\n", encoding="utf-8")
          print(f"Prepared {target_name} ({target_code})")
          PY

      - name: Verify S12.2 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt",
              "scripts/verify_tv_details_episode_focus_s12_2.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.2 changed files outside Details boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "74c141f8ca0227f17b4c3327f3a1e5c471b2d30b26be9c0b632b354d486ff680",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt": "8c186d2fcbc8100d652943b0e56bf24a8406978d8bee2a2144c260bff93fe6b6",
              "scripts/verify_tv_details_episode_focus_s12_2.py": "31250cc430ffea14de496aa54812e3c752cca95b764f6fa78e3869cb2c57ccc7",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.2 payload mismatch: " + ", ".join(mismatch))

          version = Path(".nustrim-version").read_text().strip()
          build = Path("app/build.gradle.kts").read_text()
          if version != "0.57.1-tv-cleanroom-s12.2-details-episode-focus":
              raise SystemExit("Unexpected S12.2 version marker")
          if "versionCode = 124" not in build or f'versionName = "{version}"' not in build:
              raise SystemExit("Unexpected S12.2 build metadata")
          PY

          python3 scripts/verify_tv_details_episode_focus_s12_2.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-2-details-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-2-details-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-2-details-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          SRC_CODE="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          SRC_NAME="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$SRC_CODE"
          test "$APK_NAME" = "$SRC_NAME"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          test "$SRC_CODE" -ge "$MIN_TARGET_VERSION_CODE"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$SRC_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SRC_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater and S12.2 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          dst = Path(f"Nustrim-{version_name}.apk")
          dst.write_bytes(src.read_bytes())
          sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          size = dst.stat().st_size
          tag = f"v{version_name}"
          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{dst.name}",
              "sha256": sha,
              "changelog": "S12.2 restores the exact season or episode after returning from Sources or Player, makes hero Play use the remembered episode, and displays provider cast metadata when available.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.2 Details and Episode Focus",
              "issue": "S12-DET-01",
              "status": "build-verified",
              "scope": ["TV Details", "season and episode focus restoration", "provider metadata"],
              "preserved": ["S12.1 Sources", "provider engine", "player", "subtitle system", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "open a non-first episode, return from Sources, and verify exact card focus",
                  "start playback, return to Details, and verify the same season and episode",
                  "press Back once from Sources and verify one route pop",
                  "verify hero Play targets the remembered episode",
              ],
              "nextBacklog": "S12.3 Player Overlay and Post-play",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-details-episode-focus-s12-2-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={dst.name}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"size={size}\n")
          PY

      - name: Commit S12.2 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version \
            .nustrim-tv \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt \
            scripts/verify_tv_details_episode_focus_s12_2.py
          if git diff --cached --quiet; then
            echo "S12.2 Details source is already committed."
          else
            git commit -m "Close TV Details episode focus S12.2 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-2-details-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" \
            "" \
            "S12.2 restores the exact season or episode after returning from Sources or Player. Hero Play uses the remembered episode, Back remains a single route pop, and provider cast metadata is shown when available." \
            "" \
            "S12.1 Sources, provider engine, player, subtitle system, and Mobile UI remain preserved." \
            "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-details-episode-focus-s12-2-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-2-details-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-details-episode-focus-s12-2-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-details-episode-focus-s12-2-report.json").read_text())
          if report.get("issue") != "S12-DET-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.2 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-2-details-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-details-episode-focus-s12-2-report.json
            ${{ runner.temp }}/nustrim-s12-2-details-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-2-details-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-2-details-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-2-details-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-details-episode-focus-s12-2-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-2-details-diagnose
          path: ${{ runner.temp }}/nustrim-s12-2-details-diagnose
          if-no-files-found: warn
          retention-days: 7
