name: Nustrim TV Runtime Route Fix R2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-runtime-route-fix-r2
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-route-fix"
          mkdir -p "$DIR"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          test -f "$APP"
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/TvApp.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          cp "$APP" "$DIR/NustrimApp.before.kt"
          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          {
            echo "TV RUNTIME ROUTE FIX R1"
            echo "======================="
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionName' app/build.gradle.kts || true
            echo
            grep -n -E 'TvApp|tv2|physicalTvDevice|TvReferenceCanvas|interfaceMode == InterfaceMode.TV|screenContent\(\)' "$APP" | head -n 120 || true
          } > "$DIR/preflight.txt"

          cat "$DIR/preflight.txt"

      - name: Patch TV runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/tv-route-fix/patch.log"
          from pathlib import Path
          import re

          APP = Path("app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt")
          text = APP.read_text(encoding="utf-8")
          before = text

          required = [
              "fun NustrimApp()",
              "InterfaceMode.TV",
              "fun switchInterfaceMode",
              "val activity = context.findActivity()",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing anchors: " + ", ".join(missing))

          tv_import = "import app.nudroidlabs.nustrim.tv.TvApp\n"
          if tv_import not in text:
              package_end = text.find("\n", text.find("package "))
              if package_end < 0:
                  raise SystemExit("Package declaration missing")
              text = text[:package_end + 1] + "\n" + tv_import + text[package_end + 1:]

          text = re.sub(
              r'(?m)^import app\.nudroidlabs\.nustrim\.tv2\.[^\n]+\n',
              '',
              text
          )

          app_start = text.find("fun NustrimApp()")
          app_end = text.find("private tailrec fun Context.findActivity", app_start)
          if app_end < 0:
              raise SystemExit("NustrimApp end anchor missing")

          chunk = text[app_start:app_end]

          legacy_exact = (
              "if (interfaceMode == InterfaceMode.TV && !physicalTvDevice) {\n"
              "                    TvReferenceCanvas { screenContent() }\n"
              "                } else {\n"
              "                    screenContent()\n"
              "                }"
          )

          legacy_exact_alt = (
              "if (interfaceMode == InterfaceMode.TV && !physicalTvDevice) {\n"
              "                TvReferenceCanvas { screenContent() }\n"
              "            } else {\n"
              "                screenContent()\n"
              "            }"
          )

          removed = 0
          for legacy in (legacy_exact, legacy_exact_alt):
              if legacy in chunk:
                  chunk = chunk.replace(legacy, "screenContent()", 1)
                  removed += 1

          # Also catch a whitespace-varied legacy branch safely.
          if "interfaceMode == InterfaceMode.TV && !physicalTvDevice" in chunk:
              start = chunk.find("if (interfaceMode == InterfaceMode.TV && !physicalTvDevice)")
              tail = chunk[start:]
              marker = "TvReferenceCanvas { screenContent() }"
              marker_pos = tail.find(marker)
              else_pos = tail.find("} else {")
              fallback_pos = tail.find("screenContent()", else_pos + 1) if else_pos >= 0 else -1
              close_pos = tail.find("}", fallback_pos + len("screenContent()")) if fallback_pos >= 0 else -1

              if marker_pos >= 0 and else_pos >= 0 and fallback_pos >= 0 and close_pos >= 0:
                  end = start + close_pos + 1
                  chunk = chunk[:start] + "screenContent()" + chunk[end:]
                  removed += 1

          fresh_route = (
              "if (interfaceMode == InterfaceMode.TV)" in chunk
              and "TvApp(" in chunk
              and "switchInterfaceMode(InterfaceMode.MOBILE)" in chunk
          )

          if not fresh_route:
              marker = "Surface(modifier = Modifier.fillMaxSize(), color = AppBackground) {"
              positions = [m.start() for m in re.finditer(re.escape(marker), chunk)]
              if not positions:
                  raise SystemExit("Root Surface anchor not found")

              start = positions[-1]
              brace = chunk.find("{", start)
              depth = 0
              in_string = False
              escape = False
              end = None

              for i in range(brace, len(chunk)):
                  ch = chunk[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue

                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Root Surface block unbalanced")

              old_surface = chunk[start:end]
              if "screenContent()" not in old_surface:
                  raise SystemExit("Root Surface has no Mobile fallback")

              new_surface = (
                  "Surface(modifier = Modifier.fillMaxSize(), color = AppBackground) {\n"
                  "                if (interfaceMode == InterfaceMode.TV) {\n"
                  "                    TvApp(\n"
                  "                        onExit = {\n"
                  "                            if (physicalTvDevice) {\n"
                  "                                activity?.finish()\n"
                  "                            } else {\n"
                  "                                switchInterfaceMode(InterfaceMode.MOBILE)\n"
                  "                            }\n"
                  "                        }\n"
                  "                    )\n"
                  "                } else {\n"
                  "                    screenContent()\n"
                  "                }\n"
                  "            }"
              )

              chunk = chunk[:start] + new_surface + chunk[end:]
          else:
              print("Fresh TvApp route already present.")

          text = text[:app_start] + chunk + text[app_end:]

          checks = {
              "TvApp import": "import app.nudroidlabs.nustrim.tv.TvApp" in text,
              "TV root route": "if (interfaceMode == InterfaceMode.TV)" in chunk and "TvApp(" in chunk,
              "Mobile fallback": "screenContent()" in chunk,
              "Phone exit returns Mobile": "switchInterfaceMode(InterfaceMode.MOBILE)" in chunk,
              "Physical TV exit": "activity?.finish()" in chunk,
              "Old conditional removed":
                  "interfaceMode == InterfaceMode.TV && !physicalTvDevice" not in chunk,
              "No legacy TvReferenceCanvas route":
                  "TvReferenceCanvas { screenContent() }" not in chunk,
              "No tv2 import":
                  "import app.nudroidlabs.nustrim.tv2." not in text,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Route contract failed: " + ", ".join(failed))

          text = re.sub(r'(?m)^[ \t]+$', '', text)
          APP.write_text(text, encoding="utf-8")

          for name in checks:
              print("PASS:", name)

          print("Legacy blocks removed:", removed)
          print("Changed:", before != text)
          PY

      - name: Route audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-route-fix"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"

          echo "AUDIT VERSION: TV-RUNTIME-ROUTE-R2"

          grep -q 'import app.nudroidlabs.nustrim.tv.TvApp' "$APP"
          grep -q 'if (interfaceMode == InterfaceMode.TV)' "$APP"
          grep -q 'TvApp(' "$APP"
          grep -q 'switchInterfaceMode(InterfaceMode.MOBILE)' "$APP"
          grep -q 'activity?.finish()' "$APP"

          if grep -q 'interfaceMode == InterfaceMode.TV && !physicalTvDevice' "$APP"; then
            echo "::error::Old TvReferenceCanvas route still active."
            exit 1
          fi

          if grep -q -E '^import app\.nudroidlabs\.nustrim\.tv2\.' "$APP"; then
            echo "::error::Legacy tv2 import still active."
            exit 1
          fi

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          git diff --check
          git diff > "$DIR/route-fix.patch"

          echo "PASS: TV now routes directly to fresh TvApp"
          echo "PASS: Mobile remains fallback"
          echo "PASS: updater/build untouched"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache :app:compileDebugKotlin --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-route-fix/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleDebug --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-route-fix/assemble.log"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-route-fix/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Runtime route already fixed."
          else
            git commit -m "fix(tv): route TV mode directly to TvApp"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true             2>&1 | tee "$RUNNER_TEMP/tv-route-fix/dispatch.log"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-route-fix"
          echo "========== TV Runtime Route Fix R2 =========="
          echo "Result: FAILED"
          for file in preflight.txt patch.log push.log dispatch.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 140 "$DIR/$file" || true
            fi
          done
          for file in compile.log assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file result]"
              grep -E 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)' "$DIR/$file" | tail -n 180 || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-runtime-route-fix-r2-diagnose
          path: ${{ runner.temp }}/tv-route-fix
          if-no-files-found: ignore
          retention-days: 7
