name: Nustrim TV V2.2 Continue Watching Resume P1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-v2-2-continue-watching-resume-p1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.28.0-tv-v2.2-resume"
  LIVE_STORE_SHA: "8b7bce3be0b40f3e1f383d3a82ca0aeee3891128a55704874977ec257a69adee"
  LIVE_PLAYER_SHA: "1236898a807e9884f4465b5771d06351b6b68d5bd6a9376f8e7c0481e70bfb24"
  LIVE_DETAILS_SHA: "1b932466f8238d312e3cd04b6b1a10043b7eee05ee1bf58408543431c53c6dd9"
  LIVE_HOME_SHA: "5eba86011e750e8fc0b6138c31f7f8c1512a033bd47b659f61863fe2829b5de9"
  LIVE_SHELL_SHA: "00f5ca7809e4db0d7e4aaefe540ee631a3319a69a33d900e53a2236d5a8a3a85"

jobs:
  v22:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact V2.1-C live preflight
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v22"
          mkdir -p "$DIR"

          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"

          for file in "$STORE" "$PLAYER" "$DETAILS" "$HOME" "$SHELL"; do
            test -f "$file"
          done
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          test -f app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'versionName = "0.27.2-tv-v2.1c-controlbar"' app/build.gradle.kts

          declare -A EXPECTED
          EXPECTED["$STORE"]="$LIVE_STORE_SHA"
          EXPECTED["$PLAYER"]="$LIVE_PLAYER_SHA"
          EXPECTED["$DETAILS"]="$LIVE_DETAILS_SHA"
          EXPECTED["$HOME"]="$LIVE_HOME_SHA"
          EXPECTED["$SHELL"]="$LIVE_SHELL_SHA"

          for file in "${!EXPECTED[@]}"; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            expected="${EXPECTED[$file]}"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Live baseline drift: $file"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          done

          grep -q 'class LocalMediaStore' "$STORE"
          grep -q 'fun recordProgress(' "$STORE"
          grep -q 'fun resumePosition(' "$STORE"
          grep -q 'private fun TvPlayerControlButton(' "$PLAYER"
          grep -q 'autoNextCountdown' "$PLAYER"
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'SubtitleSourceAggregator(context)' "$DETAILS"
          grep -q 'private fun TvContinueCard(' "$HOME"
          grep -q 'TvDestination.HOME -> TvHomeScreen(' "$SHELL"

          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt "$DIR/StreamAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt "$DIR/SubtitleAggregator.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt "$DIR/InstalledSourceStore.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt "$DIR/UiPreferences.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt "$DIR/NustrimApp.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt "$DIR/Search.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt "$DIR/Library.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt "$DIR/Settings.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.before"

          {
            echo "NUSTRIM TV V2.2 CONTINUE WATCHING + RESUME P1"
            echo "============================================="
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts
            grep -m1 'versionName' app/build.gradle.kts
          } | tee "$DIR/preflight.txt"

      - name: Write V2.2 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          files = {
              Path("app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"):
                  "",
              Path("app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"):
                  "",
          }
          
          for path, payload in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print("WRITE:", path)
          PY

      - name: Set V2.2 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("Could not parse app version.")
          
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{target}"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: V2.2 architecture and Nuvio-parity audit
        shell: bash
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/tv-v22"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"

          echo "AUDIT VERSION: TV-V2.2-CONTINUE-WATCHING-RESUME-P1"

          # Continue Watching state model.
          grep -q 'val nextUp: Boolean = false' "$STORE"
          grep -q 'val hasContinueState: Boolean' "$STORE"
          grep -q '.filter { it.hasContinueState }' "$STORE"
          grep -q 'nextEpisode: MediaEpisode? = null' "$STORE"
          grep -q 'shouldQueueNext' "$STORE"
          grep -q '.put("nextUp", entry.nextUp)' "$STORE"
          grep -q 'nextUp = obj.optBoolean("nextUp", false)' "$STORE"

          # Player progress / resume.
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"
          grep -q 'player.seekTo(startPositionMs)' "$PLAYER"
          grep -q 'fun reportProgress(' "$PLAYER"
          grep -q 'abs(current - lastProgressReportMs) >= 5_000L' "$PLAYER"
          grep -q 'completed = true' "$PLAYER"
          grep -q 'if (!playbackCompleted)' "$PLAYER"

          # V2.1-C player controls cannot regress.
          grep -q 'private fun TvPlayerControlButton(' "$PLAYER"
          grep -q 'id = "previous"' "$PLAYER"
          grep -q 'id = "play"' "$PLAYER"
          grep -q 'id = "next"' "$PLAYER"
          grep -q 'id = "audio"' "$PLAYER"
          grep -q 'id = "subtitles"' "$PLAYER"
          grep -q 'id = "sources"' "$PLAYER"
          grep -q 'autoNextCountdown' "$PLAYER"
          grep -q 'setSubtitleConfigurations(subtitleConfigurations)' "$PLAYER"

          # Details resumes exact stored episode/season.
          grep -q 'val storedContinueEpisode' "$DETAILS"
          grep -q 'val storedContinueSeason' "$DETAILS"
          grep -q 'selectedSeason = storedContinueSeason ?: seasons.firstOrNull()' "$DETAILS"
          grep -q 'val resumeActionLabel' "$DETAILS"
          grep -q 'autoPlay = true' "$DETAILS"
          grep -q 'startPositionMs = mediaStore.resumePosition(' "$DETAILS"
          grep -q 'mediaStore.recordProgress(' "$DETAILS"
          grep -q 'nextEpisode = if (completed) nextEpisode else null' "$DETAILS"

          # Existing source aggregation stays intact.
          grep -q 'StreamSourceAggregator(context)' "$DETAILS"
          grep -q 'SubtitleSourceAggregator(context)' "$DETAILS"

          # Home parity: immediate refresh + landscape CW card + status/progress.
          grep -q 'refreshToken: Int = 0' "$HOME"
          grep -q 'remember(loading, reloadToken, refreshToken)' "$HOME"
          grep -q 'Next up ·' "$HOME"
          grep -q 'Resume ·' "$HOME"
          grep -q '.width(260.dp)' "$HOME"
          grep -q '.height(146.dp)' "$HOME"
          grep -q '.height(4.dp)' "$HOME"
          grep -q 'refreshToken = libraryRefreshToken' "$SHELL"

          # Protect unrelated stable code.
          cmp "$DIR/StreamAggregator.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/StreamSourceAggregator.kt
          cmp "$DIR/SubtitleAggregator.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/SubtitleSourceAggregator.kt
          cmp "$DIR/InstalledSourceStore.before.kt" app/src/main/java/app/nudroidlabs/nustrim/core/source/InstalledSourceStore.kt
          cmp "$DIR/UiPreferences.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt
          cmp "$DIR/NustrimApp.before.kt" app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt
          cmp "$DIR/Search.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchScreen.kt
          cmp "$DIR/Library.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/library/TvLibraryScreen.kt
          cmp "$DIR/Settings.before.kt" app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update             -type f -print0 | sort -z | xargs -0 sha256sum             > "$DIR/updater.after"
          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.28.0-tv-v2.2-resume"' app/build.gradle.kts
          grep -q 'minSdk = 23' app/build.gradle.kts

          git diff --check
          git diff --name-status | tee "$DIR/changed-files.txt"

          unexpected="$(
            git diff --name-only |
            grep -v -E               '^(app/build.gradle.kts|app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt|app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt)$'               || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git diff > "$DIR/v22.patch"

          echo "PASS: player periodically persists real playback progress"
          echo "PASS: resume seeks before playback starts"
          echo "PASS: Continue Watching refreshes when Details closes"
          echo "PASS: series resume restores stored season + episode"
          echo "PASS: Continue Watching resume auto-selects playable source"
          echo "PASS: completed episode becomes Next up when another episode exists"
          echo "PASS: exiting early during Next up does not erase the row"
          echo "PASS: completed final episode leaves Continue Watching"
          echo "PASS: Nuvio-style landscape progress/status presentation"
          echo "PASS: V2.1-C controls / Sources / subtitles preserved"

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v22/compile.log"

      - name: Unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v22/tests.log"

      - name: Release lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v22/lint-release.log"

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace             --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-v22/assemble.log"

      - name: Commit and push V2.2
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-v22/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt             app/build.gradle.kts

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): add continue watching resume progress"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-v22/remote-main.txt"

          python3 - <<'PY'
          import subprocess
          
          target = "0.28.0-tv-v2.2-resume"
          
          def show(path):
              return subprocess.check_output(
                  ["git", "show", f"origin/main:{path}"],
                  text=True,
              )
          
          store = show("app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt")
          player = show("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt")
          details = show("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          home = show("app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt")
          shell = show("app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt")
          gradle = show("app/build.gradle.kts")
          
          checks = {
              "next-up persistence":
                  "val nextUp: Boolean = false" in store and
                  "hasContinueState" in store,
              "continue includes next-up":
                  ".filter { it.hasContinueState }" in store,
              "progress record next episode":
                  "nextEpisode: MediaEpisode? = null" in store and
                  "shouldQueueNext" in store,
              "resume start position":
                  "startPositionMs: Long = 0L" in player and
                  "player.seekTo(startPositionMs)" in player,
              "progress callback":
                  "onProgress: ((Long, Long, Boolean) -> Unit)? = null" in player and
                  "reportProgress(" in player,
              "completion reported":
                  "completed = true" in player,
              "control bar retained":
                  'id = "play"' in player and
                  'id = "audio"' in player and
                  'id = "subtitles"' in player,
              "continue episode restored":
                  "storedContinueEpisode" in details and
                  "storedContinueSeason" in details,
              "continue autoplay":
                  "autoPlay = true" in details and
                  "resumeActionLabel" in details,
              "progress wired to store":
                  "mediaStore.recordProgress(" in details and
                  "nextEpisode = if (completed) nextEpisode else null" in details,
              "home immediate refresh":
                  "refreshToken: Int = 0" in home and
                  "remember(loading, reloadToken, refreshToken)" in home,
              "home next-up UI":
                  "Next up ·" in home and
                  "progressFraction * 100" in home,
              "shell refresh wiring":
                  "refreshToken = libraryRefreshToken" in shell,
              "version":
                  f'versionName = "{target}"' in gradle,
          }
          
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(
                  "REMOTE V2.2 VERIFY FAILED: " + ", ".join(failed)
              )
          
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-v22/signed-run.txt"

      - name: Wait signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-v22/signed-build-watch.log"

      - name: Verify published V2.2
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/tv-v22/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.28.0-tv-v2.2-resume' "$MANIFEST" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.28.0-tv-v2.2-resume' "$MANIFEST"
          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-v22/published-update.json"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-v22"

          echo "========== Nustrim TV V2.2 P1 =========="
          echo "RESULT: FAILED"

          for f in             preflight.txt             changed-files.txt             remote-main.txt             signed-run.txt             published-update.json; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              cat "$DIR/$f" || true
            fi
          done

          for f in             compile.log             tests.log             lint-release.log             assemble.log             push.log             signed-build-watch.log; do
            if [[ -f "$DIR/$f" ]]; then
              echo
              echo "===== $f ====="
              tail -n 360 "$DIR/$f" || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2-2-continue-watching-resume-p1-diagnose
          path: ${{ runner.temp }}/tv-v22
          if-no-files-found: ignore
          retention-days: 7
