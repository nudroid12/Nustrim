name: Nustrim TV Cleanroom S12.20 CloudStream TV Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-20-cloudstream-tv
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.19-tv-cleanroom-s12.20-cloudstream-tv"
  TARGET_VERSION_CODE: "142"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.19 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.18-tv-cleanroom-s12.19-cloudstream-speed"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.20 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.20-cloudstream-tv' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-20-cloudstream-tv.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | gzip -d > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify boundary, payload and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderLocator.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderSession.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/cloudstream/TvCloudStreamBridge.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt",
              "scripts/verify_tv_cloudstream_tv_s12_20.py",
              "scripts/verify_tv_cloudstream_speed_s12_19.py",
              "scripts/verify_tv_sources_live_tabs_s12_18.py",
              "scripts/verify_tv_episode_titles_s12_17.py",
              "scripts/verify_tv_settings_parity_s12_11.py",
              "scripts/verify_tv_subtitle_panel_s12_16.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.20 changed files outside CloudStream TV boundary: " + ", ".join(unexpected))

          expected_hashes = {
              ".nustrim-tv": "d0e04cde3e5d809f078f9599d7c555a3b8a581277cfa5696d7a6a9218221e944",
              ".nustrim-version": "3f359f05355cd38dfeab902a29996507637af70822ba72bbaca87dcf5d407497",
              "app/build.gradle.kts": "2809f4ccd16344d271451653563daa137dd1c875580755c2fc4a8d2ba3939f2e",
              "app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt": "5f42dbd949bef2ba8d3b2719fa37e4a684a7c962fcad97c3514c7d759a1e498b",
              "app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt": "29be8fa2ae59e1f25b94a7388b3544c238f26dc278e44f9fa2120e39b2202fc8",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderLocator.kt": "5ec7561cf6e9d6e5017e7077f4622c65c4f89e4e9ff6390e16e5855eef7d9c2c",
              "app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderSession.kt": "9e0e28bea04b6e8d8e3be84b7ec76a0c3b53980297e72ac1643701f6f7b90027",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/cloudstream/TvCloudStreamBridge.kt": "20f895f133b2de810cd49b2460ddd48a9ed7a54b82edbd2529f40282aa11838a",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt": "37519742e03a44fecb90f429f713dc19aca9813b3511ec4af4d2800f436be398",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt": "b5f89f5dfba35892294d22d237827685ec28facd5b584e92638e25711a974002",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt": "e933b64ed640f2758f88945554506cf9fb9ac0a4e87bbebc4ec26b3b47df35f5",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt": "2a3421040733fbd1bf694192e255ecb0e3cc96f09aefd14515558e7d6f3e70eb",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchModels.kt": "c0a3d8eeef49c80d64f7a3a53a7c88ca196f1a459f18ff0ed5d71823b82323d7",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchRepository.kt": "f960903748a34d7035e5821feec45df51b901f3daabe0cb3cc4510c52fdb883e",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt": "c94ff7ccddb59d411c4fdb74c0b213e10dc28d3fe371cb0861654701404887f9",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt": "8b1e9f4464d6319577df2b1863ca6a1780ddfbbd7b5220f42cf7c81bb2b90370",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt": "cbc5ac77daa193b8144ec2a50c851810915985dd371b85000c79de9917f0d053",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt": "cdcb3975a9e55c26edba06eb309b9a97202aae661007359a0f4202e35438d98f",
              "scripts/verify_tv_cloudstream_tv_s12_20.py": "48309e55471c36834b5d43eb3b0fa58e72c19c5f6118ba9e7d0ccc1d53a10a5a",
              "scripts/verify_tv_cloudstream_speed_s12_19.py": "a828df28ec7a312558c353ce95d9146eaad19676295e94fdcc3e431eb309735d",
              "scripts/verify_tv_sources_live_tabs_s12_18.py": "cfdfc2018a16da616dbd3de5d6c0b356771fee6dbe15e733f05c93595b47e7b3",
              "scripts/verify_tv_episode_titles_s12_17.py": "8e1c08a11f1214151cf205a785899780d605d68639087d64a567c701acfc1f1c",
              "scripts/verify_tv_settings_parity_s12_11.py": "fa644c591782d777a88bc08f83aaed4a7de80c6633e68d7283b823140c5c62f9",
              "scripts/verify_tv_subtitle_panel_s12_16.py": "44776e99c6b37423903d5dc0d076e2a1937923a3841f1ee62f21508ced0268ad",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.20 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_cloudstream_tv_s12_20.py
          python3 scripts/verify_tv_cloudstream_speed_s12_19.py
          python3 scripts/verify_tv_sources_live_tabs_s12_18.py
          python3 scripts/verify_tv_episode_titles_s12_17.py
          python3 scripts/verify_tv_subtitle_panel_s12_16.py
          python3 scripts/verify_tv_settings_parity_s12_11.py
          python3 scripts/verify_tv_parity_s11.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-20-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-20-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-20-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.20 makes CloudStream repositories fully usable on TV across Search, Details, Sources, subtitles and Content Manager.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.20 CloudStream TV",
              "issue": "S12-CLOUDSTREAM-TV-01",
              "status": "build-verified",
              "changes": [
                  "search enabled CloudStream providers from the TV Search screen",
                  "route provider results through Details and directly into playable Sources",
                  "attach CloudStream extracted subtitle tracks to playback streams",
                  "manage individual CloudStream providers under Content Manager Add-ons",
                  "hide repository package cards from Home and keep provider identity stable"
              ],
              "preserved": ["S12.19 CloudStream caches and provider priority", "S12.18 playable-only provider tabs", "S12.17 catalog episode titles", "S12.16 subtitle panel", "SmartSubs", "Mobile UI", "signed updater"],
              "deviceAcceptance": "pending"
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-cloudstream-tv-s12-20-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.20 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-tv \
            .nustrim-version \
            app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt \
            app/src/main/java/app/nudroidlabs/nustrim/core/model/MediaModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderLocator.kt \
            app/src/main/java/app/nudroidlabs/nustrim/core/source/cloudstream/CloudStreamProviderSession.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/cloudstream/TvCloudStreamBridge.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/search/TvSearchRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/sources/TvSourcesRepository.kt \
            scripts/verify_tv_cloudstream_tv_s12_20.py \
            scripts/verify_tv_cloudstream_speed_s12_19.py \
            scripts/verify_tv_sources_live_tabs_s12_18.py \
            scripts/verify_tv_episode_titles_s12_17.py \
            scripts/verify_tv_settings_parity_s12_11.py \
            scripts/verify_tv_subtitle_panel_s12_16.py
          if git diff --cached --quiet; then
            echo "S12.20 source is already committed."
          else
            git commit -m "Enable full CloudStream TV flow S12.20 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-20-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.20 makes enabled CloudStream repositories fully usable from the TV Search screen through Details, Sources and playback." "" \
            "Individual providers can be enabled or disabled under Content Manager, and extracted subtitle tracks are attached to playable links." "" \
            "S12.19 caches and priority, S12.18 playable-only tabs, catalog episode titles, SmartSubs and Mobile UI are preserved." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-cloudstream-tv-s12-20-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-20-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-cloudstream-tv-s12-20-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-20-cloudstream-tv-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-cloudstream-tv-s12-20-report.json
            ${{ runner.temp }}/nustrim-s12-20-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-20-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-20-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-20-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-cloudstream-tv-s12-20-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-20-cloudstream-tv-diagnose
          path: ${{ runner.temp }}/nustrim-s12-20-diagnose
          if-no-files-found: warn
          retention-days: 7
