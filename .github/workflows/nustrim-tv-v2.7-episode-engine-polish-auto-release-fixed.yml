      - name: Bump V2.7 polish version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")
          if code.group(1) != "89" or name.group(1) != "0.34.0-tv-v2.7-home-nuvio-visual-p1":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 90', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.34.1-tv-v2.7-episode-engine-polish"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify Episode Engine contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          exec > >(tee "$D/contract.log") 2>&1
          BUILD="app/build.gradle.kts"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          ENGINE="app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt"

          test "$(sha256sum "$BUILD" | awk '{print $1}')" = "$TARGET_BUILD_SHA256"
          test "$(sha256sum "$DETAILS" | awk '{print $1}')" = "$TARGET_DETAILS_SHA256"
          test "$(sha256sum "$STORE" | awk '{print $1}')" = "$TARGET_STORE_SHA256"
          test "$(sha256sum "$ENGINE" | awk '{print $1}')" = "$TARGET_ENGINE_SHA256"
          test "$(sha256sum "$HOME" | awk '{print $1}')" = "$BASE_HOME_SHA256"

          grep -Fq 'versionCode = 90' "$BUILD"
          grep -Fq 'versionName = "0.34.1-tv-v2.7-episode-engine-polish"' "$BUILD"
          grep -Fq 'EpisodeEngine.polish(resolvedEpisodes)' "$DETAILS"
          grep -Fq 'private fun episodeHasWatchedMark(' "$DETAILS"
          grep -Fq 'stored.episodeId == episode.id' "$DETAILS"
          grep -Fq 'private val COLON_PAIR' "$ENGINE"
          grep -Fq 'private val SEASON_EPISODE' "$ENGINE"
          grep -Fq 'private val X_PAIR' "$ENGINE"
          grep -Fq 'private val EPISODE_ONLY' "$ENGINE"
          grep -Fq '.distinctBy(::identityKey)' "$ENGINE"
          grep -Fq 'season == 0 -> SPECIALS_SORT_KEY' "$ENGINE"
          grep -Fq 'episodeWatchedStorageIdPrefix' "$STORE"

          if grep -Fq 'compareBy<MediaEpisode>(' "$DETAILS"; then
            echo "::error::Legacy Details episode sorter is still present."
            exit 41
          fi

          changed="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected changed-file set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$changed"
            exit 42
          fi
          git diff --check

      - name: Compile and lint gates
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/verify.log"

      - name: Save patch evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt "$D/EpisodeEngine.after.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.after.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt "$D/LocalMediaStore.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/episode-engine-polish.diff"
          sha256sum             app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/build.gradle.kts > "$D/target-sha256.txt"

          cat > "$D/summary.txt" <<'EOF_SUMMARY'
          Nustrim TV V2.7 Episode Engine Polish
          =====================================
          Baseline: 0.34.0-tv-v2.7-home-nuvio-visual-p1 (89)
          Target:   0.34.1-tv-v2.7-episode-engine-polish (90)

          Fixes:
          - deterministic numeric episode ordering
          - infer missing season/episode numbers from Stremio IDs and common title formats
          - explicit provider metadata always wins over inferred hints
          - regular seasons sort before Specials
          - duplicate resolved season/episode slots are collapsed deterministically
          - Continue Watching and progress matching survive metadata normalisation by episode ID
          - watched-state aliases migrate safely when inferred numbering becomes available
          - Details Next/Previous uses the same polished episode sequence

          QA target:
          - Ted Lasso Season 1 begins E1, E2, E3, not E10, E11
          - switching seasons starts the row at the first ordered episode
          - resume, watched state, long press options and player Next/Previous remain intact

          Preserved:
          - V2.7 Home Nuvio Visual P1 source unchanged
          - Search unchanged
          - Library unchanged
          - Settings unchanged
          - signing and updater pipeline unchanged
          EOF_SUMMARY

      - name: Commit only after compile and lint pass
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt             app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt

          git diff --cached --check
          git commit -m 'tv: v2.7 polish episode engine ordering'
          git push origin HEAD:main

      - name: Prepare permanent signing
        if: success()
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 50
            fi
          done

          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          LOCKED_CERT="30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
          test "$CERT" = "$LOCKED_CERT"

          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          gradle --no-daemon --build-cache             :app:testDebugUnitTest             :app:assembleRelease             --stacktrace             --console=plain             2>&1 | tee "$D/release-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$D/signature.txt"
          CERT="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$D/signature.txt" |
            head -1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$NUSTRIM_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"

          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$CODE" = "90"
          test "$NAME" = "0.34.1-tv-v2.7-episode-engine-polish"

          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare updater assets
        if: success()
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          CERT_SHA: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          export VERSION_CODE VERSION_NAME CERT_SHA
          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]

          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = f"v{name}"

          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "V2.7 Episode Engine Polish: numeric episode ordering, metadata inference, stable dedupe, Specials ordering, watched-state compatibility and consistent Next/Previous sequencing.",
              "sizeBytes": apk.stat().st_size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"apk={apk.name}\n")
              out.write(f"sha256={sha}\n")
          PY_ASSETS

      - name: Publish Nustrim release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          NOTES="Nustrim $VERSION. V2.7 Episode Engine Polish fixes deterministic episode ordering and metadata normalisation."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes "$NOTES" --latest
            gh release upload "$TAG" "$APK" update.json --clobber
          else
            gh release create "$TAG" "$APK" update.json               --target "$TARGET_SHA"               --title "Nustrim $VERSION"               --notes "$NOTES"               --latest
          fi

      - name: Verify published updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
          EXPECTED_CERT: ${{ steps.apk.outputs.cert_sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"

          LIVE="$RUNNER_TEMP/nustrim-v27-episode-engine/live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"
          gh release download "$TAG"             --pattern update.json             --pattern "$APK"             --dir "$LIVE"             --clobber

          LIVE_SHA="$(sha256sum "$LIVE/$APK" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          export LIVE APK EXPECTED_SHA EXPECTED_CERT

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["LIVE"])
          apk = root / os.environ["APK"]
          manifest = json.loads((root / "update.json").read_text(encoding="utf-8"))
          assert int(manifest["versionCode"]) == 90
          assert manifest["versionName"] == "0.34.1-tv-v2.7-episode-engine-polish"
          assert manifest["signingMode"] == "permanent"
          assert manifest["signingCertSha256"].upper() == os.environ["EXPECTED_CERT"].upper()
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          assert manifest["sha256"] == sha
          print("Updater verified:", manifest["versionName"], manifest["versionCode"])
          PY_VERIFY

      - name: Collect failure context
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt "$D/EpisodeEngine.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.current.kt" 2>/dev/null || true
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt "$D/LocalMediaStore.current.kt" 2>/dev/null || true
          cp update.json "$D/update.current.json" 2>/dev/null || true
          git status --short > "$D/git-status.txt" 2>&1 || true
          git diff > "$D/git-diff.txt" 2>&1 || true
          git log -8 --oneline > "$D/recent-commits.txt" 2>&1 || true
          {
            echo "Failure bundle collected."
            echo "Inspect verify.log for compile or lint failures."
            echo "Inspect release-build.log for signed build failures."
            echo "Inspect contract.log for contract failures."
            echo "Inspect git-diff.txt and git-status.txt for changed-file context."
          } > "$D/README.txt"

      - name: Upload diagnose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.7-episode-engine-polish-diagnose
          path: ${{ runner.temp }}/nustrim-v27-episode-engine
          if-no-files-found: error
          retention-days: 14
