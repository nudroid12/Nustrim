name: Nustrim TV V2.7 Episode Engine Polish Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-7-episode-engine-polish
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.34.0-tv-v2.7-home-nuvio-visual-p1"
  BASE_VERSION_CODE: "89"
  TARGET_VERSION_NAME: "0.34.1-tv-v2.7-episode-engine-polish"
  TARGET_VERSION_CODE: "90"
  BASE_BUILD_SHA256: "6064d34090f3366041a8f263cd8ba060cf179403b97394ac6933d39392996c6d"
  BASE_DETAILS_SHA256: "4e34f71afd8cd07d937e4137d803cfa786632e3662021f4be5054d854f2488e2"
  BASE_STORE_SHA256: "2b3c005a8dbbd661114cc23f3473e3cd649b8113a29f09bddd64b2af9e232df4"
  BASE_HOME_SHA256: "98bf971d3ab9847b133dee7dfc4e6e15dca1a3bf2be901ec894a72a16324eb29"
  TARGET_BUILD_SHA256: "5ad15a3e1f52f965a3881ed74a60c9966f1fb2bc347a98e7dd01baaaeb54e220"
  TARGET_DETAILS_SHA256: "3312436568e7ab7d3558f6fa679a7d3500c390acc837032477d0f15f12ab0818"
  TARGET_STORE_SHA256: "fb0813f712b486713e9f4949b2b1cce993e2d69f74b930774b356d7c3d17e6ae"
  TARGET_ENGINE_SHA256: "4478c4b92cb09ae149bf260c9017f1e55b5cbdca7e3af3858d48683915c428d1"

jobs:
  episode_engine:
    name: Build and publish Episode Engine Polish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Initialise diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          mkdir -p "$D"
          {
            echo "workflow=Nustrim TV V2.7 Episode Engine Polish"
            echo "run_id=$GITHUB_RUN_ID"
            echo "initial_sha=${GITHUB_SHA:-unknown}"
          } > "$D/run-info.txt"

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/nustrim-v27-episode-engine/base-commit.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact current-main preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          BUILD="app/build.gradle.kts"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          STORE="app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          ENGINE="app/src/main/java/app/nudroidlabs/nustrim/core/model/EpisodeEngine.kt"

          for file in "$BUILD" "$DETAILS" "$STORE" "$HOME"; do
            test -f "$file"
          done

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          build_sha="$(sha256sum "$BUILD" | awk '{print $1}')"
          details_sha="$(sha256sum "$DETAILS" | awk '{print $1}')"
          store_sha="$(sha256sum "$STORE" | awk '{print $1}')"
          home_sha="$(sha256sum "$HOME" | awk '{print $1}')"
          engine_sha="missing"
          if [ -f "$ENGINE" ]; then
            engine_sha="$(sha256sum "$ENGINE" | awk '{print $1}')"
          fi

          echo "Live version: $name ($code)"
          echo "Build SHA:   $build_sha"
          echo "Details SHA: $details_sha"
          echo "Store SHA:   $store_sha"
          echo "Home SHA:    $home_sha"
          echo "Engine SHA:  $engine_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$build_sha" = "$TARGET_BUILD_SHA256" ] &&              [ "$details_sha" = "$TARGET_DETAILS_SHA256" ] &&              [ "$store_sha" = "$TARGET_STORE_SHA256" ] &&              [ "$engine_sha" = "$TARGET_ENGINE_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "Episode Engine Polish is already applied exactly."
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi
          test "$build_sha" = "$BASE_BUILD_SHA256" || { echo "::error::Build baseline mismatch."; exit 21; }
          test "$details_sha" = "$BASE_DETAILS_SHA256" || { echo "::error::Details baseline mismatch."; exit 22; }
          test "$store_sha" = "$BASE_STORE_SHA256" || { echo "::error::LocalMediaStore baseline mismatch."; exit 23; }
          test "$home_sha" = "$BASE_HOME_SHA256" || { echo "::error::Home V2.7 baseline mismatch."; exit 24; }
          test ! -e "$ENGINE" || { echo "::error::EpisodeEngine.kt already exists on baseline."; exit 25; }

      - name: Save exact before state
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-v27-episode-engine"
          cp app/build.gradle.kts "$D/build.gradle.before.kts"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.before.kt"
          cp app/src/main/java/app/nudroidlabs/nustrim/core/library/LocalMediaStore.kt "$D/LocalMediaStore.before.kt"

