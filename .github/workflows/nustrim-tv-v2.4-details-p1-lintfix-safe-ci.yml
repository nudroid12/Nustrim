          test "$actual" = "$TARGET_DETAILS_SHA256"

      - name: Bump lint-fix version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)

          if code.group(1) != "83" or name.group(1) != "0.30.0-tv-v2.4-details-episodes-p1":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 84', text, count=1)
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.30.1-tv-v2.4-details-episodes-p1-lintfix"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify lint fix contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

          grep -Fq 'val episodeRequester = remember(focusKey)' "$DETAILS"
          grep -Fq 'FocusRequester().also { requester ->' "$DETAILS"
          grep -Fq 'episodeFocusRequesters[focusKey] = requester' "$DETAILS"
          ! grep -Fq '.getOrPut(focusKey) { FocusRequester() }' "$DETAILS"

          grep -Fq 'versionCode = 84' app/build.gradle.kts
          grep -Fq 'versionName = "0.30.1-tv-v2.4-details-episodes-p1-lintfix"' app/build.gradle.kts

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile Kotlin gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-details-p1-lintfix"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             :app:compileReleaseKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Release lint gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-details-p1-lintfix"
          gradle --no-daemon --build-cache             :app:lintRelease             --stacktrace             --console=plain             2>&1 | tee "$D/lint-release.log"

      - name: Save evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-details-p1-lintfix"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/details-p1-lintfix.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt > "$D/details-sha256.txt"

          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.4 Details P1 lint fix
          ====================================
          Baseline: 0.30.0-tv-v2.4-details-episodes-p1 (83)
          Target:   0.30.1-tv-v2.4-details-episodes-p1-lintfix (84)

          Fix:
          - FocusRequester is created with remember(focusKey)
          - requester is then registered in episodeFocusRequesters
          - fixes Compose RememberInComposition lint failure
          - release lint now runs before commit
          - no player logic changed
          EOF

      - name: Commit only after compile and lint pass
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt
          git diff --cached --check
          git commit -m 'tv: fix Details P1 FocusRequester lint'
          git push origin HEAD:main

      - name: Safe CI completion summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Details P1 lint fix complete"
            echo
            echo "- Kotlin compile passed."
            echo "- Release lint passed."
            echo "- No workflow dispatch was performed."
            echo
            echo "Now manually run **Build Nustrim Clean** with **publish_release = true**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-details-p1-lintfix"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt "$D/TvDetailsScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-v2.4-details-p1-lintfix-diagnose
          path: ${{ runner.temp }}/nustrim-details-p1-lintfix
          if-no-files-found: warn
          retention-days: 14
