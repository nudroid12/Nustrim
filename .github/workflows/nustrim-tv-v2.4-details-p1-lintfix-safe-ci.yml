name: Nustrim TV V2.4 Details P1 Lint Fix Safe CI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-v2-4-details-p1-lintfix
  cancel-in-progress: false

env:
  BASE_VERSION_NAME: "0.30.0-tv-v2.4-details-episodes-p1"
  BASE_VERSION_CODE: "83"
  TARGET_VERSION_NAME: "0.30.1-tv-v2.4-details-episodes-p1-lintfix"
  TARGET_VERSION_CODE: "84"
  BASE_DETAILS_SHA256: "1a09d83e21632c14c60e31d3da92c1ca6a84779da0c419f160602b94af821343"
  TARGET_DETAILS_SHA256: "1221e028ed34e9674c57a844861b4d660d55b1354992ecb063bcf472e547d0f9"

jobs:
  lintfix:
    name: Fix Compose focus requester, compile and lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Exact P1 preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          BUILD="app/build.gradle.kts"

          code="$(sed -n -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD" | head -1)"
          name="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD" | head -1)"
          details_sha="$(sha256sum "$DETAILS" | awk '{print $1}')"

          echo "Live version: $name ($code)"
          echo "Details SHA-256: $details_sha"

          if [ "$name" = "$TARGET_VERSION_NAME" ] &&              [ "$code" = "$TARGET_VERSION_CODE" ] &&              [ "$details_sha" = "$TARGET_DETAILS_SHA256" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"

          if [ "$name" != "$BASE_VERSION_NAME" ] || [ "$code" != "$BASE_VERSION_CODE" ]; then
            echo "::error::Wrong baseline. Expected $BASE_VERSION_NAME ($BASE_VERSION_CODE), got $name ($code)."
            exit 20
          fi

          if [ "$details_sha" != "$BASE_DETAILS_SHA256" ]; then
            echo "::error::TvDetailsScreen.kt does not match exact Details P1 baseline."
            echo "expected=$BASE_DETAILS_SHA256"
            echo "actual=$details_sha"
            exit 21
          fi

      - name: Apply Compose lint fix
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"

