name: Nustrim TV Stage 5 Player R1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nustrim-tv-stage5-player-r1
  cancel-in-progress: false

env:
  TARGET_VERSION: "0.23.0-tv-stage5"

jobs:
  stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Stage 5 preflight
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage5"
          mkdir -p "$DIR"

          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"
          PLAYER_FACTORY="app/src/main/java/app/nudroidlabs/nustrim/core/player/PlayerFactory.kt"

          test -f "$APP"
          test -f "$PREFS"
          test -f "$HOME"
          test -f "$DETAILS"
          test -f "$SHELL"
          test -f "$PLAYER_FACTORY"
          test -f .github/workflows/build.yml
          test -d app/src/main/java/app/nudroidlabs/nustrim/core/update

          grep -q 'private fun TvSourcesStage4Modal(' "$DETAILS"
          grep -q 'session.loadStreams(' "$DETAILS"
          grep -q 'selectedStreamUrl = stream.url' "$DETAILS"

          grep -R -q 'androidx.media3'             "$PLAYER_FACTORY"             "$APP"
          grep -R -q 'PlayerView'             "$PLAYER_FACTORY"             "$APP"
          grep -R -q 'ExoPlayer'             "$PLAYER_FACTORY"             "$APP"

          cp "$APP" "$DIR/NustrimApp.before.kt"
          cp "$PREFS" "$DIR/UiPreferences.before.kt"
          cp "$HOME" "$DIR/TvHomeScreen.before.kt"
          cp "$SHELL" "$DIR/TvShell.before.kt"

          sha256sum .github/workflows/build.yml > "$DIR/build.before"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.before"

          gradle --no-daemon             :app:dependencies             --configuration debugRuntimeClasspath             --console=plain             > "$DIR/dependencies.txt"

          grep -q 'androidx.media3:media3-exoplayer' "$DIR/dependencies.txt"
          grep -q 'androidx.media3:media3-ui' "$DIR/dependencies.txt"
          grep -q 'androidx.media3:media3-exoplayer-hls' "$DIR/dependencies.txt"

          {
            echo "TV STAGE 5 PLAYER"
            echo "================="
            echo "sha=$(git rev-parse HEAD)"
            grep -m1 'versionCode' app/build.gradle.kts || true
            grep -m1 'versionName' app/build.gradle.kts || true
            echo
            echo "[Media3 runtime]"
            grep 'androidx.media3:media3-' "$DIR/dependencies.txt"               | sort -u | head -n 100 || true
            echo
            echo "[PlayerFactory neutral core]"
            sed -n '1,260p' "$PLAYER_FACTORY" || true
          } | tee "$DIR/preflight.txt"

      - name: Write TV Player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(""))
          print("WRITE:", path)
          PY

      - name: Wire Sources to Player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          
          DETAILS = Path("app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt")
          text = DETAILS.read_text(encoding="utf-8")
          
          mutable_int_import = "import androidx.compose.runtime.mutableIntStateOf\\n"
          if mutable_int_import not in text:
              anchor = "import androidx.compose.runtime.mutableStateOf\\n"
              if anchor not in text:
                  raise SystemExit("mutableStateOf import anchor missing")
              text = text.replace(
                  anchor,
                  anchor + mutable_int_import,
                  1
              )
              print("ADDED: mutableIntStateOf import")
          
          def dec(value):
              return base64.b64decode(value).decode()
          
          required = [
              "private fun TvSourcesStage4Modal(",
              "session.loadStreams(",
              "private fun TvStreamRow(",
              "selectedStreamUrl = stream.url",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Stage 4 baseline missing: " + ", ".join(missing))
          
          player_import = "import app.nudroidlabs.nustrim.tv.player.TvPlayerScreen\n"
          if player_import not in text:
              anchor = "import app.nudroidlabs.nustrim.tv.home.TvHomeEntry\n"
              if anchor not in text:
                  raise SystemExit("TV import anchor missing")
              text = text.replace(anchor, anchor + player_import, 1)
          
          if "var playingStream by remember" not in text:
              old = dec("ICAgIHZhciByZXN0b3JlU291cmNlRm9jdXMgYnkgcmVtZW1iZXIoZW50cnkuc3RhYmxlS2V5KSB7CiAgICAgICAgbXV0YWJsZVN0YXRlT2YoZmFsc2UpCiAgICB9Cg==")
              new = dec("")
              if old not in text:
                  raise SystemExit("state anchor missing")
              text = text.replace(old, new, 1)
          
          if "playerReturnToken = sourcePlayerReturnToken" not in text:
              old = dec("")
              new = dec("")
              if old not in text:
                  raise SystemExit("modal call anchor missing")
              text = text.replace(old, new, 1)
          
          if "TvPlayerScreen(" not in text[text.find("fun TvDetailsScreen("):text.find("private fun TvDetailsBackdrop")]:
              old = dec("ICAgICAgICB9CiAgICB9CgogICAgTGF1bmNoZWRFZmZlY3Qoc291cmNlUHJldmlldywgcmVzdG9yZVNvdXJjZUZvY3VzKSB7Cg==")
              new = dec("")
              if old not in text:
                  raise SystemExit("player overlay anchor missing")
              text = text.replace(old, new, 1)
          
          if "playerReturnToken: Int" not in text:
              old = dec("cHJpdmF0ZSBmdW4gVHZTb3VyY2VzU3RhZ2U0TW9kYWwoCiAgICByZXF1ZXN0OiBUdlNvdXJjZVByZXZpZXdSZXF1ZXN0LAogICAgb25DbG9zZTogKCkgLT4gVW5pdCwKICAgIG1vZGlmaWVyOiBNb2RpZmllciA9IE1vZGlmaWVyCikgewo=")
              new = dec("cHJpdmF0ZSBmdW4gVHZTb3VyY2VzU3RhZ2U0TW9kYWwoCiAgICByZXF1ZXN0OiBUdlNvdXJjZVByZXZpZXdSZXF1ZXN0LAogICAgcGxheWVyUmV0dXJuVG9rZW46IEludCwKICAgIG9uUGxheVN0cmVhbTogKFN0cmVhbVNvdXJjZSkgLT4gVW5pdCwKICAgIG9uQ2xvc2U6ICgpIC0+IFVuaXQsCiAgICBtb2RpZmllcjogTW9kaWZpZXIgPSBNb2RpZmllcgopIHsK")
              if old not in text:
                  raise SystemExit("modal signature missing")
              text = text.replace(old, new, 1)
          
          if "onPlayStream(stream)" not in text:
              old = dec("ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgb25TZWxlY3RlZCA9IHsKICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIHNlbGVjdGVkU3RyZWFtVXJsID0gc3RyZWFtLnVybAogICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICB9Cg==")
              new = dec("ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgb25TZWxlY3RlZCA9IHsKICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIHNlbGVjdGVkU3RyZWFtVXJsID0gc3RyZWFtLnVybAogICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgb25QbGF5U3RyZWFtKHN0cmVhbSkKICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgfQo=")
              if old not in text:
                  raise SystemExit("stream selection anchor missing")
              text = text.replace(old, new, 1)
          
          if "LaunchedEffect(playerReturnToken)" not in text:
              old = dec("")
              new = dec("")
              if old not in text:
                  raise SystemExit("source focus tail missing")
              text = text.replace(old, new, 1)
          
          checks = [
              "import app.nudroidlabs.nustrim.tv.player.TvPlayerScreen",
              "var playingStream by remember",
              "playerReturnToken: Int",
              "onPlayStream: (StreamSource) -> Unit",
              "onPlayStream(stream)",
              "TvPlayerScreen(",
              "sourcePlayerReturnToken += 1",
              "LaunchedEffect(playerReturnToken)",
          ]
          missing = [x for x in checks if x not in text]
          if missing:
              raise SystemExit("Stage 5 contract failed: " + ", ".join(missing))
          
          DETAILS.write_text(
              re.sub(r'(?m)^[ \t]+$', '', text),
              encoding="utf-8"
          )
          print("PASS: Stage 5 player wired into Details/Sources")
          PY

      - name: Set Stage 5 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")
          target = os.environ["TARGET_VERSION"]
          cm = re.search(r'versionCode\s*=\s*(\d+)', text)
          nm = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not cm or not nm:
              raise SystemExit("version metadata missing")
          old_code = int(cm.group(1))
          old_name = nm.group(1)
          new_code = old_code if old_name == target else old_code + 1
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target}"', text, count=1)
          p.write_text(text, encoding="utf-8")
          print(f"versionName: {old_name} -> {target}")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Stage 5 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tv-stage5"
          APP="app/src/main/java/app/nudroidlabs/nustrim/ui/NustrimApp.kt"
          PREFS="app/src/main/java/app/nudroidlabs/nustrim/ui/UiPreferences.kt"
          HOME="app/src/main/java/app/nudroidlabs/nustrim/tv/home/TvHomeScreen.kt"
          DETAILS="app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"
          SHELL="app/src/main/java/app/nudroidlabs/nustrim/tv/shell/TvShell.kt"
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          echo "AUDIT VERSION: TV-STAGE5-PLAYER-R1-FIX1"

          test -f "$PLAYER"
          grep -q 'fun TvPlayerScreen(' "$PLAYER"
          grep -q 'ExoPlayer.Builder(context)' "$PLAYER"
          grep -q 'PlayerView(viewContext)' "$PLAYER"
          grep -q 'setDefaultRequestProperties(stream.headers)' "$PLAYER"
          grep -q 'setAllowCrossProtocolRedirects(true)' "$PLAYER"
          grep -q 'MimeTypes.APPLICATION_M3U8' "$PLAYER"
          grep -q 'seekBy(-10_000L)' "$PLAYER"
          grep -q 'seekBy(10_000L)' "$PLAYER"
          grep -q 'BackHandler(onBack = onBack)' "$PLAYER"
          grep -q 'Playback error' "$PLAYER"

          grep -q 'import androidx.compose.runtime.mutableIntStateOf' "$DETAILS"
          grep -q 'TvPlayerScreen(' "$DETAILS"
          grep -q 'onPlayStream(stream)' "$DETAILS"
          grep -q 'sourcePlayerReturnToken += 1' "$DETAILS"
          grep -q 'LaunchedEffect(playerReturnToken)' "$DETAILS"

          if grep -R -n -E             'import[[:space:]]+app\.nudroidlabs\.nustrim\.ui\.|NustrimApp|MobileNavItem'             app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::TV presentation imported/reused Mobile UI."
            exit 1
          fi

          if grep -R -n -E             'app\.nudroidlabs\.nustrim\.tv2|app\.nudroidlabs\.nustrim\.tv3'             app/src/main/java/app/nudroidlabs/nustrim/tv 2>/dev/null; then
            echo "::error::Legacy tv2/tv3 contamination detected."
            exit 1
          fi

          cmp "$DIR/NustrimApp.before.kt" "$APP"
          cmp "$DIR/UiPreferences.before.kt" "$PREFS"
          cmp "$DIR/TvHomeScreen.before.kt" "$HOME"
          cmp "$DIR/TvShell.before.kt" "$SHELL"

          sha256sum .github/workflows/build.yml > "$DIR/build.after"
          find app/src/main/java/app/nudroidlabs/nustrim/core/update -type f -print0             | sort -z | xargs -0 sha256sum > "$DIR/updater.after"

          cmp "$DIR/build.before" "$DIR/build.after"
          cmp "$DIR/updater.before" "$DIR/updater.after"

          grep -q 'versionName = "0.23.0-tv-stage5"' app/build.gradle.kts

          git diff --check
          git diff > "$DIR/stage5.patch"

          echo "PASS: Stage 4 Sources preserved"
          echo "PASS: selected source opens independent TV player"
          echo "PASS: source headers + HLS Media3 path"
          echo "PASS: Left/Right seek + OK play/pause"
          echo "PASS: buffering + playback error UI"
          echo "PASS: Back returns to selected source"
          echo "PASS: Mobile/R6/Home/Shell/updater untouched"

      - name: Compile Stage 5
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage5/compile.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Assemble Stage 5
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache             :app:assembleDebug             --stacktrace --console=plain             2>&1 | tee "$RUNNER_TEMP/tv-stage5/assemble.log"

      - name: Commit and push Stage 5
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/tv-stage5/push.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt             app/build.gradle.kts

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "feat(tv): connect Stage 5 player"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify actual origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "origin_main_sha=$(git rev-parse origin/main)"             | tee "$RUNNER_TEMP/tv-stage5/remote-main.txt"

          python3 - <<'PY'
          import subprocess
          details = subprocess.check_output(
              ["git","show","origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/details/TvDetailsScreen.kt"],
              text=True
          )
          player = subprocess.check_output(
              ["git","show","origin/main:app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"],
              text=True
          )
          gradle = subprocess.check_output(
              ["git","show","origin/main:app/build.gradle.kts"],
              text=True
          )
          checks = {
              "Details player overlay": "TvPlayerScreen(" in details,
              "source launches player": "onPlayStream(stream)" in details,
              "source focus return": "LaunchedEffect(playerReturnToken)" in details,
              "Media3 ExoPlayer": "ExoPlayer.Builder(context)" in player,
              "PlayerView": "PlayerView(viewContext)" in player,
              "headers": "setDefaultRequestProperties(stream.headers)" in player,
              "seek": "seekBy(-10_000L)" in player and "seekBy(10_000L)" in player,
              "version": 'versionName = "0.23.0-tv-stage5"' in gradle,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("REMOTE STAGE 5 VERIFICATION FAILED: " + ", ".join(failed))
          for name in checks:
              print("PASS:", name)
          PY

      - name: Dispatch signed updater build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          gh workflow run build.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f publish_release=true

          sleep 8

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow build.yml                 --branch main                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"                 | head -n1
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "SIGNED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "signed_run_id=$RUN_ID"             | tee "$RUNNER_TEMP/tv-stage5/dispatch.txt"

      - name: Wait signed build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SIGNED_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             2>&1 | tee "$RUNNER_TEMP/tv-stage5/signed-build-watch.log"

      - name: Verify published Stage 5
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/tv-stage5/update.json"

          for attempt in $(seq 1 24); do
            curl               --fail               --location               --silent               --show-error               --header 'Cache-Control: no-cache'               "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?ts=$(date +%s)"               --output "$MANIFEST" || true

            if grep -q '0.23.0-tv-stage5' "$MANIFEST" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$MANIFEST"
          grep -q '0.23.0-tv-stage5' "$MANIFEST"
          cat "$MANIFEST"             | tee "$RUNNER_TEMP/tv-stage5/published-update.json"

      - name: Compact failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/tv-stage5"
          echo "========== TV Stage 5 Player R1 =========="
          echo "Result: FAILED"

          for file in preflight.txt remote-main.txt push.log dispatch.txt signed-build-watch.log published-update.json; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              tail -n 220 "$DIR/$file" || true
            fi
          done

          for file in compile.log assemble.log; do
            if [[ -f "$DIR/$file" ]]; then
              echo
              echo "[$file]"
              grep -E                 'BUILD SUCCESSFUL|BUILD FAILED|(^|[[:space:]])(e:|error:|FAILURE:|Caused by:|Execution failed for task|What went wrong:)'                 "$DIR/$file" | tail -n 260 || true
            fi
          done

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-stage5-player-r1-diagnose
          path: ${{ runner.temp }}/tv-stage5
          if-no-files-found: ignore
          retention-days: 7
