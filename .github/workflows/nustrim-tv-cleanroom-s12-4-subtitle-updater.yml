name: Nustrim TV Cleanroom S12.4 Subtitle Updater Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nustrim-tv-cleanroom-s12-4-subtitle-updater
  cancel-in-progress: false

env:
  LOCKED_CERT_SHA256: "30C625B9112CD04D43B631D6020D0D52E61695111B8E2125F29AD19651EB165D"
  TARGET_VERSION_NAME: "0.57.3-tv-cleanroom-s12.4-subtitle-updater"
  TARGET_VERSION_CODE: "126"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted S12.3 baseline
        shell: bash
        run: |
          set -euo pipefail
          current_build="$(sed -n -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          current_marker="$(cat .nustrim-version 2>/dev/null || true)"
          case "$current_build" in
            "0.57.2-tv-cleanroom-s12.3-player-postplay"|"$TARGET_VERSION_NAME") ;;
            *)
              echo "::error::Unexpected baseline: $current_build"
              exit 20
              ;;
          esac
          test "$current_marker" = "$current_build" || {
            echo "::error::Build version and .nustrim-version differ."
            exit 21
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSTRIM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUSTRIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSTRIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSTRIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signing secret $name is missing."
              exit 30
            fi
          done
          KS="$RUNNER_TEMP/nustrim-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$(
            keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          test "$CERT" = "$LOCKED_CERT_SHA256" || {
            echo "::error::Keystore certificate is not the locked Nustrim certificate."
            exit 31
          }
          echo "NUSTRIM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSTRIM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply exact S12.4 source
        shell: bash
        env:
          SOURCE_PATCH_B64: ""
        run: |
          set -euo pipefail
          if ! grep -qx 'subsystem=12.4-subtitle-updater' .nustrim-tv; then
            PATCH_FILE="$RUNNER_TEMP/s12-4-subtitle-updater.patch"
            printf '%s' "$SOURCE_PATCH_B64" | base64 --decode > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Verify S12.4 boundary and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed"
          export CHANGED="$changed"
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line]
          allowed = {
              ".nustrim-tv",
              ".nustrim-version",
              "app/build.gradle.kts",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleStyleStore.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt",
              "scripts/verify_tv_subtitle_updater_s12_4.py",
          }
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit("S12.4 changed files outside boundary: " + ", ".join(unexpected))
          expected_hashes = {
              ".nustrim-tv": "927651094225ca7860430faa7660408374691551c8499ed02c1ba47e77803ce7",
              ".nustrim-version": "5256b7d8dc0c173b9d8aafd3c67736ed5a72f1a1f8557a2e9adbfaab1bba8889",
              "app/build.gradle.kts": "09a481918fee0a2fb178135e68f2f915dc7795ad994a24455f0a3d5a37c52e7d",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt": "1840bbc0d9973333defdbfad35312c79479c3c787346aa1ad9ff6383ab684d5f",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerModels.kt": "a8b2c872dee20cd8e8247d20f9f89539de2c01a3de521c9ea308629e87dc2966",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt": "bfdd17ad81f4bbf7eb185049efc4a7763eee14aa957da045dc4689a89718a4a5",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt": "63f111ad9d46c35d7d42de1e30863b19a21b905455cd1a37329246f510390d5e",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt": "250e8bb44a0f17c139bbc729bc5c7875e6db3ff91b5c35920c9792c7b9565dc3",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt": "0a162619ae56ecc6f3b8dfc0f3670670d321001c20c3f1eadc9bb6cb4c64dc4e",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleStyleStore.kt": "60e35f69b21d0a4797ec9015a86320efc6113dd185d339b313e3e96f63c32f31",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt": "5891b48052792ca7ccd69045b4cdc23f89700cb01cfc68bbe0a54cf4cdb12248",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt": "ae660a8192dbbc4b902c3afef3b79396361fdb1a77a99fd9fac0c2b59e529499",
              "app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt": "859a0b7586f7facf54f1d04312cc85e12d32b6008fbf1eb7eae6ad441de06a7b",
              "scripts/verify_tv_subtitle_updater_s12_4.py": "a981f56c772b22f4d67eb4ed9bd8805af0fe54191889cf1c19e0376794c08e67",
          }
          mismatch = []
          for relative, expected in expected_hashes.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatch.append(relative)
          if mismatch:
              raise SystemExit("Exact S12.4 payload mismatch: " + ", ".join(mismatch))
          PY
          python3 scripts/verify_tv_subtitle_updater_s12_4.py

      - name: Build permanent signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/nustrim-s12-4-build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nustrim-s12-4-signature.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/nustrim-s12-4-signature.txt" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$LOCKED_CERT_SHA256"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionCode='([^']+)'.*/\1/p")"
          APK_NAME="$(printf '%s\n' "$BADGING" | sed -n -E "s/^.*versionName='([^']+)'.*/\1/p")"
          test "$PACKAGE" = "app.nudroidlabs.nustrim"
          test "$APK_CODE" = "$TARGET_VERSION_CODE"
          test "$APK_NAME" = "$TARGET_VERSION_NAME"
          echo "cert_sha=$CERT" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare updater manifest and S12.4 report
        id: assets
        shell: bash
        env:
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          export CERT_SHA VERSION_CODE VERSION_NAME
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          cert = os.environ["CERT_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = Path("app/build/outputs/apk/release/app-release.apk")
          apk = Path(f"Nustrim-{name}.apk")
          apk.write_bytes(src.read_bytes())
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size
          tag = f"v{name}"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "sha256": sha,
              "changelog": "S12.4 completes the TV subtitle picker with language, provider, and persistent style controls, and completes the TV updater download, verification, permission, and install flow.",
              "sizeBytes": size,
              "signingMode": "permanent",
              "signingCertSha256": cert,
          }
          report = {
              "stage": "S12.4 Subtitle Overlay and Updater",
              "issue": "S12-SUB-UPD-01",
              "status": "build-verified",
              "staticContracts": "28/28",
              "scope": ["TV subtitle overlay", "provider labels", "persistent subtitle style", "TV updater install flow"],
              "preserved": ["S12.1 provider scheduling", "S12.2 Details", "S12.3 Player controls", "Mobile UI"],
              "deviceAcceptance": "pending",
              "requiredDeviceChecks": [
                  "verify Malay and English subtitle tracks appear for Ted Lasso S1E1",
                  "verify provider names remain visible while changing language",
                  "verify subtitle text size and bold persist after reopening playback",
                  "install an older permanent-signed build and complete update download and install",
                  "verify Back closes the subtitle overlay and restores Player controls",
              ],
              "nextBacklog": "S12.5 Player final polish and device acceptance",
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("tv-subtitle-updater-s12-4-report.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"apk={apk.name}\n")
              fh.write(f"sha256={sha}\n")
          PY

      - name: Commit S12.4 only after verified build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nustrim-version .nustrim-tv app/build.gradle.kts \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerPanels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerRuntime.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleRepository.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvSubtitleStyleStore.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsEntry.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsModels.kt \
            app/src/main/java/app/nudroidlabs/nustrim/tv/settings/TvSettingsScreen.kt \
            scripts/verify_tv_subtitle_updater_s12_4.py
          if git diff --cached --quiet; then
            echo "S12.4 source is already committed."
          else
            git commit -m "Close TV subtitle overlay and updater S12.4 [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version_name }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/s12-4-release-notes.md"
          printf '%s\n' \
            "Nustrim $VERSION" "" \
            "S12.4 completes the TV subtitle language, provider, and style picker, plus the TV update download and install flow." "" \
            "Device acceptance is still required for subtitle availability and an in-place update from an older permanently signed APK." "" \
            "Permanent signing certificate SHA-256: $LOCKED_CERT_SHA256" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          else
            gh release create "$TAG" --title "Nustrim $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA" --latest
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          EXPECTED_SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" update.json tv-subtitle-updater-s12-4-report.json --clobber
          LIVE="$RUNNER_TEMP/s12-4-live"
          mkdir -p "$LIVE"
          gh release download "$TAG" --pattern "$APK" --pattern update.json --pattern tv-subtitle-updater-s12-4-report.json --dir "$LIVE" --clobber
          test "$(sha256sum "$LIVE/$APK" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "tv-subtitle-updater-s12-4-report.json").read_text())
          if report.get("issue") != "S12-SUB-UPD-01" or report.get("deviceAcceptance") != "pending":
              raise SystemExit("Published S12.4 report is invalid")
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-4-subtitle-updater-release
          path: |
            Nustrim-${{ steps.verify.outputs.version_name }}.apk
            update.json
            tv-subtitle-updater-s12-4-report.json
            ${{ runner.temp }}/nustrim-s12-4-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnose on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-s12-4-diagnose"
          mkdir -p "$D"
          cp "$RUNNER_TEMP/nustrim-s12-4-build.log" "$D/" 2>/dev/null
          cp "$RUNNER_TEMP/nustrim-s12-4-signature.txt" "$D/" 2>/dev/null
          cp app/build.gradle.kts .nustrim-version .nustrim-tv "$D/" 2>/dev/null
          cp update.json tv-subtitle-updater-s12-4-report.json "$D/" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff.txt" 2>&1

      - name: Upload diagnose on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nustrim-tv-cleanroom-s12-4-subtitle-updater-diagnose
          path: ${{ runner.temp }}/nustrim-s12-4-diagnose
          if-no-files-found: warn
          retention-days: 7
