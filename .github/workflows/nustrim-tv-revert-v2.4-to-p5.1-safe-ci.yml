          actual="$(sha256sum "$PLAYER" | awk '{print $1}')"
          if [ "$actual" != "$TARGET_PLAYER_SHA256" ]; then
            echo "::error::Restored P5.1 player SHA mismatch."
            echo "expected=$TARGET_PLAYER_SHA256"
            echo "actual=$actual"
            exit 30
          fi

      - name: Bump restored baseline version
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Cannot parse app version")

          if code.group(1) != "81" or name.group(1) != "0.29.0-tv-v2.4-modern-player-p1":
              raise SystemExit(f"Unexpected baseline: {name.group(1)} ({code.group(1)})")

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 82',
              text,
              count=1,
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.29.1-tv-v2.3-p5.1-restored"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY_VERSION

      - name: Verify restored P5.1 contract
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt"

          grep -q 'versionCode = 82' app/build.gradle.kts
          grep -q 'versionName = "0.29.1-tv-v2.3-p5.1-restored"' app/build.gradle.kts

          # P5.1 Back fix must be present.
          grep -q 'if (event.key == Key.Back)' "$PLAYER"
          grep -q 'Back belongs to BackHandler' "$PLAYER"
          grep -q 'pendingControlFocus = false' "$PLAYER"
          grep -q 'onBack()' "$PLAYER"

          # P1-P5 functional features must remain.
          grep -q 'fun previewSeekBy(direction: Int)' "$PLAYER"
          grep -q 'fun commitPreviewSeek()' "$PLAYER"
          grep -q 'player.setPlaybackSpeed(speed)' "$PLAYER"
          grep -q 'RESIZE_MODE_ZOOM' "$PLAYER"
          grep -q 'private fun TvPlayerPauseOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerPostPlayOverlay(' "$PLAYER"
          grep -q 'private fun TvPlayerClockOverlay(' "$PLAYER"
          grep -q 'startPositionMs: Long = 0L' "$PLAYER"
          grep -q 'onProgress: ((Long, Long, Boolean) -> Unit)? = null' "$PLAYER"

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 43
          fi

          git diff --check

      - name: Compile gate
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/nustrim-revert-v24-p51"
          mkdir -p "$D"
          gradle --no-daemon --build-cache             :app:compileDebugKotlin             --stacktrace             --console=plain             2>&1 | tee "$D/compile.log"

      - name: Save revert evidence
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nustrim-revert-v24-p51"
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.after.kt"
          cp app/build.gradle.kts "$D/build.gradle.after.kts"
          git diff > "$D/revert-v24-to-p51.diff"
          sha256sum app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt > "$D/player-sha256.txt"

          cat > "$D/summary.txt" <<'EOF'
          Nustrim TV V2.4 -> P5.1 Restore
          =================================
          From: 0.29.0-tv-v2.4-modern-player-p1 (81)
          To:   0.29.1-tv-v2.3-p5.1-restored (82)

          Restored:
          - exact P5.1 player source
          - P5.1 Back exit fix
          - P1-P5 seek, resume, tracks, sources, speed, aspect, pause OSD and post-play

          Removed:
          - V2.4 Modern Minimalist visual redesign only

          No cross-workflow dispatch or unrelated automation is performed.
          EOF

      - name: Commit only after compile passes
        if: steps.preflight.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle.kts             app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt
          git diff --cached --check
          git commit -m 'tv: revert V2.4 visual redesign to P5.1 baseline'
          git push origin HEAD:main

      - name: Safe CI completion summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P5.1 baseline restored"
            echo
            echo "- V2.4 visual redesign was reverted."
            echo "- P5.1 Back fix and P1-P5 player behaviour remain."
            echo "- Compile gate passed before commit."
            echo
            echo "For the installable updater build, manually run **Build Nustrim Clean**"
            echo "with **publish_release = true**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnose
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/nustrim-revert-v24-p51"
          mkdir -p "$D"
          cp app/build.gradle.kts "$D/build.gradle.current.kts" 2>/dev/null
          cp app/src/main/java/app/nudroidlabs/nustrim/tv/player/TvPlayerScreen.kt "$D/TvPlayerScreen.current.kt" 2>/dev/null
          git status --short > "$D/git-status.txt" 2>&1
          git diff > "$D/git-diff-current.txt" 2>&1
          git log -5 --oneline > "$D/recent-commits.txt" 2>&1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nustrim-tv-revert-v24-to-p5.1-diagnose
          path: ${ runner.temp }/nustrim-revert-v24-p51
          if-no-files-found: warn
          retention-days: 14
